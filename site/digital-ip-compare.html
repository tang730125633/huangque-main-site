<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字化 IP · 多版本对比</title>
<link rel="icon" href="assets/cloud/logo-bird.png">
<link rel="stylesheet" href="assets/fonts/hq-fonts.css">
<style>
  :root{--bg:#070b13;--panel:#0d1422;--line:rgba(148,164,187,.16);--text:#eaf1fa;--muted:#94a4bb;--gold:#e7b24c}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:grid;grid-template-rows:62px 1fr;overflow:hidden}
  .bar{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(9,14,24,.97);box-shadow:0 8px 30px rgba(0,0,0,.22)}
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .brand img{width:27px;height:27px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(231,178,76,.32))}
  .brand b{font-size:13px}
  .brand span{display:block;margin-top:1px;color:var(--muted);font-size:9.5px}
  .tabs{display:flex;align-items:center;gap:7px;overflow-x:auto}
  .tab{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:rgba(148,164,187,.04);color:var(--muted);font:600 11.5px/1 inherit;white-space:nowrap;cursor:pointer}
  .tab:hover{color:var(--text);border-color:rgba(231,178,76,.28)}
  .tab.active{border-color:rgba(231,178,76,.38);background:rgba(231,178,76,.1);color:var(--gold)}
  .spacer{flex:1}
  .open{color:var(--muted);font-size:11px;text-decoration:none;white-space:nowrap}
  .open:hover{color:var(--gold)}
  iframe{width:100%;height:100%;border:0;background:var(--bg)}
  @media(max-width:820px){.brand span,.open{display:none}.bar{gap:10px;padding:0 10px}.tab{padding:0 9px}}
</style>
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="assets/cloud/logo-bird.png" alt=""><div><b>数字化 IP 原型对比</b><span>泽龙试点 · 四版同场</span></div></div>
    <nav class="tabs" aria-label="选择原型版本">
      <button class="tab active" type="button" data-page="workbench/digital-ip.html">基线版</button>
      <button class="tab" type="button" data-page="workbench/digital-ip-a.html">A · 作战指挥台</button>
      <button class="tab" type="button" data-page="workbench/digital-ip-b.html">B · 引导式成长</button>
      <button class="tab" type="button" data-page="workbench/digital-ip-c.html">C · IP DNA</button>
    </nav>
    <span class="spacer"></span>
    <a id="openPage" class="open" href="workbench/digital-ip.html" target="_blank" rel="noopener">单独打开 ↗</a>
  </header>
  <iframe id="preview" src="workbench/digital-ip.html" title="数字化 IP 原型预览"></iframe>
<script>
(function(){
  var frame=document.getElementById("preview");
  var open=document.getElementById("openPage");
  document.querySelector(".tabs").addEventListener("click",function(event){
    var button=event.target.closest("[data-page]");
    if(!button)return;
    document.querySelectorAll(".tab").forEach(function(tab){tab.classList.toggle("active",tab===button);});
    frame.src=button.dataset.page;
    open.href=button.dataset.page;
  });
})();
</script>
</body>
</html>
