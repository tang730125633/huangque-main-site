<script>
(function(){
  "use strict";
  var input=document.getElementById('kw'), goBtn=document.getElementById('goBtn'), cntSel=document.getElementById('cnt');
  var rows=document.getElementById('rows'), cntLabel=document.getElementById('cntLabel');
  var dot=document.getElementById('statusDot'), stat=document.getElementById('statusText');
  var kLeads=document.getElementById('kLeads'),kSpam=document.getElementById('kSpam'),kChat=document.getElementById('kChat'),kTotal=document.getElementById('kTotal');
  var poll=null, running=false, lastLeads=[];
  var GRAD=['150deg,#9a6a3a,#5a3d22','150deg,#b04a60,#6a2d3d','150deg,#2c8478,#15534a','150deg,#7a5aa8,#3d2d5a','150deg,#3a6a9a,#22405a'];
  var CRM_STATUSES=['待跟进','跟进中','已加微','已成交','无效'];
  var CRM_INTENTS=['高意向','咨询','价格敏感','围观'];

  function tok(){ return '__cookie__'; }
  function getPlatforms(){ return Array.from(document.querySelectorAll('.plChk:checked')).map(function(el){return el.value;}); }
  function getChannelsTargets(){
    var el=document.getElementById('chTargets'); if(!el||!el.value.trim()) return [];
    return el.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function crmStore(){
    try{ return JSON.parse(localStorage.getItem('hq_leads_crm')||'{}')||{}; }catch(e){ return {}; }
  }
  function saveCrm(id, patch){
    if(!id) return;
    var all=crmStore(), cur=all[id]||{};
    Object.keys(patch||{}).forEach(function(k){ cur[k]=patch[k]; });
    all[id]=cur; localStorage.setItem('hq_leads_crm', JSON.stringify(all));
    lastLeads=lastLeads.map(function(L){ return L.lead_id===id ? Object.assign({}, L, cur) : L; });
    fetch('/api/gen/leads/crm',{
      method:'POST',
      credentials:'include',
      headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({lead_id:id}, cur))
    }).then(function(r){ return r.json().then(function(d){return {s:r.status,d:d};}); })
      .then(function(x){
        if(x.s===200 && x.d && x.d.crm){
          var all2=crmStore(); all2[id]=Object.assign({}, all2[id]||{}, x.d.crm);
          localStorage.setItem('hq_leads_crm', JSON.stringify(all2));
        }
      }).catch(function(){});
  }
  function withCrm(L){
    var saved=(crmStore()[L.lead_id]||{});
    return Object.assign({}, L, {intent:L.intent||'高意向', intent_score:L.intent_score||0, intent_reason:L.intent_reason||'', follow_status:L.follow_status||'待跟进', follow_note:L.follow_note||''}, saved);
  }
  function optHTML(items, val){
    return items.map(function(x){ return '<option value="'+esc(x)+'"'+(x===val?' selected':'')+'>'+esc(x)+'</option>'; }).join('');
  }
  function loadRemoteCrm(leads){
    var ids=(leads||[]).map(function(L){ return L.lead_id; }).filter(Boolean);
    if(!ids.length) return Promise.resolve(false);
    return fetch('/api/gen/leads/crm?ids='+encodeURIComponent(ids.join(',')),{
      credentials:'include',
      headers:{'Authorization':'Bearer '+tok()}
    }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      var items=(d&&d.items)||{}, keys=Object.keys(items);
      if(!keys.length) return false;
      var all=crmStore();
      keys.forEach(function(id){ all[id]=Object.assign({}, all[id]||{}, items[id]); });
      localStorage.setItem('hq_leads_crm', JSON.stringify(all));
      lastLeads=lastLeads.map(withCrm);
      return true;
    }).catch(function(){ return false; });
  }
  function setStatus(t,c){ stat.innerHTML=t; dot.style.background=c||'#5c6b82'; if(c==='#2dd4bf'){dot.style.animation='hq-pulse 2s infinite';}else{dot.style.animation='none';} }
  function num(n){ return (n==null?'—':String(n)).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
  function setKPIs(r){ kLeads.textContent=num(r.leads_count); kSpam.textContent=num(r.spam); kChat.textContent=num(r.chat); kTotal.textContent=num(r.total); }

  function platformBadge(p){
    var map={douyin:{t:'抖音',bg:'rgba(232,72,72,.12)',c:'#e84848'},xhs:{t:'小红书',bg:'rgba(255,77,93,.12)',c:'#ff4d5d'},channels:{t:'视频号',bg:'rgba(7,193,96,.12)',c:'#07c160'}};
    var m=map[p]||{t:esc(p||''),bg:'rgba(148,164,187,.08)',c:'#94a4bb'};
    return m.t?('<span style="font-size:11px; padding:2px 6px; border-radius:4px; background:'+m.bg+'; color:'+m.c+'; display:inline-block; margin-top:3px;">'+m.t+'</span>'):'';
  }

  function rowHTML(L,i){
    L=withCrm(L);
    var n=L.nickname||'匿名', g=GRAD[i%GRAD.length], first=(n.trim()[0]||'客');
    var uid=((L.platform==='xhs'?(L.red_id||L.user_unique_id):L.user_unique_id))||'—';
    var src=L.title||'—';
    var url=L.profile_url||'';
    var leadId=esc(L.lead_id||'');
    var intentScore=Number(L.intent_score||0);
    var intentReason=L.intent_reason||'规则分级';
    var scoreColor=intentScore>=80?'#2dd4bf':(intentScore>=60?'#e7b24c':'#94a4bb');
    var nameInner=url
      ?'<a href="'+esc(url)+'" target="_blank" rel="noopener" style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#eaf1fa; text-decoration:none;" class="hv-gold">'+esc(n)+'</a>'
      :'<div style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(n)+'</div>';
    // 小红书主页打不开(平台墙,无 xsec_token)→ 复制小红书号去 app 搜;其余平台进主页
    var actionHTML=(L.platform==='xhs' && L.red_id)
      ?'<button class="hv-gold" onclick="navigator.clipboard.writeText(\''+esc(L.red_id)+'\');this.textContent=\'已复制 ✓\';" title="复制小红书号,去小红书 App 搜索联系" style="display:inline-flex; align-items:center; gap:5px; padding:5px 10px; font-size:12px; font-weight:500; color:#e7b24c; background:rgba(231,178,76,.08); border:1px solid rgba(231,178,76,.2); border-radius:8px; cursor:pointer; white-space:nowrap; font-family:inherit;">复制小红书号</button>'
      :url
      ?'<a href="'+esc(url)+'" target="_blank" rel="noopener" class="hv-gold" style="display:inline-flex; align-items:center; gap:5px; padding:5px 10px; font-size:12px; font-weight:500; color:#e7b24c; background:rgba(231,178,76,.08); border:1px solid rgba(231,178,76,.2); border-radius:8px; cursor:pointer; white-space:nowrap; text-decoration:none;"><span style="display:flex; width:12px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg></span>进主页</a>'
      :'<div style="display:inline-flex; align-items:center; gap:5px; padding:5px 10px; font-size:12px; font-weight:500; color:#3d4a5c; background:rgba(148,164,187,.04); border:1px solid rgba(148,164,187,.1); border-radius:8px; cursor:default; white-space:nowrap;">— 无主页</div>';
    return '<div class="hqRow lrowg">'+
      '<div class="mono" style="font-size:12px; color:#5c6b82;">'+(i+1<10?'0':'')+(i+1)+'</div>'+
      '<div style="display:flex; align-items:center; gap:8px; min-width:0;"><div style="width:34px; height:34px; flex:none; border-radius:50%; background:linear-gradient('+g+'); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600;">'+esc(first)+'</div><div style="min-width:0;">'+nameInner+'</div></div>'+
      '<div style="min-width:0;"><div class="mono" style="font-size:12px; color:#94a4bb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(uid)+'</div>'+platformBadge(L.platform)+'</div>'+
      '<div class="mono" style="font-size:12px; color:#94a4bb;">'+esc(L.ip_location||'—')+'</div>'+
      '<div style="font-size:12px; color:#cdd7e6; line-height:1.55;">"'+esc(L.content||'')+'"</div>'+
      '<div style="display:grid;gap:5px;"><select class="crm-intent" data-id="'+leadId+'" style="width:100%; height:30px; padding:0 7px; background:rgba(231,178,76,.08); color:#e7b24c; border:1px solid rgba(231,178,76,.2); border-radius:8px; font-size:12px; font-family:inherit;">'+optHTML(CRM_INTENTS,L.intent)+'</select><div title="'+esc(intentReason)+'" style="font-size:10.5px;line-height:1.2;color:'+scoreColor+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">智能 '+(intentScore||'—')+' · '+esc(intentReason)+'</div></div>'+
      '<div style="display:grid; gap:6px;"><select class="crm-status" data-id="'+leadId+'" style="width:100%; height:30px; padding:0 7px; background:rgba(7,11,19,.45); color:#eaf1fa; border:1px solid rgba(148,164,187,.18); border-radius:8px; font-size:12px; font-family:inherit;">'+optHTML(CRM_STATUSES,L.follow_status)+'</select><input class="crm-note" data-id="'+leadId+'" value="'+esc(L.follow_note||'')+'" placeholder="跟进备注" style="width:100%; height:28px; box-sizing:border-box; padding:0 8px; background:rgba(7,11,19,.32); color:#cdd7e6; border:1px solid rgba(148,164,187,.12); border-radius:8px; font-size:12px; font-family:inherit; outline:none;"></div>'+
      (L.video_url
        ? '<a href="'+esc(L.video_url)+'" target="_blank" rel="noopener" class="hv-gold" style="display:block; font-size:12px; color:#e7b24c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-decoration:none;">'+esc(src)+'</a>'
        : '<div style="font-size:12px; color:#94a4bb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(src)+'</div>')+
      actionHTML+
    '</div>';
  }
  function renderLeads(leads, skipRemote){
    lastLeads=(leads||[]).map(withCrm);
    var expBtn=document.getElementById('exportBtn');
    if(!leads || !leads.length){
      rows.innerHTML='<div style="padding:54px 20px; text-align:center; color:#94a4bb; font-size:13px;">本次没从评论里过滤到精准客户，换个关键词或加大采集量再试。</div>';
      cntLabel.textContent=''; if(expBtn) expBtn.style.display='none'; return;
    }
    rows.innerHTML=lastLeads.map(rowHTML).join('');
    cntLabel.textContent='（共 '+lastLeads.length+' 条）';
    if(expBtn) expBtn.style.display='inline-flex';
    if(!skipRemote){
      loadRemoteCrm(lastLeads).then(function(changed){ if(changed) renderLeads(lastLeads, true); });
    }
  }

  function exportCSV(){
    if(!lastLeads.length) return;
    var header='平台,昵称,平台号,IP属地,意向,智能分,分级依据,跟进状态,跟进备注,需求原话,来源视频,视频链接,主页链接\n';
    var body=lastLeads.map(function(L){
      function q(s){ s=String(s==null?'':s); return '"'+s.replace(/"/g,'""')+'"'; }
      L=withCrm(L);
      return [q(L.platform),q(L.nickname),q(L.user_unique_id),q(L.ip_location),q(L.intent),q(L.intent_score),q(L.intent_reason),q(L.follow_status),q(L.follow_note),q(L.content),q(L.title),q(L.video_url),q(L.profile_url)].join(',');
    }).join('\n');
    var blob=new Blob(['﻿'+header+body],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='leads_'+Date.now()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
  function busy(b){ running=b; goBtn.style.opacity=b?'.65':'1'; goBtn.style.pointerEvents=b?'none':'auto'; goBtn.textContent=b?'获客中…':'开始获客'; }

  function start(){
    if(running) return;
    var kw=(input.value||'').trim();
    var platforms=getPlatforms();
    if(!platforms.length){ setStatus('请至少选择一个平台','#f4708a'); return; }
    var chTargets=getChannelsTargets();
    if(platforms.length===1 && platforms[0]==='channels' && !chTargets.length){
      setStatus('视频号需填写目标号（视频号搜不了全网）','#f4708a');
      document.getElementById('chTargets').focus(); return;
    }
    if(!kw && !chTargets.length){ setStatus('请先输入关键词或视频号目标','#f4708a'); input.focus(); return; }
    var t=tok(); if(!t){ HQ.login(); return; }
    busy(true); setStatus('提交任务中…','#2dd4bf');
    rows.innerHTML='<div style="padding:64px 20px; text-align:center; color:#94a4bb;"><div style="width:34px;height:34px;margin:0 auto 16px;border:3px solid rgba(148,164,187,.18);border-top-color:#e7b24c;border-radius:50%;animation:hq-spin .8s linear infinite;"></div><div style="font-size:14px;">正在跑多平台 · 搜视频 → 扒评论 → 意图过滤</div><div style="font-size:12px;margin-top:8px;color:#5c6b82;">约 1-3 分钟，请勿关闭页面</div></div>';
    var body={keyword:kw, platforms:platforms, count:parseInt(cntSel.value)||50, pages:1, channels_targets:chTargets};
    var t0=Date.now();
    fetch('/api/gen/leads',{method:'POST',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){return {s:r.status,d:d};}); })
      .then(function(x){
        if(x.s===401){ HQ.login(); return; }
        if(x.s===402){ busy(false); setStatus('点数不足 · <a href="recharge.html" style="color:#e7b24c">去充值</a>','#f4708a'); rows.innerHTML=''; return; }
        if(!x.d.job_id){ busy(false); setStatus('提交失败：'+((x.d&&x.d.detail)||'未知错误'),'#f4708a'); rows.innerHTML=''; return; }
        if(window.HQ&&window.HQ.refreshPoints) window.HQ.refreshPoints();
        localStorage.setItem('hq_active_leads_job', JSON.stringify({id:x.d.job_id, t0:t0, kw:kw}));
        watch(x.d.job_id, t0);
      }).catch(function(){ busy(false); setStatus('网络错误，请重试','#f4708a'); rows.innerHTML=''; });
  }

  function watch(id, t0){
    if(poll) clearInterval(poll);
    setStatus('搜索中…多平台抓取+评论过滤','#2dd4bf');
    var t=tok();
    poll=setInterval(function(){
      fetch('/api/gen/job/'+id,{headers:{'Authorization':'Bearer '+t}}).then(function(r){return r.json();}).then(function(d){
        var sec=Math.round((Date.now()-t0)/1000);
        if(d.status==='done'){
          clearInterval(poll); busy(false); localStorage.removeItem('hq_active_leads_job');
          if(window.HQ&&window.HQ.refreshPoints) window.HQ.refreshPoints();
          var r=d.result||{}; setKPIs(r); renderLeads(r.leads||[]);
          setStatus('完成 · '+(r.leads_count||0)+' 个精准客户 · 去重 '+(r.deduped||0)+' 条（'+sec+'s）','#2bd576');
        }else if(d.status==='error'||d.status==='failed'){
          clearInterval(poll); busy(false); localStorage.removeItem('hq_active_leads_job');
          setStatus('失败：'+(d.error||'未知错误'),'#f4708a');
          rows.innerHTML='<div style="padding:54px 20px; text-align:center; color:#f4708a; font-size:13px;">'+esc(d.error||'任务失败')+'</div>';
        }else if(sec>400){
          clearInterval(poll); busy(false); localStorage.removeItem('hq_active_leads_job');
          setStatus('获客超时（'+sec+'s）· 请重试','#f4708a');
          rows.innerHTML='<div style="padding:54px 20px; text-align:center; color:#94a4bb; font-size:13px;">超时，请换关键词或缩小采集量重试</div>';
        }else{
          setStatus('搜索中…（'+sec+'s · '+(d.status||'running')+'）','#2dd4bf');
        }
      }).catch(function(){});
    },4000);
  }

  var expBtn2=document.getElementById('exportBtn');
  if(expBtn2) expBtn2.onclick=exportCSV;
  rows.addEventListener('change',function(e){
    var t=e.target, id=t&&t.getAttribute('data-id');
    if(t.classList.contains('crm-status')) saveCrm(id,{follow_status:t.value});
    if(t.classList.contains('crm-intent')) saveCrm(id,{intent:t.value});
  });
  rows.addEventListener('input',function(e){
    var t=e.target, id=t&&t.getAttribute('data-id');
    if(t.classList.contains('crm-note')) saveCrm(id,{follow_note:t.value});
  });
  goBtn.onclick=start;
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') start(); });
  document.querySelectorAll('.kwchip').forEach(function(c){ c.onclick=function(){
    document.querySelectorAll('.kwchip').forEach(function(x){ x.style.color='#94a4bb'; x.style.background='rgba(148,164,187,.05)'; x.style.borderColor='rgba(148,164,187,.14)'; });
    c.style.color='#e7b24c'; c.style.background='rgba(231,178,76,.1)'; c.style.borderColor='rgba(231,178,76,.3)';
    input.value=c.textContent.trim(); input.focus();
  };});
  // Platform chip toggle + channels-targets visibility
  document.querySelectorAll('.plChk').forEach(function(cb){
    var lbl=cb.parentElement;
    function sync(){
      if(cb.checked){ lbl.style.color='#e7b24c'; lbl.style.background='rgba(231,178,76,.1)'; lbl.style.borderColor='rgba(231,178,76,.3)'; }
      else { lbl.style.color='#94a4bb'; lbl.style.background='rgba(148,164,187,.05)'; lbl.style.borderColor='rgba(148,164,187,.14)'; }
      var chRow=document.getElementById('chTargetsRow');
      var chCb=document.querySelector('.plChk[value="channels"]');
      if(chRow && chCb) chRow.style.display=chCb.checked?'flex':'none';
    }
    lbl.onclick=function(){ cb.checked=!cb.checked; sync(); };
    sync();
  });

  // 恢复进行中的获客任务（离开页面去别的栏目，再回来不丢；任务在服务器一直在跑）
  try{
    var aj=JSON.parse(localStorage.getItem('hq_active_leads_job')||'null');
    if(aj && aj.id){
      busy(true);
      if(aj.kw && input) input.value=aj.kw;
      setStatus('接上刚才的获客任务…','#2dd4bf');
      rows.innerHTML='<div style="padding:64px 20px; text-align:center; color:#94a4bb;"><div style="width:34px;height:34px;margin:0 auto 16px;border:3px solid rgba(148,164,187,.18);border-top-color:#e7b24c;border-radius:50%;animation:hq-spin .8s linear infinite;"></div><div style="font-size:14px;">接上刚才的获客任务…（在服务器一直在跑）</div></div>';
      watch(aj.id, aj.t0||Date.now());
    }
  }catch(e){}
})();
</script>
</body>
</html>
