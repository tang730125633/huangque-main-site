.ca-output{display:grid;grid-template-rows:44px minmax(0,1fr);min-width:0;min-height:0;background:#0a111b}.ca-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ca-line)}.ca-tab{position:relative;border:0;background:transparent;color:#79889c;font-size:10px;cursor:pointer}.ca-tab.active{color:#e8eef6}.ca-tab.active::after{position:absolute;left:18%;right:18%;bottom:-1px;height:2px;background:var(--ca-gold);content:""}.ca-output-scroll{min-height:0;padding:16px;overflow:auto}.ca-panel[hidden]{display:none}.ca-section{margin-bottom:20px}.ca-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.ca-section-head h2{margin:0;font-size:12px}.ca-section-head span{color:var(--ca-muted);font-size:9px}.ca-stage-list{display:grid;gap:5px}.ca-stage{display:grid;grid-template-columns:27px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:48px;padding:8px 10px;border:1px solid var(--ca-line);border-radius:5px;background:#0d1622}.ca-stage i{display:grid;place-items:center;width:25px;height:25px;border:1px solid var(--ca-line);border-radius:5px;color:#748398;font-size:9px;font-style:normal}.ca-stage b{display:block;font-size:10px}.ca-stage small{display:block;margin-top:2px;color:#718095;font-size:8px}.ca-stage em{color:#718095;font-size:8px;font-style:normal}.ca-stage.done i{border-color:rgba(53,200,173,.35);color:#6ed7c6}.ca-stage.current{border-color:rgba(231,178,76,.34)}.ca-stage.current i{color:#f0c86e}.ca-stage.locked{opacity:.55}

.ca-dialog{width:min(430px,calc(100vw - 30px));padding:0;border:1px solid var(--ca-line);border-radius:7px;background:#0d1622;color:var(--ca-text);box-shadow:0 28px 80px rgba(0,0,0,.55)}.ca-dialog::backdrop{background:rgba(2,6,12,.7)}.ca-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--ca-line)}.ca-dialog-head b{font-size:13px}.ca-dialog-close{width:31px;height:31px;border:1px solid var(--ca-line);border-radius:5px;background:transparent;color:#9cabbc;cursor:pointer}.ca-project-list{display:grid;gap:6px;padding:12px}.ca-project-item{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border:1px solid var(--ca-line);border-radius:5px;background:#101a28;color:var(--ca-text);text-align:left;cursor:pointer}.ca-project-item.active{border-color:rgba(231,178,76,.45)}.ca-project-item b{display:block;font-size:10px}.ca-project-item small{display:block;margin-top:2px;color:#748398;font-size:8px}.ca-project-item i{margin-left:auto;color:var(--ca-gold);font-size:9px;font-style:normal}.ca-rename{display:flex;gap:6px;padding:0 12px 13px}.ca-rename input{flex:1;min-width:0;height:35px;padding:0 9px;border:1px solid var(--ca-line);border-radius:5px;background:#08101a;color:var(--ca-text);font-size:10px}.ca-rename button{border:1px solid rgba(231,178,76,.4);border-radius:5px;background:rgba(231,178,76,.1);color:#f2cf85;font-size:10px}.ca-pdf-retry{background:transparent;cursor:pointer}.ca-pdf-retry:disabled{opacity:.5;cursor:wait}
@media(max-width:920px){.ca-shell{grid-template-columns:1fr;grid-template-rows:58px minmax(0,1fr)}.ca-top{grid-column:1}.ca-brand,.ca-live{display:none}.ca-project{display:block;margin-left:0}.ca-project-button{min-width:130px;max-width:180px}.ca-mobile-switch{display:flex}.ca-chat{grid-column:1;grid-row:2;border-right:0}.ca-output{display:none;grid-column:1;grid-row:2}.ca-shell.show-output .ca-chat{display:none}.ca-shell.show-output .ca-output{display:grid}.ca-message-main{width:calc(100% - 38px);max-width:none}.ca-message.user .ca-message-main{max-width:91%}}

<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>
<div class="hq-app"><div class="hq-content" data-active="creator-agent"><main class="ca-shell" id="caShell">
  <header class="ca-top">
    <div class="ca-brand"><b>黄雀创作 Agent</b><small>AI 创作助手</small></div>
    <div class="ca-mobile-switch"><button class="active" data-mobile-view="chat">对话</button><button data-mobile-view="output">成果</button></div>
    <div class="ca-project"><button class="ca-project-button" id="projectButton"><span id="projectName">正在读取画像</span><i>切换</i></button></div>
    <div class="ca-live">已连接</div>
  </header>
  <section class="ca-chat">
    <div class="ca-chat-head"><div class="ca-progress-copy"><b id="progressTitle">画像准备中</b><span id="progressDetail">正在读取独立画像</span></div><div class="ca-quick" id="quickActions"></div></div>
    <div class="ca-messages" id="messages"><div class="ca-empty"><div><b>正在读取创作上下文</b><p>请稍候</p></div></div></div>
    <footer class="ca-composer"><div class="ca-compose-box"><textarea id="messageInput" maxlength="4000" placeholder="输入你的想法或修改要求"></textarea><button class="ca-send" id="sendButton" title="发送">↑</button></div><div class="ca-compose-meta">只有确认报价后才会扣点</div></footer>
  </section>
  <aside class="ca-output">
    <nav class="ca-tabs"><button class="ca-tab active" data-tab="progress">当前进度</button><button class="ca-tab" data-tab="content">内容成果</button><button class="ca-tab" data-tab="tasks">视频任务</button></nav>
    <div class="ca-output-scroll">
      <section class="ca-panel" data-panel="progress" id="progressPanel"></section>
      <section class="ca-panel" data-panel="content" id="contentPanel" hidden></section>
      <section class="ca-panel" data-panel="tasks" id="tasksPanel" hidden></section>
    </div>
  </aside>
</main></div></div>
<dialog class="ca-dialog" id="projectDialog"><div class="ca-dialog-head"><b>画像项目</b><button class="ca-dialog-close" id="projectClose">×</button></div><div class="ca-project-list" id="projectList"></div><div class="ca-rename"><input id="projectRename" maxlength="120" placeholder="画像名称"><button id="renameButton">重命名</button></div></dialog>
<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=7b2db7de"></script>
<script>
(function(){
var state={data:null,busy:false,pollTimer:0,recoverTimer:0,quoteTimer:0,activeTab:'progress'};
var el=function(id){return document.getElementById(id)};
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function safeUrl(value){var url=String(value||'').trim();return /^(?:\/(?!\/)|https:\/\/)/i.test(url)?url:''}
function requestId(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(16).slice(2)}
var pendingStorageKey='hq-creator-agent-pending-v2';
function loadPending(){try{var value=JSON.parse(localStorage.getItem(pendingStorageKey)||'null');if(!value||!value.body||Date.now()-Number(value.created_at||0)>86400000){localStorage.removeItem(pendingStorageKey);return null}return value}catch(ignore){localStorage.removeItem(pendingStorageKey);return null}}
function savePending(value){localStorage.setItem(pendingStorageKey,JSON.stringify(value))}
function clearPending(){localStorage.removeItem(pendingStorageKey);clearTimeout(state.recoverTimer)}
function keepPending(error){return !error||!error.status||error.status>=500||error.code==='idempotency_in_progress'}
function api(path,options){options=options||{};options.credentials='same-origin';options.cache='no-store';options.headers=Object.assign({'Content-Type':'application/json'},options.headers||{});return fetch('/api/creator-agent'+path,options).then(function(response){return response.text().then(function(text){var data={};try{data=JSON.parse(text||'{}')}catch(ignore){}if(response.status===401){location.href='../login.html?redirect=workbench/creator-agent';throw new Error('请先登录')}if(!response.ok)throw Object.assign(new Error(data.detail||'请求失败'),{code:data.code,status:response.status});return data})})}
function currentProject(){return state.data&&state.data.project||{progress:{}}}
function currentWorkspace(){return state.data&&state.data.workspace||{}}
function setBusy(value){state.busy=!!value;el('sendButton').disabled=state.busy;document.querySelectorAll('.ca-action,.ca-command').forEach(function(button){button.disabled=state.busy})}
function messagePublic(item){return item&&item.public&&typeof item.public==='object'?item.public:{}}
function planCards(batch){var plans=batch&&batch.plans||[];return '<div class="ca-plan-grid">'+plans.map(function(plan){return '<article class="ca-plan-card"><header><b>'+esc(plan.platform_label||plan.platform)+'</b><span>'+esc(plan.material_pack&&plan.material_pack.name||'平台素材库')+'</span></header><div class="ca-plan-line"><small>顶部标题</small><strong>'+esc(plan.top_text)+'</strong></div><div class="ca-plan-line"><small>底部行动文案</small><span>'+esc(plan.bottom_text)+'</span></div><div class="ca-plan-line"><small>推荐模板</small><span>'+esc(plan.template_id)+'</span></div><div class="ca-plan-reason">'+esc(plan.template_reason||'')+'</div></article>'}).join('')+'</div>'}
function quoteCard(batch){var quote=batch&&batch.quote||{},items=quote.items||[],expires=Number(quote.expires_at||batch&&batch.quote_expires_at||0);return '<div class="ca-quote">'+items.map(function(item){return '<div class="ca-quote-row"><span>'+esc(item.label||item.platform)+'</span><b>'+Number(item.cost||0)+' 点</b></div>'}).join('')+'<div class="ca-quote-total"><span>合计</span><b>'+Number(quote.total_cost||0)+' 点</b></div><small class="ca-quote-expiry" data-quote-expires="'+expires+'" data-quote-batch="'+esc(batch&&batch.id||'')+'">正在计算报价剩余时间</small></div>'}
function actionButtons(actions,batch){return '<div class="ca-message-tools">'+(actions||[]).map(function(action){var payload=Object.assign({},action.payload||{}),intent=action.intent||'',label=action.label||'继续';if(batch){if(!payload.batch_id)payload.batch_id=batch.id;if(!payload.expected_revision)payload.expected_revision=batch.revision;if(intent==='confirm_payment'&&!payload.expected_quote_expires_at)payload.expected_quote_expires_at=Number(batch.quote_expires_at||batch.quote&&batch.quote.expires_at||0)}return '<button class="ca-action '+(action.primary?'primary':'')+'" data-intent="'+esc(intent)+'" data-original-intent="'+esc(intent)+'" data-original-label="'+esc(label)+'" data-batch-id="'+esc(batch&&batch.id||'')+'" data-message="'+esc(label)+'" data-payload="'+esc(JSON.stringify(payload))+'">'+esc(label)+'</button>'}).join('')+'</div>'}
function platformPicker(pub){var selected=pub.selected||[];return '<div class="ca-platform-picker">'+(pub.platforms||[]).map(function(item){return '<label class="ca-platform-option"><input type="checkbox" value="'+esc(item.id)+'" '+(selected.indexOf(item.id)>=0?'checked':'')+'><span>'+esc(item.label)+'</span></label>'}).join('')+'</div><div class="ca-message-tools"><button class="ca-action primary" data-platform-submit>确认平台</button></div>'}
function profileReview(pub){return '<div class="ca-plan-grid">'+(pub.options||[]).map(function(item){return '<article class="ca-plan-card"><header><b>'+esc(item.title||'画像方案')+'</b></header><div class="ca-plan-line"><strong>'+esc(item.one_liner||'')+'</strong></div><div class="ca-plan-line"><small>优势</small><span>'+esc(Array.isArray(item.strengths)?item.strengths.join('；'):item.strengths||'')+'</span></div><div class="ca-plan-line"><small>风险</small><span>'+esc(Array.isArray(item.risks)?item.risks.join('；'):item.risks||'')+'</span></div></article>'}).join('')+'</div>'}
function publicHtml(pub){if(!pub||!pub.kind)return '';var html='';if(pub.kind==='platform_picker')html+=platformPicker(pub);if(pub.kind==='profile_question'&&pub.template)html+='<div class="ca-foundation">回答参考：'+esc(pub.template)+'</div>';if(pub.kind==='profile_review')html+='<div class="ca-foundation">'+esc(pub.summary||'请确认本模块')+'</div>'+profileReview(pub);if(pub.kind==='video_plan'&&pub.batch)html+=planCards(pub.batch)+actionButtons(pub.actions,pub.batch);if(pub.kind==='video_quote'&&pub.batch)html+=planCards(pub.batch)+quoteCard(pub.batch)+actionButtons(pub.actions,pub.batch);if(pub.kind==='video_submitted'&&pub.batch)html+='<div class="ca-foundation">任务已按平台分别创建，可在右侧查看进度。</div>';if(pub.kind==='profile_modules'&&pub.options)html+='<div class="ca-message-tools">'+pub.options.map(function(item){return '<button class="ca-action" data-fill="我想修改'+esc(item)+'">'+esc(item)+'</button>'}).join('')+'</div>';if(pub.actions&&pub.kind!=='video_plan'&&pub.kind!=='video_quote')html+=actionButtons(pub.actions,pub.batch);return html}
function messageHtml(item){var role=item.role==='user'?'user':'assistant',pub=messagePublic(item);return '<article class="ca-message '+role+'"><div class="ca-avatar">'+(role==='user'?'我':'AI')+'</div><div class="ca-message-main"><div class="ca-bubble">'+esc(item.content)+'</div>'+publicHtml(pub)+'</div></article>'}
function bindMessageTools(){document.querySelectorAll('[data-intent]').forEach(function(button){button.onclick=function(){var payload={};try{payload=JSON.parse(button.dataset.payload||'{}')}catch(ignore){}if(button.dataset.intent==='confirm_payment'){var batch=(state.data.batches||[]).find(function(item){return item.id===payload.batch_id});var cost=batch&&batch.quote&&batch.quote.total_cost||0;if(!confirm('确认消耗 '+cost+' 点并分别创建平台任务？'))return;payload.confirmation_id=requestId('creator-confirm')}sendMessage(button.dataset.message||button.textContent,button.dataset.intent,payload)}});document.querySelectorAll('[data-fill]').forEach(function(button){button.onclick=function(){el('messageInput').value=button.dataset.fill;el('messageInput').focus()}});document.querySelectorAll('[data-platform-submit]').forEach(function(button){button.onclick=function(){var parent=button.closest('.ca-message-main'),values=Array.prototype.map.call(parent.querySelectorAll('.ca-platform-option input:checked'),function(input){return input.value});if(!values.length){alert('请至少选择一个平台');return}sendMessage('已选择：'+values.map(platformLabel).join('、'),'set_platforms',{platforms:values})}})}
function scheduleQuoteCountdown(){clearTimeout(state.quoteTimer);var active=false,now=Math.floor(Date.now()/1000);document.querySelectorAll('[data-quote-expires]').forEach(function(node){var expires=Number(node.dataset.quoteExpires||0),remaining=Math.max(0,expires-now),minutes=Math.floor(remaining/60),seconds=remaining%60,batchId=node.dataset.quoteBatch||'',button=document.querySelector('[data-batch-id="'+batchId+'"][data-original-intent="confirm_payment"]');if(remaining>0){active=true;node.classList.remove('expired');node.textContent='报价剩余 '+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')}else{node.classList.add('expired');node.textContent='报价已过期，请重新报价';if(button){button.dataset.intent='confirm_plan';button.dataset.message='重新获取报价';button.textContent='重新报价'}}});if(active)state.quoteTimer=setTimeout(scheduleQuoteCountdown,1000)}
function renderMessages(){var items=state.data&&state.data.messages||[];el('messages').innerHTML=items.length?items.map(messageHtml).join(''):'<div class="ca-empty"><div><b>从你的目标开始</b><p>告诉我这次想完成什么。</p></div></div>';bindMessageTools();scheduleQuoteCountdown();el('messages').scrollTop=el('messages').scrollHeight}
function platformLabel(key){var item=(state.data.platforms||[]).find(function(entry){return entry.id===key});return item?item.label:key}
function renderHeader(){var project=currentProject(),progress=project.progress||{},quality=project.profile_quality||{};el('projectName').textContent=project.display_name||project.title||'我的个人画像';if(progress.foundation_ready&&quality.status==='needs_review'){el('progressTitle').textContent='画像需要完善';el('progressDetail').textContent=Number(quality.issue_count||0)+' 项关键信息需要重新确认'}else if(progress.foundation_ready){el('progressTitle').textContent='画像已完成';el('progressDetail').textContent='模块 1–4 已确认 · 可开始创作'}else{el('progressTitle').textContent='画像建档中';el('progressDetail').textContent='模块 '+Number(progress.current_module||1)+' · '+(progress.completed_modules||[]).length+'/4 已完成'}el('quickActions').innerHTML=(state.data.quick_actions||[]).map(function(action){return '<button class="ca-command" data-quick-intent="'+esc(action.intent)+'">'+esc(action.label)+'</button>'}).join('');document.querySelectorAll('[data-quick-intent]').forEach(function(button){button.onclick=function(){sendMessage(button.textContent,button.dataset.quickIntent,{})}})}
function statusLabel(status){return{draft:'待确认',ready:'待报价',quoting:'报价中',quoted:'待扣点确认',submitting:'提交中',submit_claimed:'提交中',submission_unknown:'确认提交结果',submitted:'已提交',queued:'排队中',running:'生成中',processing:'处理中',verifying:'校验中',done:'已完成',partial:'部分完成',failed:'失败',failed_submission:'提交失败',refunded:'已退款'}[status]||status||'未知'}
function renderProgress(){var project=currentProject(),progress=project.progress||{},quality=project.profile_quality||{},names=['定位诊断','人设塑造','价值主张','故事资产','内容选题','文案口播'],completed=progress.completed_modules||[],current=Number(progress.current_module||1);var html='<div class="ca-section"><div class="ca-section-head"><h2>独立画像路线</h2><span>'+completed.length+' / 4</span></div><div class="ca-stage-list">'+names.map(function(name,index){var id=index+1,cls=completed.indexOf(id)>=0?'done':id===current?'current':id>4&&!progress.foundation_ready?'locked':'';return '<div class="ca-stage '+cls+'"><i>'+String(id).padStart(2,'0')+'</i><div><b>'+name+'</b><small>'+(id<=4?'个人画像':'内容创作')+'</small></div><em>'+(cls==='done'?'已完成':cls==='current'?'进行中':cls==='locked'?'待解锁':'待开始')+'</em></div>'}).join('')+'</div></div>';var needsReview=progress.foundation_ready&&quality.status==='needs_review';html+='<div class="ca-section"><div class="ca-section-head"><h2>当前状态</h2><span>'+esc(needsReview?'needs_review':progress.foundation_status||'collecting')+'</span></div><div class="ca-artifact"><p class="'+(needsReview?'ca-error':'')+'">'+(needsReview?'检测到 '+Number(quality.issue_count||0)+' 项低信息或缺失内容。点击“完善画像”，Agent 会逐项重新询问。':progress.foundation_ready?'独立个人画像已经确认，后续创作会读取当前画像和平台偏好。':'完成定位、人设、价值主张和故事资产后开放内容与视频制作。')+'</p></div></div>';el('progressPanel').innerHTML=html}
function artifactItems(value,prefix){var items=[];if(Array.isArray(value)){value.forEach(function(item,index){items=items.concat(artifactItems(item,prefix+' '+(index+1)))})}else if(value&&typeof value==='object'){Object.keys(value).forEach(function(key){var item=value[key];if(item&&typeof item==='object')items.push({title:item.title||item.name||prefix+' '+key,content:item.content||item.summary||item.markdown||JSON.stringify(item,null,2)});else if(item)items.push({title:prefix+' '+key,content:String(item)})})}return items}
function overrideItems(value){var labels={module_1:'定位补充',module_2:'人设补充',module_3:'价值主张补充',module_4:'故事补充',general:'画像补充'},items=[];Object.keys(value||{}).forEach(function(key){(value[key]||[]).forEach(function(item){if(item&&item.content)items.push({title:labels[key]||'画像补充',content:item.content})})});return items}
function retryFoundationPdf(button){
  var url=safeUrl(button&&button.dataset.pdfRetry||'');
  if(!url||state.busy)return;
  var original=button.textContent;setBusy(true);button.disabled=true;button.textContent='生成中';
  fetch(url,{credentials:'same-origin',cache:'no-store'}).then(function(response){
    if(response.status===401){location.href='../login.html?redirect=workbench/creator-agent';throw new Error('请先登录')}
    if(!response.ok)return response.text().then(function(text){var data={};try{data=JSON.parse(text||'{}')}catch(ignore){}throw Object.assign(new Error(data.detail||'PDF 生成失败'),{code:data.code,status:response.status})});
    return response.arrayBuffer()
  }).then(function(){return api('/bootstrap')}).then(function(data){state.data=data;renderAll()}).catch(showError).finally(function(){setBusy(false);if(button.isConnected){button.disabled=false;button.textContent=original}})
}
function bindContentTools(){document.querySelectorAll('[data-pdf-retry]').forEach(function(button){button.onclick=function(){retryFoundationPdf(button)}})}
function renderContent(){
  var project=currentProject(),workspace=currentWorkspace(),profile=project.profile||{},pdfStatus=String(project.foundation_pdf_status||''),pdfUrl=safeUrl(project.foundation_pdf_url||''),retryUrl=safeUrl(project.foundation_pdf_retry_url||'');
  var items=overrideItems(workspace.profile_overrides||{}).concat(artifactItems(project.deliverables||{},'内容成果')).concat(artifactItems(project.reports||{},'模块报告'));
  var pdfHtml='';
  if(pdfStatus==='ready'&&pdfUrl){pdfHtml='<article class="ca-artifact"><header><b>IP人设定位背景档案</b><span class="ca-badge done">PDF 已生成</span></header><div class="ca-artifact-actions"><a class="ca-link" href="'+esc(pdfUrl)+'" target="_blank" rel="noopener">查看 PDF</a><a class="ca-link" href="'+esc(pdfUrl)+'" download>下载 PDF</a></div><iframe class="ca-pdf" title="IP人设定位背景档案" src="'+esc(pdfUrl)+'"></iframe></article>'}
  else if(pdfStatus==='failed'||pdfStatus==='pending'){var failed=pdfStatus==='failed';pdfHtml='<article class="ca-artifact"><header><b>IP人设定位背景档案</b><span class="ca-badge '+(failed?'failed':'')+'">'+(failed?'PDF 生成失败':'PDF 待生成')+'</span></header><p class="'+(failed?'ca-error':'')+'">'+(failed?'画像已经保存，背景档案暂未生成。':'画像已经保存，背景档案等待生成。')+'</p>'+(retryUrl?'<div class="ca-artifact-actions"><button class="ca-link ca-pdf-retry" data-pdf-retry="'+esc(retryUrl)+'">'+(failed?'重新生成':'生成 PDF')+'</button></div>':'')+'</article>'}
  else if(pdfStatus==='blocked'){pdfHtml='<article class="ca-artifact"><header><b>IP人设定位背景档案</b><span class="ca-badge failed">画像待完善</span></header><p class="ca-error">请先点击“完善画像”补充关键信息，完成后再生成 PDF。</p></article>'}
  var html='<div class="ca-section"><div class="ca-section-head"><h2>独立个人画像</h2><span>'+(project.progress&&project.progress.foundation_ready?'已确认':'建立中')+'</span></div>'+(Object.keys(profile).length?'<article class="ca-artifact"><p>'+esc(JSON.stringify(profile,null,2))+'</p></article>':'<div class="ca-empty-panel">完成四个画像模块后生成</div>')+pdfHtml+'</div><div class="ca-section"><div class="ca-section-head"><h2>画像版本与内容成果</h2><span>'+items.length+' 项</span></div><div class="ca-artifact-list">'+(items.length?items.map(function(item){return '<article class="ca-artifact"><header><b>'+esc(item.title)+'</b><span class="ca-badge done">已保存</span></header><p>'+esc(typeof item.content==='string'?item.content:JSON.stringify(item.content,null,2))+'</p></article>'}).join(''):'<div class="ca-empty-panel">暂无内容成果</div>')+'</div></div>';
  el('contentPanel').innerHTML=html;bindContentTools()
}
function mediaUrl(result){if(!result||typeof result!=='object')return '';var candidates=[result.video_url,result.url,result.download_url,result.result&&result.result.video_url,result.result&&result.result.url];for(var i=0;i<candidates.length;i++){var safe=safeUrl(candidates[i]);if(safe)return safe}return ''}
function jobHtml(job){var status=job.status||'',url=mediaUrl(job.result),cls=status==='done'?'done':(_FAILED_STATUS.indexOf(status)>=0?'failed':'');var html='<div class="ca-job '+cls+'"><div class="ca-job-head"><b>'+esc(platformLabel(job.platform))+' · V'+Number(job.version||1)+'</b><span>'+esc(statusLabel(status))+'</span></div>';if(job.error)html+='<p class="ca-error">'+esc(job.error)+'</p>';if(job.refund_status)html+='<p class="ca-refund">退款状态：'+esc(job.refund_status)+'</p>';if(url)html+='<video controls preload="metadata" src="'+esc(url)+'"></video><div class="ca-job-actions"><a class="ca-link" href="'+esc(url)+'" download>下载视频</a></div>';return html+'</div>'}
var _FAILED_STATUS=['failed','failed_submission','refunded','error'];
function renderTasks(){var batches=state.data&&state.data.batches||[];el('tasksPanel').innerHTML='<div class="ca-section"><div class="ca-section-head"><h2>视频版本</h2><span>'+batches.length+' 批</span></div><div class="ca-task-list">'+(batches.length?batches.map(function(batch){return '<article class="ca-task"><header><b>'+esc(batch.topic||'模板视频')+'</b><span class="ca-badge '+(batch.status==='done'?'done':_FAILED_STATUS.indexOf(batch.status)>=0?'failed':'')+'">'+esc(statusLabel(batch.status))+'</span></header><p>'+new Date(Number(batch.created_at||0)*1000).toLocaleString()+'</p><div class="ca-job-grid">'+(batch.jobs||[]).map(jobHtml).join('')+'</div></article>'}).join(''):'<div class="ca-empty-panel">暂无视频任务</div>')+'</div></div>'}
function renderProjects(){var projects=state.data&&state.data.projects||[];el('projectList').innerHTML=projects.map(function(project){return '<button class="ca-project-item '+(project.active?'active':'')+'" data-project-id="'+esc(project.id)+'"><div><b>'+esc(project.title)+'</b><small>'+esc(project.updated||'')+'</small></div>'+(project.active?'<i>当前</i>':'')+'</button>'}).join('');document.querySelectorAll('[data-project-id]').forEach(function(button){button.onclick=function(){if(loadPending()){el('projectDialog').close();recoverPending();return}if(button.dataset.projectId===currentProject().id){el('projectDialog').close();return}setBusy(true);api('/projects/'+button.dataset.projectId+'/select',{method:'POST',body:'{}'}).then(function(data){state.data=data;renderAll();el('projectDialog').close()}).catch(showError).finally(function(){setBusy(false)})}});el('projectRename').value=currentProject().display_name||''}
function renderAll(){renderHeader();renderMessages();renderProgress();renderContent();renderTasks();renderProjects();schedulePoll()}
function showError(error){alert(error&&error.message||'请求失败')}
function applyResponse(data){state.data=data;el('messageInput').value='';renderAll()}
function scheduleRecovery(){clearTimeout(state.recoverTimer);state.recoverTimer=setTimeout(recoverPending,Math.min(10000,1500*Math.max(1,Number((loadPending()||{}).attempts||1))))}
function executePending(pending){if(!pending||state.busy)return;pending.attempts=Number(pending.attempts||0)+1;savePending(pending);setBusy(true);api('/messages',{method:'POST',body:JSON.stringify(pending.body)}).then(function(data){clearPending();applyResponse(data)}).catch(function(error){if(keepPending(error)){scheduleRecovery()}else{clearPending();showError(error)}}).finally(function(){setBusy(false);el('messageInput').focus()})}
function recoverPending(){var pending=loadPending();if(!pending||!state.data||state.busy)return;if(pending.body.project_id&&pending.body.project_id!==currentProject().id){setBusy(true);api('/projects/'+pending.body.project_id+'/select',{method:'POST',body:'{}'}).then(function(data){state.data=data;renderAll();setBusy(false);executePending(pending)}).catch(function(error){setBusy(false);if(keepPending(error))scheduleRecovery();else{clearPending();showError(error)}});return}var payload=pending.body.payload||{},batchId=payload.batch_id;if(pending.body.intent==='confirm_payment'&&batchId){setBusy(true);api('/batches/'+batchId+'/refresh',{method:'POST',body:'{}'}).then(function(result){state.data.batches=state.data.batches.map(function(item){return item.id===result.batch.id?result.batch:item});state.data.latest_batch=result.batch;renderTasks();if(['running','done','partial','failed','submitted'].indexOf(result.batch.status)>=0){clearPending();renderAll()}else{setBusy(false);executePending(pending)}}).catch(function(error){if(keepPending(error))scheduleRecovery();else{clearPending();showError(error)}}).finally(function(){setBusy(false)});return}executePending(pending)}
function sendMessage(message,intent,payload){message=String(message||'').trim();if(!message||state.busy||!state.data)return;var existing=loadPending();if(existing){recoverPending();return}var body={message:message,request_id:requestId('creator-turn'),project_id:currentProject().id};if(intent)body.intent=intent;if(payload)body.payload=payload;var pending={kind:'message',body:body,created_at:Date.now(),attempts:0};savePending(pending);executePending(pending)}
function submitInput(){sendMessage(el('messageInput').value,'',{})}
function switchTab(name){state.activeTab=name;document.querySelectorAll('.ca-tab').forEach(function(tab){tab.classList.toggle('active',tab.dataset.tab===name)});document.querySelectorAll('.ca-panel').forEach(function(panel){panel.hidden=panel.dataset.panel!==name})}
function schedulePoll(){clearTimeout(state.pollTimer);var batch=(state.data&&state.data.batches||[]).find(function(item){return['submitting','submitted','queued','running','processing','verifying'].indexOf(item.status)>=0});if(!batch)return;state.pollTimer=setTimeout(function(){api('/batches/'+batch.id+'/refresh',{method:'POST',body:'{}'}).then(function(result){state.data.batches=state.data.batches.map(function(item){return item.id===result.batch.id?result.batch:item});renderTasks();schedulePoll()}).catch(function(){state.pollTimer=setTimeout(schedulePoll,5000)})},3000)}
function init(){api('/bootstrap').then(function(data){state.data=data;renderAll();recoverPending()}).catch(function(error){el('messages').innerHTML='<div class="ca-empty"><div><b>AI 创作助手暂不可用</b><p>'+esc(error.message)+'</p></div></div>'})}
el('sendButton').onclick=submitInput;el('messageInput').onkeydown=function(event){if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitInput()}};el('projectButton').onclick=function(){el('projectDialog').showModal()};el('projectClose').onclick=function(){el('projectDialog').close()};el('renameButton').onclick=function(){var title=el('projectRename').value.trim();if(!title)return;setBusy(true);api('/projects/'+currentProject().id+'/rename',{method:'POST',body:JSON.stringify({title:title})}).then(function(result){state.data.workspace=result.workspace;state.data.project.display_name=result.workspace.alias;state.data.projects.forEach(function(item){if(item.active)item.title=result.workspace.alias});renderHeader();renderProjects();el('projectDialog').close()}).catch(showError).finally(function(){setBusy(false)})};document.querySelectorAll('.ca-tab').forEach(function(tab){tab.onclick=function(){switchTab(tab.dataset.tab)}});document.querySelectorAll('[data-mobile-view]').forEach(function(button){button.onclick=function(){document.querySelectorAll('[data-mobile-view]').forEach(function(item){item.classList.toggle('active',item===button)});el('caShell').classList.toggle('show-output',button.dataset.mobileView==='output')}});init();
})();
