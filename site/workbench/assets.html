<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产库 · 黄雀 AI 工作台</title>
<link rel="icon" href="../assets/cloud/logo-bird.png">

<style>
  body{ overflow:hidden; }
  .gAsset{ grid-template-columns:repeat(4,1fr); }
  /* 通知中心带 ?task= 跳进来时，短暂高亮那条产物（金调，与 DESIGN.md 一致） */
  .asset-focus{animation:asset-focus-pulse 2.6s ease-out 1;border-color:rgba(231,178,76,.62) !important}
  @keyframes asset-focus-pulse{
    0%{box-shadow:0 0 0 0 rgba(231,178,76,.42)}
    18%{box-shadow:0 0 0 5px rgba(231,178,76,.28)}
    100%{box-shadow:0 0 0 0 rgba(231,178,76,0)}
  }
  @media (prefers-reduced-motion:reduce){ .asset-focus{animation:none} }
  .asset-page-scroll{scrollbar-width:auto;scrollbar-color:rgba(231,178,76,.62) rgba(148,164,187,.07)}
  .asset-page-scroll::-webkit-scrollbar{width:12px}
  .asset-page-scroll::-webkit-scrollbar-track{background:rgba(148,164,187,.07);border-radius:99px}
  .asset-page-scroll::-webkit-scrollbar-thumb{background:rgba(231,178,76,.58);border:2px solid rgba(7,11,19,.74);border-radius:99px;background-clip:padding-box}
  .asset-page-scroll::-webkit-scrollbar-thumb:hover{background:rgba(244,205,114,.78);border:2px solid rgba(7,11,19,.74);background-clip:padding-box}
  .skel-shimmer{ background:linear-gradient(100deg, rgba(148,164,187,.04) 30%, rgba(45,212,191,.08) 50%, rgba(148,164,187,.04) 70%); background-size:200% 100%; animation:hq-shimmer 2.6s linear infinite; }
  .chip{ transition:.16s; }
  .chip:hover{ border-color:rgba(231,178,76,.4)!important; color:#eaf1fa!important; }
  .asset-action{height:28px;padding:0 10px;border-radius:8px;border:1px solid rgba(148,164,187,.13);background:rgba(148,164,187,.04);color:#94a4bb;text-decoration:none;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;white-space:nowrap}
  .asset-action:hover{color:#e7b24c;border-color:rgba(231,178,76,.28)}
  .asset-action.gold{border-color:rgba(231,178,76,.28);background:rgba(231,178,76,.08);color:#e7b24c}
  .asset-action.danger{border-color:rgba(244,112,138,.24);background:rgba(244,112,138,.07);color:#f4708a}
  .asset-action.danger:hover{border-color:rgba(244,112,138,.42);color:#ff9bae}
  .asset-prompt-modal{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(3,7,13,.68);backdrop-filter:blur(12px)}
  .asset-prompt-box{width:min(640px,92vw);max-height:min(560px,86vh);display:flex;flex-direction:column;border:1px solid rgba(231,178,76,.26);border-radius:14px;background:linear-gradient(165deg,rgba(16,24,39,.96),rgba(9,14,24,.96));box-shadow:0 24px 70px rgba(0,0,0,.44);overflow:hidden}
  .asset-prompt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(148,164,187,.12)}
  .asset-prompt-title{font-size:14px;font-weight:700;color:#eaf1fa}
  .asset-prompt-close{width:30px;height:30px;border:1px solid rgba(148,164,187,.16);border-radius:8px;background:rgba(148,164,187,.05);color:#94a4bb;cursor:pointer;font-size:18px;line-height:1}
  .asset-prompt-text{margin:0;padding:16px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.72;color:#d8e2ef}
  .asset-prompt-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid rgba(148,164,187,.12)}
  .asset-leads-box{width:min(880px,94vw);max-height:min(680px,88vh)}
  .asset-leads-summary{padding:11px 16px;border-bottom:1px solid rgba(148,164,187,.1);font-size:12px;color:#94a4bb}
  .asset-leads-list{padding:14px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .asset-lead-card{min-width:0;padding:12px;border:1px solid rgba(148,164,187,.13);border-radius:8px;background:rgba(7,11,19,.38);display:flex;flex-direction:column;gap:8px}
  .asset-lead-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .asset-lead-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700;color:#eaf1fa}
  .asset-lead-meta{font-size:11px;color:#94a4bb;white-space:nowrap}
  .asset-lead-content{font-size:12.5px;line-height:1.65;color:#d8e2ef;white-space:pre-wrap;word-break:break-word}
  .asset-lead-source{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:#5c6b82}
  .asset-lead-links{display:flex;align-items:center;gap:8px;flex:none}
  .asset-lead-links a{color:#e7b24c;text-decoration:none;font-weight:600}
  @media (max-width:720px){.asset-leads-list{grid-template-columns:1fr}.asset-lead-source{align-items:flex-start;flex-direction:column}.asset-lead-links{width:100%}}
  .asset-video-modal{position:fixed;inset:0;z-index:46;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,7,13,.74);backdrop-filter:blur(12px)}
  .asset-video-box{position:relative;width:min(92vw,960px);height:min(86vh,540px);border:1px solid rgba(231,178,76,.24);border-radius:14px;background:#050812;box-shadow:0 28px 80px rgba(0,0,0,.5);overflow:hidden}
  .asset-video-box video{width:100%;height:100%;object-fit:contain;background:#050812;display:block}
  .asset-video-close{position:absolute;right:10px;top:10px;z-index:3;width:34px;height:34px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(7,11,19,.78);color:#eaf1fa;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1}
  .asset-video-close:hover{color:#e7b24c;border-color:rgba(231,178,76,.38)}
  .asset-video-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e7b24c;font-size:13px;font-weight:800;background:linear-gradient(145deg,rgba(7,11,19,.96),rgba(16,20,28,.94))}
  .asset-image-box{position:relative;width:min(92vw,960px);height:min(86vh,720px);border:1px solid rgba(231,178,76,.24);border-radius:14px;background:#050812;box-shadow:0 28px 80px rgba(0,0,0,.5);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .asset-image-box img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .asset-image-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:40px;height:40px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(7,11,19,.72);color:#eaf1fa;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1}
  .asset-image-nav:hover{color:#e7b24c;border-color:rgba(231,178,76,.38)}
  .asset-image-nav.prev{left:10px}
  .asset-image-nav.next{right:10px}
  .asset-image-nav:disabled{opacity:.3;cursor:not-allowed}
  .asset-image-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(0deg,rgba(3,7,13,.82),transparent)}
  .asset-image-count{font-size:12px;color:#dbe7f5;}
  .asset-video-open{position:absolute;right:11px;bottom:11px;z-index:2;height:30px;padding:0 10px;border:1px solid rgba(231,178,76,.28);border-radius:9px;background:rgba(7,11,19,.72);color:#e7b24c;font-size:11.5px;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)}
  .asset-select{position:absolute;top:10px;right:10px;z-index:4;width:30px;height:30px;display:none;align-items:center;justify-content:center;border:1px solid rgba(231,178,76,.34);border-radius:9px;background:rgba(7,11,19,.72);backdrop-filter:blur(8px)}
  .asset-select input{width:16px;height:16px;accent-color:#e7b24c;cursor:pointer}
  .multi-on .asset-select{display:flex}
  .mark-tool{height:28px;padding:0 9px;border-radius:8px;border:1px solid rgba(148,164,187,.13);background:rgba(148,164,187,.04);color:#94a4bb;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .mark-tool.on{border-color:rgba(231,178,76,.34);background:rgba(231,178,76,.1);color:#e7b24c}
  .mark-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
  .mark-tag{max-width:108px;padding:3px 7px;border-radius:999px;background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.18);color:#2dd4bf;font-size:10.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:1100px){ .gAsset{ grid-template-columns:repeat(3,1fr);} }
  @media (max-width:760px){ .gAsset{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .gAsset{ grid-template-columns:1fr;} }
</style>

<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>

<div class="hq-app"><div class="hq-content" data-active="assets">
  <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:18px; flex-wrap:wrap;">
    <div>
      <h1 style="margin:0; font-size:27px; font-weight:700; display:flex; align-items:center; gap:11px;"><img src="../assets/icons/ic_assets.png" alt="" style="width:34px;height:34px;object-fit:contain;flex:none;">资产库</h1>
      <p style="margin:9px 0 0; font-size:14px; color:#94a4bb;">素材、作品与交付物的统一仓库，生成的内容会自动归档于此</p>
    </div>
    <div style="display:flex; align-items:center; gap:18px; font-size:13px; color:#94a4bb;">
      <div style="display:flex; flex-direction:column;"><span style="font-size:11.5px;">素材</span><span class="mono" style="font-size:18px; font-weight:700; color:#eaf1fa;">—</span></div>
      <div style="width:1px; height:26px; background:rgba(148,164,187,.14);"></div>
      <div style="display:flex; flex-direction:column;"><span style="font-size:11.5px;">作品</span><span id="cntWorks" class="mono" style="font-size:18px; font-weight:700; color:#eaf1fa;">—</span></div>
      <div style="width:1px; height:26px; background:rgba(148,164,187,.14);"></div>
      <div style="display:flex; flex-direction:column;"><span style="font-size:11.5px;">交付</span><span class="mono" style="font-size:18px; font-weight:700; color:#eaf1fa;">—</span></div>
    </div>
  </div>

  <!-- 工具条：搜索 + 筛选 chip -->
  <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:9px; flex:1; min-width:220px; max-width:340px; padding:9px 14px; border:1px solid rgba(148,164,187,.14); border-radius:11px; background:rgba(148,164,187,.04);">
      <span style="display:flex; width:16px; color:#5c6b82;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
      <input type="text" name="hq_asset_search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" aria-label="搜索资产" placeholder="搜索作品、素材或标签…" style="flex:1; min-width:0; background:transparent; border:none; outline:none; color:#eaf1fa; font-size:13.5px; font-family:inherit;">

    </div>
    <button id="bulkToggle" class="hv-gold" type="button" style="display:flex; align-items:center; gap:6px; padding:9px 14px; font-size:12.5px; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); border-radius:11px; cursor:pointer; font-family:inherit;"><span style="display:flex; width:14px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>多选</button>
    <button id="bulkAll" class="hv-gold" type="button" style="display:none; align-items:center; gap:6px; padding:9px 14px; font-size:12.5px; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); border-radius:11px; cursor:pointer; font-family:inherit;">全选</button>
    <button id="favOnly" class="hv-gold" type="button" style="display:flex; align-items:center; gap:6px; padding:9px 14px; font-size:12.5px; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); border-radius:11px; cursor:pointer; font-family:inherit;">★ 只看收藏</button>
    <select id="tagFilter" aria-label="按标签筛选" style="height:38px; min-width:132px; padding:0 11px; border:1px solid rgba(148,164,187,.14); border-radius:11px; background:rgba(148,164,187,.05); color:#94a4bb; outline:none; font-size:12.5px; font-family:inherit;">
      <option value="">全部标签</option>
    </select>
  </div>
  <div id="catRow" style="display:flex; align-items:center; gap:9px; margin-bottom:26px; flex-wrap:wrap;">
    <span class="chip" data-cat="image" style="padding:7px 15px; font-size:13px; font-weight:600; color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.3); border-radius:99px; cursor:pointer;">图片资产</span>
    <span class="chip" data-cat="audio" style="padding:7px 15px; font-size:13px; color:#94a4bb; background:rgba(148,164,187,.04); border:1px solid rgba(148,164,187,.14); border-radius:99px; cursor:pointer;">音频资产</span>
    <span class="chip" data-cat="video" style="padding:7px 15px; font-size:13px; color:#94a4bb; background:rgba(148,164,187,.04); border:1px solid rgba(148,164,187,.14); border-radius:99px; cursor:pointer;">视频资产</span>
    <span class="chip" data-cat="avatar" style="padding:7px 15px; font-size:13px; color:#94a4bb; background:rgba(148,164,187,.04); border:1px solid rgba(148,164,187,.14); border-radius:99px; cursor:pointer;">数字人形象</span>
    <span class="chip" data-cat="copy" style="padding:7px 15px; font-size:13px; color:#94a4bb; background:rgba(148,164,187,.04); border:1px solid rgba(148,164,187,.14); border-radius:99px; cursor:pointer;">文案脚本</span>
    <span class="chip" data-cat="collect" style="padding:7px 15px; font-size:13px; color:#94a4bb; background:rgba(148,164,187,.04); border:1px solid rgba(148,164,187,.14); border-radius:99px; cursor:pointer;">采集素材</span>
    <span class="chip" data-cat="leads" style="padding:7px 15px; font-size:13px; color:#94a4bb; background:rgba(148,164,187,.04); border:1px solid rgba(148,164,187,.14); border-radius:99px; cursor:pointer;">客户名单</span>
  </div>

  <!-- 真实资产网格（生成历史，JS 填充；有作品时显示、空态隐藏） -->
  <div id="assetGrid" class="gAsset" style="display:none; gap:16px; margin-bottom:26px;"></div>
  <div id="bulkBar" style="display:none; position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:20; align-items:center; gap:12px; padding:10px 12px; border:1px solid rgba(231,178,76,.28); border-radius:14px; background:rgba(7,11,19,.86); box-shadow:0 12px 34px rgba(0,0,0,.32); backdrop-filter:blur(14px);">
    <span id="bulkCount" style="min-width:74px; font-size:12.5px; color:#eaf1fa; font-weight:700;">已选 0 个</span>
    <button id="bulkDownload" class="asset-action gold" type="button" style="height:32px;">批量下载</button>
    <button id="bulkDelete" class="asset-action danger" type="button" style="height:32px;">批量删除</button>
    <button id="bulkCancel" class="asset-action" type="button" style="height:32px;">取消</button>
  </div>

  <!-- 居中大空态 -->
  <div id="assetEmpty" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:44px 24px 40px; border:1px solid rgba(148,164,187,.1); border-radius:20px; background:linear-gradient(165deg, rgba(16,24,39,.55), rgba(12,18,32,.4)); margin-bottom:26px;">
    <div style="position:relative; width:88px; height:88px; display:flex; align-items:center; justify-content:center; border-radius:24px; background:rgba(45,212,191,.08); border:1px solid rgba(45,212,191,.22); color:#2dd4bf; margin-bottom:22px;">
      <span style="display:flex; width:40px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
      <span style="position:absolute; right:-6px; top:-6px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#0c1220; border:1px solid rgba(231,178,76,.3); color:#e7b24c;"><span style="display:flex; width:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span></span>
    </div>
    <div style="font-size:20px; font-weight:700;">资产库陆续上线中</div>
    <p style="margin:11px 0 22px; font-size:14px; color:#94a4bb; max-width:380px; line-height:1.7;">生成的作品会自动入库，这里陆续上线。先去作图，完成的海报、口播与配音都会归档在此，可随时检索与一键交付客户群。</p>
    <a href="banana.html" class="btn-gold" style="display:inline-flex; align-items:center; gap:7px; padding:11px 22px; font-size:14px; font-weight:600; border-radius:11px;"><span style="display:flex; width:16px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></span>去作图</a>
  </div>

  <!-- 即将上线的资产类型 · 骨架占位 -->
  <div id="skelHdr" style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
    <span style="display:flex; width:15px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    <span style="font-size:14px; font-weight:600; color:#94a4bb;">即将上线的资产类型</span>
  </div>
  <div id="skelGrid" class="gAsset" style="display:grid; gap:16px;">
    <!-- 卡片 1 -->
    <div style="position:relative; border:1px dashed rgba(45,212,191,.24); border-radius:16px; background:rgba(16,24,39,.4); overflow:hidden;">
      <span style="position:absolute; top:11px; left:11px; z-index:2; padding:3px 9px; font-size:11px; font-weight:600; border-radius:6px; background:rgba(45,212,191,.14); color:#2dd4bf;">美业海报</span>
      <div class="skel-shimmer" style="aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; color:rgba(45,212,191,.4);"><span style="display:flex; width:34px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></span></div>
      <div style="padding:13px 14px; display:flex; align-items:center; justify-content:space-between;"><div style="height:9px; width:54%; border-radius:5px; background:rgba(148,164,187,.12);"></div><span style="font-size:11.5px; color:#5c6b82;">敬请期待</span></div>
    </div>
    <!-- 卡片 2 -->
    <div style="position:relative; border:1px dashed rgba(45,212,191,.24); border-radius:16px; background:rgba(16,24,39,.4); overflow:hidden;">

<script>
/* 资产库读真实生成历史（生成即自动入库）+ 按模式分类筛选 */
(function(){
  var tok='__cookie__';
  var grid=document.getElementById('assetGrid'), empty=document.getElementById('assetEmpty'),
      skelH=document.getElementById('skelHdr'), skelG=document.getElementById('skelGrid'), cnt=document.getElementById('cntWorks');
  function markAssetPageScroll(){
    var assetContent=document.querySelector('.hq-content');
    var assetPageScroll=assetContent&&assetContent.parentElement;
    if(assetPageScroll) assetPageScroll.classList.add('asset-page-scroll');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',markAssetPageScroll);
  else markAssetPageScroll();
  var MODE={text2img:'文生图', img2img:'图生图', inpaint:'局部修改'};
  function normCat(m){ m=m||''; if(m.indexOf('inpaint')>=0) return 'inpaint'; if(m.indexOf('img2img')>=0) return 'img2img'; return 'text2img'; }  // 各引擎mode→标准类(含 nanobanana_*)
  var params=new URLSearchParams(location.search);
  var ALL=[], cat=params.get('cat')||'image', imgSub=params.get('imgSub')||'all';
  // 兼容旧链接：旧的「全部/文生图/图生图/局部修改」顶层 → 图片资产 + 子筛选
  if(cat==='all'){ cat='image'; }
  else if(cat==='text2img'||cat==='img2img'||cat==='inpaint'){ imgSub=cat; cat='image'; }
  var AUDIO_TAB=params.get('audioTab')||(cat==='audio'?'audio':'public');
  var currentLoadKind='';
  // 通知中心「生成任务已完成」点进来时带 ?task=<job_id>：定位并高亮那条产物。
  // 只用一次，滚动过去后清掉，避免用户之后切分类还被反复拉回去。
  var focusTask=String(params.get('task')||'');
  var personalVoiceLoadSeq=0, activePreviewAudio=null, activePreviewButton=null;
  var searchInput=document.querySelector('input[name="hq_asset_search"]');
  var bulkToggle=document.getElementById('bulkToggle'), bulkAll=document.getElementById('bulkAll'), bulkBar=document.getElementById('bulkBar'),
      bulkCount=document.getElementById('bulkCount'), bulkDownload=document.getElementById('bulkDownload'), bulkDelete=document.getElementById('bulkDelete'), bulkCancel=document.getElementById('bulkCancel');
  var favOnly=document.getElementById('favOnly'), tagFilter=document.getElementById('tagFilter');
  var searchTerm='', multi=false, selected={}, visibleItems=[], MARKS={}, onlyFav=false, activeTag='';
  function freshUrl(url){
    url=String(url||'');
    return /[?&]q-sign-/.test(url)||/voice_preview_/.test(url)?url:url+(url.indexOf('?')>=0?'&':'?')+'_='+(Date.now());  // voice_preview_ 内容哈希不可变，别击穿浏览器缓存
  }
  function playableUrl(url,options){
    options=options||{};
    if(options.proxy){
      var proxy='/api/gen/dl?url='+encodeURIComponent(url)+'&name='+encodeURIComponent(options.name||'collect-video');
      return fetch(proxy,{cache:'no-store',credentials:'same-origin',headers:{Authorization:'Bearer '+tok}})
        .then(function(r){
          if(r.status===401){HQ.login();throw new Error('登录已过期');}
          if(r.status===502) throw new Error('视频链接已过期，请重新采集后再试');
          if(!r.ok) throw new Error('视频暂时无法读取，请稍后重试');
          return r.blob();
        })
        .then(function(blob){return URL.createObjectURL(blob);});
    }
    if(String(url||'').indexOf('/api/gen/file/')!==0) return Promise.resolve(freshUrl(url));
    return fetch(freshUrl(url),{cache:'no-store',headers:{Authorization:'Bearer '+tok}})
      .then(function(r){if(r.status===401){HQ.login();throw new Error('登录已过期');}if(!r.ok)throw new Error('素材读取失败');return r.blob();})
      .then(function(blob){return URL.createObjectURL(blob);});
  }
  // 缩略图：COS 图走 imageMogr2 缩略+webp(体积降数十倍)，且不加缓存穿透→让浏览器缓存缩略图，避免每次进页面全量重下 4.9MB 原图导致裂图(#225)。非COS/本地/视频原样返回。点开/下载仍用原图 x.url。
  function thumbUrl(url, px){
    if(!url || url.indexOf('myqcloud.com')<0) return url;
    if(url.indexOf('imageMogr2')>=0 || url.indexOf('?')>=0) return url;
    if(!/\.(png|jpe?g|webp|gif|bmp)(\?|$)/i.test(url)) return url;
    px=px||420;
    return url+'?imageMogr2/thumbnail/!'+px+'x'+px+'r/format/webp/quality/82';
  }
  function assetUrl(x){ return x.url||x.video_url||x.audio_url||x.image_url||x.preview_url||''; }
  function assetId(x,kind){ return kind==='image' ? (x.id||x.job_id) : x.id; }
  function assetKey(x,kind){ return [kind||cat, x.id||x.job_id||x.asset_id||'', assetUrl(x), x.prompt||x.text||''].join('|'); }
  function markKey(x,kind){ return String(x.job_id||x.id||x.asset_id||assetUrl(x)||x.voice_key||x.provider_avatar_id||''); }
  function markOf(x,kind){ return MARKS[markKey(x,kind)]||{favorite:false,tags:[]}; }
  // 统一 assets 表返回的行把有信息量的内容都放在 meta 里（copy 的正文、collect 的作者/平台/描述、
  // leads 的平台列表），title 只是提示词裁到 120 字。不摊平 meta 的话这三类搜索基本是坏的。
  function metaText(x){
    var m=x&&x.meta; if(!m||typeof m!=='object') return '';
    var out=[];
    Object.keys(m).forEach(function(k){
      var v=m[k];
      if(v==null||typeof v==='boolean') return;
      if(Array.isArray(v)) out.push(v.filter(function(i){return typeof i!=='object';}).join(' '));
      else if(typeof v!=='object') out.push(v);
    });
    return out.join(' ');
  }
  function searchableText(x,kind){
    var m=markOf(x,kind);
    return [
      kind||cat, x.prompt, x.text, x.mode, x.ratio, x.quality, x.model, x.voice, x.voice_key,
      x.voice_name, x.status, x.title, x.display_name, x.sub, x.created_at, metaText(x), (m.tags||[]).join(' ')
    ].filter(Boolean).join(' ').toLowerCase();
  }
  function filterAssets(list,kind){
    var q=(searchTerm||'').trim().toLowerCase();
    return list.filter(function(x){
      var m=markOf(x,kind);
      if(onlyFav && !m.favorite) return false;
      if(activeTag && (m.tags||[]).indexOf(activeTag)<0) return false;
      return !q || searchableText(x,kind).indexOf(q)>=0;
    });
  }
  function setVisible(list,kind){
    visibleItems=list.map(function(x){ return {key:assetKey(x,kind), kind:kind, id:assetId(x,kind), url:assetUrl(x)}; }).filter(function(x){ return !!x.id; });
    updateBulk();
    return list;
  }
  function selectedCount(){ return Object.keys(selected).filter(function(k){ return selected[k]; }).length; }
  function selectedAssets(){
    return Object.keys(selected).map(function(k){ return selected[k]; }).filter(function(x){ return x && x.kind && x.id; })
      .map(function(x){ return {kind:x.kind,id:x.id}; });
  }
  function currentAssetKind(){
    return cat==='audio'?'audio':(cat==='video'?'video':(cat==='avatar'?'avatar':'image'));
  }
  function updateBulk(){
    var n=selectedCount();
    if(grid) grid.classList.toggle('multi-on', !!multi);
    if(bulkToggle){
      bulkToggle.style.color=multi?'#e7b24c':'#94a4bb';
      bulkToggle.style.borderColor=multi?'rgba(231,178,76,.32)':'rgba(148,164,187,.14)';
    }
    if(bulkAll) bulkAll.style.display=multi?'flex':'none';
    if(bulkBar) bulkBar.style.display=(multi&&n)?'flex':'none';
    if(bulkCount) bulkCount.textContent='已选 '+n+' 个';
    if(bulkDownload) bulkDownload.disabled=!n;
    if(bulkDelete) bulkDelete.disabled=!n;
    if(bulkAll && multi) bulkAll.textContent=visibleItems.some(function(v){return !selected[v.key];})?'全选':'取消全选';
  }
  function refreshMarkFilters(){
    if(favOnly){
      favOnly.style.color=onlyFav?'#e7b24c':'#94a4bb';
      favOnly.style.borderColor=onlyFav?'rgba(231,178,76,.32)':'rgba(148,164,187,.14)';
      favOnly.style.background=onlyFav?'rgba(231,178,76,.08)':'rgba(148,164,187,.05)';
    }
    if(tagFilter){
      var tags=[], seen={};
      Object.keys(MARKS||{}).forEach(function(k){
        (MARKS[k].tags||[]).forEach(function(t){ if(t&&!seen[t]){ seen[t]=1; tags.push(t); } });
      });
      tags.sort();
      var prev=activeTag;
      tagFilter.innerHTML='<option value="">全部标签</option>'+tags.map(function(t){ return '<option value="'+escapeHtml(t)+'">'+escapeHtml(t)+'</option>'; }).join('');
      if(prev && tags.indexOf(prev)>=0){ tagFilter.value=prev; } else { activeTag=''; }
    }
  }
  function saveFavorite(x,kind,next,btn){
    var key=markKey(x,kind); if(!key) return;
    btn.disabled=true;
    fetch('/api/gen/asset/favorite',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({kind:kind,key:key,favorite:next})})
      .then(function(r){ if(r.status===401){ HQ.login(); return null; } return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
      .then(function(res){
        if(!res) return;
        if(!res.ok) throw new Error((res.data&&res.data.detail)||'收藏保存失败');
        MARKS[key]=res.data.mark||{favorite:next,tags:(MARKS[key]&&MARKS[key].tags)||[]};
        toast(next?'已收藏':'已取消收藏',true); refreshMarkFilters(); render();
      })
      .catch(function(e){ toast(e.message||'收藏保存失败',false); })
      .finally(function(){ btn.disabled=false; });
  }
  function editTags(x,kind){
    var key=markKey(x,kind); if(!key) return;
    var old=(markOf(x,kind).tags||[]).join('，');
    var input=prompt('输入标签，用逗号分隔', old);
    if(input===null) return;
    var tags=input.split(/[,，]/).map(function(t){ return t.trim(); }).filter(Boolean);
    fetch('/api/gen/asset/tags',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({kind:kind,key:key,tags:tags})})
      .then(function(r){ if(r.status===401){ HQ.login(); return null; } return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
      .then(function(res){
        if(!res) return;
        if(!res.ok) throw new Error((res.data&&res.data.detail)||'标签保存失败');
        MARKS[key]=res.data.mark||{favorite:(MARKS[key]&&MARKS[key].favorite)||false,tags:tags};
        toast('标签已保存',true); refreshMarkFilters(); render();
      })
      .catch(function(e){ toast(e.message||'标签保存失败',false); });
  }
  function addMarkTools(cardEl,x,kind){
    var m=markOf(x,kind), row=document.createElement('div'), fav=document.createElement('button'), tagBtn=document.createElement('button');
    row.className='mark-row';
    fav.type='button'; fav.className='mark-tool'+(m.favorite?' on':''); fav.textContent=m.favorite?'★ 已收藏':'☆ 收藏';
    fav.onclick=function(e){ e.preventDefault(); e.stopPropagation(); saveFavorite(x,kind,!markOf(x,kind).favorite,fav); };
    tagBtn.type='button'; tagBtn.className='mark-tool'; tagBtn.textContent='标签';
    tagBtn.onclick=function(e){ e.preventDefault(); e.stopPropagation(); editTags(x,kind); };
    row.appendChild(fav); row.appendChild(tagBtn);
    (m.tags||[]).slice(0,3).forEach(function(t){ var chip=document.createElement('span'); chip.className='mark-tag'; chip.textContent=t; chip.title=t; row.appendChild(chip); });
    if(kind!=='audio') row.style.padding='0 13px 12px';
    cardEl.appendChild(row);
    return cardEl;
  }
  function addSelectBox(cardEl,x,kind){
    var key=assetKey(x,kind), meta={key:key,kind:kind,id:assetId(x,kind),url:assetUrl(x)}, box=document.createElement('label'), ck=document.createElement('input');
    box.className='asset-select'; ck.type='checkbox'; ck.checked=!!selected[key];
    ck.disabled=!meta.id;
    ck.onchange=function(){ if(ck.checked) selected[key]=meta; else delete selected[key]; updateBulk(); };
    box.onclick=function(e){ e.stopPropagation(); };
    box.appendChild(ck); cardEl.appendChild(box); return cardEl;
  }
  function selectVisible(on){
    visibleItems.forEach(function(v){ if(on) selected[v.key]=v; else delete selected[v.key]; });
    [].slice.call(grid.querySelectorAll('.asset-select input')).forEach(function(ck){ ck.checked=!!on; });
    updateBulk();
  }
  function triggerDownload(url,idx,name){
    if(!url) return;
    var a=document.createElement('a'); a.href=url; a.download=name||('huangque-asset-'+(idx+1)); a.style.display='none';
    document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 60);
  }
  function readDownloadBlob(url,name){
    url=String(url||'').trim();
    if(!url) return Promise.reject(new Error('素材文件缺失'));
    var absolute=new URL(url,location.href), sameOrigin=absolute.origin===location.origin;
    function read(target,local){
      return fetch(target,{cache:'no-store',credentials:local?'same-origin':'omit',headers:local?{Authorization:'Bearer '+tok}:{}})
        .then(function(r){
          if(local&&r.status===401){ HQ.login(); throw new Error('登录已过期'); }
          if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(data){ throw new Error((data&&data.detail)||('下载请求失败（'+r.status+'）')); });
          return r.blob();
        });
    }
    if(sameOrigin||url.indexOf('data:')===0||url.indexOf('blob:')===0) return read(url,sameOrigin);
    var proxy='/api/gen/dl?url='+encodeURIComponent(url)+'&name='+encodeURIComponent(name||'huangque-asset');
    return read(proxy,true).catch(function(proxyError){
      return read(url,false).catch(function(){ throw proxyError; });
    });
  }
  function downloadAsset(url,name,button){
    var oldText=button&&button.textContent;
    if(button){ button.disabled=true; button.textContent='下载中'; }
    return readDownloadBlob(url,name).then(function(blob){
      if(!blob||!blob.size) throw new Error('下载文件为空');
      var ext={'image/jpeg':'.jpg','image/png':'.png','image/webp':'.webp','image/gif':'.gif','audio/mpeg':'.mp3','audio/wav':'.wav','video/mp4':'.mp4','application/zip':'.zip'}[String(blob.type||'').split(';')[0]]||'';
      var fileName=String(name||'huangque-asset');
      if(ext&&!/\.[a-z0-9]{2,5}$/i.test(fileName)) fileName+=ext;
      var objectUrl=URL.createObjectURL(blob);
      triggerDownload(objectUrl,0,fileName);
      setTimeout(function(){ URL.revokeObjectURL(objectUrl); },4000);
      toast('已开始下载',true);
    }).catch(function(e){
      toast((e&&e.message)||'下载失败，请稍后重试',false);
    }).finally(function(){
      if(button){ button.disabled=false; button.textContent=oldText||'下载'; }
    });
  }
  function downloadSelected(){
    var assets=selectedAssets();
    if(!assets.length){ toast('请选择要下载的资产',false); return; }
    bulkDownload.disabled=true; bulkDownload.textContent='打包中';
    fetch('/api/gen/asset/batch-download',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({assets:assets})})
      .then(function(r){
        if(r.status===401){ HQ.login(); return null; }
        if(!r.ok){ return r.json().then(function(d){ throw new Error((d&&d.detail)||'批量下载失败'); }); }
        return r.blob();
      })
      .then(function(blob){
        if(!blob) return;
        var url=URL.createObjectURL(blob);
        triggerDownload(url,0,'huangque-assets.zip');
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        toast('已生成 ZIP 下载包',true);
      })
      .catch(function(e){ toast(e.message||'批量下载失败',false); })
      .finally(function(){ bulkDownload.disabled=false; bulkDownload.textContent='批量下载'; updateBulk(); });
  }
  function deleteSelected(){
    var assets=selectedAssets();
    if(!assets.length){ toast('请选择要删除的资产',false); return; }
    if(!confirm('确定删除选中的 '+assets.length+' 个资产？删除后将从资产库移除')) return;
    bulkDelete.disabled=true; bulkDelete.textContent='删除中';
    fetch('/api/gen/asset/batch-delete',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({assets:assets})})
      .then(function(r){ if(r.status===401){ HQ.login(); return null; } return r.json().then(function(d){ return {ok:r.ok,data:d}; }); })
      .then(function(res){

          for(var c=0;c<audio.numberOfChannels;c++) sum+=audio.getChannelData(c)[i]||0;

    [['all','全部'],['text2img','文生图'],['img2img','图生图'],['inpaint','局部修改']].forEach(function(t){
      var on=t[0]===imgSub;
      var b=document.createElement('button'); b.type='button'; b.textContent=t[1]; b.setAttribute('data-img-tab',t[0]);
      b.style.cssText='flex:1; height:34px; border:none; border-radius:9px; cursor:pointer; color:'+(on?'#1a1206':'#94a4bb')+'; background:'+(on?'linear-gradient(135deg,#f4cd72,#e7b24c)':'transparent')+'; font-size:12.5px; font-weight:700; font-family:inherit;';
      b.onclick=function(){ var u=new URL(location.href); u.searchParams.set('cat','image'); u.searchParams.set('imgSub',t[0]); history.replaceState(null,'',u.toString()); imgSub=t[0]; renderImageGrid(); };
      tabs.appendChild(b);
    });
    grid.appendChild(tabs);
    renderImageGrid();
  }
  function renderImageGrid(){
    [].slice.call(grid.children).forEach(function(n,idx){ if(idx>0) grid.removeChild(n); });  // 保留首行子tab，清旧卡片
    document.querySelectorAll('[data-img-tab]').forEach(function(b){ var on=b.getAttribute('data-img-tab')===imgSub; b.style.color=on?'#1a1206':'#94a4bb'; b.style.background=on?'linear-gradient(135deg,#f4cd72,#e7b24c)':'transparent'; });
    var list = imgSub==='all' ? ALL : ALL.filter(function(x){ return normCat(x.mode)===imgSub; });
    list=setVisible(filterAssets(list,'image'),'image');
    if(!list.length){ var e=document.createElement('div'); e.style.cssText='grid-column:1/-1; padding:30px; text-align:center; font-size:13px; color:#5c6b82;'; e.textContent=searchTerm?'没有匹配的图片资产':'该分类下暂无作品'; grid.appendChild(e); return; }
    list.forEach(function(x,i){ grid.appendChild(withJob(card(x,list,i),x)); });
  }
  // 统一 assets 表的三类（文案/采集素材/客户名单）。它们没有缩略图，用文本卡片渲染。
  // 后端 stage：material 素材 / work 作品 / delivery 交付（DESIGN.md「素材、作品、交付分开」）
  var DOC_KINDS=['copy','collect','leads'];
  var STAGE_LABEL={material:'素材', work:'作品', delivery:'交付'};
  // 分类 chip → 拉取用的 kind。未知分类回退 image（原来是三层嵌套三元，加一类就要改两处）
  function loadKindOf(c){
    return ['audio','video','avatar'].concat(DOC_KINDS).indexOf(c)>=0 ? c : 'image';
  }
  var DOC_EMPTY={
    copy:   {text:'暂无文案脚本，去编导模块生成后会自动入库。', href:'script.html', cta:'去写文案'},
    collect:{text:'暂无采集素材，去内容爬取采集后会自动入库。', href:'collect.html', cta:'去采集'},
    leads:  {text:'暂无客户名单，去获客模块跑一次后会自动入库。', href:'leads.html', cta:'去获客'}
  };
  function copyBody(data){
    data=data||{};
    var body=String(data.body||data.text||'').trim();
    if(body) return body;
    return (Array.isArray(data.scenes)?data.scenes:[]).map(function(s,i){
      if(!s || typeof s!=='object') return '';
      var dur=String(s.dur||'').trim(), scene=String(s.scene||'').trim(), line=String(s.line||'').trim();
      if(!dur && !scene && !line) return '';
      return '镜号'+('0'+(i+1)).slice(-2)+'（'+dur+'）\n画面：'+scene+'\n口播：'+line;
    }).filter(Boolean).join('\n\n');
  }
  function safeDocUrl(value){
    try{
      var u=new URL(String(value||''),location.origin);
      return u.protocol==='http:'||u.protocol==='https:'?u.href:'';
    }catch(e){ return ''; }
  }
  function mergeDocPayload(x,payload){
    payload=payload||{};
    var meta=x.meta||{};
    if(x.kind==='copy'){
      meta.body=copyBody(payload)||copyBody(meta);
      if(payload.text) meta.text=payload.text;
      if(Array.isArray(payload.scenes)) meta.scenes=payload.scenes;
    }
    if(x.kind==='leads'){
      if(Array.isArray(payload.leads)) meta.leads=payload.leads;
      ['keyword','platforms','leads_count','spam','chat','total'].forEach(function(key){
        if(payload[key]!=null) meta[key]=payload[key];
      });
    }
    x.meta=meta;
    return meta;
  }
  function loadDocPayload(x){
    var meta=x.meta||{};
    if(x.kind==='copy' && copyBody(meta)) return Promise.resolve(meta);
    if(x.kind==='leads' && Array.isArray(meta.leads)) return Promise.resolve(meta);
    if(!x.job_id) return Promise.reject(new Error('该资产缺少来源任务，无法读取详情'));
    return fetch('/api/gen/job/'+encodeURIComponent(x.job_id),{
      cache:'no-store',credentials:'same-origin',headers:{'Authorization':'Bearer '+tok,'Cache-Control':'no-cache'}
    }).then(function(r){
      if(r.status===401){ HQ.login(); throw new Error('请先登录后查看'); }
      return r.json().catch(function(){return {};}).then(function(d){
        if(!r.ok) throw new Error(d.detail||'详情读取失败');
        return mergeDocPayload(x,d.result||{});
      });
    });
  }
  function runDocAction(button,loadingLabel,work){
    var original=button&&button.textContent;
    if(button){ button.disabled=true; button.textContent=loadingLabel; }
    return work().catch(function(e){ toast(e.message||'详情读取失败',false); }).finally(function(){
      if(button){ button.disabled=false; button.textContent=original; }
    });
  }
  function openCopyAsset(x,button){
    return runDocAction(button,'读取中',function(){
      return loadDocPayload(x).then(function(payload){
        var body=copyBody(payload);
        if(!body) throw new Error('该文案资产没有可查看内容');
        openTextModal(body,{title:'完整文案脚本',copyLabel:'文案',emptyMessage:'该文案资产没有可查看内容'});
      });
    });
  }
  function leadsText(leads){
    return (leads||[]).map(function(item,i){
      return (i+1)+'. '+(item.nickname||'匿名用户')+' · '+(item.ip_location||'未知属地')+
        '\n需求：'+(item.content||'—')+'\n来源：'+(item.title||item.platform||'—');
    }).join('\n\n');
  }
  function openLeadsModal(payload,x){
    var leads=Array.isArray(payload.leads)?payload.leads:[];
    var old=document.getElementById('assetLeadsModal'); if(old && old._close) old._close();
    var wrap=document.createElement('div'); wrap.id='assetLeadsModal'; wrap.className='asset-prompt-modal';
    var box=document.createElement('div'); box.className='asset-prompt-box asset-leads-box'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','客户名单详情');
    var head=document.createElement('div'); head.className='asset-prompt-head';
    var title=document.createElement('div'); title.className='asset-prompt-title'; title.textContent='客户名单 · '+(payload.keyword||x.title||'获客结果');
    var close=document.createElement('button'); close.type='button'; close.className='asset-prompt-close'; close.setAttribute('aria-label','关闭'); close.textContent='×';
    var summary=document.createElement('div'); summary.className='asset-leads-summary';
    var stats=[leads.length+' 个客户'];
    if(payload.total!=null) stats.push('扫描 '+payload.total+' 条评论');
    if(payload.spam) stats.push('过滤广告 '+payload.spam+' 条');
    summary.textContent=stats.join(' · ');
    var list=document.createElement('div'); list.className='asset-leads-list';
    if(!leads.length){
      var emptyLead=document.createElement('div'); emptyLead.className='asset-lead-card'; emptyLead.textContent='该名单没有可显示的客户详情'; list.appendChild(emptyLead);
    }
    leads.forEach(function(item){
      item=item||{};
      var card=document.createElement('div'); card.className='asset-lead-card';
      var leadHead=document.createElement('div'); leadHead.className='asset-lead-head';
      var name=document.createElement('div'); name.className='asset-lead-name'; name.textContent=item.nickname||'匿名用户';
      var meta=document.createElement('div'); meta.className='asset-lead-meta';
      meta.textContent=[item.ip_location||'未知属地',item.intent||item.platform||''].filter(Boolean).join(' · ');
      leadHead.appendChild(name); leadHead.appendChild(meta);
      var content=document.createElement('div'); content.className='asset-lead-content'; content.textContent=item.content||'（无需求原文）';
      var source=document.createElement('div'); source.className='asset-lead-source';
      var sourceText=document.createElement('span'); sourceText.textContent='来源：'+(item.title||item.platform||'未知内容');
      var links=document.createElement('span'); links.className='asset-lead-links';
      [['查看主页',item.profile_url],['来源视频',item.video_url]].forEach(function(pair){
        var href=safeDocUrl(pair[1]); if(!href) return;
        var a=document.createElement('a'); a.href=href; a.target='_blank'; a.rel='noopener'; a.textContent=pair[0]; links.appendChild(a);
      });
      source.appendChild(sourceText); if(links.childNodes.length) source.appendChild(links);
      card.appendChild(leadHead); card.appendChild(content); card.appendChild(source); list.appendChild(card);
    });
    var foot=document.createElement('div'); foot.className='asset-prompt-foot';
    if(leads.length){ var copy=actionBtn('复制名单',function(){ copyText(leadsText(leads),'客户名单'); }); copy.className+=' gold'; foot.appendChild(copy); }
    var closeModal=function(){ document.removeEventListener('keydown',onKey); wrap.remove(); };
    var onKey=function(e){ if(e.key==='Escape') closeModal(); };
    var done=actionBtn('关闭',closeModal); foot.appendChild(done);
    head.appendChild(title); head.appendChild(close); box.appendChild(head); box.appendChild(summary); box.appendChild(list); box.appendChild(foot); wrap.appendChild(box);
    wrap._close=closeModal; close.onclick=closeModal; wrap.onclick=function(e){ if(e.target===wrap) closeModal(); }; box.onclick=function(e){ e.stopPropagation(); };
    document.addEventListener('keydown',onKey); document.body.appendChild(wrap);
  }
  function openLeadsAsset(x,button){
    return runDocAction(button,'读取中',function(){
      return loadDocPayload(x).then(function(payload){ openLeadsModal(payload,x); });
    });
  }
  function docSummary(x){
    var m=x.meta||{}, bits=[];
    if(x.kind==='copy'){ if(m.ctype) bits.push(m.ctype); if(m.mode==='script') bits.push('分镜脚本'); if(m.platform) bits.push(m.platform); }
    if(x.kind==='collect'){ if(m.platform) bits.push(m.platform); if(m.author) bits.push('@'+m.author);
      if(m.has_transcript) bits.push('有口播文案'); if(m.comments_count) bits.push(m.comments_count+' 条评论'); }
    if(x.kind==='leads'){ if(m.leads_count!=null) bits.push(m.leads_count+' 个客户');
      if(m.total!=null) bits.push('扫 '+m.total+' 条'); if(m.spam) bits.push('滤广告 '+m.spam); }
    return bits.join(' · ')||'—';
  }
  function docBody(x){
    if(x.kind==='copy') return copyBody(x.meta||{});
    if(x.kind==='collect') return String((x.meta||{}).desc||'').trim();
    if(x.kind==='leads'){
      var first=(Array.isArray((x.meta||{}).leads)?x.meta.leads:[])[0];
      if(first) return (first.nickname||'匿名用户')+'：'+(first.content||'无需求原文');
    }
    return '';
  }
  function docCard(x){
    var kind=x.kind;
    var w=document.createElement('div'); w.className='asset-library-card';
    w.style.cssText='display:flex; flex-direction:column; gap:9px; padding:14px 15px 0; border:1px solid rgba(148,164,187,.12); border-radius:16px; background:rgba(16,24,39,.4);';
    var head=document.createElement('div'); head.style.cssText='display:flex; align-items:center; gap:8px;';
    var badge=document.createElement('span'); badge.textContent=STAGE_LABEL[x.stage]||x.stage||'';
    badge.style.cssText='padding:3px 9px; font-size:11px; font-weight:600; border-radius:6px; background:rgba(231,178,76,.1); color:#e7b24c; flex:none;';
    var t=document.createElement('div'); t.textContent=x.title||'（无标题）'; t.title=x.title||'';
    t.style.cssText='flex:1; min-width:0; font-size:13.5px; font-weight:600; color:#eaf1fa; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
    head.appendChild(badge); head.appendChild(t);
    var sub=document.createElement('div'); sub.textContent=docSummary(x);
    sub.style.cssText='font-size:12px; color:#94a4bb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
    w.appendChild(head); w.appendChild(sub);
    var body=docBody(x);
    if(body){
      var pre=document.createElement('div'); pre.textContent=body.slice(0,180)+(body.length>180?'…':'');
      pre.style.cssText='font-size:12px; color:#5c6b82; line-height:1.65; max-height:66px; overflow:hidden;';
      if(kind==='copy'){ pre.style.cursor='pointer'; pre.title='点击查看全文'; pre.onclick=function(){ openCopyAsset(x); }; }
      w.appendChild(pre);
    }
    var foot=document.createElement('div'); foot.style.cssText='display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11.5px; color:#5c6b82;';
    var when=document.createElement('span');
    when.textContent=x.created_at?new Date(Number(x.created_at)*1000).toLocaleString('zh-CN',{hour12:false}):'';
    foot.appendChild(when);
    var right=document.createElement('span'); right.style.cssText='display:flex; align-items:center; gap:8px;';
    if(kind==='copy'){
      var viewCopy=document.createElement('button'); viewCopy.type='button'; viewCopy.className='asset-action gold'; viewCopy.textContent='查看全文';
      viewCopy.onclick=function(){ openCopyAsset(x,viewCopy); }; right.appendChild(viewCopy);
    }
    if(kind==='leads'){
      var viewLeads=document.createElement('button'); viewLeads.type='button'; viewLeads.className='asset-action gold'; viewLeads.textContent='查看名单';
      viewLeads.onclick=function(){ openLeadsAsset(x,viewLeads); }; right.appendChild(viewLeads);
    }
    if(x.url){
      // COS 转存失败时后端回退了第三方 CDN 直链，那种链接带时效、几天后就是死链
      if(kind==='collect' && (x.meta||{}).permanent===false){
        var warn=document.createElement('span'); warn.textContent='链接会过期'; warn.title='未能转存到永久存储，建议尽快下载';
        warn.style.cssText='color:#f4b740;'; right.appendChild(warn);
      }
      if(kind==='collect'){
        var preview=document.createElement('button'); preview.type='button'; preview.className='asset-action gold'; preview.textContent='预览视频';
        preview.onclick=function(){
          var meta=x.meta||{};
          openAssetVideoModal(x.url,x.title,meta.cover,{proxy:meta.permanent===false,name:x.title||'collect-video'});
        };
        right.appendChild(preview);
      }else{
        var a=document.createElement('a'); a.href=x.url; a.target='_blank'; a.rel='noopener'; a.textContent='打开';
        a.style.cssText='color:#e7b24c; text-decoration:none; font-weight:600;';
        right.appendChild(a);
      }
    }
    if(right.childNodes.length) foot.appendChild(right);
    w.appendChild(foot);
    // 收藏 + 标签统一走 addMarkTools（和 card/audioCard/videoCard/avatarCard 一致）。
    // 之前这里手搓了个收藏按钮，漏掉了「标签」按钮和标签 chip，后端接口其实早就支持。
    return addMarkTools(w, x, kind);
  }
  function renderDocAssets(kind){
    grid.innerHTML='';
    if(skelH) skelH.style.display='none';
    if(skelG) skelG.style.display='none';
    var cfg=DOC_EMPTY[kind]||{};
    if(!ALL.length){
      grid.style.display='none';
      if(empty){ empty.style.display='flex';
        var ep=empty.querySelector('p'), ea=empty.querySelector('a');
        if(ep) ep.textContent=cfg.text||'暂无资产';
        if(ea){ ea.href=cfg.href||'#'; if(ea.lastChild) ea.lastChild.textContent=cfg.cta||'去生成'; } }
      return;
    }
    if(empty) empty.style.display='none';
    grid.style.display='grid';
    // 这三类没有文件，批量下载/删除不适用，故不进 visibleItems（批量条保持 0）
    var list=filterAssets(ALL,kind);
    if(!list.length){
      var ne=document.createElement('div');
      ne.style.cssText='grid-column:1/-1; padding:30px; text-align:center; font-size:13px; color:#5c6b82;';
      ne.textContent='没有匹配的资产';
      grid.appendChild(ne); return;
    }
    list.forEach(function(x){ grid.appendChild(withJob(docCard(x),x)); });
  }
  function loadMarks(kind){
    if(['image','audio','video','avatar'].concat(DOC_KINDS).indexOf(kind)<0){ MARKS={}; refreshMarkFilters(); return Promise.resolve(); }
    return fetch(freshUrl('/api/gen/asset/marks?kind='+encodeURIComponent(kind)),{cache:'no-store',headers:{'Authorization':'Bearer '+tok,'Cache-Control':'no-cache'}})
      .then(function(r){ if(r.status===401){ HQ.login(); return null; } return r.json(); })
      .then(function(d){ MARKS=(d&&d.items)||{}; refreshMarkFilters(); })
      .catch(function(){ MARKS={}; refreshMarkFilters(); });
  }
  function load(kind){
    currentLoadKind=kind;
    var url=kind==='audio'?'/api/gen/audio/assets?limit=120':(kind==='video'?'/api/gen/video/assets?limit=120':(kind==='avatar'?'/api/gen/video/avatars?limit=120':
      (DOC_KINDS.indexOf(kind)>=0?'/api/gen/assets?limit=120&kind='+encodeURIComponent(kind):'/api/gen/history?limit=120')));
    var fetchUrl=kind==='avatar'?freshUrl(url):url;
    var headers={'Authorization':'Bearer '+tok};
    if(kind==='avatar') headers['Cache-Control']='no-cache';
    fetch(fetchUrl,{cache:kind==='avatar'?'no-store':'default',headers:headers}).then(function(r){ if(r.status===401){ HQ.login(); return null; } return r.json(); }).then(function(d){
      if(!d) return;
      ALL=d.items||[];
      if(kind==='audio' && !ALL.length){
        return fetch('/api/gen/history?limit=120&kind=audio',{headers:{'Authorization':'Bearer '+tok}})
          .then(function(r){return r.json();})
          .then(function(h){ ALL=h.items||[]; if(cnt) cnt.textContent=ALL.length; return loadMarks(kind).then(render); });
      }
      if(cnt) cnt.textContent=ALL.length; return loadMarks(kind).then(render);
    }).catch(function(){});
  }
  document.querySelectorAll('#catRow .chip').forEach(function(ch){ ch.onclick=function(){
    setCat(ch.getAttribute('data-cat'));
    selected={}; updateBulk();
    load(loadKindOf(cat));
  };});
  function setCat(next){
    cat=next||'all';
    document.querySelectorAll('#catRow .chip').forEach(function(c){
      var on=c.getAttribute('data-cat')===cat;
      c.style.color=on?'#e7b24c':'#94a4bb';
      c.style.background=on?'rgba(231,178,76,.1)':'rgba(148,164,187,.04)';
      c.style.borderColor=on?'rgba(231,178,76,.3)':'rgba(148,164,187,.14)';
      c.style.fontWeight=on?'600':'400';
    });
  }
  setCat(cat);
  if(searchInput){
    searchInput.addEventListener('input',function(){
      searchTerm=searchInput.value||'';
      selected={};
      render();
    });
  }
  if(bulkToggle){ bulkToggle.onclick=function(){ multi=!multi; if(!multi) selected={}; render(); }; }
  if(bulkAll){ bulkAll.onclick=function(){ selectVisible(visibleItems.some(function(v){return !selected[v.key];})); }; }
  if(bulkCancel){ bulkCancel.onclick=function(){ multi=false; selected={}; render(); }; }
  if(bulkDownload){ bulkDownload.onclick=downloadSelected; }
  if(bulkDelete){ bulkDelete.onclick=deleteSelected; }
  if(favOnly){ favOnly.onclick=function(){ onlyFav=!onlyFav; selected={}; refreshMarkFilters(); render(); }; }
  if(tagFilter){ tagFilter.onchange=function(){ activeTag=tagFilter.value||''; selected={}; render(); }; }
  load(loadKindOf(cat));
})();
</script>
</body>
</html>
