<script>
(function(){
  // ===== 灵感案例：数据驱动(inspirations.json) + 分类筛选 + 做同款 =====
  var grid=document.getElementById('caseGrid');
  var MODEL_BADGE={nb2:'纳米香蕉 2', pro:'纳米香蕉 Pro', gpt:'黄雀引擎 2', seedream:'黄雀引擎 1 标准', seedream_pro:'黄雀引擎 1 Pro', seedance:'视频引擎', heygen:'数字化 IP', veo:'视频引擎', grok:'果肉视频'};
  function modelBadge(value,type){
    var raw=String(value||'').trim(), key=raw.toLowerCase();
    if(MODEL_BADGE[key]) return MODEL_BADGE[key];
    if(key.indexOf('gpt-image')>=0 || key==='gpt') return '黄雀引擎 2';
    if(key.indexOf('seedream')>=0) return key.indexOf('pro')>=0 ? '黄雀引擎 1 Pro' : '黄雀引擎 1 标准';
    if(key==='nb2' || key.indexOf('banana 2')>=0 || key.indexOf('gemini-3.1')>=0) return '纳米香蕉 2';
    if(key==='pro' || key.indexOf('banana pro')>=0 || key.indexOf('gemini-3-pro')>=0) return '纳米香蕉 Pro';
    return type==='video' ? '视频引擎' : '图片引擎';
  }
  function watermarkHtml(){
    return '<span class="inspiration-watermark" aria-hidden="true" style="position:absolute; right:10px; bottom:54px; z-index:2; pointer-events:none; padding:4px 8px; border:1px solid rgba(255,255,255,.42); border-radius:6px; background:rgba(7,11,19,.5); color:rgba(255,255,255,.88); font-size:10px; font-weight:700; letter-spacing:.08em; text-shadow:0 1px 3px rgba(0,0,0,.75); backdrop-filter:blur(3px);">黄雀AI · 灵感样片</span>';
  }
  function cleanPrompt(value){
    return String(value||'').replace(/无文字无水印/g,'无文字').replace(/无水印/g,'').replace(/，{2,}/g,'，').replace(/,\s*,/g,',').trim();
  }
  var DATA=[], curCat='all', LIKE_COUNTS={}, LIKED={};
  function likeTotal(x){ return Math.max(0, Number(x.count)||0) + (LIKE_COUNTS[String(x.id)]||0); }
  function likeButton(x){
    var id=String(x.id), liked=!!LIKED[id];
    return '<button type="button" data-like-id="'+id+'" aria-label="'+(liked?'取消点赞':'点赞')+'" aria-pressed="'+liked+'" style="padding:2px 7px; color:'+(liked?'#f45f7d':'#94a4bb')+'; background:transparent; border:1px solid '+(liked?'rgba(244,95,125,.45)':'transparent')+'; border-radius:7px; cursor:pointer; font:inherit;">&#9829; <span data-like-count="'+id+'">'+likeTotal(x)+'</span></button>';
  }
  function syncLikeButtons(id){
    var liked=!!LIKED[id], count=(LIKE_COUNTS[id]||0), item=DATA.find(function(x){return String(x.id)===id;});
    document.querySelectorAll('[data-like-id="'+id+'"]').forEach(function(btn){
      btn.setAttribute('aria-pressed', String(liked));
      btn.setAttribute('aria-label', liked?'取消点赞':'点赞');
      btn.style.color=liked?'#f45f7d':'#94a4bb';
      btn.style.borderColor=liked?'rgba(244,95,125,.45)':'transparent';
      var n=btn.querySelector('[data-like-count]'); if(n) n.textContent=String((Number(item&&item.count)||0)+count);
    });
  }
  function toggleLike(x,e){
    e.preventDefault(); e.stopPropagation();
    var id=String(x.id), next=!LIKED[id];
    fetch('/api/gen/inspiration/like',{method:'POST',credentials:"same-origin",headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(id),favorite:next})}).then(function(r){
      if(r.status===401){ if(window.HQ&&HQ.login) HQ.login(); return null; }
      if(!r.ok) return r.json().catch(function(){return {};}).then(function(d){throw new Error(d.detail||'点赞失败');});
      return r.json();
    }).then(function(d){
      if(!d) return;
      LIKE_COUNTS[id]=Number(d.count)||0;
      if(d.favorite) LIKED[id]=true; else delete LIKED[id];
      syncLikeButtons(id);
    }).catch(function(err){ alert(err.message||'点赞失败，请稍后重试'); });
  }
  function bindLikeButton(root,x){
    var btn=root.querySelector('[data-like-id]');
    if(btn) btn.onclick=function(e){ toggleLike(x,e); };
  }
  function loadLikes(){
    fetch('/api/gen/inspiration/likes',{credentials:"same-origin",cache:'no-store'}).then(function(r){if(!r.ok) throw new Error('load'); return r.json();}).then(function(d){
      LIKE_COUNTS=d.counts||{}; LIKED={}; (d.liked||[]).forEach(function(id){LIKED[String(id)]=true;});
      renderCards();
    }).catch(function(){ /* 静态基础计数仍可正常展示 */ });
  }
  function card(x){
    var a=document.createElement('div'); a.className='hv-lift';
    a.style.cssText='position:relative; border:1px solid rgba(148,164,187,.12); border-radius:14px; overflow:hidden; background:rgba(16,24,39,.4); cursor:pointer;';
    var badge=modelBadge(x.model,x.type), isVid=(x.type==='video');
    var play=isVid?'<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0.9;"><div style="width:46px; height:46px; border-radius:50%; background:rgba(7,11,19,.65); backdrop-filter:blur(4px); border:1px solid rgba(231,178,76,.5); display:flex; align-items:center; justify-content:center; color:#e7b24c;"><svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M7 4v16l13-8z"/></svg></div></div>':'';
    var dur=(isVid&&x.duration)?'<span style="position:absolute; right:10px; top:10px; padding:2px 7px; font-size:10px; border-radius:5px; background:rgba(7,11,19,.7); color:#eaf1fa; font-family:\'JetBrains Mono\',monospace;">'+x.duration+'</span>':'';
    a.innerHTML='<img src="'+x.image+'" loading="lazy" style="display:block; width:100%; height:auto; object-fit:cover;">'
      +play+dur+watermarkHtml()
      +'<span style="position:absolute; top:10px; left:10px; padding:3px 9px; font-size:10.5px; font-weight:600; border-radius:6px; background:rgba(7,11,19,.62); color:#e7b24c;">'+badge+'</span>'
      +'<div style="position:absolute; left:0; right:0; bottom:0; padding:26px 12px 11px; background:linear-gradient(transparent,rgba(7,11,19,.9)); transition:opacity .2s;">'
      +'<div style="font-size:13px; font-weight:600; color:#eaf1fa; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+(x.title||'')+'</div>'
      +'<div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">'
      +'<span style="display:flex; align-items:center; gap:4px; font-size:11px; color:#94a4bb;">'+(x.category||'')+' · '+likeButton(x)+'</span>'
      +'<span class="btn-gold" style="padding:5px 12px; font-size:11.5px; font-weight:600; border-radius:8px; white-space:nowrap; opacity:0.95;">做同款</span>'
      +'</div></div>';
    a.onmouseenter = function(){ a.style.boxShadow='0 10px 30px rgba(0,0,0,.35)'; };
    a.onmouseleave = function(){ a.style.boxShadow=''; };
    a.onclick=function(){ openDetail(x); };
    bindLikeButton(a,x);
    return a;
  }
  var searchInput = document.getElementById('caseSearch');
  // 分类 → 金调3D图标（render3d 香槟金，与首页能力卡同一套）
  var CAT_ICON = {
    '护肤精华':'cat_serum','医美焕肤':'cat_medical','防晒':'cat_sun','面膜护肤':'cat_mask',
    '门店拓客':'cat_store','美妆产品':'cat_makeup','美女':'cat_woman','帅哥':'cat_man','风景':'cat_scenery',
    '皮肤管理封面':'cat_serum','医美科普配图':'cat_medical','门店活动海报':'cat_store','新客体验卡':'cat_store',
    '招商加盟图':'cat_store','朋友圈日签':'cat_makeup','团购套餐图':'cat_makeup','数字人首帧':'cat_woman','客户案例展示':'cat_medical'
  };
  function syncChips(){
    var cats = {}; DATA.forEach(function(x){ if(x.category) cats[x.category] = (cats[x.category]||0) + 1; });
    var chipsEl = document.getElementById('chips');
    if(!chipsEl) return;
    chipsEl.innerHTML = '';
    var all = document.createElement('span');
    all.className = 'chip'; all.setAttribute('data-cat','all'); all.textContent = '全部';
    if(curCat==='all') { all.style.color='#e7b24c'; all.style.fontWeight='600'; }
    all.onclick = function(){ setCat('all'); };
    chipsEl.appendChild(all);
    Object.keys(cats).sort().forEach(function(cat){
      var s = document.createElement('span');
      s.className = 'chip'; s.setAttribute('data-cat',cat);
      s.style.display='inline-flex'; s.style.alignItems='center'; s.style.gap='6px';
      var icoName = CAT_ICON[cat];
      if(icoName){
        var im = document.createElement('img');
        im.src = '../assets/icons/ic_'+icoName+'.png'; im.alt='';
        im.style.cssText = 'width:20px;height:20px;object-fit:contain;flex:none;';
        s.appendChild(im);
      }
      var tx = document.createElement('span'); tx.textContent = cat; s.appendChild(tx);
      if(curCat===cat){ s.style.color='#e7b24c'; s.style.fontWeight='600'; }
      s.onclick = function(){ setCat(cat); };
      chipsEl.appendChild(s);
    });
  }
  function setCat(cat){
    curCat = cat;
    renderCards();
    syncChips();
  }
  function filterData(){
    var q = (searchInput && searchInput.value || '').toLowerCase().trim();
    if(!q) return curCat==='all' ? DATA : DATA.filter(function(x){ return x.category===curCat; });
    return DATA.filter(function(x){
      var matchCat = curCat==='all' || x.category===curCat;
      var matchText = (x.title||'').toLowerCase().indexOf(q)>-1 || (x.prompt||'').toLowerCase().indexOf(q)>-1 || (x.category||'').toLowerCase().indexOf(q)>-1;
      return matchCat && matchText;
    });
  }
  function renderCards(){
    if(!grid) return;
    var list = filterData();
    grid.innerHTML='';
    if(!list.length){
      var e=document.createElement('div'); e.style.cssText='padding:30px; text-align:center; font-size:13px; color:#5c6b82;';
      e.textContent='暂无匹配案例，去作图生成一张吧'; grid.appendChild(e); return;
    }
    list.forEach(function(x){ grid.appendChild(card(x)); });
  }
  if(searchInput){
    searchInput.addEventListener('input', function(){ renderCards(); });
  }
  // ===== 详情弹窗「一键跟创」：看完整创作描述 / 复制 / 编辑 / 下载 / 跳转生成 =====
  var dlgEl=null;
  function closeDlg(){ try{ sessionStorage.removeItem('hq_followcreate_ref'); }catch(e){} if(dlgEl) dlgEl.style.display='none'; }  // 关弹窗即清掉待带的粘贴图
  function openDetail(x){
    var isVid=(x.type==='video'), badge=modelBadge(x.model,x.type);
    if(!dlgEl){
      dlgEl=document.createElement('div');
      dlgEl.style.cssText='position:fixed; inset:0; z-index:9999; background:rgba(5,8,13,.82); backdrop-filter:blur(5px); display:none; align-items:center; justify-content:center; padding:22px;';
      dlgEl.addEventListener('click', function(e){ if(e.target===dlgEl) closeDlg(); });
      document.body.appendChild(dlgEl);
    }
    var jumpLabel=isVid?'🎬 一键跟创（去视频页）':'🎨 一键跟创（去作图）';
    dlgEl.innerHTML=''
      +'<div style="display:flex; max-width:880px; width:100%; max-height:88vh; background:#0d1119; border:1px solid rgba(231,178,76,.2); border-radius:18px; overflow:hidden;">'
      +  '<div style="position:relative; flex:1.1; min-width:0; background:#05080d; display:flex; align-items:center; justify-content:center;"><img src="'+x.image+'" style="display:block; max-width:100%; max-height:88vh; object-fit:contain;">'+watermarkHtml()+'</div>'
      +  '<div style="flex:1; min-width:280px; display:flex; flex-direction:column; padding:22px; overflow:auto;">'
      +    '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;"><div style="font-size:18px; font-weight:700;">'+(x.title||'创作详情')+'</div><span id="dlgClose" style="cursor:pointer; color:#94a4bb; font-size:24px; line-height:1; padding:0 4px;">&times;</span></div>'
      +    '<div style="display:flex; align-items:center; gap:5px; font-size:12px; color:#94a4bb; margin-bottom:16px;">'+(x.category||'')+(badge?(' · '+badge):'')+' · '+likeButton(x)+'</div>'
      +    '<div style="font-size:13px; font-weight:600; margin-bottom:8px;">创作描述 <span style="font-size:11px; color:#5c6b82; font-weight:400;">(可直接编辑，跟创时用改后的)</span></div>'
      +    '<textarea id="dlgPrompt" style="flex:1; min-height:130px; resize:none; width:100%; box-sizing:border-box; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.16); border-radius:10px; color:#eaf1fa; font-size:13px; line-height:1.7; padding:12px; font-family:inherit; outline:none;"></textarea>'
      +    '<div style="display:flex; gap:8px; margin-top:14px;">'
      +      '<button id="dlgCopy" style="flex:1; padding:10px; font-size:12.5px; color:#e7b24c; background:rgba(231,178,76,.08); border:1px solid rgba(231,178,76,.28); border-radius:10px; cursor:pointer; font-family:inherit;">复制提示词</button>'
      +      '<button id="dlgDl" style="flex:1; padding:10px; font-size:12.5px; color:#94a4bb; background:rgba(148,164,187,.06); border:1px solid rgba(148,164,187,.18); border-radius:10px; cursor:pointer; font-family:inherit;">下载样图</button>'
      +    '</div>'
      +    (isVid?'':'<div style="font-size:11px; color:#5c6b82; margin-top:10px;">💡 在上面描述框 Ctrl/⌘V 粘贴你的图，跟创时把这个风格套到你的图上（图生图）</div>')
      +    '<div id="dlgRefChip" style="display:none; align-items:center; gap:8px; margin-top:8px; padding:8px 11px; font-size:12px; color:#2bd576; background:rgba(43,213,118,.08); border:1px solid rgba(43,213,118,.28); border-radius:9px;"><span style="flex:1;">📎 已附你的参考图 · 跟创时带上</span><span id="dlgRefX" style="cursor:pointer; color:#94a4bb; font-size:15px; padding:0 3px;">&times;</span></div>'
      +    '<button id="dlgGo" class="btn-gold" style="margin-top:10px; padding:13px; font-size:14.5px; font-weight:700; border-radius:12px; cursor:pointer; border:none; width:100%;">'+jumpLabel+'</button>'
      +    (isVid?'<div style="font-size:11px; color:#5c6b82; text-align:center; margin-top:8px;">视频功能完善中，部分能力陆续开放</div>':'')
      +  '</div>'
      +'</div>';
    var ta=dlgEl.querySelector('#dlgPrompt'); ta.value=cleanPrompt(x.prompt||'');
    bindLikeButton(dlgEl,x);
    dlgEl.querySelector('#dlgClose').onclick=closeDlg;
    // 弹窗内粘贴你的图 → 跟创时带去作图页当参考图（把这个灵感风格套到你的图上，图生图）
    try{ sessionStorage.removeItem('hq_followcreate_ref'); }catch(e){}  // 每次开弹窗清掉上次待带的图
    var refChip=dlgEl.querySelector('#dlgRefChip');
    function showRefChip(on){ if(refChip) refChip.style.display=on?'flex':'none'; }
    showRefChip(false);
    var refX=dlgEl.querySelector('#dlgRefX');
    if(refX) refX.onclick=function(){ try{ sessionStorage.removeItem('hq_followcreate_ref'); }catch(e){} showRefChip(false); };  // 撤销粘贴
    if(!isVid){ ta.addEventListener('paste', function(e){
      var items=(e.clipboardData&&e.clipboardData.items)||[];
      for(var i=0;i<items.length;i++){
        if(items[i].kind==='file' && items[i].type && items[i].type.indexOf('image/')===0){
          var f=items[i].getAsFile();
          if(f){ e.preventDefault();
            var url=URL.createObjectURL(f), im=new Image();
            im.onload=function(){ var mx=1024, s=Math.min(1,mx/Math.max(im.width,im.height)), cv=document.createElement('canvas');
              cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
              try{ sessionStorage.setItem('hq_followcreate_ref', cv.toDataURL('image/png')); showRefChip(true); }
              catch(err){ alert('图片太大，换张小一点的'); }
              try{ URL.revokeObjectURL(url); }catch(e2){} };
            im.src=url; return; }
        }
      }
    }); }
    dlgEl.querySelector('#dlgCopy').onclick=function(){
      var b=dlgEl.querySelector('#dlgCopy'), done=function(){ b.textContent='✓ 已复制'; setTimeout(function(){ b.textContent='复制提示词'; },1500); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value||'').then(done,function(){ ta.select(); try{document.execCommand('copy');}catch(e){} done(); }); }
      else { ta.select(); try{document.execCommand('copy');}catch(e){} done(); }
    };
    dlgEl.querySelector('#dlgDl').onclick=function(){ var a=document.createElement('a'); a.href=x.image; a.download=(x.title||'huangque')+'.webp'; document.body.appendChild(a); a.click(); a.remove(); };
    dlgEl.querySelector('#dlgGo').onclick=function(){
      var dest=isVid?'video.html':'banana.html';
      location.href=dest+'?prompt='+encodeURIComponent(ta.value||'')+((!isVid&&x.model)?('&engine='+encodeURIComponent(x.model)):'');
    };
    dlgEl.style.display='flex';
  }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && dlgEl && dlgEl.style.display==='flex') closeDlg(); });

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  fetch('inspirations.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
    // 「全部」及各分类载入时随机洗牌一次，每次进页顺序都新鲜；点卡片弹详情
    DATA=shuffle(d||[]);
    var totalEl=document.getElementById('caseTotal');
    if(totalEl) totalEl.textContent=String(DATA.length);
    syncChips(); renderCards(); loadLikes();
  }).catch(function(){ grid.innerHTML='<div style="padding:64px 20px; text-align:center; color:#94a4bb;"><div style="font-size:14px; margin-bottom:8px;">灵感案例加载失败</div><div style="font-size:12px; color:#5c6b82;">请检查网络后刷新页面重试</div></div>'; });

  // 分类筛选由 syncChips 动态绑定
})();
</script>
</body>
</html>
