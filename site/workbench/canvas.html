<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画布 · 海报编辑 · 黄雀 AI 工作台</title>
<link rel="icon" href="../assets/cloud/logo-bird.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/cloud.css?v=8">
<style>
  body{ overflow:hidden; }
  .gCanvas{ display:grid; grid-template-columns:60px 1fr 292px; gap:16px; height:calc(100vh - 134px); min-height:560px; }
  @media (max-width:1100px){ .gCanvas{ grid-template-columns:1fr; height:auto; } }

  .cv-tool{ width:44px; height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:11px; cursor:pointer; color:#94a4bb; transition:.16s; }
  .cv-tool:hover{ background:rgba(148,164,187,.06); color:#eaf1fa; }
  .cv-tool.on{ background:rgba(231,178,76,.12); color:#e7b24c; }
  .cv-tool .tl{ font-size:9px; line-height:1; }
  .cv-ico{ display:flex; align-items:center; flex:none; }

  .cv-stage{ position:relative; display:flex; flex-direction:column; border:1px solid rgba(148,164,187,.1); border-radius:16px; background:radial-gradient(120% 100% at 50% 0%, rgba(18,26,42,.6), rgba(8,12,20,.65)); overflow:hidden; min-height:440px; }
  .cv-bar{ flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 16px; border-bottom:1px solid rgba(148,164,187,.08); background:rgba(7,11,19,.4); }
  .cv-mini{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:9px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s; }
  .cv-mini:hover{ border-color:rgba(231,178,76,.4); color:#eaf1fa; }
  .cv-drop{ flex:1; margin:22px; border:1.5px dashed rgba(148,164,187,.24); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px; background:rgba(148,164,187,.02); }

  .cv-panel{ border:1px solid rgba(148,164,187,.1); border-radius:16px; background:linear-gradient(165deg, rgba(16,24,39,.58), rgba(12,18,32,.46)); padding:16px; }
  .cv-phead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; }
  .cv-ptitle{ font-size:13.5px; font-weight:600; }
  .cv-empty{ border:1px dashed rgba(148,164,187,.24); border-radius:12px; background:rgba(148,164,187,.03); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:22px 12px; text-align:center; color:#5c6b82; }
  .cv-flab{ font-size:11.5px; color:#5c6b82; margin-bottom:6px; display:block; }
  .cv-in{ width:100%; padding:9px 11px; font-size:13px; color:#eaf1fa; background:rgba(7,11,19,.5); border:1px solid rgba(148,164,187,.16); border-radius:10px; outline:none; font-family:inherit; transition:.16s; }
  .cv-in:focus{ border-color:rgba(231,178,76,.4); }
  .cv-row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cv-sel{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 11px; font-size:13px; color:#eaf1fa; background:rgba(7,11,19,.5); border:1px solid rgba(148,164,187,.16); border-radius:10px; cursor:pointer; transition:.16s; }
  .cv-sel:hover{ border-color:rgba(231,178,76,.4); }
  .cv-sw{ width:26px; height:26px; border-radius:8px; cursor:pointer; border:1px solid rgba(148,164,187,.2); transition:.16s; }
  .cv-sw.on{ box-shadow:0 0 0 2px #070b13, 0 0 0 3.5px #e7b24c; }
</style>
</head>
<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>

<div class="hq-app"><div class="hq-content" data-active="canvas">

  <!-- 模块面包屑 -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="display:flex; width:21px; color:#e7b24c;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg></span>
      <span style="font-size:15px; color:#5c6b82;">画布</span>
      <span style="color:#5c6b82;">·</span>
      <span style="font-size:15px; font-weight:600;">海报编辑</span>
      <span style="margin-left:6px; padding:3px 10px; font-size:11.5px; border-radius:7px; color:#94a4bb; background:rgba(148,164,187,.06); border:1px solid rgba(148,164,187,.12);">仙颜美容 · 未命名海报</span>
    </div>
    <div style="display:flex; align-items:center; gap:9px;">
      <button class="cv-mini" title="撤销"><span class="cv-ico" style="width:16px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg></span></button>
      <button class="cv-mini" title="重做"><span class="cv-ico" style="width:16px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg></span></button>
    </div>
  </div>

  <div class="gCanvas">

    <!-- 左：浮动工具栏 -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 0; border:1px solid rgba(148,164,187,.1); border-radius:16px; background:linear-gradient(165deg, rgba(16,24,39,.58), rgba(12,18,32,.46)); align-self:start;">
      <div class="cv-tool on">
        <span class="cv-ico" style="width:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M4 3l7 17 2.3-6.7L20 11 4 3z"/></svg></span>
        <span class="tl">选择</span>
      </div>
      <div class="cv-tool">
        <span class="cv-ico" style="width:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M4 7V5h16v2"/><path d="M9 19h6"/><path d="M12 5v14"/></svg></span>
        <span class="tl">文字</span>
      </div>
      <div class="cv-tool">
        <span class="cv-ico" style="width:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="3" y="3" width="9" height="9" rx="1.5"/><circle cx="17" cy="16.5" r="4"/></svg></span>
        <span class="tl">图形</span>
      </div>
      <div class="cv-tool">
        <span class="cv-ico" style="width:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></span>
        <span class="tl">图片</span>
      </div>
      <div class="cv-tool">
        <span class="cv-ico" style="width:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></span>
        <span class="tl">裁剪</span>
      </div>
      <div style="width:26px; height:1px; background:rgba(148,164,187,.14); margin:4px 0;"></div>
      <div class="cv-tool">
        <span class="cv-ico" style="width:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 14l.7 1.9L22 17l-2.3.6L19 20l-.7-2.4L16 17l2.3-.5z"/></svg></span>
        <span class="tl" style="color:#e7b24c;">AI重绘</span>
      </div>
    </div>

    <!-- 中：画布舞台（空态） -->
    <div class="cv-stage">
      <div class="cv-bar">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:13px; font-weight:600;">海报画布</span>
          <span class="mono" style="font-size:11.5px; color:#5c6b82; padding:3px 8px; border-radius:6px; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.1);">1080 × 1350</span>
          <span style="font-size:11.5px; color:#5c6b82;">3:4 竖版</span>
        </div>
        <div style="display:flex; align-items:center; gap:7px;">
          <button class="cv-mini" title="缩小"><span class="cv-ico" style="width:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M5 12h14"/></svg></span></button>
          <span class="mono" style="font-size:12.5px; color:#94a4bb; min-width:44px; text-align:center;">100%</span>
          <button class="cv-mini" title="放大"><span class="cv-ico" style="width:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 5v14M5 12h14"/></svg></span></button>
          <button class="cv-mini" title="适应屏幕"><span class="cv-ico" style="width:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></span></button>
        </div>
      </div>

      <div class="cv-drop">
        <div style="width:78px; height:78px; display:flex; align-items:center; justify-content:center; border-radius:20px; background:rgba(231,178,76,.07); border:1px solid rgba(231,178,76,.18); color:#e7b24c;">
          <span class="cv-ico" style="width:36px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></span>
        </div>
        <div>
          <div style="font-size:16px; font-weight:600; color:#eaf1fa;">拖入素材或从作图结果导入</div>
          <div style="font-size:13px; color:#94a4bb; margin-top:7px;">开始编辑海报 · 支持 JPG / PNG / WebP</div>
        </div>
        <div style="display:flex; gap:11px; margin-top:4px;">
          <a href="banana.html" class="hv-lift" style="display:inline-flex; align-items:center; gap:7px; padding:10px 18px; font-size:13.5px; font-weight:600; color:#1a1206; background:linear-gradient(135deg,#f4cd72,#e7b24c); border:none; border-radius:11px; cursor:pointer; box-shadow:0 10px 26px -12px rgba(231,178,76,.7); transition:.2s; text-decoration:none;">
            <span class="cv-ico" style="width:16px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></span>从作图结果导入
          </a>
          <button class="cv-mini" style="width:auto; padding:0 16px; gap:7px; display:inline-flex; font-size:13.5px;">
            <span class="cv-ico" style="width:16px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></span>上传素材
          </button>
        </div>
      </div>

      <!-- 底部：模板栏（空态） -->
      <div style="flex:none; display:flex; align-items:center; gap:12px; padding:11px 16px; border-top:1px solid rgba(148,164,187,.08); background:rgba(7,11,19,.34);">
        <span style="font-size:12px; color:#5c6b82;">模板</span>
        <div style="display:flex; align-items:center; gap:9px; overflow:hidden;">
          <div style="width:46px; height:58px; flex:none; border:1px dashed rgba(148,164,187,.24); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#5c6b82;"><span class="cv-ico" style="width:15px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 5v14M5 12h14"/></svg></span></div>
          <div style="width:46px; height:58px; flex:none; border:1px dashed rgba(148,164,187,.18); border-radius:8px; background:rgba(148,164,187,.03);"></div>
          <div style="width:46px; height:58px; flex:none; border:1px dashed rgba(148,164,187,.18); border-radius:8px; background:rgba(148,164,187,.03);"></div>
          <span style="font-size:11.5px; color:#5c6b82; margin-left:4px;">模板陆续上线中</span>
        </div>
      </div>
    </div>

    <!-- 右：图层 + 属性 + 导出 -->
    <div style="display:flex; flex-direction:column; gap:14px; min-height:0; overflow-y:auto;">

      <!-- 图层面板 -->
      <div class="cv-panel">
        <div class="cv-phead">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="cv-ico" style="width:16px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg></span>
            <span class="cv-ptitle">图层</span>
          </div>
          <button class="cv-mini" style="width:28px; height:28px;" title="新建图层"><span class="cv-ico" style="width:14px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 5v14M5 12h14"/></svg></span></button>
        </div>
        <div class="cv-empty">
          <span class="cv-ico" style="width:22px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></svg></span>
          <div style="font-size:13px; color:#94a4bb;">暂无图层</div>
          <div style="font-size:11.5px;">添加文字 / 图形 / 素材后在此显示</div>
        </div>
      </div>

      <!-- 属性面板 -->
      <div class="cv-panel">
        <div class="cv-phead">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="cv-ico" style="width:16px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>
            <span class="cv-ptitle">属性</span>
          </div>
          <span style="font-size:11px; color:#5c6b82;">未选中图层</span>
        </div>

        <div style="display:flex; flex-direction:column; gap:14px;">
          <div>
            <span class="cv-flab">位置</span>
            <div class="cv-row2">
              <input class="cv-in mono" type="text" value="X  0" disabled>
              <input class="cv-in mono" type="text" value="Y  0" disabled>
            </div>
          </div>
          <div>
            <span class="cv-flab">尺寸</span>
            <div class="cv-row2">
              <input class="cv-in mono" type="text" value="W  —" disabled>
              <input class="cv-in mono" type="text" value="H  —" disabled>
            </div>
          </div>
          <div>
            <span class="cv-flab">字体</span>
            <div class="cv-sel">
              <span>思源黑体 · Bold</span>
              <span class="cv-ico" style="width:14px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M6 9l6 6 6-6"/></svg></span>
            </div>
          </div>
          <div>
            <span class="cv-flab">字号 · 行距</span>
            <div class="cv-row2">
              <input class="cv-in mono" type="text" value="64" disabled>
              <input class="cv-in mono" type="text" value="1.3" disabled>
            </div>
          </div>
          <div>
            <span class="cv-flab">颜色</span>
            <div style="display:flex; align-items:center; gap:9px;">
              <span class="cv-sw on" style="background:#e7b24c;"></span>
              <span class="cv-sw" style="background:#2dd4bf;"></span>
              <span class="cv-sw" style="background:#f4708a;"></span>
              <span class="cv-sw" style="background:#2bd576;"></span>
              <span class="cv-sw" style="background:#eaf1fa;"></span>
              <span class="cv-sw" style="background:#070b13;"></span>
              <input class="cv-in mono" type="text" value="#E7B24C" style="width:96px; text-align:center;" disabled>
            </div>
          </div>
          <div>
            <span class="cv-flab">不透明度</span>
            <div style="display:flex; align-items:center; gap:11px;">
              <div style="flex:1; height:6px; border-radius:99px; background:rgba(148,164,187,.14); position:relative;">
                <div style="position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:99px; background:linear-gradient(90deg,#f4cd72,#e7b24c);"></div>
                <div style="position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:14px; height:14px; border-radius:50%; background:#f6d488; box-shadow:0 0 0 3px rgba(231,178,76,.18);"></div>
              </div>
              <span class="mono" style="font-size:12.5px; color:#94a4bb;">100%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 导出 -->
      <button class="hv-lift" style="width:100%; height:50px; flex:none; font-size:15px; font-weight:700; color:#1a1206; background:linear-gradient(135deg,#f4cd72,#e7b24c); border:none; border-radius:14px; cursor:pointer; box-shadow:0 14px 34px -12px rgba(231,178,76,.7); transition:.2s; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:9px;">
        <span class="cv-ico" style="width:18px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></span>
        导出 · 入库
      </button>
      <div style="text-align:center; margin-top:-4px;"><span style="font-size:11.5px; color:#5c6b82;">导出高清海报并同步到资产库</span></div>

    </div>

  </div>
</div></div>

<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=15"></script>
</body>
</html>
