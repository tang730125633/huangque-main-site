<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 配音 · 黄雀 AI 工作台</title>
<link rel="icon" href="../assets/cloud/logo-bird.png">
<link rel="stylesheet" href="../assets/fonts/hq-fonts.css">
<link rel="stylesheet" href="../assets/cloud.css?v=8">
<style>
  body{overflow:hidden}
  .gAud{grid-template-columns:1.45fr 1fr}
  .aud-card{border:1px solid rgba(148,164,187,.1);border-radius:18px;background:linear-gradient(165deg,rgba(16,24,39,.58),rgba(12,18,32,.46));padding:22px}
  .aud-muted{color:#94a4bb}
  .aud-faint{color:#5c6b82}
  .aud-label{font-size:13.5px;font-weight:700;color:#eaf1fa}
  .aud-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .voice-tabs{display:flex;gap:8px;padding:4px;border:1px solid rgba(148,164,187,.13);border-radius:12px;background:rgba(7,11,19,.36);margin:10px 0 12px}
  .voice-tab{flex:1;height:34px;border:0;border-radius:9px;background:transparent;color:#94a4bb;font:700 12.5px inherit;cursor:pointer}
  .voice-tab.on{color:#1a1206;background:linear-gradient(135deg,#f4cd72,#e7b24c)}
  .voice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .voice-card{position:relative;min-height:112px;padding:13px;border:1px solid rgba(148,164,187,.14);border-radius:13px;background:rgba(148,164,187,.05);color:#94a4bb;cursor:pointer;transition:.16s}
  .voice-card:hover{border-color:rgba(231,178,76,.35);transform:translateY(-1px)}
  .voice-card.on{color:#e7b24c;background:rgba(231,178,76,.1);border-color:rgba(231,178,76,.36)}
  .voice-card.add{border-style:dashed;background:rgba(231,178,76,.05)}
  .voice-top{display:flex;align-items:center;gap:9px;padding-right:34px}
  .voice-avatar{width:30px;height:30px;border-radius:50%;flex:none;background:rgba(148,164,187,.12);display:flex;align-items:center;justify-content:center;color:#eaf1fa;font-size:12px;font-weight:800}
  .voice-card.on .voice-avatar{background:linear-gradient(150deg,#9a6a3a,#5a3d22)}
  .voice-name{font-size:13px;font-weight:700;color:#eaf1fa;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .voice-sub{font-size:11px;color:#5c6b82;margin-top:2px;line-height:1.35}
  .voice-card.on .voice-sub{color:#c8902f}
  .voice-play{position:absolute;right:12px;top:12px;width:28px;height:28px;border:1px solid rgba(148,164,187,.18);border-radius:50%;background:rgba(7,11,19,.45);color:#94a4bb;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .voice-play:hover{color:#e7b24c;border-color:rgba(231,178,76,.36)}
  .bars{display:flex;align-items:center;gap:3px;height:20px;margin-top:11px}
  .bars span{width:3px;border-radius:2px;background:rgba(148,164,187,.3)}
  .voice-card.on .bars span{background:rgba(231,178,76,.55)}
  .param-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
  .param-box{border:1px solid rgba(148,164,187,.13);border-radius:13px;background:rgba(7,11,19,.32);padding:13px}
  .param-head{display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .info{width:16px;height:16px;border-radius:50%;border:1px solid rgba(148,164,187,.28);color:#94a4bb;background:transparent;font-size:11px;line-height:14px;cursor:pointer;position:relative}
  .tip{display:none;position:absolute;z-index:20;left:0;top:22px;width:230px;padding:10px 11px;border:1px solid rgba(148,164,187,.18);border-radius:10px;background:#111827;color:#cbd5e1;font-size:12px;line-height:1.55;box-shadow:0 18px 50px rgba(0,0,0,.42)}
  .info.show .tip{display:block}
  .stepper{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center}
  .stepper button{height:34px;border:1px solid rgba(148,164,187,.16);border-radius:10px;background:rgba(148,164,187,.06);color:#eaf1fa;cursor:pointer;font-size:18px}
  .stepper input{height:34px;border:1px solid rgba(231,178,76,.25);border-radius:10px;background:rgba(231,178,76,.06);color:#e7b24c;text-align:center;font:700 13px "JetBrains Mono",monospace}
  .result-wave{display:flex;align-items:center;justify-content:center;gap:4px;height:70px}
  .result-wave span{width:4px;border-radius:2px;background:rgba(231,178,76,.32)}
  .player{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border:1px solid rgba(148,164,187,.1);border-radius:12px;background:rgba(7,11,19,.4)}
  .play-main{width:36px;height:36px;border:1px solid rgba(231,178,76,.24);border-radius:50%;background:rgba(231,178,76,.1);color:#e7b24c;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .progress{flex:1;height:5px;border-radius:99px;background:rgba(148,164,187,.12);overflow:hidden}
  .progress div{height:100%;width:0;background:linear-gradient(90deg,#f4cd72,#e7b24c)}
  .recent-list{display:flex;flex-direction:column;gap:9px}
  .recent-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid rgba(148,164,187,.1);border-radius:12px;background:rgba(148,164,187,.03)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;transition:.2s;background:#111827;border:1px solid rgba(148,164,187,.2);border-radius:12px;padding:11px 16px;color:#eaf1fa;font-size:13px;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (max-width:1100px){.gAud{grid-template-columns:1fr}.voice-grid,.param-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>
<div class="hq-app"><div class="hq-content" data-active="audio">
  <div class="gAud" style="display:grid;gap:18px;align-items:start;">
    <section class="aud-card">
      <div class="aud-row">
        <div><h1 style="margin:0;font-size:21px;font-weight:800;">AI 配音</h1><p class="aud-muted" style="margin:7px 0 0;font-size:13px;">输入文案，选择公共或个人音色，生成口播配音</p></div>
      </div>

      <div class="aud-row" style="margin:22px 0 10px;">
        <span class="aud-label">配音文案</span>
        <button id="clearText" style="border:0;background:transparent;color:#94a4bb;cursor:pointer;font-family:inherit;">清空</button>
      </div>
      <div style="border:1px solid rgba(148,164,187,.16);background:rgba(7,11,19,.5);border-radius:12px;padding:14px 15px;">
        <textarea id="ttsText" rows="5" maxlength="1200" placeholder="输入要配音的文案，支持口播稿、广告语、门店通知..." style="width:100%;resize:none;background:transparent;border:none;outline:none;color:#eaf1fa;font-size:13.5px;line-height:1.75;font-family:inherit;">仙颜美容温馨提醒：本周末科技焕肤体验官名额仅剩 8 席，到店即享冷光嫩肤和小气泡清洁双重护理。预约请回复门店姑娘，我们在仙颜等你变美。</textarea>
        <div class="aud-row" style="justify-content:flex-end;font-size:11.5px;color:#5c6b82;margin-top:8px;"><span id="charCount" class="mono">0 / 1200</span></div>
      </div>

      <div class="aud-row" style="margin:22px 0 0;">
        <span class="aud-label">选择音色</span>
        <a href="assets.html?cat=audio&audioTab=personal" style="font-size:12px;color:#94a4bb;text-decoration:none;">管理个人音色 ›</a>
      </div>
      <div class="voice-tabs">
        <button class="voice-tab on" data-voice-tab="public">公共音色</button>
        <button class="voice-tab" data-voice-tab="personal">个人音色</button>
      </div>
      <div id="voiceGrid" class="voice-grid"></div>

      <div class="param-grid">
        <div class="param-box">
          <div class="param-head"><span class="aud-label">语速</span><button class="info" type="button">!<span class="tip">默认参数效果描述：1.0 为正常语速。数值越大语速越快，越小语速越慢。</span></button></div>
          <div class="stepper"><button data-step="speed" data-dir="-">-</button><input id="speedVal" value="1.0" readonly><button data-step="speed" data-dir="+">+</button></div>
        </div>
        <div class="param-box">
          <div class="param-head"><span class="aud-label">音调</span><button class="info" type="button">!<span class="tip">默认参数效果描述：0 为原始音调。范围 -12 到 12，每次调整 1。</span></button></div>
          <div class="stepper"><button data-step="pitch" data-dir="-">-</button><input id="pitchVal" value="0" readonly><button data-step="pitch" data-dir="+">+</button></div>
        </div>
        <div class="param-box">
          <div class="param-head"><span class="aud-label">音量</span><button class="info" type="button">!<span class="tip">默认参数效果描述：0 为默认音量。范围 -50 到 100，每次调整 10。</span></button></div>
          <div class="stepper"><button data-step="volume" data-dir="-">-</button><input id="volumeVal" value="0" readonly><button data-step="volume" data-dir="+">+</button></div>
        </div>
      </div>

      <button id="generateBtn" class="hv-lift" style="width:100%;height:54px;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:800;color:#1a1206;background:linear-gradient(135deg,#f4cd72,#e7b24c);border:none;border-radius:14px;cursor:pointer;box-shadow:0 14px 34px -12px rgba(231,178,76,.7);font-family:inherit;">
        生成配音 <span class="mono" style="padding:3px 10px;font-size:13px;background:rgba(26,18,6,.18);border-radius:8px;">10 点</span>
      </button>
      <div id="statusText" class="aud-faint" style="text-align:center;font-size:11.5px;margin-top:11px;">生成失败自动退点，生成完成后自动入库为配音资产</div>
    </section>

    <aside class="aud-card" style="position:sticky;top:0;">
      <div style="font-size:16px;font-weight:700;margin-bottom:14px;">生成结果</div>
      <div style="padding:30px 18px;border:1px dashed rgba(231,178,76,.28);border-radius:14px;background:rgba(7,11,19,.4);text-align:center;">
        <div id="waveBox" class="result-wave"></div>
        <div id="resultTitle" style="font-size:13px;color:#94a4bb;font-weight:600;">生成后在此预览音频</div>
        <div id="resultSub" class="aud-faint" style="font-size:11.5px;line-height:1.6;margin-top:4px;">填写文案、选好音色，点击生成配音</div>
      </div>
      <div class="player">
        <button id="mainPlay" class="play-main" type="button">▶</button>
        <div class="progress"><div id="progressBar"></div></div>
        <span id="timeText" class="mono" style="font-size:12px;color:#5c6b82;">00:00 / 00:00</span>
      </div>
      <audio id="resultAudio"></audio>

      <div class="aud-row" style="margin:22px 0 12px;">
        <span style="font-size:15px;font-weight:700;">最近配音</span>
        <a href="assets.html?cat=audio&audioTab=audio" style="font-size:12.5px;color:#94a4bb;text-decoration:none;">全部音频 ›</a>
      </div>
      <div id="recentList" class="recent-list"></div>
    </aside>
  </div>
</div></div>
<div id="toast" class="toast"></div>
<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=cccb4993"></script>
<script>
(function(){
  var tok=localStorage.getItem('hq_token')||'';
  if(!tok){ location.href='../login.html?redirect=workbench/audio'; return; }
  var publicFallback=[
    {scope:'public',voice_key:'S_d21F8OR62',display_name:'温柔女声',provider_voice:'S_d21F8OR62',sub:'情感种草 · 柔和自然'},
    {scope:'public',voice_key:'S_l8wE8OR62',display_name:'活力女声',provider_voice:'S_l8wE8OR62',sub:'广告推荐 · 明亮有记忆点'},
    {scope:'public',voice_key:'S_pa0E8OR62',display_name:'沉稳男声',provider_voice:'S_pa0E8OR62',sub:'知识口播 · 稳重清晰'},
    {scope:'public',voice_key:'S_xaUB8OR62',display_name:'亲和女声',provider_voice:'S_xaUB8OR62',sub:'本地生活 · 真实亲切'}
  ];
  var publicVoiceMeta={
    S_d21F8OR62:{display_name:'温柔女声',sub:'情感种草 · 柔和自然'},
    S_l8wE8OR62:{display_name:'活力女声',sub:'广告推荐 · 明亮有记忆点'},
    S_pa0E8OR62:{display_name:'沉稳男声',sub:'知识口播 · 稳重清晰'},
    S_xaUB8OR62:{display_name:'亲和女声',sub:'本地生活 · 真实亲切'}
  };
  function normalizeVoice(v){
    v=Object.assign({},v||{});
    var meta=publicVoiceMeta[v.voice_key];
    if(v.scope==='public' && meta){
      v.display_name=meta.display_name;
      v.sub=meta.sub;
    }
    return v;
  }
  var voices=[], voiceTab='public', selectedVoice='S_d21F8OR62', activePreview=null, activePreviewBtn=null, currentAudioUrl='';
  var params={speed:1.0,pitch:0,volume:0};
  var el=function(id){return document.getElementById(id);};
  function toast(msg){var t=el('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fresh(u){return u+(u.indexOf('?')>=0?'&':'?')+'_='+Date.now();}
  function fmt(sec){sec=Math.max(0,sec||0);var m=Math.floor(sec/60),s=Math.floor(sec%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
  function bars(){var h=[8,14,22,32,42,30,20,13,26,38,48,38,26,18,28,40,30,22,14,9,6];el('waveBox').innerHTML=h.map(function(n){return '<span style="height:'+n+'px"></span>';}).join('');}
  function resetBtn(btn){if(btn){btn.textContent='▶';}}
  function stopPreview(){if(activePreview){try{activePreview.pause();activePreview.currentTime=0;}catch(e){} activePreview=null;} resetBtn(activePreviewBtn); activePreviewBtn=null;}
  function renderVoices(){
    var grid=el('voiceGrid'), list=voices.filter(function(v){return v.scope===voiceTab;});
    grid.innerHTML='';
    if(voiceTab==='personal'){
      var add=document.createElement('div'); add.className='voice-card add'; add.innerHTML='<div class="voice-top"><div class="voice-avatar">+</div><div><div class="voice-name">复刻音色</div><div class="voice-sub">去资产页上传样音</div></div></div><div class="bars">'+[7,15,10,18,12,8,16,9].map(function(n){return '<span style="height:'+n+'px"></span>';}).join('')+'</div>';
      add.onclick=function(){location.href='assets.html?cat=audio&audioTab=personal';}; grid.appendChild(add);
      if(!list.length){var empty=document.createElement('div');empty.style.cssText='grid-column:1/-1;padding:18px;border:1px dashed rgba(148,164,187,.16);border-radius:14px;color:#94a4bb;text-align:center;font-size:13px;';empty.textContent='暂无个人音色，复刻完成后会显示在这里';grid.appendChild(empty);}
    }
    list.forEach(function(v){
      var key=v.voice_key, on=key===selectedVoice, card=document.createElement('div');
      card.className='voice-card'+(on?' on':''); card.dataset.voice=key;
      var initial=(v.display_name||key).charAt(0).toUpperCase();
      card.innerHTML='<div class="voice-top"><div class="voice-avatar">'+esc(initial)+'</div><div style="min-width:0"><div class="voice-name">'+esc(v.display_name||key)+'</div><div class="voice-sub">'+esc(v.sub||(v.scope==='personal'?'个人音色':'公共音色'))+'</div></div></div>'
        +(v.preview_url?'<button class="voice-play" type="button" title="试听">▶</button>':'')
        +'<div class="bars">'+[6,13,9,17,11,7,15,10,18,6].map(function(n){return '<span style="height:'+n+'px"></span>';}).join('')+'</div>';
      card.onclick=function(){selectedVoice=key;renderVoices();};
      var btn=card.querySelector('.voice-play');
      if(btn){btn.onclick=function(e){e.preventDefault();e.stopPropagation();playPreview(v.preview_url,btn);};}
      grid.appendChild(card);
    });
  }
  function playPreview(url,btn){
    if(activePreviewBtn===btn && activePreview && !activePreview.paused){stopPreview();return;}
    stopPreview();
    activePreview=new Audio(fresh(url)); activePreviewBtn=btn; btn.textContent='Ⅱ';
    activePreview.onended=stopPreview; activePreview.play().catch(function(){stopPreview();toast('试听失败');});
  }
  function loadVoices(){
    fetch(fresh('/api/gen/audio/voices'),{cache:'no-store',headers:{Authorization:'Bearer '+tok,'Cache-Control':'no-cache'}})
      .then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/audio';return Promise.reject();}return r.json();})
      .then(function(d){
        var got=d.items||[];
        var publics=got.filter(function(v){return v.scope==='public';}).map(normalizeVoice);
        var personals=got.filter(function(v){return v.scope==='personal' && v.provider_voice && v.preview_url;});
        voices=(publics.length?publics:publicFallback.map(normalizeVoice)).concat(personals);
        if(!voices.some(function(v){return v.voice_key===selectedVoice;})) selectedVoice=(voices[0]||publicFallback[0]).voice_key;
        renderVoices();
      }).catch(function(){voices=publicFallback.map(normalizeVoice);renderVoices();});
  }
  function loadRecent(){
    fetch(fresh('/api/gen/audio/assets?limit=8'),{cache:'no-store',headers:{Authorization:'Bearer '+tok,'Cache-Control':'no-cache'}})
      .then(function(r){return r.json();}).then(function(d){renderRecent(d.items||[]);}).catch(function(){});
  }
  function renderRecent(items){
    var box=el('recentList'); box.innerHTML='';
    if(!items.length){box.innerHTML='<div style="padding:24px 18px;border:1px dashed rgba(148,164,187,.18);border-radius:14px;background:rgba(148,164,187,.02);text-align:center;color:#94a4bb;font-size:12.5px;">暂无音频，生成后自动入库</div>';return;}
    items.forEach(function(a){var row=document.createElement('div');row.className='recent-item';row.innerHTML='<button class="play-main" style="width:30px;height:30px" type="button">▶</button><div style="min-width:0;flex:1"><div style="font-size:12.5px;color:#eaf1fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc((a.text||'配音资产').slice(0,34))+'</div><div class="mono" style="font-size:10.5px;color:#5c6b82;margin-top:3px;">'+esc(a.voice_name||a.voice_key||'')+' · '+(a.speed||'1.0')+'</div></div><a href="'+esc(a.url||'#')+'" download style="color:#e7b24c;text-decoration:none;font-size:12px;">下载</a>';row.querySelector('button').onclick=function(){setResult(a.url,a.text||'配音资产',true);};box.appendChild(row);});
  }
  function updateParams(){
    el('speedVal').value=params.speed.toFixed(1); el('pitchVal').value=params.pitch; el('volumeVal').value=params.volume;
  }
  document.querySelectorAll('[data-step]').forEach(function(b){b.onclick=function(){var k=b.dataset.step, dir=b.dataset.dir==='+'?1:-1;if(k==='speed')params.speed=Math.max(0.5,Math.min(2.0,Math.round((params.speed+dir*.1)*10)/10));if(k==='pitch')params.pitch=Math.max(-12,Math.min(12,params.pitch+dir));if(k==='volume')params.volume=Math.max(-50,Math.min(100,params.volume+dir*10));updateParams();};});
  document.querySelectorAll('.info').forEach(function(b){b.onclick=function(e){e.stopPropagation();document.querySelectorAll('.info.show').forEach(function(x){if(x!==b)x.classList.remove('show');});b.classList.add('show');};b.onmouseleave=function(){b.classList.remove('show');};});
  document.querySelectorAll('[data-voice-tab]').forEach(function(b){b.onclick=function(){voiceTab=b.dataset.voiceTab;document.querySelectorAll('[data-voice-tab]').forEach(function(x){x.classList.toggle('on',x===b);});stopPreview();renderVoices();};});
  el('ttsText').addEventListener('input',function(){el('charCount').textContent=el('ttsText').value.length+' / 1200';});
  el('clearText').onclick=function(){el('ttsText').value='';el('ttsText').dispatchEvent(new Event('input'));};
  function setBusy(on){el('generateBtn').disabled=on;el('generateBtn').style.opacity=on?'.72':'1';el('generateBtn').style.cursor=on?'wait':'pointer';}
  function generate(){
    var text=el('ttsText').value.trim(); if(!text){toast('请先输入配音文案');return;}
    setBusy(true); el('statusText').textContent='正在提交配音任务...';
    fetch('/api/gen/audio',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({text:text,voice:selectedVoice,speed:params.speed,pitch:params.pitch,volume:params.volume})})
      .then(function(r){return r.json().then(function(d){return {status:r.status,data:d};});})
      .then(function(res){if(res.status===401){location.href='../login.html?redirect=workbench/audio';return;}if(!res.data.job_id)throw new Error(res.data.detail||'提交失败');pollJob(res.data.job_id,0);})
      .catch(function(e){setBusy(false);el('statusText').textContent=e.message||'提交失败';toast(el('statusText').textContent);});
  }
  function pollJob(id,n){
    el('statusText').textContent='正在生成配音...';
    fetch('/api/gen/job/'+id,{headers:{Authorization:'Bearer '+tok}}).then(function(r){return r.json();}).then(function(d){
      if(d.status==='done' && d.result){setBusy(false);setResult(d.result.url,d.result.text||'配音结果',true);el('statusText').textContent='生成完成，已自动入库为配音资产';loadRecent();return;}
      if(d.status==='error'){throw new Error(d.error||'生成失败');}
      if(n<90)setTimeout(function(){pollJob(id,n+1);},2000);else throw new Error('生成超时，请稍后到资产页查看');
    }).catch(function(e){setBusy(false);el('statusText').textContent=e.message||'生成失败';toast(el('statusText').textContent);});
  }
  function setResult(url,title,play){
    currentAudioUrl=url||''; var a=el('resultAudio'); a.src=fresh(currentAudioUrl); el('resultTitle').textContent=title||'配音结果'; el('resultSub').textContent=currentAudioUrl?'已生成，可试听或下载':'暂无音频'; if(play)a.play().catch(function(){});
  }
  el('generateBtn').onclick=generate;
  el('mainPlay').onclick=function(){var a=el('resultAudio');if(!currentAudioUrl){toast('暂无可播放音频');return;}if(a.paused){a.play();}else{a.pause();}};
  el('resultAudio').ontimeupdate=function(){var a=el('resultAudio'), pct=a.duration?Math.min(100,a.currentTime/a.duration*100):0;el('progressBar').style.width=pct+'%';el('timeText').textContent=fmt(a.currentTime)+' / '+fmt(a.duration);};
  el('resultAudio').onplay=function(){el('mainPlay').textContent='Ⅱ';};
  el('resultAudio').onpause=function(){el('mainPlay').textContent='▶';};
  bars(); updateParams(); el('ttsText').dispatchEvent(new Event('input')); loadVoices(); loadRecent();
})();
</script>
</body>
</html>
