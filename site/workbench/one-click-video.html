<style>
body{overflow:hidden}.hq-content[data-active="video"]{height:100%;min-height:0;overflow:hidden}.compose-page{height:100%;display:flex;flex-direction:column;gap:14px;min-height:0}.compose-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.compose-head h1{margin:0;font-size:25px}.compose-head p{margin:7px 0 0;color:#94a4bb;font-size:13px}.stage-row{display:flex;gap:7px;flex-wrap:wrap}.stage{height:28px;padding:0 10px;display:flex;align-items:center;border:1px solid rgba(148,164,187,.14);border-radius:999px;color:#65758d;background:rgba(148,164,187,.04);font-size:11px;font-weight:800}.stage.on{color:#171004;border-color:#e7b24c;background:#e7b24c}.compose-grid{display:grid;grid-template-columns:320px minmax(360px,1fr) 390px;gap:14px;flex:1;min-height:0}.panel{min-height:0;border:1px solid rgba(148,164,187,.12);border-radius:14px;background:linear-gradient(165deg,rgba(16,24,39,.72),rgba(8,13,23,.68));overflow:hidden;display:flex;flex-direction:column}.panel-head{padding:14px 15px;border-bottom:1px solid rgba(148,164,187,.1);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head b{font-size:13px}.panel-head span{font-size:11px;color:#65758d}.panel-body{padding:14px;overflow:auto;min-height:0}.asset-list{display:flex;flex-direction:column;gap:8px}.asset-card{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:9px;border:1px solid rgba(148,164,187,.12);border-radius:10px;background:rgba(148,164,187,.035);cursor:pointer;color:inherit;text-align:left;font-family:inherit}.asset-card:hover,.asset-card.on{border-color:rgba(231,178,76,.42);background:rgba(231,178,76,.08)}.asset-icon{height:54px;border-radius:8px;background:linear-gradient(145deg,#1b2738,#080c14);display:flex;align-items:center;justify-content:center;color:#e7b24c;font-size:21px}.asset-title{font-size:12px;font-weight:800;color:#eaf1fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-meta{margin-top:5px;color:#65758d;font-size:10.5px}.empty{padding:24px 12px;border:1px dashed rgba(148,164,187,.16);border-radius:10px;text-align:center;color:#65758d;font-size:12px;line-height:1.7}.review-list{display:flex;flex-direction:column;gap:9px}.candidate{padding:11px;border:1px solid rgba(148,164,187,.12);border-radius:11px;background:rgba(7,11,19,.4)}.candidate-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.candidate-time{font-family:"JetBrains Mono";font-size:11px;color:#e7b24c}.candidate-kind{padding:3px 7px;border-radius:999px;background:rgba(231,178,76,.1);color:#e7b24c;font-size:10px;font-weight:800}.candidate-reason{margin-top:7px;color:#d9e4f2;font-size:12px;line-height:1.55}.candidate-text{margin-top:6px;color:#94a4bb;font-size:11px}.candidate-action{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:#94a4bb;font-size:11px}.candidate-action input{width:17px;height:17px;accent-color:#e7b24c}.play-cut{height:27px;padding:0 9px;border:1px solid rgba(148,164,187,.16);border-radius:7px;background:rgba(148,164,187,.05);color:#dbe6f3;font:800 10px inherit;cursor:pointer}.transcript{margin-bottom:12px;padding:11px;border:1px solid rgba(45,212,191,.16);border-radius:10px;background:rgba(45,212,191,.05);color:#b9c9db;font-size:12px;line-height:1.7;word-break:break-word}.video-wrap{position:relative;width:100%;aspect-ratio:9/16;max-height:52vh;border:1px solid rgba(148,164,187,.14);border-radius:12px;background:#03060b;overflow:hidden}.video-wrap video{width:100%;height:100%;object-fit:contain;display:block}.video-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#65758d;font-size:12px;line-height:1.7}.status{margin-top:10px;min-height:42px;padding:10px 11px;border-radius:9px;background:rgba(148,164,187,.05);color:#94a4bb;font-size:11.5px;line-height:1.55}.status.good{color:#2dd4bf;background:rgba(45,212,191,.08)}.status.bad{color:#f4708a;background:rgba(244,112,138,.08)}.form{display:grid;gap:9px;margin-top:12px}.field label{display:block;margin-bottom:5px;color:#94a4bb;font-size:10.5px;font-weight:700}.field input{width:100%;height:37px;padding:0 10px;border:1px solid rgba(148,164,187,.14);border-radius:9px;background:rgba(7,11,19,.5);color:#eaf1fa;font:12px inherit;outline:none}.field input:focus{border-color:rgba(231,178,76,.45)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;height:43px;border:none;border-radius:10px;background:linear-gradient(135deg,#f4cd72,#e7b24c);color:#171004;font:900 13px inherit;cursor:pointer}.btn:disabled{opacity:.42;cursor:not-allowed}.btn.secondary{border:1px solid rgba(148,164,187,.16);background:rgba(148,164,187,.06);color:#dbe6f3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.result-link{display:none;margin-top:8px;color:#e7b24c;font-size:11px;text-decoration:none}.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(231,178,76,.25);border-top-color:#e7b24c;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1180px){.compose-grid{grid-template-columns:270px 1fr 340px}}@media(max-width:900px){body{overflow:auto}.hq-content[data-active="video"]{height:auto;overflow:visible}.compose-grid{grid-template-columns:1fr}.panel{max-height:none}.video-wrap{max-height:70vh}}@media(max-width:600px){.compose-page{padding:0 10px 16px}.compose-head{align-items:flex-start;flex-direction:column;gap:10px}.stage-row{width:100%;flex-wrap:nowrap}.stage{flex:1;justify-content:center;padding:0 5px}.actions,.two{grid-template-columns:1fr}}
@media(max-width:900px){.hq-app{overflow:auto!important}}
</style>

<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>
<div class="hq-app"><div class="hq-content" data-active="video"><div class="compose-page">
  <header class="compose-head"><div><h1>一键成片</h1><p>已有口播 → AI 粗剪建议 → 用户确认 → 已验证模板 → 真实 MP4</p></div><div class="stage-row"><span class="stage on" data-stage="asset">01 视频</span><span class="stage" data-stage="analysis">02 分析</span><span class="stage" data-stage="review">03 粗剪</span><span class="stage" data-stage="template">04 模板</span><span class="stage" data-stage="result">05 成片</span></div></header>
  <div class="compose-grid">
    <section class="panel"><div class="panel-head"><b>选择已有视频</b><span id="assetCount">读取中</span></div><div class="panel-body"><div id="assetList" class="asset-list"><div class="empty">正在读取你的视频资产…</div></div></div></section>
    <section class="panel"><div class="panel-head"><b>AI 粗剪建议</b><span id="candidateCount">尚未分析</span></div><div class="panel-body"><div id="transcript" class="transcript" style="display:none"></div><div id="reviewList" class="review-list"><div class="empty">选择视频后点击“开始分析”。系统会识别静音、气口、重复和疑似片尾口误；原视频始终保持不变。</div></div></div></section>
    <aside class="panel"><div class="panel-head"><b>预览与模板</b><span>viral-talking-head-v1</span></div><div class="panel-body"><div class="video-wrap"><video id="preview" controls playsinline></video><div id="videoPlaceholder" class="video-placeholder">选择一条已完成的视频</div></div><div id="status" class="status">等待选择视频</div>
      <div class="actions"><button id="analyzeBtn" class="btn" disabled>开始分析</button><button id="confirmBtn" class="btn secondary" disabled>确认粗剪</button></div>
      <div id="templateForm" class="form" style="display:none"><div class="field"><label>开场标题</label><input id="hookOne" maxlength="28"></div><div class="field"><label>第二行标题</label><input id="hookTwo" maxlength="28"></div><div class="two"><div class="field"><label>大字 1</label><input id="headlineOne" maxlength="12" placeholder="例如：猪脚饭"></div><div class="field"><label>出现秒数</label><input id="headlineOneAt" type="number" min="0" step="0.1"></div></div><div class="two"><div class="field"><label>大字 2</label><input id="headlineTwo" maxlength="12" placeholder="例如：AI"></div><div class="field"><label>出现秒数</label><input id="headlineTwoAt" type="number" min="0" step="0.1"></div></div><div class="field"><label>结尾 CTA</label><input id="ctaText" maxlength="36" value="让每条口播都有记忆点"></div><button id="renderBtn" class="btn" disabled>渲染真实 MP4</button></div>
      <a id="downloadLink" class="result-link" download="huangque-one-click-video.mp4">下载成片 MP4</a>
    </div></aside>
  </div>
</div></div></div>
<script src="../assets/cloud.js?v=8"></script><script src="cloud-shell.js?v=49fe47f6"></script>
<script>
(function(){
var token='__cookie__',assets=[],selected=null,project=null,previewBlob='',outputBlob='';
var $=function(id){return document.getElementById(id)};
function auth(){return {Authorization:'Bearer '+token,'Content-Type':'application/json'};}
function fresh(url){return url+(url.indexOf('?')>=0?'&':'?')+'_='+Date.now();}
function protectedUrl(url){if(!url)return Promise.reject(new Error('视频地址不存在'));return fetch(fresh(url),{cache:'no-store',headers:{Authorization:'Bearer '+token}}).then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/one-click-video';throw new Error('登录已过期');}if(!r.ok)throw new Error('视频读取失败');return r.blob();}).then(function(b){return URL.createObjectURL(b);});}
function api(url,options){options=options||{};options.headers=Object.assign({},auth(),options.headers||{});return fetch(url,options).then(function(r){return r.json().catch(function(){return {detail:'服务返回格式异常'};}).then(function(d){if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'请求失败');return d;});});}
function setStatus(text,type,busy){$('status').className='status'+(type?' '+type:'');$('status').innerHTML=(busy?'<i class="spinner"></i>':'')+text;}
function stage(name){document.querySelectorAll('.stage').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-stage')===name);});}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(ms){ms=Math.max(0,Number(ms)||0);var s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(ms%1000).padStart(3,'0');}
function loadAssets(){fetch(fresh('/api/gen/video/assets?limit=60'),{cache:'no-store',headers:{Authorization:'Bearer '+token}}).then(function(r){if(!r.ok)throw new Error('读取视频资产失败');return r.json();}).then(function(d){assets=(d.items||[]).filter(function(x){return (x.status==='done'||x.status==='completed')&&(x.video_file||x.video_url);});$('assetCount').textContent=assets.length+' 条';renderAssets();var wanted=new URLSearchParams(location.search).get('source_asset_id');if(wanted){var found=assets.find(function(x){return String(x.id)===wanted;});if(found)selectAsset(found);}}).catch(function(e){$('assetList').innerHTML='<div class="empty">'+esc(e.message)+'</div>';});}
function renderAssets(){$('assetList').innerHTML=assets.length?assets.map(function(x){return '<button class="asset-card'+(selected&&selected.id===x.id?' on':'')+'" data-id="'+x.id+'"><span class="asset-icon">▶</span><span><span class="asset-title">'+esc(x.text||x.model||('视频 #'+x.id))+'</span><span class="asset-meta">'+esc(x.ratio||'9:16')+' · '+esc(x.resolution||'视频')+(x.duration?' · '+Number(x.duration).toFixed(1)+'s':'')+'</span></span></button>';}).join(''):'<div class="empty">还没有可用视频，请先在视频模块生成一条口播。</div>';document.querySelectorAll('.asset-card').forEach(function(btn){btn.onclick=function(){var item=assets.find(function(x){return String(x.id)===btn.getAttribute('data-id');});if(item)selectAsset(item);};});}
function selectAsset(item){selected=item;project=null;renderAssets();$('reviewList').innerHTML='<div class="empty">点击右侧“开始分析”，原视频不会被修改。</div>';$('transcript').style.display='none';$('templateForm').style.display='none';$('downloadLink').style.display='none';$('analyzeBtn').disabled=false;$('confirmBtn').disabled=true;$('renderBtn').disabled=true;stage('asset');setStatus('已选择视频资产 #'+item.id);if(previewBlob)URL.revokeObjectURL(previewBlob);protectedUrl(item.video_url||(item.video_file?'/api/gen/file/'+item.video_file:'')).then(function(url){previewBlob=url;$('preview').src=url;$('videoPlaceholder').style.display='none';}).catch(function(e){setStatus(e.message,'bad');});}
function analyze(){if(!selected)return;$('analyzeBtn').disabled=true;stage('analysis');setStatus('正在创建项目并分析音频。AI 会识别逐字时间轴，请耐心等待…','',true);api('/api/gen/video-compose/projects',{method:'POST',body:JSON.stringify({source_asset_id:selected.id})}).then(function(d){project=d.project;return api('/api/gen/video-compose/projects/'+project.id+'/analyze-source',{method:'POST',body:JSON.stringify({expected_revision:project.revision})});}).then(function(d){project=d.project;renderReview();stage('review');setStatus('分析完成。请确认每一项删除建议。','good');$('confirmBtn').disabled=false;}).catch(function(e){setStatus(e.message,'bad');$('analyzeBtn').disabled=false;});}
function transcriptText(){return (project&&project.words||[]).map(function(x){return x.text;}).join('');}
function renderReview(){var text=transcriptText();$('transcript').style.display='block';$('transcript').textContent=text;$('candidateCount').textContent=(project.candidates||[]).length+' 项';$('reviewList').innerHTML=(project.candidates||[]).length?(project.candidates||[]).map(function(c){return '<div class="candidate"><div class="candidate-top"><span class="candidate-time">'+fmt(c.start_ms)+' → '+fmt(c.end_ms)+'</span><span class="candidate-kind">'+esc(c.type)+'</span></div><div class="candidate-reason">'+esc(c.reason)+'</div>'+(c.text?'<div class="candidate-text">“'+esc(c.text)+'”</div>':'')+'<div class="candidate-action"><button type="button" class="play-cut" data-play-start="'+c.start_ms+'" data-play-end="'+c.end_ms+'">试听区间</button><label style="display:flex;align-items:center;gap:7px"><span>删除</span><input type="checkbox" data-candidate="'+c.id+'" '+(c.default_selected?'checked':'')+'></label></div></div>';}).join(''):'<div class="empty">没有检测到需要删除的内容，仍可直接确认并套模板。</div>';document.querySelectorAll('.play-cut').forEach(function(btn){btn.onclick=function(){var start=Number(btn.getAttribute('data-play-start'))||0,end=Number(btn.getAttribute('data-play-end'))||0;$('preview').currentTime=Math.max(0,start/1000-.12);$('preview').play().catch(function(){});setTimeout(function(){if($('preview').currentTime>=end/1000-.08)$('preview').pause();},Math.max(250,end-start+260));};});}
function decisions(){var result={};(project.candidates||[]).forEach(function(c){var input=document.querySelector('[data-candidate="'+c.id+'"]');result[c.id]=input&&input.checked?'remove':'keep';});return result;}
function sourceToOutput(ms){var cursor=0,ranges=(project.edl&&project.edl.keep_ranges)||[];for(var i=0;i<ranges.length;i++){var r=ranges[i];if(ms>=r.source_start_ms&&ms<=r.source_end_ms)return cursor+ms-r.source_start_ms;cursor+=r.source_end_ms-r.source_start_ms;}return null;}
function fillTemplate(){var text=transcriptText();$('hookOne').value=text.slice(0,Math.min(14,text.length));$('hookTwo').value=text.length>14?text.slice(Math.max(0,text.length-14)):text;var words=project.words||[];[['猪脚饭','headlineOne','headlineOneAt'],['AI','headlineTwo','headlineTwoAt']].forEach(function(row){var word=words.find(function(x){return String(x.text||'').indexOf(row[0])>=0;});$(row[1]).value=word?row[0]:'';var at=word?sourceToOutput(word.start_ms):null;$(row[2]).value=at===null?'':(at/1000).toFixed(1);});}
function confirmCuts(){if(!project)return;$('confirmBtn').disabled=true;setStatus('正在保存非破坏性 EDL…','',true);api('/api/gen/video-compose/projects/'+project.id+'/edit-decisions',{method:'POST',body:JSON.stringify({expected_revision:project.revision,decisions:decisions()})}).then(function(d){project=d.project;stage('template');$('templateForm').style.display='grid';fillTemplate();$('renderBtn').disabled=false;setStatus('粗剪方案已确认，预计成片 '+(project.edl.output_duration_ms/1000).toFixed(2)+' 秒。','good');}).catch(function(e){setStatus(e.message,'bad');$('confirmBtn').disabled=false;});}
function headline(text,at){text=String(text||'').trim();at=Number(at);if(!text||!isFinite(at))return null;return {text:text,start_ms:Math.max(0,Math.round(at*1000)),end_ms:Math.min(project.edl.output_duration_ms,Math.round(at*1000)+1400)};}
function renderVideo(){if(!project)return;$('renderBtn').disabled=true;stage('result');setStatus('正在生成 clean master、套用模板并渲染 MP4…','',true);var hs=[headline($('headlineOne').value,$('headlineOneAt').value),headline($('headlineTwo').value,$('headlineTwoAt').value)].filter(Boolean);api('/api/gen/video-compose/projects/'+project.id+'/render',{method:'POST',body:JSON.stringify({expected_revision:project.revision,hook:{line_1:$('hookOne').value,line_2:$('hookTwo').value},headlines:hs,brand:{name:'黄雀 AI',cta_title:'你也可以',cta:$('ctaText').value}})}).then(function(d){project=d.project;return protectedUrl(d.output_url);}).then(function(url){if(outputBlob)URL.revokeObjectURL(outputBlob);outputBlob=url;$('preview').src=url;$('preview').play().catch(function(){});$('downloadLink').href=url;$('downloadLink').style.display='inline-block';setStatus('真实 MP4 已完成并通过基础编码检查。','good');}).catch(function(e){setStatus(e.message,'bad');$('renderBtn').disabled=false;});}
$('analyzeBtn').onclick=analyze;$('confirmBtn').onclick=confirmCuts;$('renderBtn').onclick=renderVideo;loadAssets();
})();
</script>
</body></html>
