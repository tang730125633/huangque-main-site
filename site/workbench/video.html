      var raw=sessionStorage.getItem('hq_ip12_product_handoff_v1');
      sessionStorage.removeItem('hq_ip12_product_handoff_v1');
      var handoff=JSON.parse(raw||'null'), age=handoff?Date.now()-Number(handoff.created_at):Infinity;
      if(!handoff||handoff.version!==1||handoff.target!=='video_studio'||!Number.isFinite(age)||age<0||age>600000||!handoff.prompt) return;
      updateFunction('talking');updateMode('text');
      $('scriptText').value=String(handoff.prompt).slice(0,1000);$('scriptText').dispatchEvent(new Event('input'));$('scriptText').focus();
      setVideoStatus('宸插甫鍏?IP12 寰呯紪杈戞柟妗堬紝璇锋鏌ュ悗鍐嶇敓鎴?,'talking');
      if(typeof toast==='function') toast('宸插甫鍏?IP12 寰呯紪杈戞柟妗堬紝璇锋鏌ュ悗鍐嶇敓鎴?);
    }catch(e){}
  }
  // 鐏垫劅椤点€屼竴閿窡鍒涳紙瑙嗛锛夈€嶏細?prompt= 棰勫～鍒版寚瀹氳棰戞笭閬撳苟鍒囧埌瀵瑰簲 tab
  function applyInspirationPrefill(){
    try{
      var q=new URLSearchParams(location.search);
      var pp=q.get('prompt'); if(!pp) return;
      var ch=(q.get('channel')||'grok').trim();
      if(['grok','micro','omni','minimax'].indexOf(ch)<0) ch='grok';
      if((ch==='omni'&&!omniAvailable)||(ch==='micro'&&!seedanceAvailable)||(ch==='minimax'&&!minimaxAvailable)) ch='grok';
      updateFunction(ch);
      var ta=(ch==='grok')?$('grokPrompt'):(ch==='omni'?$('omniPrompt'):(ch==='minimax'?$('minimaxPrompt'):$('microPrompt')));
      if(ta){ ta.value=pp; ta.focus(); }
      if(typeof toast==='function') toast('宸插甫鍏ョ伒鎰熸彁绀鸿瘝锛屽彲鐩存帴鐢熸垚');
    }catch(e){}
  }
  function applyDirectVideoAction(){
    try{
      var q=new URLSearchParams(location.search);
      if(q.get('function')!=='cinematic'||q.get('action')!=='create-avatar') return;
      updateFunction('cinematic');
      setTimeout(function(){
        var entry=$('cineNewAvatarDrop');
        if(!entry) return;
        entry.classList.add('direct-create-focus');
        entry.setAttribute('tabindex','-1');
        try{entry.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){entry.scrollIntoView();}
        try{entry.focus({preventScroll:true});}catch(e){entry.focus();}
        if($('cineAvatarStatus')){
          $('cineAvatarStatus').textContent='璇蜂笂浼犱竴寮犳鑴告竻鏅扮殑鐓х墖锛屽垱寤哄畬鎴愬悗杩斿洖鐭墽宸ヤ綔鍖哄埛鏂板舰璞″簱銆?;
        }
      },0);
    }catch(e){}
  }
  document.querySelectorAll('[data-video-module]').forEach(function(btn){btn.onclick=function(){canvasToolboxOpen=false;if($('videoToolbox'))$('videoToolbox').classList.add('hidden');if($('videoToolboxToggle'))$('videoToolboxToggle').classList.remove('on');openVideoModule(btn.dataset.videoModule);};});
  $('backToVideoHome').onclick=showVideoHome;
  $('openVideoHistory').onclick=openVideoHistory;
  $('agentDockHistory').onclick=openVideoHistory;
  $('backFromVideoHistory').onclick=closeVideoHistory;
  $('agentPlanStatus').onclick=focusAgentPlanCard;
  $('agentDockToggle').onclick=function(){var collapsed=$('agentPanel').classList.toggle('agent-dock-collapsed');this.textContent=collapsed?'鈥?:'鈥?;this.setAttribute('aria-label',collapsed?'灞曞紑鍒涗綔鍔╂墜':'鏀惰捣鍒涗綔鍔╂墜');setTimeout(function(){renderMaterialCanvas();if(!collapsed)scrollAgentToLatest({force:true,behavior:'auto'});},180);};
  $('videoToolboxToggle').onclick=function(){canvasToolboxOpen=!canvasToolboxOpen;$('videoToolbox').classList.toggle('hidden',!canvasToolboxOpen);this.classList.toggle('on',canvasToolboxOpen);};
  $('videoToolboxClose').onclick=function(){canvasToolboxOpen=false;$('videoToolbox').classList.add('hidden');$('videoToolboxToggle').classList.remove('on');};
  $('canvasSelectMode').onclick=function(){setCanvasToolMode('select');};
  $('canvasPanMode').onclick=function(){setCanvasToolMode('pan');};
  $('canvasZoomOut').onclick=function(){setCanvasZoom(canvasViewport.scale-.1);};
  $('canvasZoomValue').onclick=function(){setCanvasZoom(1);};
  $('canvasZoomIn').onclick=function(){setCanvasZoom(canvasViewport.scale+.1);};
  $('canvasFitView').onclick=fitCanvasView;
  $('canvasAddText').onclick=addCanvasTextCard;
  $('canvasAutoArrange').onclick=autoArrangeCanvas;
  $('agentNewSession').onclick=function(){resetAgentSession();$('agentPrompt').focus();};
  $('agentDismissResume').onclick=function(){$('agentResumeNotice').classList.add('hidden');};
  $('workbenchAgentSend').onclick=analyzeWorkbenchAgent;
  $('workbenchAgentPrompt').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();analyzeWorkbenchAgent();}};
  $('agentApplyUpdates').onclick=applyAgentFormUpdates;
  function handleCanvasUpload(source){if(!ensureAgentSessionOwner()){this.value='';return;}addAgentFiles(this.files,source);this.value='';}
  $('agentFileInput').onchange=function(){handleCanvasUpload.call(this,'chat');};
  $('canvasUploadInput').onchange=function(){handleCanvasUpload.call(this,'canvas');};
  $('materialCanvasStage').ondragover=function(e){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy';};
  $('materialCanvasStage').ondrop=function(e){e.preventDefault();if(e.dataTransfer)addAgentFiles(e.dataTransfer.files,'canvas');};
  $('materialCanvasStage').onpointerdown=beginCanvasPan;
  $('materialCanvasStage').onwheel=function(e){if((e.ctrlKey||e.metaKey)){e.preventDefault();setCanvasZoom(canvasViewport.scale*(e.deltaY<0?1.1:.9),e.clientX,e.clientY);}};
  $('materialCanvasStage').addEventListener('click',function(e){var planChat=e.target.closest('[data-agent-plan-chat]');if(!planChat)return;e.stopPropagation();focusAgentPlanMissingField();},true);
  $('materialCanvasStage').onclick=function(e){if(canvasToolMode==='select'&&!canvasSpacePanning&&!e.target.closest('.canvas-card')){canvasSelectedIds=[];renderMaterialCanvas();}};
  $('agentSendBtn').onclick=analyzeAgentRequest;
  $('agentPrompt').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();analyzeAgentRequest();}};
  window.addEventListener('hq:auth-changed',handleAgentAuthChanged);
  window.addEventListener('storage',function(e){if(!e||e.key==='hq_user'||e.key===null){agentIdentity.invalidate();if(window.HQ&&window.HQ.refreshPoints)window.HQ.refreshPoints();}});
  window.addEventListener('pageshow',function(){if(videoView==='home')scrollAgentToLatest({force:true,behavior:'auto'});});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&videoView==='home')scrollAgentToLatest({force:true,behavior:'auto'});});
  window.addEventListener('keydown',function(e){var tag=(e.target&&e.target.tagName||'').toLowerCase();if(e.code==='Space'&&!e.repeat&&videoView==='home'&&['input','textarea','select'].indexOf(tag)<0&&!(e.target&&e.target.isContentEditable)){e.preventDefault();canvasSpacePanning=true;applyCanvasViewport();}});
  window.addEventListener('keyup',function(e){if(e.code==='Space'&&canvasSpacePanning){canvasSpacePanning=false;applyCanvasViewport();}});
  window.addEventListener('blur',function(){if(canvasSpacePanning){canvasSpacePanning=false;applyCanvasViewport();}});
  window.addEventListener('pagehide',releaseAssetCache);
  window.addEventListener('resize',function(){if(videoView==='home')renderMaterialCanvas();});
  initializeAgentChatScroll();
  if(hasVideoDeepLink()){
    var deepFunction='talking';
    try{
      var deepQuery=new URLSearchParams(location.search), requestedFunction=(deepQuery.get('function')||'').trim();
      if(['talking','cinematic','tryon','grok','sora','minimax','omni','micro'].indexOf(requestedFunction)>=0)deepFunction=requestedFunction;
    }catch(e){}
    openVideoWorkbench({function:deepFunction,title:'瑙嗛鍒朵綔'});
  }else showVideoHome();
  applyAssetPrefill();
  applyDirectVideoAction();
  applyIP12Handoff();
  $('historyChannelFilter').onchange=function(){historyChannelFilter=this.value;renderVideoOutput();};
  videoHealthReady.then(applyInspirationPrefill);
  loadVoices();
  loadVideoHistory();
  resumeTrackedVideoTask();
})();
</script>
