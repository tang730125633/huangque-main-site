body{overflow:hidden}.hq-content[data-active="matrix-template"]{height:100%;min-height:0}.mt-layout{display:grid;grid-template-columns:minmax(440px,1fr) minmax(340px,.72fr);height:100%;border-top:1px solid rgba(148,164,187,.1)}.mt-editor{padding:28px 30px;overflow:auto;border-right:1px solid rgba(148,164,187,.12)}.mt-preview{display:flex;align-items:center;justify-content:center;padding:24px;background:#090e18}.mt-title{margin:0 0 24px;color:#edf3fa;font-size:23px;line-height:1.25}.mt-label{display:flex;justify-content:space-between;gap:12px;margin:18px 0 9px;color:#dbe5f1;font-size:12px;font-weight:700}.mt-input,.mt-select{width:100%;padding:12px 13px;border:1px solid rgba(148,164,187,.22);border-radius:7px;background:#0b111d;color:#eef4fb;font:14px/1.65 inherit;outline:0}.mt-input{min-height:72px;resize:vertical}.mt-select{height:46px;cursor:pointer}.mt-input:focus,.mt-select:focus{border-color:#e7b24c;box-shadow:0 0 0 2px rgba(231,178,76,.13)}.mt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;max-height:380px;overflow:auto}.mt-template{min-width:0;padding:0;border:1px solid rgba(148,164,187,.18);border-radius:7px;background:#0b111d;color:#d7e1ee;text-align:left;overflow:hidden;cursor:pointer}.mt-template.active{border-color:#e7b24c;box-shadow:0 0 0 1px #e7b24c}.mt-template-visual{display:grid;grid-template-rows:28% 1fr 25%;height:150px;padding:11px;background:var(--bg,#111827);color:var(--fg,#fff)}.mt-template-top,.mt-template-bottom{display:flex;align-items:center;font-weight:800;line-height:1.15}.mt-template-top{font-size:15px}.mt-template-media{margin:7px 0;background:linear-gradient(135deg,var(--accent,#e7b24c),rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.28)}.mt-template-bottom{font-size:10px;opacity:.9}.mt-template-copy{display:block;padding:9px}.mt-template-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.mt-template-copy small{display:block;margin-top:4px;color:#728299;font-size:10px}.mt-action{width:100%;height:50px;margin-top:18px;border:0;border-radius:8px;background:#e7b24c;color:#171006;font:800 15px inherit;cursor:pointer}.mt-action:disabled{opacity:.55;cursor:wait}.mt-status{min-height:48px;margin-top:13px;padding:12px 14px;border-left:3px solid #344258;background:#0b111d;color:#94a4bb;font-size:12.5px;line-height:1.7}.mt-status.running{border-color:#e7b24c;color:#dce6f2}.mt-status.done{border-color:#2dd4bf;color:#d8fff8}.mt-status.error{border-color:#f87171;color:#ffdede}.mt-stage{position:relative;width:min(100%,390px);aspect-ratio:9/16;background:#05070b;border:1px solid rgba(148,164,187,.16);box-shadow:0 20px 55px rgba(0,0,0,.34);overflow:hidden}.mt-stage video{display:none;width:100%;height:100%;object-fit:contain}.mt-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#65748a}.mt-meta{display:none;position:absolute;left:12px;top:12px;color:#fff;font:11px "JetBrains Mono",monospace;text-shadow:0 1px 4px #000}.mt-download{display:none;position:absolute;right:12px;top:12px;width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(5,7,11,.78);color:#fff;align-items:center;justify-content:center;text-decoration:none}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);opacity:0;transition:.18s;background:#111827;border:1px solid rgba(148,164,187,.2);border-radius:8px;padding:10px 15px;color:#eaf1fa;z-index:90}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:900px){body{overflow:auto}.mt-layout{grid-template-columns:1fr;height:auto}.mt-editor{border-right:0}.mt-preview{min-height:680px}}
.mt-live{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,28%) minmax(0,1fr) minmax(0,25%);padding:11% 8%;overflow:hidden;background:var(--live-bg,#111827);color:var(--live-fg,#fff);transition:background .18s,color .18s}.mt-live:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 0 54%,color-mix(in srgb,var(--live-accent,#e7b24c) 22%,transparent) 54% 100%);pointer-events:none}.mt-live-top,.mt-live-bottom{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;text-align:center;line-height:1.16;font-weight:900;text-wrap:balance}.mt-live-top{font-size:34px}.mt-live-bottom{font-size:20px}.mt-live .placeholder{opacity:.42}.mt-live-media{position:relative;z-index:1;align-self:stretch;margin:8% 0;border:1px solid color-mix(in srgb,var(--live-fg,#fff) 28%,transparent);background:linear-gradient(135deg,var(--live-accent,#e7b24c),color-mix(in srgb,var(--live-fg,#fff) 12%,transparent));box-shadow:0 16px 42px color-mix(in srgb,var(--live-accent,#e7b24c) 24%,transparent)}.mt-live[data-template="video-diary"] .mt-live-top,.mt-live[data-template="vlog-journal"] .mt-live-top{align-items:center;justify-content:flex-start;text-align:left;font-size:27px}.mt-live[data-template="video-diary"] .mt-live-bottom,.mt-live[data-template="vlog-journal"] .mt-live-bottom{justify-content:flex-start;text-align:left}.mt-live[data-template="minimal-headline"] .mt-live-top{align-items:center;font-size:42px}.mt-live[data-template="airy-blush"] .mt-live-media{border-radius:28px}.mt-live[data-template="yellow-blue-pop"] .mt-live-top{font-size:39px;text-shadow:4px 4px 0 var(--live-accent,#2671ff)}.mt-live[data-template="business-black"] .mt-live-top,.mt-live[data-template="business-black"] .mt-live-bottom{justify-content:flex-start;text-align:left}.mt-live[data-template="black-gold-premium"] .mt-live-top,.mt-live[data-template="chinese-title"] .mt-live-top{font-family:"Noto Serif SC",serif;font-size:38px}.mt-live[data-template="data-compare"] .mt-live-media{background:linear-gradient(90deg,var(--live-accent,#2563eb) 0 48%,transparent 48% 52%,color-mix(in srgb,var(--live-accent,#2563eb) 45%,white) 52%)}.mt-live[data-template="torn-magazine"] .mt-live-top{justify-content:flex-start;text-align:left;transform:rotate(-2deg);font-size:36px}.mt-live[data-template="bilingual-split"] .mt-live-bottom{border-top:3px solid var(--live-accent,#1c6db2)}.mt-live[data-template="portrait-quote"] .mt-live-top:before{content:"“";margin-right:6px;color:var(--live-accent,#d9b56e);font-size:58px}
@media(max-width:900px){html body .hq-app .hq-content[data-active="matrix-template"]{height:auto!important;min-height:100%!important;overflow:visible!important}.hq-content[data-active="matrix-template"] .mt-layout{height:auto;min-height:100%}.hq-content[data-active="matrix-template"] .mt-editor{overflow:visible}.hq-content[data-active="matrix-template"] .mt-preview{min-height:0;padding:20px 16px 32px}}
</style>

<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>
<div class="hq-app"><div class="hq-content" data-active="matrix-template"><main class="mt-layout">
<section class="mt-editor">
  <h1 class="mt-title">模板成片</h1>
  <div class="mt-label"><label for="topText">顶部标题</label><span id="topCount">0 / 60</span></div>
  <textarea id="topText" class="mt-input" maxlength="60" placeholder="例如：真正拉开差距的，不是工具"></textarea>
  <div class="mt-label"><label for="bottomText">底部行动文案</label><span id="bottomCount">0 / 80</span></div>
  <textarea id="bottomText" class="mt-input" maxlength="80" placeholder="例如：评论区留下关键词，领取完整方案"></textarea>
  <div class="mt-label"><label for="fontFamily">字体</label><span id="fontSource">自动</span></div>
  <select id="fontFamily" class="mt-select" aria-label="字体选择"><option value="">自动搭配</option></select>
  <div class="mt-label"><span>视觉模板</span><span id="templateName">正在加载</span></div>
  <div id="templateGrid" class="mt-grid" role="listbox" aria-label="视觉模板"></div>
  <button id="generateBtn" class="mt-action" type="button" disabled>生成视频</button>
  <div id="status" class="mt-status">填写文案并选择模板</div>
</section>
<section class="mt-preview"><div class="mt-stage">
  <div id="livePreview" class="mt-live" data-template="native-bold">
    <div id="liveTop" class="mt-live-top placeholder">顶部标题</div>
    <div class="mt-live-media" aria-hidden="true"></div>
    <div id="liveBottom" class="mt-live-bottom placeholder">底部行动文案</div>
  </div>
  <video id="video" controls playsinline></video>
  <div id="meta" class="mt-meta"></div>
  <a id="download" class="mt-download" download title="下载视频">↓</a>
</div></section>
</main></div></div>
<div id="toast" class="toast"></div>
<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=76171dc1"></script>
<script>
(function(){
var templates=[],fonts=[],activeTemplate='',cost=0,busy=false,timer=0,started=0,pendingStorageKey='hq-matrix-template-pending-v1';
var el=function(id){return document.getElementById(id)};
var palettes={
'native-bold':['#111827','#ffffff','#f4c84b'],'video-diary':['#eef3f2','#1d2935','#6ba89c'],'minimal-headline':['#f5f5f2','#111111','#df3f36'],'airy-blush':['#fff4f6','#5d424b','#e7a8b5'],'yellow-blue-pop':['#f8d53a','#102a63','#2671ff'],'business-black':['#0c1017','#f3f6fa','#4fa3ff'],'black-gold-premium':['#14110e','#e9d8a7','#cda65a'],'data-compare':['#f2f6ff','#17284a','#2563eb'],'chinese-title':['#f3ead7','#33251c','#b7352c'],'torn-magazine':['#e9e4da','#191815','#f04438'],'vlog-journal':['#fffceb','#29445a','#ff9c5a'],'bilingual-split':['#eef2f5','#17212b','#1c6db2'],'portrait-quote':['#1e2630','#f4f0e5','#d9b56e']};
function toast(message){var t=el('toast');t.textContent=message;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function headers(json){var h={'Authorization':'Bearer __cookie__'};if(json)h['Content-Type']='application/json';return h}
function read(response){return response.text().then(function(text){var data={};try{data=JSON.parse(text||'{}')}catch(e){}return {status:response.status,data:data}})}
function status(message,state){el('status').textContent=message;el('status').className='mt-status '+(state||'')}
function fitLiveText(node,max,min){var size=max;node.style.fontSize=size+'px';node.style.lineHeight='1.1';if(!node.clientWidth||!node.clientHeight)return;while(size>min&&(node.scrollHeight>node.clientHeight||node.scrollWidth>node.clientWidth)){size--;node.style.fontSize=size+'px'}}
function updateLive(){var top=el('topText').value.trim(),bottom=el('bottomText').value.trim(),p=palettes[activeTemplate]||['#111827','#fff','#e7b24c'],topSizes={'video-diary':27,'vlog-journal':27,'minimal-headline':42,'yellow-blue-pop':39,'black-gold-premium':38,'chinese-title':38,'torn-magazine':36};el('liveTop').textContent=top||'顶部标题';el('liveBottom').textContent=bottom||'底部行动文案';el('liveTop').classList.toggle('placeholder',!top);el('liveBottom').classList.toggle('placeholder',!bottom);el('livePreview').setAttribute('data-template',activeTemplate||'native-bold');el('livePreview').setAttribute('style','--live-bg:'+p[0]+';--live-fg:'+p[1]+';--live-accent:'+p[2]);fitLiveText(el('liveTop'),topSizes[activeTemplate]||34,12);fitLiveText(el('liveBottom'),20,12)}
function showLivePreview(){el('livePreview').style.display='grid';el('video').style.display='none';el('meta').style.display='none';el('download').style.display='none'}
function sync(){el('topCount').textContent=el('topText').value.length+' / 60';el('bottomCount').textContent=el('bottomText').value.length+' / 80';el('generateBtn').disabled=busy||!activeTemplate||el('topText').value.trim().length<2||el('bottomText').value.trim().length<2;updateLive()}
function select(button,item){activeTemplate=item.id;Array.prototype.forEach.call(el('templateGrid').children,function(node){node.classList.toggle('active',node===button);node.setAttribute('aria-selected',node===button?'true':'false')});el('templateName').textContent=item.name;showLivePreview();sync()}
function renderTemplates(){var grid=el('templateGrid');grid.textContent='';templates.forEach(function(item){var p=palettes[item.id]||['#111827','#fff','#e7b24c'];var b=document.createElement('button');b.className='mt-template';b.type='button';b.setAttribute('aria-selected','false');b.innerHTML='<span class="mt-template-visual" style="--bg:'+p[0]+';--fg:'+p[1]+';--accent:'+p[2]+'"><span class="mt-template-top">观点标题</span><span class="mt-template-media"></span><span class="mt-template-bottom">行动文案</span></span><span class="mt-template-copy"><strong>'+esc(item.name)+'</strong><small>'+esc((item.tags||[]).slice(0,3).join(' · '))+'</small></span>';b.onclick=function(){select(b,item)};grid.appendChild(b)});if(templates.length){var preferred=templates.find(function(x){return x.id==='native-bold'})||templates[0];select(grid.children[templates.indexOf(preferred)],preferred)}}
function renderFonts(){var selectNode=el('fontFamily');selectNode.textContent='';(fonts.length?fonts:[{value:'',label:'自动搭配',source:'automatic'}]).forEach(function(item){var option=document.createElement('option');option.value=item.value||'';option.textContent=item.label||item.value||'自动搭配';option.setAttribute('data-source',item.source||'automatic');selectNode.appendChild(option)});selectNode.value='';el('fontSource').textContent='自动'}
/* pending-state:start */
function loadPending(){try{var value=JSON.parse(sessionStorage.getItem(pendingStorageKey)||'null');return value&&value.key&&value.body?value:null}catch(e){return null}}
function savePending(value){sessionStorage.setItem(pendingStorageKey,JSON.stringify(value))}
function clearPending(){sessionStorage.removeItem(pendingStorageKey)}
function requestKey(){return 'matrix-template-'+(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2))}
/* pending-state:end */
function applyPending(value){var body=value.body||{};el('topText').value=body.top_text||'';el('bottomText').value=body.bottom_text||'';el('fontFamily').value=body.font_family||'';var index=templates.findIndex(function(item){return item.id===body.template_id});if(index>=0)select(el('templateGrid').children[index],templates[index]);sync()}
function restorePending(){var pending=loadPending();if(!pending)return;applyPending(pending);busy=true;started=Number(pending.started_at||Date.now());sync();status(pending.job_id?'正在恢复任务':'正在确认提交结果','running');if(pending.job_id)poll(pending.job_id,0);else submitPending(pending,0)}
function load(){fetch('/api/gen/matrix-template/templates',{headers:headers(false),cache:'no-store'}).then(read).then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/matrix-template';return}if(r.status>=400)throw new Error(r.data.detail||'模板目录不可用');templates=r.data.templates||[];fonts=r.data.fonts||[];cost=Number(r.data.cost||0);renderFonts();renderTemplates();el('generateBtn').textContent='生成视频 · '+cost+' 点';restorePending()}).catch(function(e){status(e.message,'error')})}
function scheduleSubmit(pending,attempt){clearTimeout(timer);timer=setTimeout(function(){submitPending(pending,attempt)},Math.min(8000,1000*Math.pow(2,attempt)))}
function submitPending(pending,attempt){busy=true;sync();status(attempt?'正在确认提交结果':'正在提交任务','running');fetch('/api/gen/matrix-template',{method:'POST',headers:Object.assign(headers(true),{'Idempotency-Key':pending.key}),body:JSON.stringify(pending.body)}).then(read).then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/matrix-template';return}if(r.status===409&&r.data.code==='idempotency_in_progress'){scheduleSubmit(pending,attempt+1);return}if(r.status>=400){var explicit=r.status===400||r.status===402||r.status===403||r.status===429||r.data.operation_terminal===true;if(explicit)clearPending();throw Object.assign(new Error(r.data.detail||'提交失败'),{uncertain:!explicit})}if(!r.data.job_id)throw Object.assign(new Error('提交结果待确认'),{uncertain:true});pending.job_id=r.data.job_id;savePending(pending);poll(pending.job_id,0)}).catch(function(e){if(e&&e.uncertain!==false&&attempt<3){scheduleSubmit(pending,attempt+1);return}busy=false;status(e.message||'提交结果待确认，点击继续查询','error');toast(e.message||'提交结果待确认');sync()})}
function poll(jobId,failures){fetch('/api/gen/job/'+jobId,{headers:headers(false),cache:'no-store'}).then(read).then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/matrix-template';return}if(r.status>=500)throw new Error(r.data.detail||'任务查询失败');if(r.status>=400){clearPending();throw Object.assign(new Error(r.data.detail||'任务不存在'),{terminal:true})}var d=r.data;if(d.status==='done'){busy=false;clearTimeout(timer);clearPending();var result=d.result||{};el('video').src=result.video_url;el('video').style.display='block';el('meta').textContent=Number(result.duration||0).toFixed(1)+'s · 1080×1920';el('meta').style.display='block';el('download').href=result.video_url;el('download').style.display='flex';status('生成完成','done');sync();el('livePreview').style.display='none';return}if(d.status==='error'||d.status==='failed'){busy=false;clearPending();throw Object.assign(new Error(d.error||'生成失败'),{terminal:true})}status('正在生成 · '+Math.max(0,Math.round((Date.now()-started)/1000))+' 秒','running');timer=setTimeout(function(){poll(jobId,0)},2500)}).catch(function(e){if(!e.terminal&&failures<5){status('网络波动，正在恢复任务查询','running');timer=setTimeout(function(){poll(jobId,failures+1)},Math.min(10000,1000*Math.pow(2,failures)));return}busy=false;clearTimeout(timer);status(e.message||'任务查询暂时中断，点击继续查询','error');toast(e.message||'任务查询暂时中断');sync()})}
function generate(){var existing=loadPending();if(existing){busy=true;started=Number(existing.started_at||Date.now());sync();if(existing.job_id)poll(existing.job_id,0);else submitPending(existing,0);return}var body={top_text:el('topText').value.trim(),bottom_text:el('bottomText').value.trim(),template_id:activeTemplate,bgm:true};var selectedFont=el('fontFamily').value;if(selectedFont)body.font_family=selectedFont;if(!confirm('本次预计扣除 '+cost+' 点，确认生成？'))return;var pending={key:requestKey(),body:body,job_id:'',started_at:Date.now()};savePending(pending);started=pending.started_at;submitPending(pending,0)}
el('topText').addEventListener('input',function(){showLivePreview();sync()});el('bottomText').addEventListener('input',function(){showLivePreview();sync()});el('fontFamily').addEventListener('change',function(){var item=fonts.find(function(font){return font.value===el('fontFamily').value});el('fontSource').textContent=!this.value?'自动':item&&item.source==='private'?'私有字体':'内置字体';showLivePreview();sync()});if(window.addEventListener)window.addEventListener('resize',updateLive);el('generateBtn').onclick=generate;sync();load();
})();
</script>
</body>
