<script>

function scheduleSubmit(pending,index,attempt){clearTimeout(timers['s'+index]);timers['s'+index]=setTimeout(function(){submitItem(pending,index,attempt)},Math.min(8000,1000*Math.pow(2,attempt)))}
function submitItem(pending,index,attempt){var item=pending.items[index];item.status='submitting';updateBatch(pending);fetch('/api/gen/matrix-template',{method:'POST',headers:Object.assign(headers(true),{'Idempotency-Key':item.key}),body:JSON.stringify(item.body)}).then(read).then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/matrix-template';return}if(r.status===409&&r.data.code==='idempotency_in_progress'){scheduleSubmit(pending,index,attempt+1);return}if(r.status>=400){var explicit=r.status===400||r.status===402||r.status===403||r.status===429||r.data.operation_terminal===true;if(explicit){item.status='failed';item.error=r.data.detail||'提交失败';item.refund_status=r.data.refund_status||r.data.refund_state||(r.data.job_id?'退款处理中':'未受理/未扣点');renderFailure(item,index);updateBatch(pending);return}throw Object.assign(new Error(r.data.detail||'提交失败'),{uncertain:true})}if(!r.data.job_id)throw Object.assign(new Error('提交结果待确认'),{uncertain:true});item.job_id=r.data.job_id;item.status='pending';updateBatch(pending);pollItem(pending,index,0)}).catch(function(e){if(e&&e.uncertain!==false&&attempt<3){scheduleSubmit(pending,index,attempt+1);return}item.status='uncertain';item.error=e.message||'提交结果待确认';updateBatch(pending)})}
function pollItem(pending,index,failures){var item=pending.items[index];fetch('/api/gen/job/'+item.job_id,{headers:headers(false),cache:'no-store'}).then(read).then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/matrix-template';return}if(r.status>=500)throw new Error(r.data.detail||'任务查询失败');if(r.status>=400){item.status='failed';item.error=r.data.detail||'任务不存在';item.refund_status='退款状态待确认';renderFailure(item,index);updateBatch(pending);return}var d=r.data;if(d.status==='done'){item.status='done';item.result=d.result||{};renderResult(item,index,pending.items.length);updateBatch(pending);return}if(d.status==='error'||d.status==='failed'){item.status='failed';item.error=d.error||'生成失败';item.refund_status=d.refund_status||(d.refunded?'已退款':'退款处理中');renderFailure(item,index);updateBatch(pending);return}item.status='running';updateBatch(pending);clearTimeout(timers['p'+index]);timers['p'+index]=setTimeout(function(){pollItem(pending,index,0)},2500)}).catch(function(e){if(failures<5){timers['p'+index]=setTimeout(function(){pollItem(pending,index,failures+1)},Math.min(10000,1000*Math.pow(2,failures)));return}item.status='uncertain';item.error=e.message||'任务查询暂时中断';updateBatch(pending)})}
function startPending(pending){applyPending(pending);busy=true;started=Number(pending.started_at||Date.now());el('batchResults').textContent='';pending.items.forEach(function(item,index){if(batchTerminal(item)){if(item.status==='done')renderResult(item,index,pending.items.length);else renderFailure(item,index);return}if(item.job_id)pollItem(pending,index,0);else submitItem(pending,index,0)});updateBatch(pending)}
function restorePending(){var pending=loadPending();if(pending){startPending(pending);return}var last=loadLastBatch();if(!last)return;applyPending(last);el('batchResults').textContent='';last.items.forEach(function(item,index){if(item.status==='done')renderResult(item,index,last.items.length);else renderFailure(item,index)});var failed=last.items.filter(function(item){return item.status==='failed'}).length;status(failed?'上次批量：成功 '+(last.items.length-failed)+' 条，失败 '+failed+' 条':'上次批量已完成 · '+last.items.length+' 条','done')}
function load(){fetch('/api/gen/matrix-template/templates',{headers:headers(false),cache:'no-store'}).then(read).then(function(r){if(r.status===401){location.href='../login.html?redirect=workbench/matrix-template';return}if(r.status>=400)throw new Error(r.data.detail||'模板目录不可用');templates=r.data.templates||[];fonts=r.data.fonts||[];cost=Number(r.data.cost||0);renderFonts();renderTemplates();el('generateBtn').textContent='生成视频 · '+cost+' 点';restorePending()}).catch(function(e){status(e.message,'error')})}
function generate(){var existing=loadPending();if(existing){startPending(existing);return}var body={top_text:el('topText').value.trim(),bottom_text:el('bottomText').value.trim(),template_id:activeTemplate,bgm:true};var selectedFont=el('fontFamily').value;if(selectedFont)body.font_family=selectedFont;var count=Math.max(1,Math.min(5,Number(el('batchCount').value)||1));if(!confirm('将同时生成 '+count+' 条，预计共扣除 '+(cost*count)+' 点，确认生成？'))return;sessionStorage.removeItem(lastBatchStorageKey);var pending={started_at:Date.now(),items:[]};for(var index=0;index<count;index++){pending.items.push({key:requestKey(),body:Object.assign({},body),job_id:'',status:'waiting',result:null,error:'',refund_status:''})}savePending(pending);startPending(pending)}
el('topText').addEventListener('input',function(){showLivePreview();sync()});el('bottomText').addEventListener('input',function(){showLivePreview();sync()});el('fontFamily').addEventListener('change',function(){var item=fonts.find(function(font){return font.value===el('fontFamily').value});el('fontSource').textContent=!this.value?'自动':item&&item.source==='private'?'私有字体':'内置字体';showLivePreview();sync()});if(window.addEventListener)window.addEventListener('resize',updateLive);el('generateBtn').onclick=generate;sync();load();
})();
</script>
