<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body{overflow:hidden}
  .hq-content[data-active="text-video"]{height:100%;min-height:0}
  .tv-layout{display:grid;grid-template-columns:minmax(420px,1fr) minmax(340px,.72fr);height:100%;min-height:0;border-top:1px solid rgba(148,164,187,.1)}
  .tv-editor{min-width:0;padding:28px 30px;overflow-y:auto;border-right:1px solid rgba(148,164,187,.12)}
  .tv-preview{min-width:0;padding:24px;display:flex;align-items:center;justify-content:center;background:#090e18;overflow:hidden}
  .tv-heading{margin:0;color:#eaf1fa;font-size:23px;line-height:1.25;font-weight:800;letter-spacing:0}
  .tv-label{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px;color:#eaf1fa;font-size:13px;font-weight:700}
  .tv-template-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .tv-template-tabs{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid rgba(148,164,187,.16);border-radius:7px;background:#0b111d}
  .tv-template-tabs button{height:32px;padding:0 13px;border:0;border-radius:5px;background:transparent;color:#74849a;font:700 12px inherit;cursor:pointer}
  .tv-template-tabs button.active{background:#202938;color:#f5c86f}
  .tv-template-tabs[hidden]{display:none}
  .tv-template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;max-height:380px;overflow-y:auto;padding:1px 4px 1px 1px}
  .tv-template{position:relative;min-width:0;padding:0;border:1px solid rgba(148,164,187,.18);border-radius:6px;background:#0b111d;color:#cbd6e5;text-align:left;cursor:pointer;overflow:hidden;transition:border-color .16s,background .16s,transform .16s}
  .tv-template:hover{transform:translateY(-1px);border-color:rgba(231,178,76,.42)}
  .tv-template.active{border-color:#e7b24c;background:#171a21;color:#fff;box-shadow:0 0 0 1px #e7b24c}
  .tv-template-media{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:9/16;overflow:hidden;background:#141b26;color:#65748a;font-size:11px;text-align:center}
  .tv-template[data-orientation="landscape"] .tv-template-media{aspect-ratio:16/9}
  .tv-template-media img{display:block;width:100%;height:100%;object-fit:cover}
  .tv-template-media.missing::after{content:"预览暂不可用";padding:10px}
  .tv-template-info{display:block;padding:9px 8px 10px}
  .tv-template strong{display:block;font-size:12px;line-height:1.2;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-template-meta{display:block;margin-top:4px;color:#65748a;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-template-selected{position:absolute;right:6px;top:6px;display:none;width:22px;height:22px;border-radius:50%;background:#e7b24c;color:#171006;align-items:center;justify-content:center;font-size:13px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .tv-template.active .tv-template-selected{display:flex}
  .tv-template-loading{grid-column:1/-1;padding:22px;border:1px dashed rgba(148,164,187,.2);color:#65748a;text-align:center;font-size:12px}
  .tv-style-field{display:grid;gap:8px;margin:18px 0}
  .tv-style-field label{color:#cbd6e5;font-size:12px;font-weight:700}
  .tv-style-field select{width:100%;height:42px;padding:0 36px 0 12px;border:1px solid rgba(148,164,187,.22);border-radius:6px;background:#0b111d;color:#f1f5fa;font:13px inherit;letter-spacing:0;outline:none}
  .tv-style-field select:focus{border-color:#e7b24c;box-shadow:0 0 0 2px rgba(231,178,76,.14)}
  .tv-style-field select:disabled{color:#65748a;cursor:not-allowed}
  .tv-input-wrap{border:1px solid rgba(148,164,187,.18);background:#0b111d;border-radius:8px;padding:14px 15px;transition:border-color .18s}
  .tv-input-wrap:focus-within{border-color:rgba(231,178,76,.62)}
  .tv-text{display:block;width:100%;min-height:310px;resize:vertical;border:0;outline:0;background:transparent;color:#eaf1fa;font:14px/1.85 inherit;letter-spacing:0}
  .tv-count{margin-top:9px;text-align:right;color:#65748a;font:11px "JetBrains Mono",monospace}
  .tv-action{width:100%;height:50px;margin-top:18px;border:0;border-radius:8px;background:#e7b24c;color:#171006;font:800 15px inherit;cursor:pointer;transition:background .16s,opacity .16s}
  .tv-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:4px 0 18px;background:#0b111d;border:1px solid rgba(148,164,187,.18);border-radius:8px}
  .tv-mode button{height:40px;border:0;border-radius:6px;background:transparent;color:#94a4bb;font:600 13px inherit;cursor:pointer}
  .tv-mode button.active{background:#1a2433;color:#f5c86f;box-shadow:inset 0 0 0 1px rgba(231,178,76,.28)}
  .tv-action:hover{background:#f1c66a}.tv-action:disabled{opacity:.58;cursor:wait}
  .tv-status{min-height:46px;margin-top:14px;padding:12px 14px;border-left:3px solid #344258;background:#0b111d;color:#94a4bb;font-size:12.5px;line-height:1.7}
  .tv-status.running{border-color:#e7b24c;color:#dbe4f0}.tv-status.done{border-color:#2dd4bf;color:#d8fff8}.tv-status.error{border-color:#f87171;color:#ffdede}
  .tv-stage{position:relative;width:min(100%,390px);aspect-ratio:9/16;background:#05070b;border:1px solid rgba(148,164,187,.16);box-shadow:0 20px 55px rgba(0,0,0,.34);overflow:hidden;transition:width .2s,aspect-ratio .2s}
  .tv-stage.landscape{aspect-ratio:16/9;width:min(100%,720px)}
  .tv-stage video{display:none;width:100%;height:100%;object-fit:contain;background:#000}
  .tv-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#65748a;text-align:center;padding:32px}
  .tv-empty-icon{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(231,178,76,.28);border-radius:50%;color:#e7b24c;font-size:22px}
  .tv-download{display:none;position:absolute;right:12px;top:12px;width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(5,7,11,.78);color:#fff;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
  .tv-meta{display:none;position:absolute;left:12px;right:58px;top:12px;color:#fff;font:11px "JetBrains Mono",monospace;text-shadow:0 1px 4px #000}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;transition:.18s;background:#111827;border:1px solid rgba(148,164,187,.2);border-radius:8px;padding:10px 15px;color:#eaf1fa;font-size:13px;z-index:90}.toast.show{opacity:1;transform:translateX(-50%)}
  @media(max-width:980px){body{overflow:auto}.hq-content[data-active="text-video"]{height:auto}.tv-layout{grid-template-columns:1fr;height:auto}.tv-editor{border-right:0;border-bottom:1px solid rgba(148,164,187,.12)}.tv-preview{min-height:680px}.tv-text{min-height:220px}}
  @media(max-width:560px){.tv-template-controls{align-items:flex-start;flex-direction:column}.tv-template-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tv-editor{padding:22px 18px}}
</style>

<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>
<div class="hq-app"><div class="hq-content" data-active="text-video">
  <main class="tv-layout">
    <section class="tv-editor">
      <h1 class="tv-heading">文案成片</h1>
      <div class="tv-label"><span>视频模板</span><span id="templateName" style="color:#e7b24c;font-weight:600">正在加载</span></div>
      <div class="tv-template-controls">
        <div id="kindTabs" class="tv-template-tabs" role="tablist" aria-label="模板类型">
          <button class="active" type="button" role="tab" aria-selected="true" data-kind="illustration">插画模板</button>
          <button type="button" role="tab" aria-selected="false" data-kind="video">视频模板</button>
        </div>
        <div id="orientationTabs" class="tv-template-tabs" role="tablist" aria-label="画面方向">
          <button class="active" type="button" role="tab" aria-selected="true" data-orientation="portrait">竖屏</button>
          <button type="button" role="tab" aria-selected="false" data-orientation="landscape">横屏</button>
        </div>
      </div>
      <div id="templateGrid" class="tv-template-grid" role="listbox" aria-label="视频模板"><div class="tv-template-loading">正在读取专业模板库</div></div>
      <div class="tv-style-field">
        <label for="materialStyle">素材风格</label>
        <select id="materialStyle" aria-label="素材风格" disabled>
          <option value="">正在加载素材风格</option>
        </select>
      </div>
      <div class="tv-style-field">
        <label for="videoVoice">配音音色</label>
        <select id="videoVoice" aria-label="配音音色" disabled>
          <option value="">正在加载音色</option>
        </select>
      </div>
      <div class="tv-label"><span>输入方式</span></div>
      <div class="tv-mode" role="radiogroup" aria-label="输入方式">
        <button class="active" type="button" role="radio" aria-checked="true" data-mode="generate">主题创作</button>
        <button type="button" role="radio" aria-checked="false" data-mode="fixed">完整文案</button>
      </div>
      <div class="tv-label"><label id="videoTextLabel" for="videoText">输入主题</label><button id="clearText" type="button" style="border:0;background:transparent;color:#94a4bb;cursor:pointer;font:12px inherit">清空</button></div>
      <div class="tv-input-wrap">
        <textarea id="videoText" class="tv-text" maxlength="1000" placeholder="例如：AI 如何帮助美业门店提升复购率"></textarea>
        <div id="charCount" class="tv-count">0 / 1000</div>
      </div>
      <button id="generateBtn" class="tv-action" type="button" disabled>生成视频</button>
      <div id="statusText" class="tv-status">输入主题或文案，选择模板后生成</div>
    </section>
    <section class="tv-preview" aria-label="视频预览">
      <div id="videoStage" class="tv-stage">
        <div id="emptyState" class="tv-empty"><div class="tv-empty-icon">▶</div><div>视频生成后在此预览</div></div>
        <video id="resultVideo" controls playsinline></video>
        <div id="resultMeta" class="tv-meta"></div>
        <a id="downloadBtn" class="tv-download" href="#" title="下载视频" download>↓</a>
      </div>
    </section>
  </main>
</div></div>
<div id="toast" class="toast"></div>
<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=5c2643d5"></script>
<script>
(function(){
  var token='__cookie__',activeBlob='',startedAt=0,pollTimer=0,activeTemplate='',activeMode='generate',templates=[],activeKind='illustration',activeOrientation='portrait',stylesReady=false,voicesReady=false,isBusy=false;
  var pendingStorageKey='hq-text-video-pending-v1';
  var el=function(id){return document.getElementById(id);};
  function toast(message){var node=el('toast');node.textContent=message;node.classList.add('show');setTimeout(function(){node.classList.remove('show');},1800);}
  function updateCount(){el('charCount').textContent=el('videoText').value.length+' / 1000';}
  function setStatus(message,state){var node=el('statusText');node.textContent=message;node.className='tv-status'+(state?' '+state:'');}
  function syncGenerateButton(){el('generateBtn').disabled=isBusy||!stylesReady||!voicesReady;el('generateBtn').textContent=isBusy?'正在生成':'生成视频';}
  function setBusy(value){isBusy=value;syncGenerateButton();}
  function elapsed(){return Math.max(0,Math.round((Date.now()-startedAt)/1000));}
  function phaseText(){var seconds=elapsed();if(seconds<20)return '正在处理文案与配音';if(seconds<180)return '正在生成画面素材';return '正在套用模板并渲染视频';}
  function requestKey(){return 'text-video-'+(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));}
  function pendingSubmission(payload){
    var body=JSON.stringify(payload),saved=null;
    try{saved=JSON.parse(sessionStorage.getItem(pendingStorageKey)||'null');}catch(_){}
    if(saved&&saved.body===body&&saved.key)return saved;
    var pending={body:body,key:requestKey()};
    try{sessionStorage.setItem(pendingStorageKey,JSON.stringify(pending));}catch(_){}
    return pending;
  }
  function confirmSubmission(pending){
    try{
      var saved=JSON.parse(sessionStorage.getItem(pendingStorageKey)||'null');
      if(saved&&saved.body===pending.body&&saved.key===pending.key)sessionStorage.removeItem(pendingStorageKey);
    }catch(_){}
  }
  function shouldConfirmSubmission(response){
    var inProgress=response.status===409&&response.data.code==='idempotency_in_progress';
    return !inProgress&&(response.status<500||response.data.operation_terminal===true);
  }
  function authHeaders(json){var headers={Authorization:'Bearer '+token};if(json)headers['Content-Type']='application/json';return headers;}
  function readJson(response){
    return response.text().then(function(text){
      var data;
      try{data=JSON.parse(text);}catch(_){
        throw new Error(response.ok?'服务返回格式错误':'生成服务未启动或接口地址错误（HTTP '+response.status+'）');
      }
      return {status:response.status,data:data};
    });
  }
  function playableUrl(url){
    if(String(url||'').indexOf('/api/gen/file/')!==0)return Promise.resolve(url);
    return fetch(url,{cache:'no-store',headers:authHeaders(false)}).then(function(response){
      if(response.status===401){location.href='../login.html?redirect=workbench/text-video';throw new Error('登录已过期');}
      if(!response.ok)throw new Error('视频读取失败');
      return response.blob();
    }).then(function(blob){if(activeBlob)URL.revokeObjectURL(activeBlob);activeBlob=URL.createObjectURL(blob);return activeBlob;});
  }
  function showResult(result){
    playableUrl(result.video_url).then(function(url){
      var video=el('resultVideo');video.src=url;video.style.display='block';el('emptyState').style.display='none';
      el('resultMeta').style.display='block';el('resultMeta').textContent=Number(result.duration||0).toFixed(1)+'s · '+(result.scene_count||0)+' 个画面';
      var download=el('downloadBtn');download.style.display='flex';download.href=url;
      video.play().catch(function(){});
    }).catch(function(error){setStatus(error.message||'视频读取失败','error');});
  }
  function poll(jobId){
    fetch('/api/gen/job/'+jobId,{cache:'no-store',headers:authHeaders(false)}).then(readJson).then(function(response){
      var data=response.data;
      if(response.status===401){location.href='../login.html?redirect=workbench/text-video';return;}
      if(data.status==='done'&&data.result){clearTimeout(pollTimer);setBusy(false);setStatus('生成完成，用时 '+elapsed()+' 秒','done');showResult(data.result);return;}
      if(data.status==='error'||data.status==='failed')throw new Error(data.error||'生成失败，点数已自动退回');
      setStatus((data.stage||phaseText())+' · '+elapsed()+' 秒','running');pollTimer=setTimeout(function(){poll(jobId);},2500);
    }).catch(function(error){clearTimeout(pollTimer);setBusy(false);setStatus(error.message||'任务查询失败','error');toast(error.message||'任务查询失败');});
  }
  function generate(){
    var text=el('videoText').value.trim();
    if(text.length<2){toast(activeMode==='generate'?'请输入至少 2 个字的主题':'请输入至少 2 个字的完整文案');return;}
    if(!activeTemplate){toast('模板库尚未加载完成');return;}
    if(!stylesReady){toast('素材风格暂不可用');return;}
    if(!el('materialStyle').value){toast('请选择素材风格');return;}
    if(!voicesReady){toast('音色暂不可用');return;}
    if(!el('videoVoice').value){toast('请选择配音音色');return;}
    clearTimeout(pollTimer);setBusy(true);startedAt=Date.now();setStatus('正在提交任务','running');
    var payload={pipeline:'pixelle',text:text,template:activeTemplate,mode:activeMode,style:el('materialStyle').value,voice:el('videoVoice').value};
    var pending=pendingSubmission(payload),headers=authHeaders(true);headers['Idempotency-Key']=pending.key;
    fetch('/api/gen/script_to_video',{method:'POST',headers:headers,body:pending.body}).then(readJson).then(function(response){
      if(response.status===401){confirmSubmission(pending);location.href='../login.html?redirect=workbench/text-video';return;}
      if(!response.data.job_id){
        if(shouldConfirmSubmission(response))confirmSubmission(pending);
        throw new Error(response.data.detail||'任务提交失败');
      }
      confirmSubmission(pending);
      var cost=response.data.cost?'，预计扣除 '+response.data.cost+' 点':'';
      setStatus((activeMode==='generate'?'正在根据主题创作中文文案':'正在使用完整文案生成视频')+cost,'running');
      poll(response.data.job_id);
    }).catch(function(error){setBusy(false);setStatus(error.message||'任务提交失败','error');toast(error.message||'任务提交失败');});
  }
  function selectMode(button){
    activeMode=button.getAttribute('data-mode')||'generate';
    Array.prototype.forEach.call(document.querySelectorAll('.tv-mode button'),function(item){var selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-checked',selected?'true':'false');});
    var isTopic=activeMode==='generate';
    el('videoTextLabel').textContent=isTopic?'输入主题':'输入完整文案';
    el('videoText').placeholder=isTopic?'例如：AI 如何帮助美业门店提升复购率':'粘贴需要原样配音和排版的完整中文文案';
    setStatus(isTopic?'输入主题，选择模板后生成':'输入完整文案，选择模板后生成');
  }
  function selectTemplate(button,template){
    activeTemplate=button.getAttribute('data-template')||'';
    Array.prototype.forEach.call(document.querySelectorAll('.tv-template'),function(item){var selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-selected',selected?'true':'false');});
    el('templateName').textContent=button.getAttribute('data-name')||'专业模板';
    var isLandscape=template.orientation==='landscape',stage=el('videoStage');
    stage.classList.toggle('landscape',isLandscape);
  }
  function updateTabState(container,attribute,value){
    Array.prototype.forEach.call(container.querySelectorAll('button'),function(button){var selected=button.getAttribute(attribute)===value;button.classList.toggle('active',selected);button.setAttribute('aria-selected',selected?'true':'false');});
  }
  function renderTemplates(){
    var visible=templates.filter(function(template){return template.kind===activeKind&&(activeKind==='video'||template.orientation===activeOrientation);});
    var grid=el('templateGrid');grid.textContent='';
    visible.forEach(function(template){
      var button=document.createElement('button'),media=document.createElement('span'),image=document.createElement('img'),info=document.createElement('span'),title=document.createElement('strong'),meta=document.createElement('span'),selected=document.createElement('span');
      button.className='tv-template';button.type='button';button.setAttribute('data-template',template.key);button.setAttribute('data-name',template.name);button.setAttribute('data-orientation',template.orientation);button.setAttribute('aria-selected','false');
      media.className='tv-template-media';image.src=template.preview_url;image.alt=template.name+'模板预览';image.loading='lazy';image.onerror=function(){image.style.display='none';media.classList.add('missing');};
      info.className='tv-template-info';title.textContent=template.name;meta.className='tv-template-meta';meta.textContent=template.width+'×'+template.height+' · '+(template.orientation==='landscape'?'横屏':'竖屏');
      selected.className='tv-template-selected';selected.textContent='✓';selected.setAttribute('aria-hidden','true');
      media.appendChild(image);info.appendChild(title);info.appendChild(meta);button.appendChild(media);button.appendChild(info);button.appendChild(selected);button.onclick=function(){selectTemplate(button,template);};grid.appendChild(button);
    });
    if(visible.length)selectTemplate(grid.querySelector('.tv-template'),visible[0]);
    else{activeTemplate='';grid.innerHTML='<div class="tv-template-loading">该分类暂无模板</div>';el('templateName').textContent='暂无模板';}
  }
  function selectKind(button){
    activeKind=button.getAttribute('data-kind')||'illustration';updateTabState(el('kindTabs'),'data-kind',activeKind);el('orientationTabs').hidden=activeKind==='video';renderTemplates();
  }
  function selectOrientation(button){
    activeOrientation=button.getAttribute('data-orientation')||'portrait';updateTabState(el('orientationTabs'),'data-orientation',activeOrientation);renderTemplates();
  }
  function loadTemplates(){
    fetch('/api/gen/text-video/templates',{cache:'no-store',headers:authHeaders(false)}).then(readJson).then(function(response){
      if(!response.data.templates||!response.data.templates.length)throw new Error(response.data.detail||'没有可用模板');
      templates=response.data.templates;renderTemplates();
    }).catch(function(error){el('templateGrid').innerHTML='<div class="tv-template-loading">'+error.message+'</div>';el('templateName').textContent='加载失败';setStatus('模板库不可用，请检查生成服务','error');});
  }
  function loadStyles(){
    var select=el('materialStyle');
    stylesReady=false;select.disabled=true;syncGenerateButton();
    fetch('/api/gen/text-video/styles',{cache:'no-store',headers:authHeaders(false)}).then(readJson).then(function(response){
      var styles=response.data.styles||[],defaultStyle=response.data.default_style||'';
      if(!styles.length||!defaultStyle)throw new Error(response.data.detail||'没有可用素材风格');
      select.textContent='';
      styles.forEach(function(style){var option=document.createElement('option');option.value=style.key;option.textContent=style.name;select.appendChild(option);});
      if(!styles.some(function(style){return style.key===defaultStyle;}))throw new Error('默认素材风格无效');
      select.value=defaultStyle;select.disabled=false;stylesReady=true;syncGenerateButton();
    }).catch(function(){stylesReady=false;select.disabled=true;select.innerHTML='<option value="">素材风格暂不可用</option>';syncGenerateButton();setStatus('素材风格暂不可用','error');});
  }
  function loadVoices(){
    var select=el('videoVoice');
    voicesReady=false;select.disabled=true;syncGenerateButton();
    fetch('/api/gen/text-video/voices',{cache:'no-store',headers:authHeaders(false)}).then(readJson).then(function(response){
      var voices=response.data.voices||[],defaultVoice=response.data.default_voice||'';
      if(!voices.length||!defaultVoice)throw new Error(response.data.detail||'没有可用音色');
      select.textContent='';
      var publicGroup=document.createElement('optgroup'),personalGroup=document.createElement('optgroup');
      publicGroup.label='公共音色';personalGroup.label='个人音色';
      voices.forEach(function(voice){
        var option=document.createElement('option');option.value=voice.id;option.textContent=voice.name;
        (voice.scope==='personal'?personalGroup:publicGroup).appendChild(option);
      });
      if(publicGroup.children.length)select.appendChild(publicGroup);
      if(personalGroup.children.length)select.appendChild(personalGroup);
      if(!voices.some(function(voice){return voice.id===defaultVoice;}))defaultVoice=voices[0].id;
      select.value=defaultVoice;select.disabled=false;voicesReady=true;syncGenerateButton();
    }).catch(function(){voicesReady=false;select.disabled=true;select.innerHTML='<option value="">音色暂不可用</option>';syncGenerateButton();setStatus('音色暂不可用','error');});
  }
  el('videoText').addEventListener('input',updateCount);
  Array.prototype.forEach.call(document.querySelectorAll('.tv-mode button'),function(button){button.onclick=function(){selectMode(button);};});
  Array.prototype.forEach.call(el('kindTabs').querySelectorAll('button'),function(button){button.onclick=function(){selectKind(button);};});
  Array.prototype.forEach.call(el('orientationTabs').querySelectorAll('button'),function(button){button.onclick=function(){selectOrientation(button);};});
  el('clearText').onclick=function(){el('videoText').value='';updateCount();el('videoText').focus();};
  el('generateBtn').onclick=generate;
  updateCount();loadTemplates();loadStyles();loadVoices();
})();
</script>
</body>
</html>
