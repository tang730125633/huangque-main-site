<style>

  .tv-source button{min-height:40px;padding:7px 10px;border:0;border-radius:6px;background:transparent;color:#94a4bb;font:600 13px inherit;cursor:pointer}

  .tv-status{min-height:46px;margin-top:14px;padding:12px 14px;border-left:3px solid #344258;background:#0b111d;color:#94a4bb;font-size:12.5px;line-height:1.7}

  .tv-stage.landscape{aspect-ratio:16/9;width:min(100%,720px)}
  .tv-stage video{display:none;width:100%;height:100%;object-fit:contain;background:#000}
  .tv-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#65748a;text-align:center;padding:32px}
  .tv-empty-icon{width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(231,178,76,.28);border-radius:50%;color:#e7b24c;font-size:22px}
  .tv-download{display:none;position:absolute;right:12px;top:12px;width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(5,7,11,.78);color:#fff;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
  .tv-meta{display:none;position:absolute;left:12px;right:58px;top:12px;color:#fff;font:11px "JetBrains Mono",monospace;text-shadow:0 1px 4px #000}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;transition:.18s;background:#111827;border:1px solid rgba(148,164,187,.2);border-radius:8px;padding:10px 15px;color:#eaf1fa;font-size:13px;z-index:90}.toast.show{opacity:1;transform:translateX(-50%)}
  @media(max-width:980px){body{overflow:auto}.hq-content[data-active="text-video"]{height:auto}.tv-layout{grid-template-columns:1fr;height:auto}.tv-editor{border-right:0;border-bottom:1px solid rgba(148,164,187,.12)}.tv-preview{min-height:680px}.tv-text{min-height:220px}}
  @media(max-width:560px){.tv-template-controls{align-items:flex-start;flex-direction:column}.tv-template-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tv-editor{padding:22px 18px}.tv-avatar-row{grid-template-columns:68px minmax(0,1fr)}.tv-avatar-preview{width:68px}.tv-scene{grid-template-columns:22px minmax(0,1fr) 50px}.tv-scene-avatar{width:50px}.tv-avatar-actions button,.tv-scene-actions button{flex:1 1 112px}.tv-action{height:auto;min-height:50px;padding:11px 14px;line-height:1.35}}
</style>

<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>
<div class="hq-app"><div class="hq-content" data-active="text-video">
  <main class="tv-layout">
    <section class="tv-editor">
      <h1 class="tv-heading">文案成片</h1>
      <div class="tv-label"><span>视频模板</span><span id="templateName" style="color:#e7b24c;font-weight:600">正在加载</span></div>
      <div class="tv-template-controls">
        <div id="kindTabs" class="tv-template-tabs" role="tablist" aria-label="模板类型">
          <button class="active" type="button" role="tab" aria-selected="true" data-kind="illustration">插画模板</button>
          <button type="button" role="tab" aria-selected="false" data-kind="video">视频模板</button>
        </div>
        <div id="orientationTabs" class="tv-template-tabs" role="tablist" aria-label="画面方向">
          <button class="active" type="button" role="tab" aria-selected="true" data-orientation="portrait">竖屏</button>
          <button type="button" role="tab" aria-selected="false" data-orientation="landscape">横屏</button>
        </div>
      </div>
      <div id="templateGrid" class="tv-template-grid" role="listbox" aria-label="视频模板"><div class="tv-template-loading">正在读取专业模板库</div></div>
      <div class="tv-label"><span>素材来源</span></div>
      <div id="materialSource" class="tv-source" role="radiogroup" aria-label="素材来源">
        <button id="materialSourceAi" class="active" type="button" role="radio" aria-checked="true" data-material-source="ai">AI 生成素材</button>
        <button id="materialSourceLibrary" type="button" role="radio" aria-checked="false" data-material-source="library">平台素材库</button>
      </div>
      <div class="tv-style-field">
        <label for="materialStyle">素材风格</label>
        <select id="materialStyle" aria-label="素材风格" disabled>
          <option value="">正在加载素材风格</option>
        </select>
      </div>
      <div class="tv-style-field">
        <label for="videoVoice">配音音色</label>
        <select id="videoVoice" aria-label="配音音色" disabled>
          <option value="">正在加载音色</option>
        </select>
      </div>
      <div class="tv-style-field tv-range-field">
        <div class="tv-range-head">
          <label for="speechRate">语速调节</label>
          <output id="speechRateValue" class="tv-range-value" for="speechRate" aria-live="polite">1.0x</output>
        </div>
        <div class="tv-range-wrap">
          <input id="speechRate" class="tv-range" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="语速调节">
        </div>
      </div>
      <div class="tv-label"><span>输入方式</span></div>
      <div class="tv-mode" role="radiogroup" aria-label="输入方式">
        <button class="active" type="button" role="radio" aria-checked="true" data-mode="generate">主题创作</button>
        <button type="button" role="radio" aria-checked="false" data-mode="fixed">完整文案</button>
      </div>
      <div class="tv-label"><label id="videoTextLabel" for="videoText">输入主题</label><button id="clearText" type="button" style="border:0;background:transparent;color:#94a4bb;cursor:pointer;font:12px inherit">清空</button></div>
      <div class="tv-input-wrap">
        <textarea id="videoText" class="tv-text" maxlength="1000" placeholder="例如：AI 如何帮助美业门店提升复购率"></textarea>
        <div id="charCount" class="tv-count">0 / 1000</div>
      </div>
      <section class="tv-talking" aria-label="口播视频素材设置">
        <label class="tv-talking-toggle" for="talkingMaterialEnabled">
          <input id="talkingMaterialEnabled" type="checkbox">
          <span>启用口播视频素材</span>
        </label>
        <div id="talkingMaterialPanel" hidden class="tv-talking-panel">
          <div class="tv-talking-section">
            <div class="tv-talking-section-title"><label for="talkingDefaultAvatar">默认人物形象</label><span>JPG / PNG / WebP，最大 12 MB</span></div>
            <div class="tv-avatar-row">
              <div class="tv-avatar-preview">
                <img id="talkingAvatarPreview" alt="默认人物形象预览" hidden>
                <span id="talkingAvatarPlaceholder" class="tv-avatar-placeholder">尚未上传</span>
              </div>
              <div class="tv-avatar-actions">
                <input id="talkingDefaultAvatar" type="file" accept="image/jpeg,image/png,image/webp" hidden>
                <button id="replaceTalkingAvatar" type="button">上传人物图</button>
                <button id="removeTalkingAvatar" type="button" disabled>移除</button>
              </div>
            </div>
            <p id="talkingUploadError" class="tv-field-error" role="alert" hidden></p>
          </div>
          <div class="tv-talking-section tv-range-field">
            <div class="tv-range-head">
              <label for="talkingRatio">口播镜头比例</label>
              <output id="talkingRatioValue" class="tv-range-value" for="talkingRatio" aria-live="polite">30%</output>
            </div>
            <div class="tv-range-wrap"><input id="talkingRatio" class="tv-range" type="range" min="10" max="50" step="10" value="30" aria-label="口播镜头比例"></div>
          </div>
          <div class="tv-talking-section">
            <div class="tv-talking-section-title"><span>分镜设置</span><span>约 6 秒，不强制截断</span></div>
            <div id="talkingScenes" class="tv-scene-list" aria-live="polite"><div class="tv-scene-empty">生成方案后可逐镜头调整</div></div>
            <input id="talkingSceneAvatarInput" class="tv-scene-avatar-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            <p id="talkingPlanError" class="tv-field-error" role="alert" hidden></p>
            <p id="talkingFinalError" class="tv-field-error" role="alert" hidden></p>
          </div>
        </div>
      </section>
      <button id="generateBtn" class="tv-action" type="button" disabled>生成视频</button>
      <div id="statusText" class="tv-status">输入主题或文案，选择模板后生成</div>
      <ul id="talkingWarnings" class="tv-warning-list" aria-live="polite" hidden></ul>
    </section>
    <section class="tv-preview" aria-label="视频预览">
      <div id="videoStage" class="tv-stage">
        <div id="emptyState" class="tv-empty"><div class="tv-empty-icon">▶</div><div>视频生成后在此预览</div></div>
        <video id="resultVideo" controls playsinline></video>
        <div id="resultMeta" class="tv-meta"></div>
        <a id="downloadBtn" class="tv-download" href="#" title="下载视频" download>↓</a>
      </div>
    </section>
  </main>
</div></div>

<script>
(function(){
  var token='__cookie__',activeBlob='',startedAt=0,pollTimer=0,activeTemplate='',activeMode='generate',activeMaterialSource='ai',templates=[],activeKind='illustration',activeOrientation='portrait',stylesReady=false,voicesReady=false,isBusy=false,busyLabel='正在生成',pendingSceneAvatarId='';
  var planRequestVersion=0,planRequestController=null,isPlanning=false,quoteRequestVersion=0,quoteRequestController=null,isQuoting=false,avatarRequestVersion=0,pendingAvatarUploads=0,avatarRequests={},avatarPreviewUrls={};
  var pendingStorageKey='hq-text-video-pending-v1';
  var el=function(id){return document.getElementById(id);};
  /* talking-state:start */
  function createTalkingState(){
    var enabled=false,plan=null,defaultAvatar=null,sceneSelections={},sceneAvatarOverrides={};
    function copy(value){return value==null?value:JSON.parse(JSON.stringify(value));}
    return {
      setEnabled:function(value){enabled=value===true;},
      setDefaultAvatar:function(value){defaultAvatar=value?copy(value):null;},
      setPlan:function(value){
        plan=copy(value);sceneSelections={};sceneAvatarOverrides={};
        (plan&&plan.scenes||[]).forEach(function(scene){sceneSelections[scene.scene_id]=scene.talking_recommended===true;});
      },
      invalidatePlan:function(){plan=null;sceneSelections={};sceneAvatarOverrides={};},
      setSceneEnabled:function(sceneId,value){if(plan&&Object.prototype.hasOwnProperty.call(sceneSelections,sceneId))sceneSelections[sceneId]=value===true;},
      setSceneAvatar:function(sceneId,value){if(plan&&Object.prototype.hasOwnProperty.call(sceneSelections,sceneId)){if(value)sceneAvatarOverrides[sceneId]=copy(value);else delete sceneAvatarOverrides[sceneId];}},
      snapshot:function(){return copy({enabled:enabled,plan:plan,defaultAvatar:defaultAvatar,sceneSelections:sceneSelections,sceneAvatarOverrides:sceneAvatarOverrides});},
      buildTalkingMaterial:function(ratioPercent){
        if(!enabled||!plan||!defaultAvatar)return {enabled:false};
        return {enabled:true,plan_id:plan.plan_id,source_hash:plan.source_hash,ratio:Number(ratioPercent)/100,default_avatar_asset_id:defaultAvatar.asset_id,scenes:(plan.scenes||[]).map(function(scene){
          var item={scene_id:scene.scene_id,enabled:sceneSelections[scene.scene_id]===true},override=sceneAvatarOverrides[scene.scene_id];
          if(item.enabled&&override)item.avatar_asset_id=override.asset_id;
          return item;
        })};
      }
    };
  }
  /* talking-state:end */
  var talkingState=createTalkingState();
  function toast(message){var node=el('toast');node.textContent=message;node.classList.add('show');setTimeout(function(){node.classList.remove('show');},1800);}

  function selectMaterialSource(button){
    activeMaterialSource=button.getAttribute('data-material-source')||'ai';invalidateQuote(false);
    [el('materialSourceAi'),el('materialSourceLibrary')].forEach(function(item){var selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-checked',selected?'true':'false');});
    setStatus(activeMaterialSource==='library'?'将按内容从素材库匹配画面，不调用 AI 生成素材':'将按分镜调用 AI 生成素材');
  }
  function selectTemplate(button,template){
    activeTemplate=button.getAttribute('data-template')||'';
    Array.prototype.forEach.call(document.querySelectorAll('.tv-template'),function(item){var selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-selected',selected?'true':'false');});
    el('templateName').textContent=button.getAttribute('data-name')||'专业模板';
    var isLandscape=template.orientation==='landscape',stage=el('videoStage');
    stage.classList.toggle('landscape',isLandscape);
  }
  function updateTabState(container,attribute,value){
    Array.prototype.forEach.call(container.querySelectorAll('button'),function(button){var selected=button.getAttribute(attribute)===value;button.classList.toggle('active',selected);button.setAttribute('aria-selected',selected?'true':'false');});
  }
  function renderTemplates(){
    var visible=templates.filter(function(template){return template.kind===activeKind&&(activeKind==='video'||template.orientation===activeOrientation);});
    var grid=el('templateGrid');grid.textContent='';
    visible.forEach(function(template){
      var button=document.createElement('button'),media=document.createElement('span'),image=document.createElement('img'),info=document.createElement('span'),title=document.createElement('strong'),meta=document.createElement('span'),selected=document.createElement('span');
      button.className='tv-template';button.type='button';button.setAttribute('data-template',template.key);button.setAttribute('data-name',template.name);button.setAttribute('data-orientation',template.orientation);button.setAttribute('aria-selected','false');
      media.className='tv-template-media';image.src=template.preview_url;image.alt=template.name+'模板预览';image.loading='lazy';image.onerror=function(){image.style.display='none';media.classList.add('missing');};
      info.className='tv-template-info';title.textContent=template.name;meta.className='tv-template-meta';meta.textContent=template.width+'×'+template.height+' · '+(template.orientation==='landscape'?'横屏':'竖屏');
      selected.className='tv-template-selected';selected.textContent='✓';selected.setAttribute('aria-hidden','true');
      media.appendChild(image);info.appendChild(title);info.appendChild(meta);button.appendChild(media);button.appendChild(info);button.appendChild(selected);button.onclick=function(){invalidateTalkingPlan();selectTemplate(button,template);};grid.appendChild(button);
    });
    if(visible.length)selectTemplate(grid.querySelector('.tv-template'),visible[0]);
    else{activeTemplate='';grid.innerHTML='<div class="tv-template-loading">该分类暂无模板</div>';el('templateName').textContent='暂无模板';}
  }
  function selectKind(button){
    invalidateTalkingPlan();
    activeKind=button.getAttribute('data-kind')||'illustration';updateTabState(el('kindTabs'),'data-kind',activeKind);el('orientationTabs').hidden=activeKind==='video';renderTemplates();
  }
  function selectOrientation(button){
    invalidateTalkingPlan();
    activeOrientation=button.getAttribute('data-orientation')||'portrait';updateTabState(el('orientationTabs'),'data-orientation',activeOrientation);renderTemplates();
  }
  function loadTemplates(){
    fetch('/api/gen/text-video/templates',{cache:'no-store',headers:authHeaders(false)}).then(readJson).then(function(response){
      if(!response.data.templates||!response.data.templates.length)throw new Error(response.data.detail||'没有可用模板');
      templates=response.data.templates;renderTemplates();
    }).catch(function(error){el('templateGrid').innerHTML='<div class="tv-template-loading">'+error.message+'</div>';el('templateName').textContent='加载失败';setStatus('模板库不可用，请检查生成服务','error');});
  }
  function loadStyles(){
    var select=el('materialStyle');
    stylesReady=false;select.disabled=true;syncGenerateButton();
    fetch('/api/gen/text-video/styles',{cache:'no-store',headers:authHeaders(false)}).then(readJson).then(function(response){
      var styles=response.data.styles||[],defaultStyle=response.data.default_style||'';
      if(!styles.length||!defaultStyle)throw new Error(response.data.detail||'没有可用素材风格');
      select.textContent='';
      styles.forEach(function(style){var option=document.createElement('option');option.value=style.key;option.textContent=style.name;select.appendChild(option);});
      if(!styles.some(function(style){return style.key===defaultStyle;}))throw new Error('默认素材风格无效');
      select.value=defaultStyle;select.disabled=false;stylesReady=true;syncGenerateButton();
    }).catch(function(){stylesReady=false;select.disabled=true;select.innerHTML='<option value="">素材风格暂不可用</option>';syncGenerateButton();setStatus('素材风格暂不可用','error');});
  }
  function loadVoices(){
    var select=el('videoVoice');
    voicesReady=false;select.disabled=true;syncGenerateButton();
    fetch('/api/gen/text-video/voices',{cache:'no-store',headers:authHeaders(false)}).then(readJson).then(function(response){
      var voices=response.data.voices||[],defaultVoice=response.data.default_voice||'';
      if(!voices.length||!defaultVoice)throw new Error(response.data.detail||'没有可用音色');
      select.textContent='';
      var publicGroup=document.createElement('optgroup'),personalGroup=document.createElement('optgroup');
      publicGroup.label='公共音色';personalGroup.label='个人音色';
      voices.forEach(function(voice){
        var option=document.createElement('option');option.value=voice.id;option.textContent=voice.name;
        (voice.scope==='personal'?personalGroup:publicGroup).appendChild(option);
      });
      if(publicGroup.children.length)select.appendChild(publicGroup);
      if(personalGroup.children.length)select.appendChild(personalGroup);
      if(!voices.some(function(voice){return voice.id===defaultVoice;}))defaultVoice=voices[0].id;
      select.value=defaultVoice;select.disabled=false;voicesReady=true;syncGenerateButton();
    }).catch(function(){voicesReady=false;select.disabled=true;select.innerHTML='<option value="">音色暂不可用</option>';syncGenerateButton();setStatus('音色暂不可用','error');});
  }
  el('speechRate').addEventListener('input',updateSpeechRateValue);
  el('talkingRatio').addEventListener('input',updateTalkingRatioValue);
  el('videoText').addEventListener('input',updateCount);
  bindPlanInvalidation(el('videoText'),'input');
  bindPlanInvalidation(el('materialStyle'),'change');
  bindPlanInvalidation(el('videoVoice'),'change');
  bindPlanInvalidation(el('speechRate'),'input');
  bindPlanInvalidation(el('talkingRatio'),'input');
  Array.prototype.forEach.call(document.querySelectorAll('.tv-mode button'),function(button){button.onclick=function(){invalidateTalkingPlan();selectMode(button);};});
  el('materialSourceAi').onclick=function(){selectMaterialSource(el('materialSourceAi'));};
  el('materialSourceLibrary').onclick=function(){selectMaterialSource(el('materialSourceLibrary'));};
  Array.prototype.forEach.call(el('kindTabs').querySelectorAll('button'),function(button){button.onclick=function(){selectKind(button);};});
  Array.prototype.forEach.call(el('orientationTabs').querySelectorAll('button'),function(button){button.onclick=function(){selectOrientation(button);};});
  el('clearText').onclick=function(){el('videoText').value='';updateCount();invalidateTalkingPlan();el('videoText').focus();};
  el('talkingMaterialEnabled').onchange=function(){setTalkingEnabled(el('talkingMaterialEnabled').checked);};
  el('replaceTalkingAvatar').onclick=function(){el('talkingDefaultAvatar').click();};
  el('removeTalkingAvatar').onclick=function(){cancelAvatarRequest('default');revokeAvatarPreview('default');talkingState.setDefaultAvatar(null);invalidateTalkingPlan();renderDefaultAvatar();syncGenerateButton();};
  el('talkingDefaultAvatar').onchange=function(){uploadAvatarFile(el('talkingDefaultAvatar').files&&el('talkingDefaultAvatar').files[0],'');};
  el('talkingSceneAvatarInput').onchange=function(){var sceneId=pendingSceneAvatarId;pendingSceneAvatarId='';uploadAvatarFile(el('talkingSceneAvatarInput').files&&el('talkingSceneAvatarInput').files[0],sceneId);};
  el('generateBtn').onclick=generate;
  updateSpeechRateValue();updateTalkingRatioValue();updateCount();renderDefaultAvatar();renderTalkingScenes();clearTalkingErrors();setTalkingEnabled(false);loadTemplates();loadStyles();loadVoices();
})();
</script>
</body>
</html>
