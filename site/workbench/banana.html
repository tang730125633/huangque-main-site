  .gImg{ grid-template-columns:1.45fr 1fr; }

<body>
<div class="hq-bg"><div class="glow"></div><div class="grid"></div><canvas></canvas></div>

<div class="hq-app"><div class="hq-content" data-active="banana">
  <div class="gImg" style="display:grid; gap:18px; align-items:start;">
    <div style="border:1px solid rgba(148,164,187,.1); border-radius:18px; background:linear-gradient(165deg, rgba(16,24,39,.58), rgba(12,18,32,.46)); padding:22px;">
      <div style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div><h1 style="margin:0; font-size:21px; font-weight:700;">AI 作图</h1><p style="margin:7px 0 0; font-size:13px; color:#94a4bb;">用 AI 激发灵感，快速生成高质量图片</p></div>
        <button class="hv-gold" style="width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); border-radius:9px; cursor:pointer; transition:.16s;"><span style="display:flex; width:17px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></span></button>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin:22px 0 9px;">
        <span style="font-size:13.5px; font-weight:600;">提示词</span>
      </div>
      <div style="position:relative; border:1px solid rgba(148,164,187,.16); background:rgba(7,11,19,.5); border-radius:12px; padding:14px 15px;">
        <textarea id="bPrompt" rows="3" placeholder="科技焕肤 · 逆龄新生，高级感美业海报，金色光效，9:16…" style="width:100%; resize:none; background:transparent; border:none; outline:none; color:#eaf1fa; font-size:13.5px; line-height:1.7; font-family:inherit;">科技焕肤 · 逆龄新生，高级感美业海报，金色光效，9:16 竖版，留白标题区，柔光质感，主体居中，氛围高级，适合朋友圈与门店屏幕投放</textarea>
        <div style="display:flex; align-items:center; justify-content:flex-end; gap:12px; font-size:11.5px; color:#5c6b82; margin-top:6px;"><span style="font-family:'JetBrains Mono',monospace;">62 / 500</span><span style="cursor:pointer;">清空</span></div>
      </div>

      <div style="font-size:13.5px; font-weight:600; margin:22px 0 10px;">引擎</div>
      <div id="engineRow" style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">
        <div data-engine="nb2" style="padding:11px 10px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.32); transition:.16s; line-height:1.5;"><div style="font-weight:600;">Nano Banana 2</div><div style="font-size:11px; margin-top:3px; color:#e7b24c;">快·中文好 · <span data-engine-cost="nb2">10点</span> ✦推荐</div></div>
        <div data-engine="pro" style="padding:11px 10px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s; line-height:1.5;"><div style="font-weight:600;">Nano Banana Pro</div><div style="font-size:11px; margin-top:3px; color:#94a4bb;">精品·最强中文/4K · <span data-engine-cost="pro">18点</span></div></div>
        <div data-engine="gpt" style="padding:11px 10px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s; line-height:1.5;"><div style="font-weight:600;">gpt-image-2</div><div style="font-size:11px; margin-top:3px; color:#94a4bb;">OpenAI·写实/局部改 · <span data-engine-cost="gpt">12点</span></div></div>
        <div data-engine="zelong" style="padding:11px 10px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s; line-height:1.5;"><div style="font-weight:600;">泽龙AI</div><div style="font-size:11px; margin-top:3px; color:#94a4bb;">实惠·偏不稳 · <span data-engine-cost="zelong">8点</span></div></div>
      </div>

      <div style="font-size:13.5px; font-weight:600; margin:22px 0 10px;">比例</div>
      <div id="ratioRow" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;">
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 6px; font-size:13px; border-radius:11px; cursor:pointer; color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.32); transition:.16s; font-family:'JetBrains Mono',monospace;"><span style="width:9px; height:13px; border:1.4px solid #e7b24c; border-radius:2px;"></span>9:16</div>
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 6px; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s; font-family:'JetBrains Mono',monospace;"><span style="width:11px; height:11px; border:1.4px solid #94a4bb; border-radius:2px;"></span>1:1</div>
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 6px; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s; font-family:'JetBrains Mono',monospace;"><span style="width:13px; height:9px; border:1.4px solid #94a4bb; border-radius:2px;"></span>16:9</div>
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 6px; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s; font-family:'JetBrains Mono',monospace;"><span style="width:10px; height:13px; border:1.4px solid #94a4bb; border-radius:2px;"></span>3:4</div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:22px;">
        <div>
          <div style="font-size:13.5px; font-weight:600; margin-bottom:10px;">清晰度</div>
          <div id="qualityRow" style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">
            <div data-q="std" style="padding:11px 6px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#94a4bb; background:rgba(148,164,187,.05); border:1px solid rgba(148,164,187,.14); transition:.16s;">标准</div>
            <div data-q="hd" style="padding:11px 6px; text-align:center; font-size:13px; border-radius:11px; cursor:pointer; color:#e7b24c; background:rgba(231,178,76,.1); border:1px solid rgba(231,178,76,.32); transition:.16s;">高清</div>
          </div>
        </div>
        <div>
          <div style="font-size:13.5px; font-weight:600; margin-bottom:10px;">生成数量</div>
          <div id="countRow" style="display:grid; grid-template-columns:44px 1fr 44px; gap:10px; align-items:center;">
            <button id="countMinus" type="button" aria-label="减少生成数量" style="height:42px; border-radius:11px; border:1px solid rgba(148,164,187,.14); background:rgba(148,164,187,.05); color:#94a4bb; font-size:22px; line-height:1; cursor:pointer; transition:.16s; font-family:inherit;">-</button>
            <input id="countInput" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="生成数量" autocomplete="off" style="height:42px; box-sizing:border-box; border-radius:11px; border:1px solid rgba(231,178,76,.32); background:rgba(231,178,76,.1); color:#e7b24c; text-align:center; font-size:15px; font-weight:700; outline:none; font-family:'JetBrains Mono',monospace;">
            <button id="countPlus" type="button" aria-label="增加生成数量" style="height:42px; border-radius:11px; border:1px solid rgba(148,164,187,.14); background:rgba(148,164,187,.05); color:#94a4bb; font-size:22px; line-height:1; cursor:pointer; transition:.16s; font-family:inherit;">+</button>
          </div>
        </div>
      </div>

      <button id="bGen" class="hv-lift" style="width:100%; height:54px; margin-top:22px; font-size:16px; font-weight:700; color:#1a1206; background:linear-gradient(135deg,#f4cd72,#e7b24c); border:none; border-radius:14px; cursor:pointer; box-shadow:0 14px 34px -12px rgba(231,178,76,.7); transition:.2s; font-family:inherit;">立即生成（10 点）</button>
      <div id="bNote" style="text-align:center; font-size:11.5px; color:#5c6b82; margin-top:11px;">本次预计消耗 <span style="color:#e7b24c; font-family:'JetBrains Mono',monospace;">10</span> 点 · 失败自动退点</div>
    </div>

    <div style="position:sticky; top:0; border:1px solid rgba(231,178,76,.16); border-radius:18px; background:linear-gradient(165deg, rgba(20,17,10,.6), rgba(12,16,26,.5)); padding:20px;">
      <div style="font-size:16px; font-weight:600; margin-bottom:14px;">生成结果</div>
      <div style="position:relative; border-radius:14px; overflow:hidden; border:1px solid rgba(231,178,76,.18);">
        <img id="bResult" src="../assets/meiye_poster.webp" alt="生成结果 · 美业海报" style="display:block; width:100%; aspect-ratio:9/13; object-fit:cover;">
        <div style="position:absolute; top:12px; right:12px; padding:5px 10px; background:rgba(7,11,19,.55); backdrop-filter:blur(6px); border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#e7b24c;">9:16</div>
      </div>
      <div id="actRow" style="display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:14px;">
        <div class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;"><span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg></span><span style="font-size:11px; color:#94a4bb;">再生成</span></div>
        <a href="video.html" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s; text-decoration:none;"><span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg></span><span style="font-size:11px; color:#94a4bb;">转视频</span></a>
        <div class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;"><span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></span><span style="font-size:11px; color:#94a4bb;">发飞书</span></div>
        <div class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s;"><span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></span><span style="font-size:11px; color:#94a4bb;">下载</span></div>
        <a href="assets.html" class="hv-gold" style="display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border:1px solid rgba(148,164,187,.1); border-radius:11px; background:rgba(148,164,187,.03); cursor:pointer; transition:.16s; text-decoration:none;"><span style="display:flex; width:17px; color:#94a4bb;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9 14h6"/></svg></span><span style="font-size:11px; color:#94a4bb;">入库</span></a>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;">
        <span style="font-size:15px; font-weight:600;">最近作品</span>
        <a href="assets.html" style="display:flex; align-items:center; gap:4px; font-size:12.5px; color:#94a4bb; cursor:pointer; text-decoration:none;">全部作品 <span style="display:flex; width:12px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%"><path d="M9 18l6-6-6-6"/></svg></span></a>
      </div>
      <div id="recentGrid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:9px;">
        <div style="grid-column:1/-1; padding:18px 0; text-align:center; font-size:12.5px; color:#5c6b82;">还没有作品，生成第一张吧</div>
      </div>
    </div>
  </div>
</div></div>

<script src="../assets/cloud.js?v=8"></script>
<script src="cloud-shell.js?v=cccb4993"></script>
<script>
/* 作图页接后端能力中心 /api/gen/image + /api/gen/banana，点数后端统一扣。 */
(function(){
  var pr=document.getElementById('bPrompt'), gen=document.getElementById('bGen'),
      res=document.getElementById('bResult'), note=document.getElementById('bNote');
  if(!gen) return;
  var ratio='9:16', engine='nb2', quality='hd', count=1;
  // 质量基价(最终=基价×数量)；nb/pro/gpt/zelong 各档
  var COSTBASE={nb2:{std:10,hd:14}, pro:{std:18,hd:26}, gpt:{std:8,hd:12}, zelong:{std:8,hd:12}};
  var ENGINE_MAXN={nb2:2, pro:2, gpt:4, zelong:2};  // 数量上限(中转/循环慢→低)
  function engineCost(eng){ var t=COSTBASE[eng]||COSTBASE.nb2; return (t[quality]||t.hd)*count; }
  function costFor(){ return engineCost(engine); }
  function updateEngineCosts(){
    document.querySelectorAll('[data-engine-cost]').forEach(function(x){
      x.textContent=engineCost(x.getAttribute('data-engine-cost'))+'点';
    });
  };
  function tok(){ return localStorage.getItem('hq_token')||''; }
  function genLabel(){ return '立即生成（'+costFor()+' 点）'; }
  function updateCost(){
    updateEngineCosts();
    gen.textContent=genLabel();
    note.innerHTML='本次预计消耗 <span style="color:#e7b24c; font-family:\'JetBrains Mono\',monospace;">'+costFor()+'</span> 点 · 失败自动退点';
    note.style.color='#5c6b82';
  }
  function setNote(t,c){ note.innerHTML=t; note.style.color=c||'#5c6b82'; }
  function busy(on){ gen.style.pointerEvents=on?'none':'auto'; gen.style.opacity=on?'.7':'1'; gen.textContent=on?'生成中…':genLabel(); res.style.filter=on?'blur(3px) brightness(.6)':'none'; }

  // 引擎选择
  function selectEngine(e){
    document.querySelectorAll('#engineRow > div').forEach(function(x){
      x.style.color='#94a4bb'; x.style.background='rgba(148,164,187,.05)'; x.style.borderColor='rgba(148,164,187,.14)';
      var sub=x.querySelector('div:last-child'); if(sub) sub.style.color='#94a4bb';
    });
    var c=document.querySelector('#engineRow [data-engine="'+e+'"]');
    if(c){ c.style.color='#e7b24c'; c.style.background='rgba(231,178,76,.1)'; c.style.borderColor='rgba(231,178,76,.32)'; var sub=c.querySelector('div:last-child'); if(sub) sub.style.color='#e7b24c'; }
    engine=e; adaptCount();
  }
  document.querySelectorAll('#engineRow > div').forEach(function(c){ c.onclick=function(){ selectEngine(c.getAttribute('data-engine')); }; });

  // 清晰度 / 数量 选择(仿 ratioRow 高亮)
  function pickIn(rowId, el){
    document.querySelectorAll('#'+rowId+' > div').forEach(function(x){ x.style.color='#94a4bb'; x.style.background='rgba(148,164,187,.05)'; x.style.borderColor='rgba(148,164,187,.14)'; });
    if(el){ el.style.color='#e7b24c'; el.style.background='rgba(231,178,76,.1)'; el.style.borderColor='rgba(231,178,76,.32)'; }
  }
  document.querySelectorAll('#qualityRow > div').forEach(function(c){ c.onclick=function(){ pickIn('qualityRow',c); quality=c.getAttribute('data-q'); updateCost(); }; });
  var countMinus=document.getElementById('countMinus'), countInput=document.getElementById('countInput'), countPlus=document.getElementById('countPlus');
  function countMax(){ return ENGINE_MAXN[engine]||1; }
  function clampCount(n){
    n=parseInt(n,10);
    if(!isFinite(n) || n<1) n=1;
    return Math.min(countMax(), n);
  }
  function styleCountButton(btn, disabled){
    if(!btn) return;
    btn.disabled=!!disabled;
    btn.style.opacity=disabled?'.45':'1';
    btn.style.cursor=disabled?'not-allowed':'pointer';
    btn.style.color=disabled?'#5c6b82':'#94a4bb';
  }
  function syncCount(){
    count=clampCount(count);
    if(countInput) countInput.value=String(count);
    styleCountButton(countMinus, count<=1);
    styleCountButton(countPlus, count>=countMax());
    updateCost();
  }
  function setCount(n){ count=clampCount(n); syncCount(); }
  if(countMinus) countMinus.onclick=function(){ setCount(count-1); };
  if(countPlus) countPlus.onclick=function(){ setCount(count+1); };
  if(countInput){
    countInput.oninput=function(){
      var clean=countInput.value.replace(/[^\d]/g,'');
      if(clean!==countInput.value) countInput.value=clean;
      if(clean) setCount(clean);
    };
    countInput.onblur=function(){ setCount(countInput.value); };
  }
  function adaptCount(){ syncCount(); }

  adaptCount(); // init: nb2 默认 + 数量上限
  // 灵感页「做同款」：从 ?prompt= / ?engine= 预填提示词 + 切引擎
  try{ var ip=new URLSearchParams(location.search);
    var pp=ip.get('prompt'); if(pp){ pr.value=pp; }
    var pe=ip.get('engine'); if(pe && document.querySelector('#engineRow [data-engine="'+pe+'"]')) selectEngine(pe);
  }catch(e){}

  document.querySelectorAll('#ratioRow > div').forEach(function(c){ c.onclick=function(){
    document.querySelectorAll('#ratioRow > div').forEach(function(x){ x.style.color='#94a4bb'; x.style.background='rgba(148,164,187,.05)'; x.style.borderColor='rgba(148,164,187,.14)'; });
    c.style.color='#e7b24c'; c.style.background='rgba(231,178,76,.1)'; c.style.borderColor='rgba(231,178,76,.32)';
    var m=c.textContent.match(/\d+:\d+/); if(m) ratio=m[0];
  };});

  // 共享：提交 → 轮询 → 显示。任务存 localStorage，切走再回来自动续传（后端不中断）
  var lastPayload=null, lastResultUrl=null, lastEndpoint='/api/gen/image';
  // gpt-image 内容审核拒绝会返回 HTTP 400，原文对用户无意义 → 给可操作提示
  function errMsg(e){
    var s=String(e||'');
    if(lastEndpoint==='/api/gen/image' && /400|bad request/i.test(s))
      return '该提示词可能被 OpenAI 内容审核拒绝，换个说法，或改用 Nano Banana 引擎（对人物/中文更宽松）· 已退点';
    return '失败：'+s+' · 已退点';
  }
  // 结果展示：单图走 #bResult；多图(数量>1)在下方渲染缩略图条，点选驱动当前图
  function showResult(result){
    var us=(result&&result.urls&&result.urls.length)?result.urls:[result.url];
    res.src=us[0]+'?t='+Date.now(); lastResultUrl=us[0]; localStorage.setItem('hq_last_result',us[0]);
    renderThumbs(us);
  }
  function renderThumbs(us){
    var box=document.getElementById('bThumbs');
    if(!box){ box=document.createElement('div'); box.id='bThumbs';
      box.style.cssText='display:none; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:8px; margin-top:10px;';
      res.parentElement.parentElement.insertBefore(box, res.parentElement.nextSibling); }
    if(!us || us.length<=1){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display='grid'; box.innerHTML='';
    us.forEach(function(u,i){ var im=document.createElement('img'); im.src=u+'?t='+Date.now();
      im.style.cssText='width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid '+(i===0?'#e7b24c':'transparent')+';';
      im.onclick=function(){ res.src=u+'?t='+Date.now(); lastResultUrl=u; localStorage.setItem('hq_last_result',u);
        box.querySelectorAll('img').forEach(function(x){x.style.borderColor='transparent';}); im.style.borderColor='#e7b24c'; };
      box.appendChild(im); });
  }
  function poll(id, t0, label){
    var iv=setInterval(function(){
      fetch('/api/gen/job/'+id,{headers:{'Authorization':'Bearer '+tok()}}).then(function(r){return r.json();}).then(function(d){
        if(!d.status){ clearInterval(iv); busy(false); localStorage.removeItem('hq_active_job'); return; }
        var sec=Math.round((Date.now()-t0)/1000);
        if(d.status==='done'){ clearInterval(iv); showResult(d.result); busy(false); setNote('✅ 出图完成（'+sec+'s）· 点数已更新','#2bd576'); localStorage.removeItem('hq_active_job'); if(window.HQ&&window.HQ.refreshPoints) window.HQ.refreshPoints(); loadHistory(); }
        else if(d.status==='error'){ clearInterval(iv); busy(false); setNote(errMsg(d.error||''),'#f4708a'); localStorage.removeItem('hq_active_job'); }
        else if(sec>400){ clearInterval(iv); busy(false); setNote('生成超时（'+sec+'s）· 已自动退点，请重试','#f4708a'); localStorage.removeItem('hq_active_job'); }
        else setNote((label||'生成中')+'（'+sec+'s）· 可切去别的页，回来自动接上','#2dd4bf');
      }).catch(function(){});
    },4000);
  }
  function submit(payload, label, endpoint){
    endpoint=endpoint||'/api/gen/image'; lastEndpoint=endpoint;
    if(!payload.prompt){ setNote('请先输入提示词','#f4708a'); return; }
    if(!tok()){ HQ.login(); return; }
    lastPayload=payload; busy(true);
    var hint=endpoint==='/api/gen/banana'?'Nano Banana 约30-90秒':'gpt-image-2 高清约 1-2 分钟';
    setNote(label+' · '+hint,'#2dd4bf');
    var t0=Date.now();
    fetch(endpoint,{method:'POST',headers:{'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){ return r.json().then(function(d){ return {s:r.status,d:d}; }); })
      .then(function(x){
        if(x.s===401){ HQ.login(); return; }
        if(x.s===402){ busy(false); setNote('点数不足 · <a href="recharge.html" style="color:#e7b24c">去充值</a>','#f4708a'); return; }
        if(!x.d.job_id){ busy(false); setNote('提交失败：'+((x.d&&x.d.detail)||'未知'),'#f4708a'); return; }
        localStorage.setItem('hq_active_job', JSON.stringify({id:x.d.job_id, t0:t0, label:(label||'生成中').replace(/（.*$/,'')}));
        poll(x.d.job_id, t0, label);
      }).catch(function(){ busy(false); setNote('网络错误，请重试','#f4708a'); });
  }

  // 文本生成图片
  gen.onclick=function(){
    var bp={prompt:(pr.value||'').trim(), ratio:ratio, quality:quality, count:count};
    if(engine==='gpt' || engine==='zelong'){
      if(engine==='zelong') bp.provider='zelong';  // 走中转站 gpt-image-2
      submit(bp, (engine==='zelong'?'泽龙Ai ':'')+(engine==='gpt'?'文生图中':'生成中'), '/api/gen/image');
    } else {
      bp.model=engine;
      submit(bp, (engine==='pro'?'Nano Banana Pro ':'Nano Banana 2 ')+'生成中', '/api/gen/banana');
    }
  };
  // 最近作品：读真实历史（生成即自动入库）
  function loadHistory(){
    var grid=document.getElementById('recentGrid'); if(!grid||!tok()) return;
    fetch('/api/gen/history?limit=12',{headers:{'Authorization':'Bearer '+tok()}}).then(function(r){return r.json();}).then(function(d){
      if(!d.items||!d.items.length) return;
      grid.innerHTML=d.items.map(function(it){ return '<img src="'+it.url+'" class="hv-lift" data-url="'+it.url+'" style="display:block; width:100%; aspect-ratio:3/4; border-radius:11px; object-fit:cover; cursor:pointer; border:1px solid rgba(148,164,187,.12);">'; }).join('');
      grid.querySelectorAll('img').forEach(function(im){ im.onclick=function(){ var u=im.getAttribute('data-url'); res.src=u+'?t='+Date.now(); lastResultUrl=u; localStorage.setItem('hq_last_result',u); }; });
    }).catch(function(){});
  }
  loadHistory();
  // 刷新还原：把上次的结果图放回结果区，刷新后也能直接再生成
  try{ var lr0=localStorage.getItem('hq_last_result'); if(lr0){ res.src=lr0+'?t='+Date.now(); lastResultUrl=lr0; } }catch(e){}
  // 续传：切回页面时接上进行中的任务（后端没中断）
  try{ var aj=JSON.parse(localStorage.getItem('hq_active_job')||'null'); if(aj&&aj.id){ busy(true); poll(aj.id, aj.t0||Date.now(), aj.label); } }catch(e){}

  // 结果区按钮
  function actBtn(label){ var n=null; document.querySelectorAll('#actRow > *').forEach(function(el){ if(el.textContent.indexOf(label)>=0) n=el; }); return n; }
  var bRegen=actBtn('再生成'), bFeishu=actBtn('发飞书'), bDl=actBtn('下载'), bStore=actBtn('入库');
  if(bRegen) bRegen.onclick=function(){ if(!lastPayload){ setNote('先生成一张，再「再生成」','#f4708a'); return; } submit(lastPayload,'重新生成中',lastEndpoint); };
  if(bDl) bDl.onclick=function(){ if(!lastResultUrl){ setNote('先生成一张再下载','#f4708a'); return; } var a=document.createElement('a'); a.href=lastResultUrl; a.download='huangque_'+Date.now()+'.png'; document.body.appendChild(a); a.click(); a.remove(); };
  if(bStore) bStore.onclick=function(e){ if(e&&e.preventDefault) e.preventDefault(); if(!lastResultUrl){ setNote('先生成一张','#f4708a'); return; } setNote('✅ 生成即自动入库 · <a href="assets.html" style="color:#e7b24c">去「资产」查看</a>','#2bd576'); };
  if(bFeishu) bFeishu.onclick=function(){ setNote('飞书推送即将上线（bot 接入阶段）','#f4cd72'); };
})();
</script>
</body>
