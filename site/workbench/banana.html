      .then(function(r){ return r.text().then(function(t){ return parseJsonResponse(r.status,t); }); });
  }
  function requestJsonWithProgress(endpoint,payload,onProgress){
    var idemKey=arguments[3]||'';
    return new Promise(function(resolve,reject){
      var xhr=new XMLHttpRequest(),uploadComplete=false;
      xhr.open('POST',endpoint,true);
      xhr.setRequestHeader('Authorization','Bearer '+tok());
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.setRequestHeader('Idempotency-Key',idemKey);
      xhr.upload.onprogress=function(e){
        if(e.lengthComputable&&onProgress){ var pct=Math.round(e.loaded/e.total*100); onProgress(pct); }
      };
      xhr.upload.onload=function(){ uploadComplete=true; };
      xhr.onload=function(){ resolve(parseJsonResponse(xhr.status,xhr.responseText||'')); };
      function fail(message){ var error=new Error(message); error.uploadComplete=uploadComplete; reject(error); }
      xhr.onerror=function(){ fail('upload failed'); };
      xhr.onabort=function(){ fail('upload aborted'); };
      xhr.send(JSON.stringify(payload));
    });
  }

  function referenceFetchUrl(url){

      if(parsed.origin===location.origin) return parsed.pathname+parsed.search;
      return '/api/gen/dl?url='+encodeURIComponent(parsed.href)+'&name=banana-edit';
    }catch(e){ return url; }

  function openRecentLightbox(urls,idx){
    if(!urls||!urls.length) return;
    idx=Math.max(0,Math.min(idx||0,urls.length-1));
    var old=document.getElementById('recentModal'); if(old&&old._close) old._close();
    var wrap=document.createElement('div'); wrap.id='recentModal'; wrap.className='recent-modal';
    var box=document.createElement('div'); box.className='recent-box'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','浣滃搧棰勮');
    var close=document.createElement('button'); close.type='button'; close.className='recent-close'; close.setAttribute('aria-label','鍏抽棴'); close.textContent='脳';
    var img=document.createElement('img'); img.alt='';
    var prev=document.createElement('button'); prev.type='button'; prev.className='recent-nav prev'; prev.setAttribute('aria-label','涓婁竴寮?); prev.textContent='鈥?;
    var next=document.createElement('button'); next.type='button'; next.className='recent-nav next'; next.setAttribute('aria-label','涓嬩竴寮?); next.textContent='鈥?;
    var foot=document.createElement('div'); foot.className='recent-foot';
    var count=document.createElement('span'); count.className='recent-count';
    var use=document.createElement('button'); use.type='button'; use.className='recent-use'; use.textContent='鐢ㄤ綔鍙傝€冪户缁紪杈?;
    foot.appendChild(count); foot.appendChild(use);
    var closeModal=function(){ document.removeEventListener('keydown',onKey); wrap.remove(); };
    var onKey=function(e){
      if(e.key==='Escape') closeModal();
      else if(e.key==='ArrowLeft') show(idx-1);
      else if(e.key==='ArrowRight') show(idx+1);
    };
    function show(i){
      if(i<0||i>=urls.length) return;
      idx=i;
      img.src=urls[idx];
      count.textContent=(idx+1)+' / '+urls.length;
      prev.disabled=idx<=0;
      next.disabled=idx>=urls.length-1;
    }
    wrap._close=closeModal;
    close.onclick=closeModal;
    wrap.onclick=function(e){ if(e.target===wrap) closeModal(); };
    box.onclick=function(e){ e.stopPropagation(); };
    prev.onclick=function(){ show(idx-1); };
    next.onclick=function(){ show(idx+1); };
    use.onclick=function(){ var url=urls[idx]; closeModal(); loadReferenceFromUrl(url); };
    box.appendChild(close); box.appendChild(prev); box.appendChild(img); box.appendChild(next); box.appendChild(foot);
    wrap.appendChild(box);
    document.addEventListener('keydown',onKey);
    document.body.appendChild(wrap);
    show(idx);
  }
  function loadHistory(){

      var items=d.items.slice(0,9);

  }

  function guessImageExt(type,url){
    var t=String(type||'').toLowerCase();
    if(t.indexOf('jpeg')>=0 || t.indexOf('jpg')>=0) return 'jpg';
    if(t.indexOf('webp')>=0) return 'webp';
    if(t.indexOf('gif')>=0) return 'gif';
    var clean=String(url||'').split('?')[0].split('#')[0];
    var m=clean.match(/\.([a-z0-9]{2,5})$/i);
    return m ? m[1].toLowerCase() : 'png';
  }
  async function downloadResultImage(){
