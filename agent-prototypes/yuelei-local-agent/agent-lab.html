<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>黄雀编导 Agent · 本地对话验收</title>
  <style>
    :root{color-scheme:dark;--bg:#070a10;--panel:#0d131e;--panel2:#121b29;--line:#253247;--gold:#f2c66d;--mint:#44d7bb;--text:#edf3fb;--muted:#91a0b5;--danger:#ff839d}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 15% 0,#182032 0,transparent 34%),radial-gradient(circle at 95% 15%,#1c1821 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
    .app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:auto 1fr;gap:18px;padding:22px;max-width:1500px;margin:auto}
    header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:rgba(13,19,30,.86);backdrop-filter:blur(18px)}
    h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:12px}.badge{padding:7px 11px;border-radius:999px;background:#302815;color:#ffd986;border:1px solid #5c4921;font-weight:700;white-space:nowrap}
    .model-connect{display:none;gap:8px;align-items:center}.model-connect input{width:220px;border:1px solid var(--line);border-radius:10px;background:#080d15;color:var(--text);padding:8px 10px}.model-connect button{border:1px solid #5b4929;color:#f8d992;background:#241f16;border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:700}.model-status{font-size:12px;color:#ffd986;white-space:nowrap}
    .header-actions,.customer-connect{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.customer-connect{padding-right:12px;border-right:1px solid var(--line)}.customer-connect button{border:1px solid #2f6f63;color:#9ff5df;background:#102923;border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:700}.customer-status{font-size:12px;color:#ffd986;white-space:nowrap}
    .chat,.inspect{border:1px solid var(--line);border-radius:20px;background:rgba(13,19,30,.9);overflow:hidden;min-height:0}.chat{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 126px)}
    .toolbar{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.toolbar b{font-size:16px}.safe{color:var(--mint);font-size:12px}.toolbar-actions{display:flex;gap:8px;align-items:center}
    .messages{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:11px 14px;border-radius:15px;white-space:pre-wrap}.assistant{align-self:flex-start;background:var(--panel2);border:1px solid #26364d}.user{align-self:flex-end;background:linear-gradient(135deg,#f2c66d,#daa542);color:#211707;font-weight:650}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}.chip,.mini{border:1px solid #5b4929;color:#f8d992;background:#241f16;border-radius:999px;padding:7px 11px;cursor:pointer}.mini{font-size:12px;padding:5px 9px}.offer{align-self:flex-start;max-width:82%;padding:13px 15px;border:1px solid #705c2c;border-radius:15px;background:#201b11}.offer button{margin-top:9px;border:0;border-radius:10px;background:var(--gold);color:#201607;font-weight:800;padding:9px 13px;cursor:pointer}.offer button:disabled{opacity:.55}
    .run-card{align-self:flex-start;width:min(82%,680px);padding:14px 15px;border:1px solid #2f6f63;border-radius:15px;background:#0d201d}.run-title{font-weight:800;color:#aef6e4}.run-state{margin-top:4px;color:var(--muted)}.run-card video{display:block;width:100%;max-height:460px;margin-top:11px;border-radius:12px;background:#05070a}.run-card a{display:inline-block;margin-top:10px;color:#9ff5df}.run-error{color:var(--danger)}
    .compose{border-top:1px solid var(--line);padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px}.compose textarea{resize:none;min-height:58px;max-height:140px;border:1px solid var(--line);border-radius:13px;background:#080d15;color:var(--text);padding:11px 13px;font:inherit;outline:none}.compose>button{border:0;border-radius:13px;background:var(--gold);color:#201607;font-weight:800;padding:0 22px;cursor:pointer}.compose button:disabled{opacity:.55}.upload-button{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:13px;background:#111a28;color:var(--text);padding:0 14px;cursor:pointer;font-weight:700}.attachment-tray{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}.attachment-tray:empty{display:none}.attachment-card{display:flex;gap:8px;align-items:center;border:1px solid #33445d;background:#111a28;border-radius:11px;padding:7px 9px;font-size:12px}.attachment-card span{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment-card button{border:1px solid #5b4929;color:#f8d992;background:#241f16;border-radius:8px;padding:4px 7px;cursor:pointer}
    .consent-row{grid-column:1/-1;display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#0a1019}.consent-row input{margin-top:4px}.consent-row strong{color:var(--text)}
    .inspect{height:calc(100vh - 126px);overflow:auto;padding:17px}.inspect h2{font-size:15px;margin:0 0 12px}.card{padding:13px;border:1px solid var(--line);border-radius:14px;background:#0a1019;margin-bottom:12px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{margin-top:5px}.list{margin:7px 0 0;padding-left:18px}.empty{color:var(--muted)}.problem{color:var(--danger)}
    .contract{font-size:12px;color:var(--muted)}.contract strong{color:var(--text)}
    @media(max-width:900px){.app{grid-template-columns:1fr;padding:12px}.chat,.inspect{height:auto}.chat{min-height:72vh}.inspect{grid-row:3}.badge{white-space:normal}}
  </style>
</head>
<body>
<div class="app">
  <header><div><h1>黄雀编导 Agent · 对话验收台</h1><div class="sub">客户登录后直接对话；生产动作必须经过素材授权、报价与点击确认</div></div><div class="header-actions"><div class="customer-connect"><span class="customer-status" id="customer-status">客户未登录</span><button id="customer-connect">登录测试账号</button></div><div class="model-connect"><span class="model-status" id="model-status">DeepSeek 未连接</span><input id="model-key" type="password" autocomplete="off" placeholder="输入 DeepSeek API Key"><button id="model-connect">连接模型</button></div></div></header>
  <section class="chat">
    <div class="toolbar"><b>连续对话</b><div class="toolbar-actions"><span class="safe">● 安全测试</span></div></div>
    <div class="messages" id="messages">
      <div class="msg assistant">你好，我是黄雀编导 Agent。你可以直接告诉我想制作什么，我会选择对应功能并提示缺少的信息。付费生产必须先报价，再由你点击确认按钮。</div>
      <div class="chips">
        <button class="chip">你会什么？</button><button class="chip">主题是东鹏特饮，核心卖点买三送一</button><button class="chip">帮我拆解一个视频</button><button class="chip">我想做数字人口播</button>
      </div>
    </div>
    <div class="compose"><div class="attachment-tray" id="attachment-tray"></div><label class="consent-row"><input id="material-consent" type="checkbox" disabled><span><strong>素材使用授权</strong>：我确认拥有所上传人物形象、声音及其他素材的合法使用权，并同意用于本次内容制作。新增或更换素材后需要重新确认。</span></label><label class="upload-button" id="upload-label" for="file-input">＋ 上传素材</label><input id="file-input" type="file" multiple hidden accept="image/jpeg,image/png,image/webp,audio/mpeg,audio/wav,audio/mp4,audio/aac,video/mp4,video/quicktime,video/webm"><textarea id="input" placeholder="请先登录测试账号" disabled></textarea><button id="send" disabled>发送</button></div>
  </section>
  <aside class="inspect">
    <h2>本轮判断</h2>
    <div class="card"><div class="label">识别目标</div><div class="value" id="intent">等待对话</div></div>
    <div class="card"><div class="label">选择能力</div><div class="value" id="capability">—</div></div>
    <div class="card"><div class="label">缺失参数</div><ul class="list" id="missing"><li class="empty">—</li></ul></div>
    <div class="card"><div class="label">建议下一步</div><div class="value" id="next">—</div></div>
    <div class="card"><div class="label">说话问题</div><ul class="list" id="problems"><li class="empty">本轮尚未检查</li></ul></div>
    <div class="card contract"><strong>能力边界</strong><br>可执行：功能查询、素材准备和无扣点报价。<br><br>付费生产：必须先获得真实报价，再点击价格确认按钮。发布和删除不会自动执行。</div>
  </aside>
</div>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),fileInput=document.getElementById('file-input'),attachmentTray=document.getElementById('attachment-tray'),modelStatus=document.getElementById('model-status'),modelKey=document.getElementById('model-key'),modelConnect=document.getElementById('model-connect'),customerStatus=document.getElementById('customer-status'),customerConnect=document.getElementById('customer-connect'),materialConsent=document.getElementById('material-consent'),uploadLabel=document.getElementById('upload-label');
const history=[],attachments=[],runCards=new Map();let csrfToken='',customerLoggedIn=false,runPollTimer=null;
function add(role,content){const node=document.createElement('div');node.className='msg '+role;node.textContent=content;messages.appendChild(node);messages.scrollTop=messages.scrollHeight;history.push({role,content});}
function list(id,items,empty){const node=document.getElementById(id);node.textContent='';(items.length?items:[empty]).forEach((text,i)=>{const li=document.createElement('li');li.textContent=text;if(!items.length)li.className='empty';node.appendChild(li);});}
function authFetch(url,options={}){const headers=new Headers(options.headers||{});if(csrfToken&&String(options.method||'GET').toUpperCase()!=='GET')headers.set('X-CSRF-Token',csrfToken);return fetch(url,{...options,headers});}
function setCustomerUI(loggedIn,name=''){customerLoggedIn=loggedIn;customerStatus.textContent=loggedIn?(name+' · 已登录'):'客户未登录';customerStatus.style.color=loggedIn?'#9ff5df':'#ffd986';customerConnect.textContent=loggedIn?'退出客户账号':'登录测试账号';input.disabled=!loggedIn;send.disabled=!loggedIn;fileInput.disabled=!loggedIn;materialConsent.disabled=!loggedIn;uploadLabel.style.opacity=loggedIn?'1':'.45';input.placeholder=loggedIn?'像客户一样说话；Enter 发送，Shift+Enter 换行':'请先登录测试账号';}
function runPhaseText(run){const phases={submitting_video:'正在提交视频生成',running:'正在生成视频',processing:'正在生成视频',result_pending:'视频已生成，正在整理文件',reconcile_pending:'正在核对任务状态'};return phases[run.phase]||phases[run.status]||'正在处理';}
function renderRun(run){const key=String(run.job_id);let card=runCards.get(key);if(!card){card=document.createElement('div');card.className='run-card';card.dataset.jobId=key;runCards.set(key,card);messages.appendChild(card);}card.textContent='';const title=document.createElement('div');title.className='run-title';title.textContent='任务 #'+key;const state=document.createElement('div');state.className='run-state';card.append(title,state);if(run.status==='succeeded'){state.textContent='视频已生成完成';if(run.result_url){const video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=run.result_url;const link=document.createElement('a');link.href=run.result_url;link.target='_blank';link.rel='noopener';link.textContent='打开或下载视频';card.append(video,link);}else{state.textContent='任务已完成，视频文件正在同步';}}else if(run.status==='failed'){state.classList.add('run-error');state.textContent='生成失败'+(run.error?'：'+run.error:'')+(run.refunded?'；已退还 '+run.cost+' 点':'；退款状态待确认');}else{state.textContent=runPhaseText(run)+'，完成后会自动显示在这里';}messages.scrollTop=messages.scrollHeight;}
async function pollRuns(){if(!customerLoggedIn)return;try{const response=await authFetch('/api/local-agent/runs');if(response.status===401){setCustomerUI(false);return;}const data=await response.json();if(!response.ok)throw new Error(data.detail||'任务状态读取失败');for(const run of data.runs||[])renderRun(run);}catch(error){console.warn('run poll failed',error);}}
function startRunPolling(){if(runPollTimer)clearInterval(runPollTimer);pollRuns();runPollTimer=setInterval(pollRuns,4000);}
async function refreshCustomer(){const data=await (await fetch('/api/local-agent/customer/status')).json();csrfToken=data.csrf_token||'';setCustomerUI(!!data.logged_in,data.user&&data.user.display_name||'');materialConsent.checked=!!data.material_consent;if(data.logged_in){if(attachments.length===0)await loadDefaultAttachments();startRunPolling();}return data;}
async function toggleCustomer(){customerConnect.disabled=true;try{if(customerLoggedIn){await fetch('/api/local-agent/customer/logout',{method:'POST'});location.reload();return;}const response=await fetch('/api/local-agent/customer/login',{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'登录失败');csrfToken=data.csrf_token||'';setCustomerUI(true,data.user&&data.user.display_name||'本地测试客户');add('assistant','测试客户已登录。你现在可以直接描述需求并上传素材。');await loadDefaultAttachments();startRunPolling();}catch(error){add('assistant','登录失败：'+error.message);}finally{customerConnect.disabled=false;}}
async function setMaterialConsent(accepted){const response=await authFetch('/api/local-agent/customer/consent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accepted,attachments:attachments.map(item=>item.attachment_id)})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'授权状态保存失败');materialConsent.checked=!!data.accepted;if(data.accepted)add('assistant','素材使用授权已记录，并绑定当前素材；更换素材后需要重新确认。');}
function renderAttachment(item){const card=document.createElement('div');card.className='attachment-card';card.dataset.id=item.attachment_id;const label=document.createElement('span');const prefix=item.default?'本地测试素材 · ':'';label.textContent=prefix+({image:'图片',audio:'音频',video:'视频'}[item.kind]||'文件')+' · '+item.name+(item.default?' · 仅本地':' · 已就绪');card.appendChild(label);if(!item.default){const upload=document.createElement('button');upload.textContent='上传素材';upload.onclick=async()=>{upload.disabled=true;upload.textContent='上传中';try{const response=await authFetch('/api/local-agent/material/cli-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attachment_id:item.attachment_id})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'当前未能完成素材上传，请稍后重试。');item.status='uploaded';label.textContent=prefix+({image:'图片',audio:'音频',video:'视频'}[item.kind]||'文件')+' · '+item.name+' · 已上传';upload.textContent='已上传';}catch(error){upload.disabled=false;upload.textContent='重新上传';add('assistant',error.message);}};card.appendChild(upload);}attachmentTray.appendChild(card);}
async function loadDefaultAttachments(){if(!customerLoggedIn)return;try{const response=await authFetch('/api/local-agent/material/defaults');const data=await response.json();if(!response.ok)throw new Error(data.detail||'测试素材加载失败');for(const item of data.items||[]){if(!attachments.some(value=>value.attachment_id===item.attachment_id)){attachments.push(item);renderAttachment(item);}}}catch(error){add('assistant','默认测试素材加载失败：'+error.message);}}
async function refreshModel(){try{const data=await (await fetch('/api/local-agent/model/status')).json();modelStatus.textContent=data.connected?'DeepSeek 已连接':'DeepSeek 未连接';modelStatus.style.color=data.connected?'#9ff5df':'#ffd986';modelConnect.textContent=data.connected?'断开模型':'连接模型';modelKey.hidden=!!data.connected;}catch(error){modelStatus.textContent='模型状态检测失败';}}
async function toggleModel(){if(modelConnect.disabled)return;modelConnect.disabled=true;try{const status=await (await fetch('/api/local-agent/model/status')).json();if(status.connected){await fetch('/api/local-agent/model/disconnect',{method:'POST'});add('assistant','DeepSeek 已断开，接下来使用本地规则回答。');}else{const key=modelKey.value.trim();if(!key)throw new Error('请先输入 DeepSeek API Key');modelConnect.textContent='连接中';const response=await fetch('/api/local-agent/model/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'连接失败');modelKey.value='';add('assistant','DeepSeek 已连接。接下来的对话将由模型理解和组织回答。');}}catch(error){add('assistant','模型连接失败：'+error.message);}finally{modelConnect.disabled=false;refreshModel();}}
async function stageFiles(files){if(!customerLoggedIn)return add('assistant','请先登录黄雀账号后上传素材。');for(const file of files){const form=new FormData();form.append('file',file,file.name);add('assistant','正在安全检查并暂存：'+file.name);try{const response=await authFetch('/api/local-agent/material/stage',{method:'POST',body:form});const data=await response.json();if(!response.ok)throw new Error(data.detail||'文件不符合要求');attachments.push(data);renderAttachment(data);materialConsent.checked=false;await setMaterialConsent(false);add('assistant','已收到'+file.name+'。新增素材后，请重新勾选素材使用授权；无需进入其他页面。');}catch(error){add('assistant','无法接收'+file.name+'：'+error.message);}}fileInput.value='';}
function showCli(){}
function addOffer(offer){const card=document.createElement('div');card.className='offer';const text=document.createElement('div');text.textContent='本次生成报价：'+offer.cost+' 点。点击后会提交付费任务。';const button=document.createElement('button');button.textContent='确认并扣 '+offer.cost+' 点';button.onclick=async()=>{button.disabled=true;button.textContent='提交中';try{const response=await authFetch('/api/local-agent/cli/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offer_id:offer.offer_id})});const data=await response.json();if(!response.ok){add('assistant',data.detail||'任务未提交，请重新获取报价。');button.textContent=data.status==='rejected'?'未提交':'状态待核对';return;}add('assistant','任务已提交'+(data.job_id?'，任务号：'+data.job_id:'')+'。完成后视频会自动回到当前对话，刷新或重新打开也能恢复。');button.textContent='已提交';await pollRuns();}catch(error){add('assistant','暂时无法核对提交结果。系统不会自动重试，请稍后查看任务记录。');button.textContent='状态待核对';}};card.append(text,button);messages.appendChild(card);messages.scrollTop=messages.scrollHeight;}
async function submit(value){value=String(value||input.value).trim();if(!customerLoggedIn)return add('assistant','请先登录黄雀账号后继续。');if(!value||send.disabled)return;input.value='';add('user',value);send.disabled=true;send.textContent='处理中';try{const response=await authFetch('/api/local-agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:value,history:history.slice(-12),attachments:attachments.map(item=>item.attachment_id)})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'请求失败');add('assistant',data.reply);if(data.offer)addOffer(data.offer);const a=data.analysis||{};document.getElementById('intent').textContent=a.intent||'未知';document.getElementById('capability').textContent=a.capability||'—';document.getElementById('next').textContent=a.next_step||'—';list('missing',a.missing||[],'没有检测到缺失项');list('problems',a.speech_problems||[],'未发现规则可识别的问题');showCli(a.cli);}catch(error){add('assistant',error.message);}finally{send.disabled=!customerLoggedIn;send.textContent='发送';input.focus();}}
send.onclick=()=>submit();input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit();}});fileInput.onchange=()=>stageFiles([...fileInput.files]);materialConsent.onchange=async()=>{try{await setMaterialConsent(materialConsent.checked);}catch(error){materialConsent.checked=!materialConsent.checked;add('assistant',error.message);}};customerConnect.onclick=toggleCustomer;modelConnect.onclick=toggleModel;document.querySelectorAll('.chip').forEach(button=>button.onclick=()=>submit(button.textContent));if(new URLSearchParams(location.search).get('admin')==='1')document.querySelector('.model-connect').style.display='flex';refreshCustomer().catch(error=>add('assistant','客户状态读取失败：'+error.message));refreshModel();
</script>
</body>
</html>
