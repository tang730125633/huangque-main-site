log_format huangque_observed '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                               'rt=$request_time rid=$request_id hq=$sent_http_x_hq_error_code';
limit_req_zone $binary_remote_addr zone=hq_cli_upload_rate:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=hq_cli_upload_conn:10m;

server {
    server_tokens off;
    server_name huangquechuanmei.com www.huangquechuanmei.com;

    root /var/www/huangquechuanmei;
    index index.html;
    charset utf-8;

    # 阶段性 CSP：保留现有内联脚本/样式，先封住外部脚本、object 与 base 注入。
    # ponytail: https: 媒体/连接兼容现有 COS 与采集 CDN 回退，来源稳定后再收紧域名。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $request_id always;

    access_log /var/log/nginx/huangquechuanmei.access.log huangque_observed;
    error_log  /var/log/nginx/huangquechuanmei.error.log;

    # 主站 IP12 使用 Git 管理的 Hermes Flask；其他工作台与 API 保持不变。
    location = /workbench/ip12 { return 301 /workbench/ip12/; }
    location ^~ /workbench/ip12/ {
        proxy_pass http://127.0.0.1:3102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /workbench/ip12;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 200m;

        # 原版模板和 JSON 使用根绝对路径；只改已知内部路由，避免误改对话正文和“/12”进度文本。
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter '"/api/' '"/workbench/ip12/api/';
        sub_filter "'/api/" "'/workbench/ip12/api/";
        sub_filter '`/api/' '`/workbench/ip12/api/';
        sub_filter '"/media/' '"/workbench/ip12/media/';
        sub_filter "'/analytics'" "'/workbench/ip12/analytics'";
        sub_filter "'/classic'" "'/workbench/ip12/classic'";
        sub_filter "'/skills'" "'/workbench/ip12/skills'";
        sub_filter 'href="/agnes-lab"' 'href="/workbench/ip12/agnes-lab"';
        sub_filter 'href="/video-factory"' 'href="/workbench/ip12/video-factory"';
        sub_filter 'href="/"' 'href="/workbench/ip12/"';
    }

    # Hermes IP12 历史版临时预览：复用团队 Basic Auth，避免旧数据和生成接口裸露公网。
    location = /hermes-ip12 { return 301 /hermes-ip12/; }
    location ^~ /hermes-ip12/ {
        auth_basic "Hermes IP12（团队预览）";
        auth_basic_user_file /etc/nginx/.htpasswd-hq;
        proxy_pass http://127.0.0.1:3102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /hermes-ip12;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 200m;

        # 原版模板和 JSON 使用根绝对路径；只改已知内部路由，避免误改内容文本。
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter '"/api/' '"/hermes-ip12/api/';
        sub_filter "'/api/" "'/hermes-ip12/api/";
        sub_filter '`/api/' '`/hermes-ip12/api/';
        sub_filter '"/media/' '"/hermes-ip12/media/';
        sub_filter "'/analytics'" "'/hermes-ip12/analytics'";
        sub_filter "'/classic'" "'/hermes-ip12/classic'";
        sub_filter "'/skills'" "'/hermes-ip12/skills'";
        sub_filter 'href="/agnes-lab"' 'href="/hermes-ip12/agnes-lab"';
        sub_filter 'href="/video-factory"' 'href="/hermes-ip12/video-factory"';
        sub_filter 'href="/"' 'href="/hermes-ip12/"';
    }

    # 认证服务（独立 8095）
    location = /api/gen/dl {
        proxy_pass http://127.0.0.1:8097;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/gen/collect {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
    location = /api/gen/collect/search {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
    location = /api/gen/leads {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }

    location = /api/gen/banana/health {
        proxy_pass http://127.0.0.1:8101;
    }
    location = /api/gen/banana {
        proxy_pass http://127.0.0.1:8101;
        proxy_read_timeout 200s;
        client_max_body_size 80m;
    }
    # 提示词反推：也在 imggen(8101) 上，须精确路由，否则会落到下面 ^~ /api/gen/ → content(8096) 404
    location = /api/gen/reverse {
        proxy_pass http://127.0.0.1:8101;
        client_max_body_size 20m;      # 反推走 base64 图(≤8MB)，默认 1m 会 413
        proxy_read_timeout 90s;
    }

    location ^~ /api/gen/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 320s;
        proxy_buffering off;
        client_max_body_size 80m;
    }

    # 内部点数和管理员接口只允许服务经 127.0.0.1:8095 直连。
    location = /api/auth/points { return 404; }
    location = /api/auth/points/deduct { return 404; }
    location = /api/auth/points/refund { return 404; }
    location = /api/auth/membership/voice-slot-entitlement { return 404; }
    location = /api/auth/admin/points/adjust { return 404; }
    location = /api/auth/admin/points/audit { return 404; }
    location = /api/auth/admin/users { return 404; }
    location = /api/auth/admin/password/reset { return 404; }
    location = /api/auth/admin/recharge/review { return 404; }
    location = /api/auth/admin/recharge/orders { return 404; }

    # CLI 图片使用独立原始字节通道；认证服务按账号和 scope 转发，控制面 JSON 仍保持小体积。
    location = /api/auth/cli/image-upload {
        limit_req zone=hq_cli_upload_rate burst=8 nodelay;
        limit_conn hq_cli_upload_conn 2;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 90s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 10m;
        client_body_timeout 20s;
    }

    # CLI 动作会在认证服务内串联 AI 或内容服务，等待时间与 IP12 非流式对话一致；内部密钥仍由边界清空。
    location = /api/auth/cli/action {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 300s;
    }

    location = /api/auth/card/media {
        limit_req zone=hq_cli_upload_rate burst=8 nodelay;
        limit_conn hq_cli_upload_conn 2;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 90s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 30m;
        client_body_timeout 90s;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
    }

    # 邀请注册与邀请中心接口同样由认证服务处理，必须放在通用 /api/ 之前。
    location ^~ /api/invite/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        client_max_body_size 200m;
    }

    # 获客后端 API（leadgen :8090）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # 老 leadgen 完整工具台
    location ^~ /leadgen/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # 干净 URL：/login → login.html；/ → index.html（不经 index 跳转，避免撞 .html 301）
    location ^~ /api-admin {
        auth_basic "黄雀 API 管理台（团队）";
        auth_basic_user_file /etc/nginx/.htpasswd-hq;
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ^~ /api-docs {
        auth_basic "黄雀 API 文档（团队）";
        auth_basic_user_file /etc/nginx/.htpasswd-hq;
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ^~ /admin-console {
        try_files $uri $uri/ /admin/index.html =404;
    }

    location = / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        # nginx 遇到 location 级 add_header 后不继承 server 级响应头，需同步声明。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 直接访问 *.html 一律 301 到无扩展名干净 URL
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~* \.(webp|png|jpe?g|gif|mp4|css|js|json|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/huangquechuanmei.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/huangquechuanmei.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    server_tokens off;
    if ($host = www.huangquechuanmei.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = huangquechuanmei.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name huangquechuanmei.com www.huangquechuanmei.com;
    return 404; # managed by Certbot
}
