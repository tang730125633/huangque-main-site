server {
    server_name huangquechuanmei.com www.huangquechuanmei.com;

    root /var/www/huangquechuanmei;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/huangquechuanmei.access.log;
    error_log  /var/log/nginx/huangquechuanmei.error.log;

    # 认证服务（独立 8095）
    location = /api/gen/dl {
        proxy_pass http://127.0.0.1:8097;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/gen/collect {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
    location = /api/gen/collect/search {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
    location = /api/gen/leads {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }

    location = /api/gen/banana/health {
        proxy_pass http://127.0.0.1:8101;
    }
    location = /api/gen/banana {
        proxy_pass http://127.0.0.1:8101;
        proxy_read_timeout 200s;
    }

    location ^~ /api/gen/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 320s;
        proxy_buffering off;
        client_max_body_size 80m;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
    }

    # 获客后端 API（leadgen :8090）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # 老 leadgen 完整工具台
    location ^~ /leadgen/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # 干净 URL：/login → login.html；/ → index.html（不经 index 跳转，避免撞 .html 301）
    location ^~ /api-admin {
        auth_basic "黄雀 API 管理台（团队）";
        auth_basic_user_file /etc/nginx/.htpasswd-hq;
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ^~ /api-docs {
        auth_basic "黄雀 API 文档（团队）";
        auth_basic_user_file /etc/nginx/.htpasswd-hq;
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ^~ /admin-console {
        try_files $uri $uri/ /admin/index.html =404;
    }

    location = / {
        add_header Cache-Control "no-store" always;
        return 302 /workbench/inspiration;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 直接访问 *.html 一律 301 到无扩展名干净 URL
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~* \.(webp|png|jpe?g|gif|mp4|css|js|json|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/huangquechuanmei.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/huangquechuanmei.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.huangquechuanmei.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = huangquechuanmei.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name huangquechuanmei.com www.huangquechuanmei.com;
    return 404; # managed by Certbot
}
