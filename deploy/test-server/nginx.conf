server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.138.143.64 _;

    root /opt/huangque-test-server/site;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;

    access_log /var/log/nginx/huangque-test.access.log;
    error_log /var/log/nginx/huangque-test.error.log;

    location = /api/auth/points/deduct { return 404; }
    location = /api/auth/points/refund { return 404; }
    location = /api/auth/admin/points/adjust { return 404; }
    location = /api/auth/admin/points/audit { return 404; }
    location = /api/auth/admin/users { return 404; }
    location = /api/auth/admin/recharge/review { return 404; }
    location = /api/auth/admin/recharge/orders { return 404; }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
        client_max_body_size 8m;
    }

    location = /api/gen/dl {
        proxy_pass http://127.0.0.1:8097;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/gen/collect {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }

    location = /api/gen/collect/search {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }

    location = /api/gen/leads {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }

    location = /api/gen/banana/health {
        proxy_pass http://127.0.0.1:8101;
    }

    location = /api/gen/banana {
        proxy_pass http://127.0.0.1:8101;
        proxy_read_timeout 200s;
        client_max_body_size 20m;
    }

    location = /api/gen/reverse {
        proxy_pass http://127.0.0.1:8101;
        proxy_read_timeout 90s;
        client_max_body_size 20m;
    }

    location ^~ /api/gen/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 320s;
        proxy_buffering off;
        client_max_body_size 80m;
    }

    location ^~ /admin/ {
        include /etc/nginx/snippets/huangque-admin-allowlist.conf;
        try_files $uri $uri/ /admin/index.html =404;
    }

    location ^~ /api/admin/ {
        include /etc/nginx/snippets/huangque-admin-allowlist.conf;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HQ-Internal-Token "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
        client_max_body_size 8m;
    }

    location = / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
        return 302 /workbench/inspiration;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~* \.(webp|png|jpe?g|gif|mp4|css|js|json|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
    }
}
