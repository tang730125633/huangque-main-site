# Versioned fail-closed gate for the digital-human v2 runtime. Install this
# file and the locked script before restarting huangque-content.service.
[Service]
Environment=DIGITAL_HUMAN_LOCAL_MATERIAL_LIBRARY_ROOT=/home/ubuntu/material-libraries/huangque-media
ExecStartPre=/usr/bin/python3 /home/ubuntu/content-api/scripts/digital_human_v2_release_preflight.py
