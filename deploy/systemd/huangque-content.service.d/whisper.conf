# huangque-content 的 whisper 配置（F4 口播字幕用）
# 服务器落地路径：/etc/systemd/system/huangque-content.service.d/whisper.conf
# 部署后：sudo systemctl daemon-reload && sudo systemctl restart huangque-content
#
# 为什么这么配（2026-07-04）：
# - 生产服务用户 ubuntu 已在 Hugging Face 默认缓存中完整缓存 small。
# - 固定使用该现有缓存，并强制离线（HF_HUB_OFFLINE=1），禁止发布时联网下载。
# - 生产已安装且通过 zh-cn 字形声明的字体名是 Noto Sans SC。
[Service]
Environment=WHISPER_MODEL=small
Environment=WHISPER_DEVICE=cpu
Environment=WHISPER_COMPUTE_TYPE=int8
Environment=WHISPER_CACHE_DIR=/home/ubuntu/.cache/huggingface/hub
Environment="SUBTITLE_FONT=Noto Sans SC"
Environment=HF_HUB_OFFLINE=1
