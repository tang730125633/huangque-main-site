# Included inside the zelong.huangquechuanmei.com TLS server block.
# Agent credentials stay out of access logs; the admin feed is limited to the production host.
location ^~ /komari-agent/api/clients/ {
    access_log off;
    proxy_pass http://127.0.0.1:25774/api/clients/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
}

location ^~ /komari-agent/ {
    return 404;
}

location = /komari-admin/api/nodes {
    allow 129.204.166.13;
    allow 8.134.144.132;
    allow 127.0.0.1;
    deny all;
    access_log off;
    proxy_pass http://127.0.0.1:25774/api/nodes;
}

location ~ ^/komari-admin(/api/recent/[0-9a-f-]{36})$ {
    allow 129.204.166.13;
    allow 8.134.144.132;
    allow 127.0.0.1;
    deny all;
    access_log off;
    rewrite ^/komari-admin(/api/recent/[0-9a-f-]{36})$ $1 break;
    proxy_pass http://127.0.0.1:25774;
}

location /komari-admin/ {
    return 404;
}
