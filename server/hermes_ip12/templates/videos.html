<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频脚本生成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:#e5e5e5;font-family:PingFang SC,Microsoft YaHei,sans-serif;padding:20px;max-width:900px;margin:0 auto}
h1{font-size:22px;margin:20px 0;text-align:center}
.video-card{background:#171717;border:1px solid #262626;border-radius:10px;padding:16px;margin:16px 0;display:flex;gap:16px}
.video-card img{width:180px;height:240px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#111}
.video-info{flex:1}
.video-info h3{font-size:16px;color:#a78bfa;margin-bottom:8px}
.video-info .prompt{font-size:12px;color:#737373;background:#0a0a0a;padding:8px;border-radius:6px;margin:8px 0;word-break:break-all}
.video-info .tools{font-size:11px;color:#4ade80;margin:6px 0}
.video-info .script{font-size:13px;color:#e5e5e5;background:#0a0a0a;padding:10px;border-radius:6px;margin:8px 0;white-space:pre-wrap;max-height:200px;overflow-y:auto}
.copy-btn{background:#a78bfa;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;margin:4px}
.copy-btn:hover{opacity:0.8}
.spinner{width:40px;height:40px;border:3px solid #262626;border-top-color:#a78bfa;border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
input{padding:10px;background:#1a1a1a;border:1px solid #262626;color:#e5e5e5;border-radius:6px;width:300px;font-size:14px}
button.go{padding:10px 20px;background:#a78bfa;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.toolbar{text-align:center;margin:20px 0}
</style>
</head>
<body>
<h1>🎬 视频脚本 + 即梦提示词</h1>
<div class="toolbar">
  <input id="topic" value="美业拓客" placeholder="输入主题...">
  <button class="go" onclick="generate()">生成</button>
</div>
<div id="status"><div class="spinner"></div><p style="color:#737373;text-align:center">正在生成...</p></div>
<div id="results"></div>

<script>
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function safeUrl(s){s=String(s||'').trim();return s.startsWith('/')||/^https?:\/\//i.test(s)?s:''}
function copy(text) {
  navigator.clipboard.writeText(text).then(function(){
    alert('已复制到剪贴板');
  });
}
function generate(topic) {
  topic = topic || document.getElementById('topic').value;
  document.getElementById('status').style.display='block';
  document.getElementById('results').innerHTML='';
  fetch('/api/module8-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic})})
  .then(function(r){return r.json()})
  .then(function(data){
    document.getElementById('status').style.display='none';
    if(!data.ok||!data.videos){document.getElementById('results').innerHTML='<p style=color:#ef4444>生成失败</p>';return;}
    var html='';
    data.videos.forEach(function(v){
      html+='<div class="video-card">';
      html+='<img src="'+esc(safeUrl(v.preview))+'" onerror="this.style.display=\'none\'">';
      html+='<div class="video-info">';
      html+='<h3>'+esc(v.name)+'</h3>';
      html+='<div class="prompt">'+esc(v.prompt)+'</div>';
      html+='<div class="tools">📋 推荐工具：'+(v.tools||[]).map(esc).join(' / ')+'</div>';
      html+='<div class="script">'+esc(v.script)+'</div>';
      html+='<button class="copy-btn" onclick="copy(this.previousElementSibling.previousElementSibling.textContent)">📋 复制提示词</button>';
      html+='<button class="copy-btn" onclick="copy(this.parentElement.querySelector(\'.script\').textContent)">📝 复制脚本</button>';
      html+='</div></div>';
    });
    document.getElementById('results').innerHTML=html;
  });
}
generate('美业拓客');
</script>
</body>
</html>
