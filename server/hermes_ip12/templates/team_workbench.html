<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>团队协作工作台 V2 - 极简版</title>
<style>
:root{--bg:#070a0f;--panel:#101722;--line:#263447;--text:#e8eef7;--dim:#91a0b4;--green:#44d19d;--blue:#57a6ff;--yellow:#f6c65b;--red:#ff6b6b;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#1e2550,#070a0f 55%);color:var(--text);font-family:"Microsoft YaHei",Arial,sans-serif}.wrap{display:grid;grid-template-columns:340px 1fr;gap:14px;min-height:100vh;padding:16px}.pane{background:rgba(16,23,34,.95);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025)}h1{font-size:19px;margin:0 0 6px}.sub{font-size:12px;color:var(--dim);line-height:1.55}.box{padding:16px}.task{padding:12px;border:1px solid var(--line);background:#090e15;border-radius:12px;margin-bottom:10px}.tag,.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;color:var(--dim);margin:2px}.tag{color:var(--green);border:0;padding:0}.pill.a{border-color:rgba(68,209,157,.5);color:var(--green)}.pill.b{border-color:rgba(246,198,91,.5);color:var(--yellow)}.pill.c{border-color:rgba(255,107,107,.5);color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#0c121b;color:var(--dim);cursor:pointer}.tab.active{border-color:var(--green);color:var(--green);background:rgba(68,209,157,.08)}label{display:block;font-size:12px;color:#c4d0e2;margin:10px 0 6px}input,select,textarea{width:100%;background:#090e15;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;font-size:14px}textarea{min-height:92px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--blue)}.btn{border:1px solid rgba(255,255,255,.1);background:#121b27;color:var(--text);padding:10px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:linear-gradient(135deg,#1c8f67,#246bff);border:0}.btn.warn{border-color:rgba(246,198,91,.5);color:var(--yellow)}.btn.bad{border-color:rgba(255,107,107,.5);color:var(--red)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.status,.std{white-space:pre-wrap;font-size:12px;color:var(--dim);line-height:1.6;background:#090e15;border:1px solid var(--line);border-radius:12px;padding:10px}.sectionTitle{font-size:15px;margin:16px 0 8px;color:var(--green);font-weight:700}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.card{border:1px solid var(--line);background:#090e15;border-radius:12px;padding:10px;margin:8px 0}.small{font-size:12px;color:var(--dim);line-height:1.55}.preview img,.preview video{max-width:100%;max-height:220px;border-radius:10px;margin-top:6px}.ok{color:var(--green)}.badText{color:var(--red)}.videoTable{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.videoTable th,.videoTable td{border:1px solid var(--line);padding:6px;vertical-align:top}.videoTable th{color:#c4d0e2;background:#0c121b}.videoTable input,.videoTable select,.videoTable textarea{font-size:12px;padding:6px;border-radius:6px;min-width:88px}.videoTable textarea{min-height:42px;min-width:140px}.statsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.statCard{border:1px solid var(--line);background:#090e15;border-radius:10px;padding:10px}.statNum{font-size:20px;color:var(--green);font-weight:700}.wide{overflow-x:auto}.splitTitle{margin-top:14px;color:#c4d0e2;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}.modal-overlay.hidden{display:none}.modal{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:16px;max-width:760px;width:100%;max-height:86vh;overflow-y:auto;padding:22px}.modal h2{margin:0 0 14px;color:var(--green);font-size:18px}.close{float:right;background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-item,.detail-full{background:#090e15;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}.detail-item .label,.detail-full .label{font-size:11px;color:var(--dim);margin-bottom:4px}.detail-item .value,.detail-full .value{font-size:14px;color:var(--text);white-space:pre-wrap;word-break:break-all}.review-section{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.clickable{cursor:pointer;transition:border-color .2s}.clickable:hover{border-color:var(--blue)}.pill.mt{border-color:rgba(87,166,255,.5);color:var(--blue)}.pill.track{border-color:rgba(167,139,250,.5);color:var(--purple)}
</style>
</head>
<body>
<div class="wrap">
<section class="pane"><div class="head"><h1>团队协作工作台 V2</h1><div class="sub">极简版：员工只做三件事：交内容、填视频数据、写今日总结。老板看团队看板和审核素材库。</div></div><div class="box"><div id="status" class="status">加载中...</div><h1 style="margin-top:16px">今日流程</h1><div class="task"><span class="tag">员工</span><br><b>上午：</b>内容提交<br><b>下午/晚上：</b>视频数据<br><b>收工前：</b>今日总结</div><div class="task"><span class="tag">老板/管理员</span><br><b>每天看：</b>团队看板、审核素材库<br><b>目标：</b>找出A类标题、封面、选题、账号、失败原因。</div><div id="tasks"></div><div class="toolbar"><button class="btn" onclick="loadAll()">刷新数据</button><a class="btn" href="/api/team-workbench/export.csv" target="_blank">导出全部提交</a><a class="btn" href="/api/team-workbench/video-items.csv" target="_blank">导出视频数据</a></div><div class="std" style="margin-top:14px"><strong>规则：</strong><br>1. 文案/图片/视频/截图统一交到“内容提交”。<br>2. 单条视频数据只填“视频数据”。<br>3. 每日复盘只回答三问，不再重复填链接和数据。<br>4. A/B/C集中在审核素材库里看。</div></div></section>
<section class="pane"><div class="head"><h1>员工区 / 老板区</h1><div class="sub">把重复入口合并，减少小白选择成本。</div></div><div class="box"><div class="tabs"><button class="tab active" data-mode="content_submit">内容提交</button><button class="tab" data-mode="video_data_table">视频数据</button><button class="tab" data-mode="daily_summary">今日总结</button><button class="tab" data-mode="dashboard">团队看板</button><button class="tab" data-mode="admin">审核素材库</button><button class="tab" data-mode="tools">工具实验室</button></div><div id="standard" class="std"></div><div id="formBox"></div><div id="adminBox" class="hidden"><div class="toolbar"><button class="btn" onclick="loadSubmissions()">刷新提交</button><button class="btn primary" onclick="autoClassifyAll()">一键自动初分</button><select id="filterType" onchange="loadSubmissions()"><option value="">全部类型</option></select><select id="filterMaterial" onchange="loadSubmissions()"><option value="">全部形态</option><option value="short_video">短视频</option><option value="image">图片</option><option value="copywriting">文案</option><option value="other">其他</option></select><select id="filterTrack" onchange="loadSubmissions()"><option value="">全部赛道</option><option value="beauty">美业</option><option value="direct_sales">直销</option><option value="local_life">本地生活</option><option value="ai">AI</option><option value="other">其他</option></select><select id="filterLabel" onchange="loadSubmissions()"><option value="">全部标签</option><option>A</option><option>B</option><option>C</option></select><select id="filterReview" onchange="loadSubmissions()"><option value="">全部状态</option><option value="pending_review">待审核</option><option value="approved">已审核</option><option value="risk_only">仅内部参考</option></select></div><div id="submissions" class="cards" style="margin-top:12px"></div></div></div></section>
</div>
<div id="reviewModal" class="modal-overlay hidden"><div class="modal"><button class="close" onclick="closeReviewModal()">&times;</button><h2>审核素材详情 / 三层分类</h2><div id="reviewDetail"></div><div class="review-section"><div class="grid"><div><label>第一步：素材形态</label><select id="reviewMaterialType"><option value="short_video">短视频</option><option value="image">图片</option><option value="copywriting">文案</option><option value="other">其他</option></select></div><div><label>第二步：业务赛道（老板手动定）</label><select id="reviewBusinessTrack"><option value="beauty">美业赛道</option><option value="direct_sales">直销赛道</option><option value="local_life">本地生活赛道</option><option value="ai">AI赛道</option><option value="other">其他赛道</option></select></div></div><div class="grid"><div><label>第三步：A/B/C</label><select id="reviewLabel"><option value="A">A 入库</option><option value="B">B 待优化</option><option value="C">C 淘汰/风险</option></select></div><div><label>审核状态</label><select id="reviewStatus"><option value="approved">已审核</option><option value="pending_review">待审核</option><option value="risk_only">仅内部参考</option></select></div></div><label>审核人</label><input id="reviewer" placeholder="填写审核人"><label>审核备注</label><textarea id="reviewNotes" placeholder="为什么这样分？怎么用？风险是什么？"></textarea><div class="toolbar"><button class="btn primary" id="reviewSaveBtn" onclick="saveReview()">保存审核</button><button class="btn" onclick="closeReviewModal()">取消</button></div><div id="reviewMsg" class="status" style="margin-top:10px;display:none"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);let mode='content_submit',statusData={},uploadedFiles=[],submissionsCache=[],currentReviewId=null;
const standards={content_submit:`<strong>内容提交：</strong><br>员工所有文案、图片、视频、截图、封面、评论、客户原话都放这里。不再区分“真实文案上传/文案评分/素材上传”。提交后老板或系统再做A/B/C和入库。`,video_data_table:`<strong>视频数据：</strong><br>一行=一条视频。按抖音/视频号/小红书/快手 → 账号 → 视频 → 数据记录，系统自动统计平台、账号、Top视频。`,daily_summary:`<strong>今日总结：</strong><br>每天收工前只回答三问：今天最好的一件事、最大问题、明天重点改什么。不要重复填视频链接和播放数据。`,dashboard:`<strong>团队看板：</strong><br>老板看今日总提交、视频总数、播放、互动、私信、A/B/C和Top视频。`,admin:`<strong>审核素材库：</strong><br>集中查看所有提交，筛A/B/C，A类自动写入库。`,tools:`<strong>工具实验室：</strong><br>跳转 Agnes、Zelong、AI图片/视频测试页。`};
const fields={content_submit:[['content_kind','内容类型','文案/图片/视频/封面/截图/评论/客户原话/竞品/AI结果'],['target_scene','用途场景','抖音/视频号/小红书/快手/朋友圈/私域/课程/海报'],['topic','主题/选题',''],['content_text','文案/原文/说明','能粘就粘原文，不要只写“见附件”'],['source_url','来源链接','抖音/小红书/官网/文章链接，没有可空'],['source_note','来源说明','微信群/客户聊天/同行朋友圈/抖音评论/自己原创/AI生成'],['best_part','最值得复用的地方','好标题/好开头/好封面/好评论/好结构'],['problem_part','问题或风险','版权/隐私/水印/太空/不像大鹏/不适合美业'],['need_help','需要老板/AI判断什么','比如：能不能发？怎么改？适合哪个平台？']],daily_summary:[['best_today','今天做得最好的一件事','不要写流水账，写最有价值的一件事'],['biggest_problem','今天最大问题','例如：封面弱、开头太平、账号没发满、私信少'],['tomorrow_focus','明天重点改什么','只写1-3个动作'],['need_support','需要老板/系统支持什么','没有可空'] ]};
const bigFields=new Set(['content_text','source_note','best_part','problem_part','need_help','best_today','biggest_problem','tomorrow_focus','need_support']);
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||JSON.stringify(j));return j;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(s){s=String(s??'').trim();return s.startsWith('/')||/^https?:\/\//i.test(s)?s:''}
function gradeClass(s){return /^[ABC]$/i.test(String(s||''))?String(s).toLowerCase():'b'}
const mtName={short_video:'短视频',image:'图片',copywriting:'文案',other:'其他'};const trName={beauty:'美业',direct_sales:'直销',local_life:'本地生活',ai:'AI',other:'其他'};
function renderForm(){uploadedFiles=[];$('adminBox').classList.toggle('hidden',mode!=='admin');$('formBox').classList.toggle('hidden',mode==='admin');$('standard').innerHTML=standards[mode]||'';if(mode==='admin'){loadSubmissions();return}if(mode==='video_data_table'){renderVideoDataTable();return}if(mode==='dashboard'){renderDashboard();return}if(mode==='tools'){renderTools();return}let submitType=mode;let defaultRole=mode==='daily_summary'?'今日总结':'内容提交';let html=`<div class="grid"><div><label>提交人</label><input id="member" placeholder="填写名字"></div><div><label>角色/小组</label><input id="role" value="${defaultRole}"></div></div><div class="grid"><div><label>A/B/C 标签</label><select id="label"><option value="B">B 有潜力，待优化</option><option value="A">A 直接入库</option><option value="C">C 失败/风险案例</option></select></div><div><label>审核状态</label><select id="review_status"><option value="pending_review">待审核</option><option value="approved">已审核</option><option value="risk_only">仅内部参考</option></select></div></div><label>总备注</label><input id="notes" placeholder="一句话总结">`;if(mode==='content_submit')html+=`<div class="sectionTitle">上传文件/截图</div><div class="small">可上传图片、视频、截图、PDF/文档。上传后显示预览和保存地址。</div><input id="fileInput" type="file" multiple accept="image/*,video/*,.pdf,.txt,.md,.doc,.docx"><div class="toolbar"><button class="btn" onclick="uploadFiles()" type="button">上传并预览</button></div><div id="uploadList" class="preview"></div>`;html+=`<div class="sectionTitle">填写资料</div>`;for(const f of fields[mode]||[]){html+=`<label>${f[1]}</label>${bigFields.has(f[0])?`<textarea id="f_${f[0]}" placeholder="${f[2]||''}"></textarea>`:`<input id="f_${f[0]}" placeholder="${f[2]||''}">`}`}html+=`<div class="toolbar"><button class="btn primary" id="submitBtn" onclick="submitForm('${submitType}')">提交</button><button class="btn" onclick="renderForm()">清空重填</button></div><div id="submitMsg" class="status" style="margin-top:12px">等待提交...</div>`;$('formBox').innerHTML=html;}
async function uploadFiles(){const inp=$('fileInput');if(!inp.files.length)return alert('请先选择文件');const fd=new FormData();for(const f of inp.files)fd.append('files',f);const r=await fetch('/api/team-workbench/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok||!j.ok){alert(j.error||'上传失败');return}uploadedFiles=uploadedFiles.concat(j.files||[]);renderUploadList();}
function renderUploadList(){$('uploadList').innerHTML=uploadedFiles.map(f=>{const u=esc(safeUrl(f.url));let media=f.category==='videos'?`<video controls src="${u}"></video>`:(f.category==='images'?`<img src="${u}">`:`<div class="card">文件：<a href="${u}" target="_blank">${esc(f.original_name)}</a></div>`);return `<div class="card">${media}<div class="small">网页地址：${esc(location.origin+safeUrl(f.url))}<br>本地地址：${esc(f.path)}<br>${esc(f.bytes)} bytes</div></div>`}).join('')}
async function submitForm(submitType){const btn=$('submitBtn');btn.disabled=true;try{const payload={};for(const f of fields[mode]||[])payload[f[0]]=$('f_'+f[0]).value;if(uploadedFiles[0]){payload.result_url=uploadedFiles[0].url;payload.local_path=uploadedFiles[0].path}const j=await api('/api/team-workbench/submit',{type:submitType,member:$('member').value,role:$('role').value,label:$('label').value,review_status:$('review_status').value,notes:$('notes').value,payload,files:uploadedFiles});$('submitMsg').innerHTML=`<span class="ok">提交成功</span>：${esc(j.item.id)}<br>保存文件：${esc(statusData.submissions_path)}`;loadAll(false)}catch(e){$('submitMsg').innerHTML=`<span class="badText">提交失败：</span>${esc(e.message)}`}finally{btn.disabled=false}}
function renderPreview(x){const files=x.files||[];const p=x.payload||{};let arr=files.length?files:[p.result_url?{url:p.result_url,path:p.local_path,category:/mp4|video/.test(p.result_url)?'videos':'images'}:null].filter(Boolean);return `<div class="preview">${arr.map(f=>{const raw=safeUrl(f.url),u=esc(raw);if((f.category||'').includes('video')||/\.mp4|\.mov|\.webm/.test(raw))return `<video controls src="${u}"></video>`;if((f.category||'').includes('image')||/\.png|\.jpg|\.jpeg|\.webp|\.gif/.test(raw))return `<img src="${u}">`;return `<div class="card"><a href="${u}" target="_blank">${esc(f.original_name||raw)}</a></div>`}).join('')}</div>`}
async function loadSubmissions(){const type=$('filterType')?.value||'',label=$('filterLabel')?.value||'',review=$('filterReview')?.value||'',mt=$('filterMaterial')?.value||'',bt=$('filterTrack')?.value||'';const j=await api(`/api/team-workbench/submissions?limit=1000&type=${encodeURIComponent(type)}&label=${encodeURIComponent(label)}&review_status=${encodeURIComponent(review)}&material_type=${encodeURIComponent(mt)}&business_track=${encodeURIComponent(bt)}`);submissionsCache=j.items||[];$('submissions').innerHTML=submissionsCache.map(x=>{const p=x.payload||{};return `<div class="card clickable" data-id="${esc(x.id)}" onclick="showReviewModal(this.dataset.id)"><span class="pill ${gradeClass(x.label)}">${esc(x.label||'B')}</span><span class="pill mt">${esc(x.material_type_name||mtName[x.material_type]||'未分形态')}</span><span class="pill track">${esc(x.business_track_name||trName[x.business_track]||'未定赛道')}</span><span class="pill">AI:${esc(x.ai_label||'-')}</span><span class="pill">${esc(x.review_status||'')}</span><span class="pill">${esc(x.type_name||'')}</span><span class="pill">${esc(x.member||'')}</span><div class="small">${esc(x.time)} | ${esc(x.id)}</div>${renderPreview(x)}<div class="small" style="margin-top:8px">${Object.entries(p).slice(0,8).map(([k,v])=>`<b>${esc(k)}</b>：${esc(String(v||'').slice(0,160))}`).join('<br>')}</div><div class="small">AI理由：${esc(x.ai_reason||'')}</div><div class="toolbar"><button class="btn primary" data-id="${esc(x.id)}" onclick="event.stopPropagation();showReviewModal(this.dataset.id)">查看详情 / 分类审核</button></div></div>`}).join('')||'暂无提交'}
async function loadAll(render=true){const j=await api('/api/team-workbench/status');statusData=j;$('status').textContent=`版本：${j.version}\n数据目录：${j.data_root}\n上传目录：${j.uploads_path}\n总提交：${j.stats.total}\n待审核：${j.stats.pending_review}\nA入库：${j.stats.by_label.A||0}  B优化：${j.stats.by_label.B||0}  C失败：${j.stats.by_label.C||0}`;$('tasks').innerHTML=(j.tasks||[]).map(t=>`<div class="task"><span class="tag">${esc(t.group)}</span><br><b>做什么：</b>${esc(t.task)}<br><b>怎么判断：</b>${esc(t.standard)}</div>`).join('');if($('filterType'))$('filterType').innerHTML='<option value="">全部类型</option>'+Object.entries(j.types||{}).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('');if(render)renderForm();if(mode==='admin')loadSubmissions()}
const platforms=['抖音','视频号','小红书','快手'];function todayStr(){const d=new Date();return d.toISOString().slice(0,10)}
function rowHtml(i){return `<tr data-row="${i}"><td><select class="v_platform">${platforms.map(p=>`<option>${p}</option>`).join('')}</select></td><td><input class="v_account" placeholder="账号名"></td><td><input class="v_no" value="${i+1}"></td><td><textarea class="v_url" placeholder="视频链接"></textarea></td><td><textarea class="v_title" placeholder="标题"></textarea></td><td><textarea class="v_topic" placeholder="选题"></textarea></td><td><textarea class="v_cover" placeholder="封面文字"></textarea></td><td><textarea class="v_hook" placeholder="开头3秒"></textarea></td><td><input class="v_views" placeholder="播放"></td><td><input class="v_likes" placeholder="赞"></td><td><input class="v_comments" placeholder="评"></td><td><input class="v_favorites" placeholder="藏"></td><td><input class="v_shares" placeholder="转"></td><td><input class="v_dm" placeholder="私信"></td><td><input class="v_follow" placeholder="涨粉"></td><td><select class="v_grade"><option>B</option><option>A</option><option>C</option></select></td><td><textarea class="v_why" placeholder="为什么好/差"></textarea></td><td><textarea class="v_tomorrow" placeholder="明天怎么改"></textarea></td><td><button class="btn bad" type="button" onclick="this.closest('tr').remove()">删</button></td></tr>`}
function renderVideoDataTable(){let html=`<div class="grid"><div><label>日期</label><input id="videoDate" value="${todayStr()}"></div><div><label>成员</label><input id="videoMember" placeholder="填写名字"></div></div><div class="toolbar"><button class="btn" onclick="addVideoRow()" type="button">+ 添加一条视频</button><button class="btn primary" onclick="submitVideoRows()" type="button">保存今日视频数据</button><button class="btn" onclick="loadVideoStats()" type="button">刷新统计</button><a class="btn" href="/api/team-workbench/video-items.csv" target="_blank">导出CSV</a></div><div class="wide"><table class="videoTable"><thead><tr><th>平台</th><th>账号</th><th>序号</th><th>链接</th><th>标题</th><th>选题</th><th>封面</th><th>开头3秒</th><th>播放</th><th>赞</th><th>评</th><th>藏</th><th>转</th><th>私信</th><th>涨粉</th><th>A/B/C</th><th>原因</th><th>明天改法</th><th>操作</th></tr></thead><tbody id="videoRows">${[0,1,2,3].map(rowHtml).join('')}</tbody></table></div><div id="videoMsg" class="status" style="margin-top:12px">等待保存...</div><div id="videoStats"></div>`;$('formBox').innerHTML=html;loadVideoStats();}
function addVideoRow(){const tb=$('videoRows');tb.insertAdjacentHTML('beforeend',rowHtml(tb.children.length));}
function valIn(tr,c){return (tr.querySelector(c)?.value||'').trim()}
async function submitVideoRows(){const rows=[...document.querySelectorAll('#videoRows tr')].map(tr=>({report_date:$('videoDate').value,member:$('videoMember').value,platform:valIn(tr,'.v_platform'),account_name:valIn(tr,'.v_account'),video_no:valIn(tr,'.v_no'),video_url:valIn(tr,'.v_url'),title:valIn(tr,'.v_title'),topic:valIn(tr,'.v_topic'),cover_text:valIn(tr,'.v_cover'),opening_hook:valIn(tr,'.v_hook'),views:valIn(tr,'.v_views'),likes:valIn(tr,'.v_likes'),comments:valIn(tr,'.v_comments'),favorites:valIn(tr,'.v_favorites'),shares:valIn(tr,'.v_shares'),dm_leads:valIn(tr,'.v_dm'),followers_gain:valIn(tr,'.v_follow'),grade:valIn(tr,'.v_grade'),why:valIn(tr,'.v_why'),tomorrow_action:valIn(tr,'.v_tomorrow')})).filter(x=>x.account_name||x.video_url||x.title||x.topic);try{const j=await api('/api/team-workbench/video-items',{items:rows});$('videoMsg').innerHTML=`<span class="ok">保存成功</span>：${esc(j.count)}条视频数据`;loadVideoStats();}catch(e){$('videoMsg').innerHTML=`<span class="badText">保存失败：</span>${esc(e.message)}`}}
function findCached(id){return submissionsCache.find(x=>x.id===id)||null}
function showReviewModal(id){const x=findCached(id);if(!x){alert('未找到该素材，请刷新');return}currentReviewId=id;const p=x.payload||{};let detail=`<div class="detail-grid"><div class="detail-item"><div class="label">提交人</div><div class="value">${esc(x.member)}</div></div><div class="detail-item"><div class="label">提交时间</div><div class="value">${esc(x.time)}</div></div><div class="detail-item"><div class="label">类型</div><div class="value">${esc(x.type_name||x.type)}</div></div><div class="detail-item"><div class="label">当前状态</div><div class="value">${esc(x.review_status||'pending_review')}</div></div></div>`;const topic=p.topic||p.title||p.content_kind||'';if(topic)detail+=`<div class="detail-full"><div class="label">标题/主题</div><div class="value">${esc(topic)}</div></div>`;const ct=p.content_text||p.best_today||p.biggest_problem||'';if(ct)detail+=`<div class="detail-full"><div class="label">文案内容</div><div class="value">${esc(ct)}</div></div>`;const extra=Object.entries(p).filter(([k])=>!['topic','title','content_kind','content_text','best_today','biggest_problem'].includes(k)).map(([k,v])=>`<b>${esc(k)}</b>：${esc(String(v||'').slice(0,500))}`).join('<br>');if(extra)detail+=`<div class="detail-full"><div class="label">其他资料</div><div class="value">${extra}</div></div>`;if(x.ai_reason)detail+=`<div class="detail-full"><div class="label">系统建议</div><div class="value">形态：${esc(x.material_type_name||mtName[x.material_type]||'')}；赛道：${esc(x.business_track_name||trName[x.business_track]||'')}；A/B/C：${esc(x.ai_label||'')}\n理由：${esc(x.ai_reason||'')}</div></div>`;detail+=renderPreview(x);$('reviewDetail').innerHTML=detail;$('reviewMaterialType').value=x.material_type||'other';$('reviewBusinessTrack').value=x.business_track||'other';$('reviewLabel').value=x.ai_label||x.label||'B';$('reviewStatus').value=x.review_status==='approved'?'approved':'approved';$('reviewNotes').value=x.review_notes||x.ai_reason||'';$('reviewer').value=x.reviewer||'大鹏';$('reviewMsg').style.display='none';$('reviewModal').classList.remove('hidden')}
function closeReviewModal(){$('reviewModal').classList.add('hidden');currentReviewId=null}
async function saveReview(){const btn=$('reviewSaveBtn');btn.disabled=true;$('reviewMsg').style.display='none';try{const j=await api('/api/team-workbench/review',{id:currentReviewId,material_type:$('reviewMaterialType').value,business_track:$('reviewBusinessTrack').value,label:$('reviewLabel').value,review_status:$('reviewStatus').value,review_notes:$('reviewNotes').value,reviewer:$('reviewer').value});$('reviewMsg').style.display='block';$('reviewMsg').innerHTML=`<span class="ok">保存成功</span>：${esc(j.item.material_type_name)} / ${esc(j.item.business_track_name)} / ${esc(j.item.label)}`;await loadSubmissions()}catch(e){$('reviewMsg').style.display='block';$('reviewMsg').innerHTML=`<span class="badText">保存失败：</span>${esc(e.message)}`}finally{btn.disabled=false}}
async function autoClassifyAll(){if(!confirm('自动给所有未分类素材初分：短视频/图片/文案，并给A/B/C建议。继续？'))return;const j=await api('/api/team-workbench/auto-classify',{only_missing:true});alert(j.message||('已处理 '+j.count+' 条'));loadAll(false);loadSubmissions()}

function miniTable(obj){return Object.entries(obj||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v.videos)}</td><td>${esc(v.views)}</td><td>${esc(v.avg_views)}</td><td>${esc(v.interactions)}</td><td>${esc(v.dm_leads)}</td><td>${esc(v.a_count)}</td></tr>`).join('')}
function topList(arr){return (arr||[]).map(x=>`<div class="card"><span class="pill ${gradeClass(x.grade)}">${esc(x.grade)}</span><span class="pill">${esc(x.platform)}</span><span class="pill">${esc(x.account_name)}</span><div><b>${esc(x.title||x.topic||'未填标题')}</b></div><div class="small">播放 ${esc(x.views||0)}｜互动 ${esc(x.interactions||0)}｜私信 ${esc(x.dm_leads||0)}<br>${safeUrl(x.video_url)?`<a href="${esc(safeUrl(x.video_url))}" target="_blank">打开视频</a>`:''}<br>原因：${esc(x.why||'')}</div></div>`).join('')||'暂无'}
async function loadVideoStats(target='videoStats'){const el=$(target);if(!el)return;const date=$('videoDate')?.value||todayStr();const j=await api('/api/team-workbench/video-items?limit=1000&date='+encodeURIComponent(date));const s=j.stats||{};el.innerHTML=`<div class="statsGrid"><div class="statCard"><div>总视频</div><div class="statNum">${esc(s.total_videos||0)}</div></div><div class="statCard"><div>总播放</div><div class="statNum">${esc(s.total_views||0)}</div></div><div class="statCard"><div>总互动</div><div class="statNum">${esc(s.total_interactions||0)}</div></div><div class="statCard"><div>私信/咨询</div><div class="statNum">${esc(s.total_dm_leads||0)}</div></div></div><div class="grid"><div class="card"><h1>平台统计</h1><table class="videoTable"><tr><th>平台</th><th>条数</th><th>播放</th><th>均播</th><th>互动</th><th>私信</th><th>A类</th></tr>${miniTable(s.by_platform)}</table></div><div class="card"><h1>账号统计</h1><table class="videoTable"><tr><th>账号</th><th>条数</th><th>播放</th><th>均播</th><th>互动</th><th>私信</th><th>A类</th></tr>${miniTable(s.by_account)}</table></div></div><h1 style="margin-top:12px">播放Top</h1>${topList(s.top_views)}`}
async function renderDashboard(){let html=`<div class="grid"><div><label>看哪一天</label><input id="videoDate" value="${todayStr()}"></div><div><label>&nbsp;</label><button class="btn" onclick="loadVideoStats('dashStats')">刷新看板</button></div></div><div id="dashStats"></div><div class="sectionTitle">今日提交</div><div id="dashSubmissions" class="cards"></div>`;$('formBox').innerHTML=html;loadVideoStats('dashStats');const j=await api('/api/team-workbench/submissions?limit=50');$('dashSubmissions').innerHTML=(j.items||[]).slice(0,12).map(x=>`<div class="card"><span class="pill ${gradeClass(x.label)}">${esc(x.label)}</span><span class="pill">${esc(x.type_name)}</span><span class="pill">${esc(x.member)}</span><div class="small">${esc(x.time)}<br>${esc(x.notes||'')}</div></div>`).join('')||'暂无提交'}
function renderTools(){$('formBox').innerHTML=`<div class="cards"><div class="card"><h1>Agnes 全模态 API 实验室</h1><div class="small">文生图、文生视频、图生视频</div><div class="toolbar"><a class="btn primary" href="/agnes-lab" target="_blank">打开 Agnes</a></div></div><div class="card"><h1>Zelong 图片素材工厂</h1><div class="small">图片测试、素材生成</div><div class="toolbar"><a class="btn primary" href="/zelong-image-lab" target="_blank">打开 Zelong</a></div></div></div>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));renderForm()});loadAll();
</script>
</body>
