<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IP12 基础访谈练习场</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#0d1420;--card:#121c2a;--line:#223044;--text:#edf3f8;--muted:#8998aa;--gold:#f1c768;--mint:#52dfc7;--bad:#ff8d8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#142033 0,#070b12 36%);color:var(--text);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(7,11,18,.9)}h1{font-size:16px;margin:0}.tag{color:var(--mint);font-size:12px}.actions{display:flex;gap:8px}button{border:1px solid var(--line);background:#131e2d;color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer}button.primary{background:var(--gold);color:#211806;border-color:var(--gold);font-weight:700}.main{min-height:0;display:grid;grid-template-columns:minmax(420px,1fr) 360px}.chat{min-height:0;display:grid;grid-template-rows:1fr auto;border-right:1px solid var(--line)}.messages{overflow:auto;padding:22px}.msg{display:flex;margin:0 0 16px}.msg.user{justify-content:flex-end}.bubble{max-width:78%;white-space:pre-wrap;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.user .bubble{background:#223044}.review{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.review button{font-size:11px;padding:4px 7px;color:var(--muted)}.review button.chosen{color:var(--gold);border-color:var(--gold)}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--panel)}textarea{flex:1;min-height:48px;max-height:130px;resize:vertical;background:#08101b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.inspector{overflow:auto;padding:18px;background:rgba(13,20,32,.92)}.inspector h2{font-size:13px;color:var(--gold);margin:0 0 10px}.box{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}.label{font-size:11px;color:var(--muted);margin-bottom:4px}.value{white-space:pre-wrap}.fact{padding:8px 0;border-bottom:1px solid var(--line)}.fact:last-child{border:0}.quote{font-size:11px;color:var(--muted)}.empty{color:var(--muted)}.warning{color:var(--bad);font-size:12px}.count{color:var(--mint)}@media(max-width:820px){.main{grid-template-columns:1fr}.chat{border-right:0}.inspector{display:none}.bubble{max-width:92%}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div><h1>IP12 基础访谈练习场</h1><div class="tag">只调问题、回复风格、采集结果 · 不进入模块 1</div></div>
    <div class="actions"><button id="copyBtn">复制调试记录</button><button id="resetBtn">新测试</button></div>
  </header>
  <main class="main">
    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="composer"><textarea id="input" placeholder="像真实用户一样回答，Enter 发送，Shift+Enter 换行"></textarea><button class="primary" id="sendBtn">发送</button></div>
    </section>
    <aside class="inspector">
      <h2>本轮检查</h2>
      <div class="box"><div class="label">当前正在问</div><div class="value" id="currentQuestion">—</div></div>
      <div class="box"><div class="label">采集进度</div><div class="value"><span class="count" id="factCount">0</span> 条候选事实 · <span id="unknownCount">0</span> 项未回答</div></div>
      <div class="box"><div class="label">当前总结稿</div><div class="value empty" id="draft">还没有生成总结稿</div></div>
      <h2>已经采集的内容</h2>
      <div class="box" id="facts"><div class="empty">还没有候选事实</div></div>
      <h2>你标记的问题</h2>
      <div class="box" id="feedback"><div class="empty">点击每条 Agent 回复下方的评价按钮</div></div>
      <div class="warning">这里的内容只属于本地练习场，不会写入正式客户 Project。</div>
    </aside>
  </main>
</div>
<script>
const labels={preferred_name:'称呼',current_identity:'当前身份',previous_work_experience:'过往经历',core_skill_1:'第一项能力',core_skill_2:'第二项能力',long_term_interest:'长期兴趣',target_audience:'目标人群',help_goal:'希望解决的问题',content_account:'内容账号',offer:'产品或服务',business_goal:'商业目标',primary_platform:'主要平台',desired_action:'希望用户采取的动作',time_budget:'投入时间',three_month_goal:'三个月目标',tone_preference:'表达偏好',disliked_style:'反感风格'};
let cid='',state={},messages=[],feedback=[];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'请求失败');return d}
async function ensureSession(){const list=await request('/api/conversations');if(list.length){cid=list[0].id}else{const d=await request('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'基础访谈调试'})});cid=d.id}await load()}
async function load(){const d=await request('/api/conversations/'+cid);state=d.coach_state||{};messages=d.messages||[];render()}
function render(){const area=$('messages');area.innerHTML=messages.map((m,i)=>`<div class="msg ${m.role==='user'?'user':'assistant'}"><div><div class="bubble">${esc(m.content)}</div>${m.role==='assistant'?reviewButtons(i):''}</div></div>`).join('');area.scrollTop=area.scrollHeight;renderInspector()}
function reviewButtons(index){return `<div class="review" data-index="${index}">${['合适','太机械','听不懂','答非所问','重复提问','总结不准'].map(x=>`<button onclick="mark(${index},'${x}',this)">${x}</button>`).join('')}</div>`}
function mark(index,type,button){feedback=feedback.filter(x=>x.index!==index);feedback.push({index,type,reply:messages[index]?.content||''});button.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('chosen'));button.classList.add('chosen');renderInspector()}
function renderInspector(){const intake=state.intake||{},updates=intake.profile_updates||[],statuses=intake.field_statuses||{};$('currentQuestion').textContent=labels[intake.current_question_field]||intake.current_question_field||'还没有开始提问';$('factCount').textContent=updates.length;$('unknownCount').textContent=Object.values(statuses).filter(x=>x==='unknown').length;$('draft').textContent=intake.draft||'还没有生成总结稿';$('draft').className='value '+(intake.draft?'':'empty');$('facts').innerHTML=updates.length?updates.map(x=>`<div class="fact"><b>${esc(labels[x.field]||x.field)}</b><div>${esc(x.value)}</div><div class="quote">原话：${esc(x.evidence_quote)}</div></div>`).join(''):'<div class="empty">还没有候选事实</div>';$('feedback').innerHTML=feedback.length?feedback.map(x=>`<div class="fact"><b>第 ${x.index+1} 条 · ${esc(x.type)}</b><div class="quote">${esc(x.reply.slice(0,90))}</div></div>`).join(''):'<div class="empty">点击每条 Agent 回复下方的评价按钮</div>'}
async function send(){const text=$('input').value.trim();if(!text||!cid)return;$('sendBtn').disabled=true;$('input').value='';try{const d=await request('/api/chat-complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,expected_revision:state.revision,request_id:crypto.randomUUID(),message:text})});state=d.state;messages.push({role:'user',content:text},{role:'assistant',content:d.assistant});render()}catch(e){alert(e.message)}finally{$('sendBtn').disabled=false;$('input').focus()}}
async function reset(){if(!confirm('清空当前本地测试，重新开始吗？'))return;await request('/api/conversations/'+cid,{method:'DELETE'});cid='';state={};messages=[];feedback=[];await ensureSession()}
async function copyRecord(){const text=JSON.stringify({conversation_id:cid,messages,state:{intake:state.intake,revision:state.revision},feedback},null,2);await navigator.clipboard.writeText(text);$('copyBtn').textContent='已复制';setTimeout(()=>$('copyBtn').textContent='复制调试记录',1200)}
$('sendBtn').onclick=send;$('resetBtn').onclick=reset;$('copyBtn').onclick=copyRecord;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});ensureSession().catch(e=>alert(e.message));
</script>
</body>
</html>
