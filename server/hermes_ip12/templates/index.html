<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP孵化教练 v6</title>
<script src="https://unpkg.com/marked@15.0.12/lib/marked.umd.js"></script>
<style>
:root {
  --bg:#070b13;--sb:#0a101b;--card:#101722;--bd:rgba(148,164,187,.12);--tx:#eaf1fa;--dim:#718197;
  --ac:#e7b24c;--acb:#f1c768;--ag:rgba(231,178,76,.12);--gr:#2dd4bf;
  --gb:rgba(45,212,191,.1);--wa:#f4cd72;--ub:#182336;--ab:rgba(14,20,31,.96);--ib:rgba(9,14,23,.88);
  --r:14px;--rs:9px;--f:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{position:relative;font-family:var(--f);background:radial-gradient(circle at 72% 2%,rgba(231,178,76,.09),transparent 27%),radial-gradient(circle at 62% 100%,rgba(45,212,191,.045),transparent 34%),var(--bg);color:var(--tx);height:100vh;display:flex;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(circle at 1px 1px,rgba(148,164,187,.13) 1px,transparent 0);background-size:24px 24px;mask-image:linear-gradient(90deg,transparent 250px,#000 40%,transparent 92%)}
button,input,textarea{font:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid rgba(231,178,76,.7);outline-offset:2px}

/* ── LEFT SIDEBAR ── */
.lsb{position:relative;isolation:isolate;width:280px;min-width:280px;background:linear-gradient(180deg,rgba(12,18,29,.98),rgba(7,12,21,.98));border-right:1px solid rgba(148,164,187,.1);box-shadow:16px 0 44px -34px rgba(0,0,0,.9),inset -1px 0 rgba(231,178,76,.055);display:flex;flex-direction:column;height:100vh;z-index:10;overflow:hidden;backdrop-filter:blur(18px)}
.lsb:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(230px circle at 12% 4%,rgba(231,178,76,.12),transparent 70%),radial-gradient(210px circle at 90% 92%,rgba(45,212,191,.045),transparent 72%)}
.lsb-hd{min-height:76px;display:flex;align-items:center;gap:11px;padding:15px 14px;border-bottom:1px solid rgba(148,164,187,.09)}
.brand-emblem{position:relative;width:38px;height:38px;display:grid;place-items:center;flex:none;border:1px solid rgba(231,178,76,.34);border-radius:12px;background:linear-gradient(145deg,rgba(231,178,76,.18),rgba(231,178,76,.06));color:#f4cd72;box-shadow:0 12px 28px -20px rgba(231,178,76,.85),inset 0 1px rgba(255,255,255,.08)}
.brand-emblem:after{content:"";position:absolute;right:5px;top:5px;width:4px;height:4px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 8px rgba(45,212,191,.85)}
.brand-emblem svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.brand-copy{min-width:0}
.brand-kicker{margin-bottom:3px;color:#8f9db0;font-size:8px;font-weight:800;letter-spacing:.16em}
.lsb-hd h1{font-size:13px;font-weight:800;color:#f4f7fb;letter-spacing:.01em}
.lsb-hd .sub{margin-top:3px;font-size:9px;color:#68788f}
.sidebar-close{display:none;margin-left:auto;width:30px;height:30px;border:0;border-radius:8px;background:rgba(148,164,187,.05);color:#8c9aaf;cursor:pointer;font-size:16px}
.prog-wrap{padding:12px 14px 13px;border-bottom:1px solid rgba(148,164,187,.08);background:rgba(148,164,187,.018)}
.prog-lbl{font-size:10px;color:#718197;display:flex;justify-content:space-between}
.prog-lbl span:last-child{color:var(--acb);font-weight:750}
.prog-bar{height:4px;background:rgba(148,164,187,.1);border-radius:999px;overflow:hidden;margin-top:8px;box-shadow:inset 0 1px rgba(0,0,0,.3)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gr),var(--ac));border-radius:inherit;box-shadow:0 0 12px rgba(45,212,191,.24);transition:width .5s}
.sec-lbl{display:flex;align-items:center;gap:8px;font-size:9px;text-transform:uppercase;letter-spacing:1.25px;color:#637189;padding:10px 14px 4px;cursor:pointer;user-select:none}
.sec-lbl:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(148,164,187,.1),transparent)}
.sec-lbl:hover{color:#aeb9c8}

/* Module list */
.mod-scroll{overflow-y:auto;flex:1;padding:4px 8px 8px;scrollbar-width:none}
.mod-scroll::-webkit-scrollbar{display:none}
.mod-item{position:relative;display:flex;align-items:center;gap:8px;min-height:43px;padding:6px 8px;border:1px solid transparent;border-radius:11px;cursor:pointer;font-size:12px;transition:color .18s,background .18s,border-color .18s,box-shadow .18s;user-select:none;flex-wrap:wrap;overflow:hidden}
.mod-item:before{content:"";position:absolute;inset:2px;border-radius:9px;background:linear-gradient(105deg,transparent 18%,rgba(231,178,76,.09) 48%,transparent 78%);opacity:0;transform:translateX(-110%);pointer-events:none}
.mod-item:hover{color:#fff;background:rgba(231,178,76,.055);border-color:rgba(231,178,76,.12)}
.mod-item:hover:before{animation:hq-scan .72s cubic-bezier(.22,1,.36,1)}
.mod-item.cur{background:linear-gradient(105deg,rgba(231,178,76,.16),rgba(231,178,76,.065));border-color:rgba(231,178,76,.28);box-shadow:0 12px 28px -22px rgba(231,178,76,.72),inset 0 1px rgba(255,255,255,.06)}
.mod-item.cur:after{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:3px;background:#f1c768;box-shadow:0 0 10px rgba(231,178,76,.7)}
.mod-item.done{color:#bcd8d4}
.mod-item.locked{opacity:.4;cursor:not-allowed}
.mod-item.locked:hover{background:transparent;border-color:transparent;color:inherit}
.mod-item .mod-row{display:flex;align-items:center;gap:8px;width:100%}
.mod-num{width:24px;height:24px;border:1px solid rgba(148,164,187,.13);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;background:rgba(148,164,187,.045);color:#6f8096}
.mod-item.cur .mod-num{border-color:rgba(231,178,76,.34);background:rgba(231,178,76,.14);color:#f4cd72}
.mod-item.done .mod-num{border-color:rgba(45,212,191,.28);background:rgba(45,212,191,.1);color:#7ce8d8}
.mod-info{flex:1;min-width:0}
.mod-name{display:flex;align-items:center;gap:8px;font-weight:650;color:#bcc8d7}
.mod-item:hover .mod-name,.mod-item.cur .mod-name{color:#f3f6fa}
.module-icon{position:relative;width:18px;height:18px;display:grid;place-items:center;flex:none;color:#8090a5}
.module-icon svg{width:18px;height:18px;display:block;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.module-icon .icon-accent{color:#e7b24c;stroke:currentColor}
.mod-item:hover .module-icon,.mod-item.cur .module-icon,.tool-row button:hover .module-icon,.top-action:hover .module-icon,.lsb-ft button:hover .module-icon{color:#f3f6fa;filter:drop-shadow(0 0 7px rgba(231,178,76,.38))}
.mod-item:hover .module-icon svg>*,.tool-row button:hover .module-icon svg>*,.top-action:hover .module-icon svg>*,.lsb-ft button:hover .module-icon svg>*{animation:hq-icon-draw .72s cubic-bezier(.22,1,.36,1)}
.mod-item:hover .module-icon:before,.tool-row button:hover .module-icon:before{content:"";position:absolute;right:-2px;top:-2px;width:3px;height:3px;border-radius:50%;background:#f4cd72;box-shadow:0 0 7px rgba(244,205,114,.8);animation:hq-seed .68s ease-out}
.mod-badge{font-size:8px;padding:2px 5px;border:1px solid rgba(231,178,76,.14);border-radius:999px;background:rgba(231,178,76,.07);color:#cfae67;white-space:nowrap}
.mod-item.done .mod-badge{background:var(--gb);color:var(--gr)}
.mod-expand{font-size:8px;color:#5f6e82;transition:transform .2s;flex-shrink:0}
.mod-item.expanded .mod-expand{transform:rotate(90deg)}

/* Sub-skills */
.mod-sub{display:none;align-items:center;gap:7px;padding:7px 8px 7px 33px;cursor:pointer;font-size:10px;color:#718197;transition:all .15s;border-radius:8px;margin:1px 2px;width:100%}
.mod-item.expanded .mod-sub{display:block}
.mod-sub:hover{color:#eaf1fa;background:rgba(148,164,187,.055)}
.mod-sub .module-icon{display:inline-grid;width:15px;height:15px;margin-right:6px;vertical-align:middle}
.mod-sub .module-icon svg{width:15px;height:15px}

/* Tools */
.tools-wrap{border-top:1px solid rgba(148,164,187,.08);background:rgba(5,9,16,.22)}
.tools-wrap .tool-row{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px 10px}
.tools-wrap .tool-row button{display:flex;align-items:center;gap:6px;flex:0 0 calc(50% - 3px);min-width:0;min-height:31px;padding:6px 7px;border:1px solid rgba(148,164,187,.1);border-radius:8px;background:rgba(148,164,187,.025);color:#718197;cursor:pointer;font-size:9.5px;text-align:left;transition:color .16s,background .16s,border-color .16s,box-shadow .16s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools-wrap .tool-row button:hover{background:rgba(231,178,76,.08);border-color:rgba(231,178,76,.2);color:#f1eadb;box-shadow:0 10px 24px -20px rgba(231,178,76,.8)}
.tool-row .module-icon{width:15px;height:15px}
.tool-row .module-icon svg{width:15px;height:15px}
.tools-wrap.collapsed .tool-row{display:none}
.artifact-empty{padding:6px 12px 9px;color:var(--dim);font-size:10px}
.lsb-ft{padding:10px 12px 12px;border-top:1px solid rgba(148,164,187,.09);display:flex;gap:7px;background:rgba(4,8,14,.42)}
.lsb-ft button{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-height:34px;padding:7px;border:1px solid rgba(148,164,187,.12);border-radius:9px;background:rgba(148,164,187,.035);color:#b7c3d2;cursor:pointer;font-size:10px;transition:.16s}
.lsb-ft button:first-child{border-color:rgba(231,178,76,.25);background:rgba(231,178,76,.1);color:#f1c768}
.lsb-ft button:hover{transform:translateY(-1px);border-color:rgba(231,178,76,.28);background:rgba(231,178,76,.1);color:#fff}

/* ── CENTER CHAT ── */
.main{position:relative;flex:1;display:flex;flex-direction:column;height:100vh;min-width:0;background:linear-gradient(180deg,rgba(7,11,19,.24),rgba(7,11,19,.74))}
.top-bar{position:relative;z-index:2;min-height:55px;padding:10px 22px;border-bottom:1px solid rgba(148,164,187,.09);background:rgba(7,11,19,.66);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;font-size:11px}
.top-bar .cur-mod{display:flex;align-items:center;gap:6px}
.top-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px rgba(45,212,191,.75)}
.top-bar strong{color:#f1c768}
.top-action{display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(148,164,187,.11);border-radius:8px;background:rgba(148,164,187,.035);color:#7f8fa5;cursor:pointer;font-size:10px;transition:.16s}
.top-action:hover{border-color:rgba(231,178,76,.24);background:rgba(231,178,76,.08);color:#f3f6fa}
.top-action .module-icon{width:14px;height:14px}.top-action .module-icon svg{width:14px;height:14px}
.mobile-menu{display:none}
.chat-area{position:relative;z-index:1;flex:1;overflow-y:auto;padding:26px 32px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(148,164,187,.16) transparent}
.welcome{position:relative;isolation:isolate;flex:1;width:min(620px,100%);min-height:390px;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:42px 38px;overflow:hidden;border:1px solid rgba(148,164,187,.13);border-radius:24px;background:radial-gradient(circle at 50% 18%,rgba(231,178,76,.13),transparent 30%),linear-gradient(145deg,rgba(17,24,36,.88),rgba(8,13,22,.92));box-shadow:0 35px 90px -54px rgba(0,0,0,.95),inset 0 1px rgba(255,255,255,.055);color:#7f8fa5;text-align:center}
.welcome:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.28;background-image:linear-gradient(rgba(148,164,187,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(148,164,187,.09) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(circle at center,#000,transparent 74%)}
.welcome:after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#2dd4bf,#e7b24c,transparent);opacity:.52}
.welcome .big-icon{position:relative;width:72px;height:72px;display:grid;place-items:center;margin-bottom:4px;border:1px solid rgba(231,178,76,.28);border-radius:22px;background:linear-gradient(145deg,rgba(231,178,76,.18),rgba(231,178,76,.055));box-shadow:0 20px 48px -28px rgba(231,178,76,.9),inset 0 1px rgba(255,255,255,.08);color:#f4cd72}
.welcome .big-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.welcome .big-icon .spark{transform-origin:center;animation:welcome-spark 2.8s ease-in-out infinite}
.welcome .big-icon:after{content:"";position:absolute;right:11px;top:11px;width:6px;height:6px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 12px rgba(45,212,191,.9)}
.welcome-kicker{color:#d1a94d;font-size:9px;font-weight:850;letter-spacing:.18em}
.welcome h2{font-size:26px;color:#f5f8fc;font-weight:800;letter-spacing:-.02em}
.welcome p{font-size:12px;max-width:430px;line-height:1.8;color:#8290a4}
.welcome-meta{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin:2px 0 5px}
.welcome-meta span{padding:5px 8px;border:1px solid rgba(148,164,187,.11);border-radius:999px;background:rgba(148,164,187,.035);color:#8b9ab0;font-size:9px}
.welcome-meta span:first-child{border-color:rgba(45,212,191,.2);background:rgba(45,212,191,.07);color:#79d8ca}
.start-btn{position:relative;min-width:132px;padding:11px 22px;border:1px solid rgba(244,205,114,.55);border-radius:11px;background:linear-gradient(135deg,#f4cd72,#e7b24c);box-shadow:0 16px 34px -20px rgba(231,178,76,.9),inset 0 1px rgba(255,255,255,.38);color:#211707;cursor:pointer;font-size:12px;font-weight:850;transition:transform .16s,box-shadow .16s,filter .16s}
.start-btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 20px 42px -20px rgba(231,178,76,.96)}
.msg{display:flex;gap:10px;max-width:750px;width:100%;margin:0 auto}
.msg.user{flex-direction:row-reverse}
.av{width:32px;height:32px;border:1px solid rgba(148,164,187,.12);border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:rgba(148,164,187,.045);color:#94a4bb}
.av .module-icon,.av .module-icon svg{width:17px;height:17px}
.msg.user .av{border-color:rgba(231,178,76,.22);background:rgba(231,178,76,.1);color:#f1c768}
.msg.assistant .av{border-color:rgba(45,212,191,.18);background:rgba(45,212,191,.07);color:#76d9ca}
.bubble{padding:13px 16px;border-radius:13px;max-width:85%;font-size:13px;line-height:1.72;word-break:break-word;box-shadow:0 16px 34px -30px rgba(0,0,0,.9)}
.msg.user .bubble{border:1px solid rgba(231,178,76,.13);background:linear-gradient(145deg,rgba(36,43,55,.94),rgba(24,35,54,.94))}
.msg.assistant .bubble{background:var(--ab);border:1px solid var(--bd)}
.input-area{position:relative;z-index:2;padding:12px 24px 17px;border-top:1px solid rgba(148,164,187,.08);background:linear-gradient(180deg,rgba(7,11,19,.18),rgba(7,11,19,.92));backdrop-filter:blur(18px)}
.input-wrap{max-width:750px;margin:0 auto;display:flex;gap:7px;background:var(--ib);border:1px solid rgba(148,164,187,.13);border-radius:14px;padding:5px;align-items:flex-end;box-shadow:0 22px 48px -34px rgba(0,0,0,.92),inset 0 1px rgba(255,255,255,.035);transition:border-color .18s,background .18s,box-shadow .18s}
.input-wrap:focus-within{border-color:rgba(231,178,76,.42);background:rgba(11,17,27,.96);box-shadow:0 22px 48px -34px rgba(0,0,0,.92),0 0 24px -18px rgba(231,178,76,.75),inset 0 1px rgba(255,255,255,.05)}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-family:var(--f);font-size:12px;resize:none;padding:7px 8px;min-height:27px;max-height:120px}
.input-wrap textarea::placeholder{color:#56657a}
.send-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(244,205,114,.45);background:linear-gradient(135deg,#f4cd72,#e7b24c);color:#211707;cursor:pointer;font-size:14px;font-weight:900;flex-shrink:0;box-shadow:0 12px 24px -18px rgba(231,178,76,.9)}
.send-btn:disabled{opacity:.42;filter:saturate(.4);cursor:not-allowed;box-shadow:none}

/* ── RIGHT PANEL ── */
.rpn{width:0;min-width:0;background:linear-gradient(180deg,rgba(15,22,34,.99),rgba(8,13,22,.99));border-left:1px solid rgba(148,164,187,.11);height:100vh;overflow:hidden;transition:width .3s ease,min-width .3s ease;z-index:5;box-shadow:-24px 0 55px -40px rgba(0,0,0,.9)}
.rpn.open{width:420px;min-width:420px}
.rpn-inner{padding:16px;width:420px}
.rpn-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(148,164,187,.09)}
.rpn-hd h2{font-size:14px;color:#f1c768}
.rpn-close{width:30px;height:30px;border:0;border-radius:8px;background:rgba(148,164,187,.035);color:var(--dim);cursor:pointer;font-size:16px}
.rpn-close:hover{color:var(--tx)}
.rpn-body{overflow-y:auto;max-height:calc(100vh - 80px);font-size:13px;line-height:1.7}
.rpn-body img{max-width:100%;border-radius:8px;margin:6px 0}
.rpn-body pre{background:rgba(4,8,14,.72);border:1px solid rgba(148,164,187,.08);border-radius:var(--rs);padding:10px;overflow-x:auto;font-size:11px;margin:8px 0}
.rpn-body h3{color:var(--acb);margin:12px 0 6px;font-size:14px}

/* Cards in right panel */
.rpn-card{background:linear-gradient(145deg,rgba(18,26,39,.95),rgba(10,16,26,.96));border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 20px 46px -38px rgba(0,0,0,.9),inset 0 1px rgba(255,255,255,.035)}
.rpn-card-header{font-size:14px;font-weight:600;color:var(--acb);margin-bottom:8px}
.rpn-card .copy-btn{background:linear-gradient(135deg,#f4cd72,#e7b24c);color:#211707;border:1px solid rgba(244,205,114,.45);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:10px;font-weight:800;margin-top:8px}
.rpn-card .copy-btn:hover{opacity:0.8}

.spinner{width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;z-index:200;background:rgba(11,31,30,.96);border:1px solid rgba(45,212,191,.34);color:#8ce7da;padding:10px 16px;border-radius:10px;box-shadow:0 16px 40px -24px rgba(0,0,0,.9);font-size:11px;animation:slideIn .3s ease,fadeOut .5s ease 3s forwards;pointer-events:none}
@keyframes slideIn{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes hq-scan{0%{opacity:0;transform:translateX(-110%)}35%{opacity:1}100%{opacity:0;transform:translateX(110%)}}
@keyframes hq-icon-draw{0%{stroke-dasharray:2 32;stroke-dashoffset:18;opacity:.35}100%{stroke-dasharray:48 0;stroke-dashoffset:0;opacity:1}}
@keyframes hq-seed{0%{opacity:0;transform:translate(-3px,3px) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(7px,-9px) scale(1.2)}}
@keyframes welcome-spark{0%,100%{opacity:.35;transform:scale(.72) rotate(-8deg)}50%{opacity:1;transform:scale(1.08) rotate(4deg)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(148,164,187,.14);border-radius:2px}
@media(max-width:720px){
  body:before{mask-image:none;opacity:.18}
  .lsb{position:fixed;left:0;top:0;z-index:60;width:min(300px,88vw);min-width:0;transform:translateX(-102%);transition:transform .25s;box-shadow:30px 0 70px rgba(0,0,0,.52)}
  .lsb.open{transform:translateX(0)}
  .sidebar-close{display:grid;place-items:center}
  .mobile-menu{display:grid;place-items:center;width:30px;height:30px;padding:0}
  .top-bar{min-height:52px;padding:9px 12px}
  .top-bar .cur-mod{flex:1}
  .rpn.open{position:fixed;inset:0;z-index:70;width:100%;min-width:100%}
  .rpn-inner{width:100%;height:100%;padding:14px}
  .chat-area{padding:12px}
  .welcome{min-height:390px;padding:30px 18px;border-radius:18px}
  .welcome h2{font-size:22px}
  .welcome .big-icon{width:62px;height:62px;border-radius:18px}

function moduleIcon(name){return '<span class="module-icon" aria-hidden="true"><svg viewBox="0 0 24 24">'+(ICONS[name]||ICONS.sparkles)+'</svg></span>'}
document.querySelectorAll('[data-icon]').forEach(function(el){el.insertAdjacentHTML('afterbegin',moduleIcon(el.dataset.icon))});

// Module list
var M=[{id:1,name:"定位诊断",icon:"target"},{id:2,name:"人设塑造",icon:"user"},{id:3,name:"价值主张",icon:"sparkles"},{id:4,name:"故事资产",icon:"book"},{id:5,name:"选题策划",icon:"layers"},{id:6,name:"文案口播",icon:"edit"},{id:7,name:"形象设计",icon:"image"},{id:8,name:"脚本分镜",icon:"video"},{id:9,name:"私域矩阵",icon:"link"},{id:10,name:"朋友圈运营",icon:"message"},{id:11,name:"销售策略",icon:"trend"},{id:12,name:"公众号变现",icon:"calendar"}];
var AVAILABLE_MODULE_COUNT=6;

// Module → sub-skills map
var SKILL_MAP={};
SKILL_MAP[1]=[{id:'competitor',icon:'search',name:'竞品定位对比',api:'/api/m1-competitor',help:'分析赛道竞品的定位，找到你的差异化切入点'}];
SKILL_MAP[2]=[{id:'persona',icon:'user',name:'人设卡片',api:'/api/m2-persona',help:'生成你的人设标签、口头禅、镜头状态建议'}];
SKILL_MAP[3]=[{id:'value',icon:'sparkles',name:'价值金字塔',api:'/api/m3-value',help:'构建价值金字塔：主张→信任状→卖点→痛点'}];
SKILL_MAP[4]=[{id:'story',icon:'book',name:'故事资产库',api:'/api/m4-story',help:'收集你的经历故事，打造个人品牌资产库'}];
SKILL_MAP[5]=[{id:'hooks',icon:'layers',name:'Hook钩子生成',api:'/api/m5-hooks',help:'为一个选题生成10个钩子'}];
SKILL_MAP[6]=[{id:'deliverable-6',icon:'edit',name:'专属文案包',api:'/api/generate-deliverable',help:'生成朋友圈、口播和私信文案'}];
SKILL_MAP[7]=[{id:'images',icon:'image',name:'形象预览',api:'/api/module7-images',help:'生成头像、封面和朋友圈配图参考'}];
SKILL_MAP[8]=[{id:'videos',icon:'video',name:'视频脚本',api:'/api/module8-video',help:'生成脚本和画面参考'}];
SKILL_MAP[9]=[{id:'funnel',icon:'link',name:'私域漏斗',api:'/api/m9-funnel',help:'设计私域转化漏斗'}];
SKILL_MAP[10]=[{id:'deliverable-10',icon:'message',name:'朋友圈排期',api:'/api/generate-deliverable',help:'生成7天朋友圈排期'}];
SKILL_MAP[11]=[{id:'sales',icon:'trend',name:'成交话术',api:'/api/m11-sales',help:'生成私域成交SOP话术'}];
SKILL_MAP[12]=[{id:'calendar',icon:'calendar',name:'公众号日历',api:'/api/m12-calendar',help:'生成公众号30天内容日历'}];

var cid=null,state={current_module:1,completed_modules:[],module_step:0,ip_profile:{},intake:{status:'complete'}},reports={},deliverables={},streaming=false,convos=[];
var expandedMod=0;
var WELCOME_HTML=document.getElementById('welcome').outerHTML;

function toggleExpand(mid){
  if(expandedMod===mid){expandedMod=0}else{expandedMod=mid}
  renderMods()
}

function loadSkill(sid){
  if(sid==='images'){loadPanel('images');return}
  if(sid==='videos'){loadPanel('videos');return}
  if(sid.indexOf('deliverable-')===0){viewDeliverable(Number(sid.split('-')[1]));return}
  if(sid==='video-factory'){
    openPanel('视频工厂')
    document.getElementById('rpnBody').innerHTML='<div class="rpn-card"><div class="rpn-card-header">🎥 视频工厂</div><p style="font-size:12px;color:var(--dim)">通义万相出图 + edge-tts配音 + FFmpeg合成</p><input id="vfTopic" placeholder="输入视频主题..." style="width:100%;padding:8px;background:var(--ib);border:1px solid var(--bd);color:var(--tx);border-radius:6px;margin:6px 0;font-size:12px"><button class="copy-btn" onclick="runVideoFactory()" style="margin-top:8px">生成视频</button><div id="vfResult"></div></div>'
  }else if(sid==='video-analyzer'){
    openPanel('对标分析')
    document.getElementById('rpnBody').innerHTML='<div class="rpn-card"><div class="rpn-card-header">📊 对标分析</div><p style="font-size:12px;color:var(--dim)">下载对标视频 → 语音转文字 → AI拆解结构</p><input id="vaUrl" placeholder="粘贴对标视频URL..." style="width:100%;padding:8px;background:var(--ib);border:1px solid var(--bd);color:var(--tx);border-radius:6px;margin:6px 0;font-size:12px"><button class="copy-btn" onclick="runVideoAnalyzer()" style="margin-top:8px">分析</button><div id="vaResult"></div></div>'
  }else{
    openPath('/skills')
  }
}

function openPath(path){window.location.href=path}

async function runVideoFactory(){
  var topic=document.getElementById('vfTopic').value||'美业IP推广';
  document.getElementById('vfResult').innerHTML='<div class="spinner"></div><p style="font-size:11px;color:var(--dim)">生成中...（约60秒）</p>';
  try{
    var r=await fetch('/api/generate-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic,conversation_id:cid||''})});
    var d=await r.json();
    if(d.ok){document.getElementById('vfResult').innerHTML='<p style="color:var(--gr);margin:8px 0">✅ 视频生成成功！</p><video src="'+eHtml(isSafeMarkdownUrl(d.video_url,location.href)?d.video_url:'')+'" controls style="width:100%;max-width:360px;border-radius:8px;margin:8px 0"></video><pre style="font-size:10px;max-height:200px">'+eHtml(d.script||'')+'</pre>'}
    else{document.getElementById('vfResult').innerHTML='<p style="color:#ef4444">❌ '+eHtml(d.error||'生成失败')+'</p>'}
  }catch(e){document.getElementById('vfResult').innerHTML='<p style="color:#ef4444">❌ '+eHtml(e.message)+'</p>'}
}

async function runVideoAnalyzer(){
  var url=document.getElementById('vaUrl').value;
  if(!url){document.getElementById('vaResult').innerHTML='<p style="color:#ef4444">请输入视频URL</p>';return}
  document.getElementById('vaResult').innerHTML='<div class="spinner"></div><p style="font-size:11px;color:var(--dim)">下载+分析中...</p>';
  try{
    var r=await fetch('/api/analyze-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,conversation_id:cid||''})});
    var d=await r.json();
    if(d.ok){document.getElementById('vaResult').innerHTML=md(d.analysis||d.transcript||'分析完成')}
    else{document.getElementById('vaResult').innerHTML='<p style="color:#ef4444">❌ '+eHtml(d.error||'分析失败')+'</p>'}
  }catch(e){document.getElementById('vaResult').innerHTML='<p style="color:#ef4444">❌ '+eHtml(e.message)+'</p>'}
}

function renderMods(){
  var done=(state.completed_modules||[]).filter(function(mid){return mid<=AVAILABLE_MODULE_COUNT}),cur=Math.min(state.current_module||1,AVAILABLE_MODULE_COUNT);
  var foundation=state.foundation_report||{};
  var intakePending=state.intake&&state.intake.status==='collecting',intakeRound=intakePending?(state.intake.round||1):0;
  var html='';
  for(var i=0;i<M.length;i++){
    var m=M[i];
    var cls='mod-item',badge='',check='',expand='<span class="mod-expand">▶</span>';
    var comingSoon=m.id>AVAILABLE_MODULE_COUNT;
    var locked=comingSoon||intakePending||(m.id>=5&&foundation.status!=='confirmed');
    if(locked){cls+=' locked';badge=comingSoon?'<span class="mod-badge">尚未开发，敬请期待</span>':(intakePending&&m.id===1?'<span class="mod-badge">基础信息 '+intakeRound+'/3</span>':(intakePending?'':'<span class="mod-badge">待确认 PDF</span>'))}
    if(done.indexOf(m.id)>=0){cls+=' done';check='<span style="color:var(--gr);font-size:12px">✓</span>'}
    if(!intakePending&&m.id===cur&&done.indexOf(m.id)<0){cls+=' cur';badge='<span class="mod-badge">进行中</span>'}
    if(intakePending&&m.id===1)cls+=' cur';
    if(m.id===expandedMod)cls+=' expanded';
    var hasSub=!comingSoon&&!!SKILL_MAP[m.id];
    var subs='';
    if(hasSub){
      var skills=SKILL_MAP[m.id];
      for(var j=0;j<skills.length;j++){
        var s=skills[j];
        subs+='<div class="mod-sub" onclick="event.stopPropagation();loadSkill(\''+s.id+'\')">'+moduleIcon(s.icon)+eHtml(s.name)+'</div>';
      }
    }
    var click=comingSoon?"toast('尚未开发，敬请期待')":(locked?(intakePending?"toast('请先完成 3 轮基础信息')":"toast('请先确认模块 1-4 的 IP 定位初稿 PDF')"):(hasSub?'toggleExpand('+m.id+')':'jumpModule('+m.id+')'));
    html+='<div class="'+cls+'" onclick="'+click+'"><div class="mod-num">'+(done.indexOf(m.id)>=0?'✓':m.id)+'</div><div class="mod-info"><div class="mod-name">'+moduleIcon(m.icon)+m.name+'</div></div>'+badge+check+(hasSub?expand:'')+subs+'</div>';
  }
  document.getElementById('modScroll').innerHTML=html;
  var dc=done.length;
  document.getElementById('progBar').style.width=Math.round(dc/AVAILABLE_MODULE_COUNT*100)+'%';
  document.getElementById('progText').textContent=dc===AVAILABLE_MODULE_COUNT?'🎉 六步完成':dc+'/'+AVAILABLE_MODULE_COUNT;
  var mod=M.filter(function(m){return m.id===cur})[0];
  document.getElementById('curModName').textContent=intakePending?'基础信息 · '+intakeRound+'/3':(mod?mod.name:'—');
  renderArtifacts();
}

renderMods();
loadConvos().then(function(){var requested=new URLSearchParams(location.search).get('conversation_id');var target=convos.find(function(c){return c.id===requested});if(target)selectConvo(target.id);else if(convos.length>0)selectConvo(convos[0].id)});

async function loadConvos(){var r=await fetch('/api/conversations');convos=await r.json()}
async function newDiagnosis(){var r=await fetch('/api/conversations',{method:'POST'});var d=await r.json();convos.unshift({id:d.id,title:'新诊断',current_module:1,completed_modules:[],message_count:1});selectConvo(d.id)}
async function selectConvo(id){cid=id;var r=await fetch('/api/conversations/'+id);var c=await r.json();state=c.coach_state||{current_module:1,completed_modules:[],module_step:0,ip_profile:{},intake:{status:'complete'}};reports=c.reports||{};deliverables=c.deliverables||{};expandedMod=0;renderMods();renderChat(c.messages||[]);document.getElementById('userInput').disabled=false;document.getElementById('sendBtn').disabled=false;document.getElementById('userInput').focus()}
async function jumpModule(mid){if(mid>AVAILABLE_MODULE_COUNT){toast('尚未开发，敬请期待');return}if(!cid||streaming)return;var r=await fetch('/api/jump-module',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,module:mid})});var d=await r.json();if(!r.ok||!d.ok){toast('❌ '+(d.error||'无法切换模块'));return}state.current_module=d.current_module;state.module_step=0;renderMods();sendJumpMsg(mid)}

function renderChat(msgs){var a=document.getElementById('chatArea');if(!msgs||msgs.length===0){a.innerHTML=WELCOME_HTML;return}a.innerHTML=msgs.map(function(m){return '<div class="msg '+(m.role==='user'?'user':'assistant')+'"><div class="av">'+moduleIcon(m.role==='user'?'user':'sparkles')+'</div><div class="bubble">'+md(m.content)+'</div></div>'}).join('')}
function isSafeMarkdownUrl(value,base='https://huangque.invalid/'){try{var u=new URL(String(value??'').trim(),base);return u.protocol==='http:'||u.protocol==='https:'}catch(e){return false}}
function sanitizeMarked(html){var t=document.createElement('template');t.innerHTML=html;t.content.querySelectorAll('a[href],img[src]').forEach(function(el){var attr=el.tagName==='A'?'href':'src';if(!isSafeMarkdownUrl(el.getAttribute(attr),location.href)){if(el.tagName==='A')el.replaceWith(document.createTextNode(el.textContent));else el.remove()}else if(el.tagName==='A'){el.rel='noopener noreferrer'}});return t.innerHTML}
function md(t){if(!t)return'';try{if(typeof marked!=='undefined')return sanitizeMarked(marked.parse(eHtml(t)))}catch(e){return eHtml(t).replace(/\n/g,'<br>')}return eHtml(t).replace(/\n/g,'<br>')}
function eHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function scroll(){var a=document.getElementById('chatArea');requestAnimationFrame(function(){a.scrollTop=a.scrollHeight})}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3500)}

function renderArtifacts(){
  var rows=[],done=(state.completed_modules||[]).filter(function(mid){return mid<=AVAILABLE_MODULE_COUNT});
  Object.keys(reports).forEach(function(mid){mid=Number(mid);if(mid>=1&&mid<=AVAILABLE_MODULE_COUNT&&done.indexOf(mid)<0)done.push(mid)});
  done.forEach(function(mid){rows.push('<button onclick="viewReport('+mid+')">📄 '+eHtml(M[mid-1].name)+'报告</button>')});
  Object.keys(deliverables).filter(function(mid){return !/^\d+$/.test(mid)||Number(mid)<=AVAILABLE_MODULE_COUNT}).forEach(function(mid){var d=deliverables[mid]||{},mod=M[Number(mid)-1],arg=/^\d+$/.test(mid)?mid:"'topic_radar'";rows.push('<button onclick="viewDeliverable('+arg+')">📦 '+eHtml(d.title||(mod?mod.name+'交付物':'交付物'))+'</button>')});
  var foundation=state.foundation_report||{};
  if(foundation.status==='awaiting_confirmation'||foundation.status==='confirmed'){
    rows.push('<button onclick="openFoundationReport()">📑 模块 1-4 IP 定位初稿 PDF</button>');
    if(foundation.status==='awaiting_confirmation')rows.push('<button onclick="confirmFoundationReport()">✅ 确认初稿，开始模块 5</button>');
  }else if(done.indexOf(4)>=0){
    rows.push('<button onclick="generateFoundationReport()">'+(foundation.status==='failed'?'↻ 重新生成':'⏳ 检查/重试')+'模块 1-4 PDF</button>');
  }
  var wrap=document.getElementById('artifactsWrap'),box=document.getElementById('artifactRows');
  wrap.style.display=(cid&&rows.length)?'block':'none';
  box.innerHTML=rows.join('');
}

async function generateFoundationReport(){
  if(!cid||streaming)return;streaming=true;toast('正在生成模块 1-4 PDF…');
  try{var r=await fetch('/api/foundation-report/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid})});var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'PDF 生成失败');state=d.state;renderMods();toast('✅ PDF 已生成，请下载查看并确认')}
  catch(e){toast('❌ '+e.message)}finally{streaming=false}
}

async function openFoundationReport(){
  if(!cid)return;var url='/api/foundation-report/'+cid+'.pdf';var r=await fetch(url,{method:'HEAD',cache:'no-store'});
  if(!r.ok){state.foundation_report={status:'failed'};renderMods();toast('❌ PDF 文件不可用，请重新生成');return}window.open(url,'_blank','noopener')
}

async function confirmFoundationReport(){
  if(!cid||streaming)return;
  try{var r=await fetch('/api/foundation-report/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid})});var d=await r.json();if(!d.ok)throw new Error(d.error||'确认失败');state=d.state;renderMods();toast('✅ IP 定位初稿已确认，继续模块 '+state.current_module);if((state.completed_modules||[]).indexOf(state.current_module)<0)sendJumpMsg(state.current_module)}catch(e){toast('❌ '+e.message)}
}

async function viewReport(mid){
  if(!cid)return;
  openPanel('📄 '+M[mid-1].name+'报告');
  var body=document.getElementById('rpnBody'),saved=reports[String(mid)]||reports[mid];
  if(saved){body.innerHTML='<div class="rpn-card">'+md(saved.content||saved)+'</div>';return}
  body.innerHTML='<div class="spinner"></div><p style="color:var(--dim)">正在生成报告...</p>';
  try{var r=await fetch('/api/generate-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,module:mid})});var d=await r.json();if(!d.ok)throw new Error(d.error||'报告生成失败');reports[String(mid)]={title:M[mid-1].name+'报告',content:d.report,generated_at:new Date().toISOString()};body.innerHTML='<div class="rpn-card">'+md(d.report)+'</div>';renderArtifacts()}catch(e){body.innerHTML='<p style="color:#ef4444">❌ '+eHtml(e.message)+'</p>'}
}

async function viewDeliverable(mid){
  if(!cid)return;
  var saved=deliverables[String(mid)]||deliverables[mid],mod=M[Number(mid)-1];
  openPanel('📦 '+(mod?mod.name+'交付物':(saved&&saved.title)||'交付物'));
  var body=document.getElementById('rpnBody');
  if(saved){renderDeliverable(saved,body);return}
  body.innerHTML='<div class="spinner"></div><p style="color:var(--dim)">正在生成交付物...</p>';
  try{var r=await fetch('/api/generate-deliverable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,module:mid})});var d=await r.json();if(!d.ok)throw new Error(d.error||'交付物生成失败');deliverables[String(mid)]=d.deliverable;renderDeliverable(d.deliverable,body);renderArtifacts()}catch(e){body.innerHTML='<p style="color:#ef4444">❌ '+eHtml(e.message)+'</p>'}
}

function renderDeliverable(item,body){var html='<div class="rpn-card"><div class="rpn-card-header">'+eHtml(item.title||'交付物')+'</div>';Object.keys(item.items||{}).forEach(function(name){html+='<h3>'+eHtml(name)+'</h3>'+md(item.items[name])});body.innerHTML=html+'</div>'}

async function deleteConvo(id){if(!confirm('删除这个诊断记录？'))return;await fetch('/api/conversations/'+id,{method:'DELETE'});convos=convos.filter(function(c){return c.id!==id});if(cid===id){cid=null;state={current_module:1,completed_modules:[],module_step:0,ip_profile:{},intake:{status:'complete'}};reports={};deliverables={};renderMods();renderChat([]);document.getElementById('userInput').disabled=true;document.getElementById('sendBtn').disabled=true}toggleConvos();toggleConvos()}

// ── RIGHT PANEL ──
function openPanel(title){document.getElementById('rpnTitle').textContent=title;document.getElementById('rpn').classList.add('open')}
function closePanel(){document.getElementById('rpn').classList.remove('open')}

async function loadPanel(type){
  var labels={'images':'🎨 形象预览','videos':'🎬 视频脚本','geo':'🔎 GEO分析','radar':'📡 选题雷达'};
  openPanel(labels[type]||type);
  var body=document.getElementById('rpnBody');
  body.innerHTML='<div class="spinner"></div>';
  if(type==='images'){
    try{
      var r=await fetch('/api/module7-images',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      var d=await r.json();
      if(d.ok&&d.images){
        var imgLabels={avatar:'头像风格',cover:'封面风格',lifestyle:'朋友圈配图'};
        body.innerHTML=Object.keys(d.images).map(function(k){var u=isSafeMarkdownUrl(d.images[k],location.href)?d.images[k]:'';return '<div class="rpn-card"><div class="rpn-card-header">'+eHtml(imgLabels[k]||k)+'</div><img src="'+eHtml(u)+'" style="width:100%;max-width:300px;border-radius:8px;background:var(--card)"><div style="font-size:11px;color:var(--dim);margin-top:6px">AI生成 · 风格参考</div></div>'}).join('');
      }else{body.innerHTML='<p style="color:#ef4444">生成失败</p>'}
    }catch(e){body.innerHTML='<p style="color:#ef4444">'+eHtml(e.message)+'</p>'}
  }else if(type==='videos'){
    try{
      var r2=await fetch('/api/module8-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:'美业拓客'})});
      var d2=await r2.json();
      if(d2.ok&&d2.videos){
        body.innerHTML=d2.videos.map(function(v){var u=isSafeMarkdownUrl(v.preview,location.href)?v.preview:'';return '<div class="rpn-card"><div class="rpn-card-header">'+eHtml(v.name)+'</div><img src="'+eHtml(u)+'" style="width:100%;max-width:250px;border-radius:8px;background:var(--card)"><pre>'+eHtml(v.script)+'</pre><div style="font-size:11px;color:var(--gr)">推荐：'+(v.tools||[]).map(eHtml).join(' / ')+'</div><button class="copy-btn" onclick="navigator.clipboard.writeText(this.previousElementSibling.previousElementSibling.textContent);toast(\'已复制\')">📋 复制提示词</button></div>'}).join('');
      }else{body.innerHTML='<p style="color:#ef4444">生成失败</p>'}
    }catch(e){body.innerHTML='<p style="color:#ef4444">'+eHtml(e.message)+'</p>'}
  }else if(type==='geo'){
    body.innerHTML='<div class="rpn-card"><div class="rpn-card-header">GEO 分析</div><input id="geoBiz" placeholder="品牌名称" style="width:100%;padding:8px;background:var(--ib);border:1px solid var(--bd);color:var(--tx);border-radius:6px;margin:6px 0;font-size:12px"><input id="geoKW" placeholder="关键词" style="width:100%;padding:8px;background:var(--ib);border:1px solid var(--bd);color:var(--tx);border-radius:6px;margin:6px 0;font-size:12px"><button class="copy-btn" onclick="runGEO()" style="margin-top:8px">分析</button><div id="geoResult"></div></div>'
  }else if(type==='radar'){
    body.innerHTML='<div class="rpn-card"><div class="rpn-card-header">选题雷达</div><input id="radarKW" placeholder="关键词（用逗号分隔）" style="width:100%;padding:8px;background:var(--ib);border:1px solid var(--bd);color:var(--tx);border-radius:6px;margin:6px 0;font-size:12px"><button class="copy-btn" onclick="runRadar()" style="margin-top:8px">扫描</button><div id="radarResult"></div></div>'
  }
}

async function runGEO(){
  var biz=document.getElementById('geoBiz').value,kw=document.getElementById('geoKW').value;
  if(!biz||!kw)return;
  document.getElementById('geoResult').innerHTML='<div class="spinner"></div>';
  try{
    var r=await fetch('/api/geo-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_name:biz,business_type:'美业',keywords:kw})});
    var d=await r.json();
    document.getElementById('geoResult').innerHTML=d.ok?md(d.report):'<p style="color:#ef4444">'+eHtml(d.error)+'</p>';
  }catch(e){document.getElementById('geoResult').innerHTML='<p style="color:#ef4444">'+eHtml(e.message)+'</p>'}
}

async function runRadar(){
  var kw=document.getElementById('radarKW').value;if(!kw)return;
  document.getElementById('radarResult').innerHTML='<div class="spinner"></div>';
  try{
    var r=await fetch('/api/topic-radar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keywords:kw,niche:'美业',conversation_id:cid||''})});
    var d=await r.json();
    document.getElementById('radarResult').innerHTML=d.ok?md(d.report):'<p style="color:#ef4444">'+eHtml(d.error)+'</p>';
  }catch(e){document.getElementById('radarResult').innerHTML='<p style="color:#ef4444">'+eHtml(e.message)+'</p>'}
}

// ── CHAT ──
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
async function sendMessage(){
  if(streaming||!cid)return;
  var input=document.getElementById('userInput'),text=input.value.trim();if(!text)return;
  input.value='';document.getElementById('sendBtn').disabled=true;streaming=true;
  var area=document.getElementById('chatArea'),welcome=area.querySelector('.welcome');if(welcome)welcome.remove();
  var um=document.createElement('div');um.className='msg user';um.innerHTML='<div class="av">'+moduleIcon('user')+'</div><div class="bubble">'+eHtml(text).replace(/\n/g,'<br>')+'</div>';area.appendChild(um);
  var am=document.createElement('div');am.className='msg assistant';am.innerHTML='<div class="av">'+moduleIcon('sparkles')+'</div><div class="bubble"><div class="typing" style="display:flex;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite .2s"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite .4s"></span></div></div>';area.appendChild(am);scroll();
  var full='';var bubble=am.querySelector('.bubble');
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,message:text})});
    if(!r.ok){var errorData=await r.json();throw new Error(errorData.error||'发送失败')}
    var reader=r.body.getReader(),decoder=new TextDecoder(),buf='';
    while(true){var part=await reader.read();if(part.done)break;buf+=decoder.decode(part.value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';for(var i=0;i<lines.length;i++){var line=lines[i];if(!line.startsWith('data: '))continue;try{var data=JSON.parse(line.slice(6));if(data.error){bubble.innerHTML='<span style="color:#ef4444">❌ '+eHtml(data.error)+'</span>'}else if(data.content){full+=data.content;bubble.innerHTML=md(full)+'<span class="cursor" style="color:var(--ac)">▍</span>';scroll()}else if(data.done){bubble.innerHTML=md(full);if(data.state){state=data.state;renderMods()}if(data.auto_deliverables){Object.keys(data.auto_deliverables).forEach(function(mid){deliverables[mid]=data.auto_deliverables[mid]});renderArtifacts()}if(data.new_completed&&data.new_completed.length>0){data.new_completed.forEach(function(mid){toast('✅ '+M[mid-1].name+'完成！')});renderMods()}}}catch(e){}}}
  }catch(e){bubble.innerHTML='<span style="color:#ef4444">❌ '+eHtml(e.message)+'</span>'}
  streaming=false;document.getElementById('sendBtn').disabled=false;document.getElementById('userInput').focus()
}

async function sendJumpMsg(mid){
  streaming=true;var area=document.getElementById('chatArea');
  var um=document.createElement('div');um.className='msg user';um.innerHTML='<div class="av">'+moduleIcon('user')+'</div><div class="bubble">跳到模块'+mid+'</div>';area.appendChild(um);
  var am=document.createElement('div');am.className='msg assistant';am.innerHTML='<div class="av">'+moduleIcon('sparkles')+'</div><div class="bubble"><div class="typing" style="display:flex;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite .2s"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite .4s"></span></div></div>';area.appendChild(am);scroll();
  var full='';var bubble=am.querySelector('.bubble');
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,message:'跳到模块 '+mid})});
    if(!r.ok){var errorData=await r.json();throw new Error(errorData.error||'发送失败')}
    var reader=r.body.getReader(),decoder=new TextDecoder(),buf='';
    while(true){var part=await reader.read();if(part.done)break;buf+=decoder.decode(part.value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';for(var i=0;i<lines.length;i++){var line=lines[i];if(!line.startsWith('data: '))continue;try{var data=JSON.parse(line.slice(6));if(data.error){bubble.innerHTML='<span style="color:#ef4444">❌ '+eHtml(data.error)+'</span>'}else if(data.content){full+=data.content;bubble.innerHTML=md(full)+'<span class="cursor" style="color:var(--ac)">▍</span>';scroll()}else if(data.done){bubble.innerHTML=md(full);if(data.state){state=data.state;renderMods()}}}catch(e){}}}
  }catch(e){bubble.innerHTML='<span style="color:#ef4444">❌ '+eHtml(e.message)+'</span>'}
  streaming=false
}

function toggleConvos(){
  var o=document.getElementById('convoOverlay');if(o.style.display==='flex'){o.style.display='none';return}
  loadConvos().then(function(){var p=document.getElementById('convoPanel');p.innerHTML='<button style="float:right;background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px" onclick="toggleConvos()">✕</button><h3 style="margin-bottom:10px;font-size:14px">历史诊断</h3>'+(convos.length===0?'<p style="color:var(--dim);font-size:12px">暂无</p>':convos.map(function(c){return '<div data-id="'+eHtml(c.id)+'" style="display:flex;justify-content:space-between;padding:8px;cursor:pointer;font-size:12px;border-radius:6px" onclick="selectConvo(this.dataset.id);toggleConvos()"><span>'+eHtml(c.title)+'<span style="color:var(--acb);font-family:monospace;font-size:9px;margin-left:6px">'+eHtml(c.id)+'</span></span><span style="color:var(--dim);font-size:10px">模块'+eHtml(c.current_module)+' · '+eHtml(c.message_count)+'条 <button data-id="'+eHtml(c.id)+'" style="background:none;border:none;color:#ef4444;cursor:pointer" onclick="event.stopPropagation();deleteConvo(this.dataset.id)">🗑</button></span></div>'}).join(''));o.style.display='flex'})
}

document.getElementById('userInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
</script>
