<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>IP孵化教练 v6</title>
<script src="https://unpkg.com/marked@15.0.12/lib/marked.umd.js"></script>
<style>
:root {
  --bg:#070b13;--sb:#0a101b;--card:#101722;--bd:rgba(148,164,187,.12);--tx:#eaf1fa;--dim:#718197;
  --ac:#e7b24c;--acb:#f1c768;--ag:rgba(231,178,76,.12);--gr:#2dd4bf;
  --gb:rgba(45,212,191,.1);--wa:#f4cd72;--ub:#182336;--ab:rgba(14,20,31,.96);--ib:rgba(9,14,23,.88);
  --r:14px;--rs:9px;--f:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{position:relative;font-family:var(--f);background:radial-gradient(circle at 72% 2%,rgba(231,178,76,.09),transparent 27%),radial-gradient(circle at 62% 100%,rgba(45,212,191,.045),transparent 34%),var(--bg);color:var(--tx);height:100vh;display:flex;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(circle at 1px 1px,rgba(148,164,187,.13) 1px,transparent 0);background-size:24px 24px;mask-image:linear-gradient(90deg,transparent 250px,#000 40%,transparent 92%)}
button,input,textarea{font:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid rgba(231,178,76,.7);outline-offset:2px}

/* ── LEFT SIDEBAR ── */
.lsb{position:relative;isolation:isolate;width:280px;min-width:280px;background:linear-gradient(180deg,rgba(12,18,29,.98),rgba(7,12,21,.98));border-right:1px solid rgba(148,164,187,.1);box-shadow:16px 0 44px -34px rgba(0,0,0,.9),inset -1px 0 rgba(231,178,76,.055);display:flex;flex-direction:column;height:100vh;z-index:10;overflow:hidden;backdrop-filter:blur(18px)}
.lsb:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(230px circle at 12% 4%,rgba(231,178,76,.12),transparent 70%),radial-gradient(210px circle at 90% 92%,rgba(45,212,191,.045),transparent 72%)}
.lsb-hd{min-height:76px;display:flex;align-items:center;gap:11px;padding:15px 14px;border-bottom:1px solid rgba(148,164,187,.09)}
.brand-emblem{position:relative;width:38px;height:38px;display:grid;place-items:center;flex:none;border:1px solid rgba(231,178,76,.34);border-radius:12px;background:linear-gradient(145deg,rgba(231,178,76,.18),rgba(231,178,76,.06));color:#f4cd72;box-shadow:0 12px 28px -20px rgba(231,178,76,.85),inset 0 1px rgba(255,255,255,.08)}
.brand-emblem:after{content:"";position:absolute;right:5px;top:5px;width:4px;height:4px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 8px rgba(45,212,191,.85)}
.brand-emblem svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.brand-copy{min-width:0}
.brand-kicker{margin-bottom:3px;color:#8f9db0;font-size:8px;font-weight:800;letter-spacing:.16em}
.lsb-hd h1{font-size:13px;font-weight:800;color:#f4f7fb;letter-spacing:.01em}
.lsb-hd .sub{margin-top:3px;font-size:9px;color:#68788f}
.sidebar-close{display:none;margin-left:auto;width:30px;height:30px;border:0;border-radius:8px;background:rgba(148,164,187,.05);color:#8c9aaf;cursor:pointer;font-size:16px}
.prog-wrap{padding:12px 14px 13px;border-bottom:1px solid rgba(148,164,187,.08);background:rgba(148,164,187,.018)}
.prog-lbl{font-size:10px;color:#718197;display:flex;justify-content:space-between}
.prog-lbl span:last-child{color:var(--acb);font-weight:750}
.prog-bar{height:4px;background:rgba(148,164,187,.1);border-radius:999px;overflow:hidden;margin-top:8px;box-shadow:inset 0 1px rgba(0,0,0,.3)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gr),var(--ac));border-radius:inherit;box-shadow:0 0 12px rgba(45,212,191,.24);transition:width .5s}
.sec-lbl{display:flex;align-items:center;gap:8px;font-size:9px;text-transform:uppercase;letter-spacing:1.25px;color:#637189;padding:10px 14px 4px;cursor:pointer;user-select:none}
.sec-lbl:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(148,164,187,.1),transparent)}
.sec-lbl:hover{color:#aeb9c8}

/* Module list */
.mod-scroll{overflow-y:auto;flex:1;padding:4px 8px 8px;scrollbar-width:none}
.mod-scroll::-webkit-scrollbar{display:none}
.mod-item{position:relative;display:flex;align-items:center;gap:8px;min-height:43px;padding:6px 8px;border:1px solid transparent;border-radius:11px;cursor:pointer;font-size:12px;transition:color .18s,background .18s,border-color .18s,box-shadow .18s;user-select:none;flex-wrap:wrap;overflow:hidden}
.mod-item:before{content:"";position:absolute;inset:2px;border-radius:9px;background:linear-gradient(105deg,transparent 18%,rgba(231,178,76,.09) 48%,transparent 78%);opacity:0;transform:translateX(-110%);pointer-events:none}
.mod-item:hover{color:#fff;background:rgba(231,178,76,.055);border-color:rgba(231,178,76,.12)}
.mod-item:hover:before{animation:hq-scan .72s cubic-bezier(.22,1,.36,1)}
.mod-item.cur{background:linear-gradient(105deg,rgba(231,178,76,.16),rgba(231,178,76,.065));border-color:rgba(231,178,76,.28);box-shadow:0 12px 28px -22px rgba(231,178,76,.72),inset 0 1px rgba(255,255,255,.06)}
.mod-item.cur:after{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:3px;background:#f1c768;box-shadow:0 0 10px rgba(231,178,76,.7)}
.mod-item.done{color:#bcd8d4}
.mod-item.locked{opacity:.4;cursor:not-allowed}
.mod-item.locked:hover{background:transparent;border-color:transparent;color:inherit}
.mod-item .mod-row{display:flex;align-items:center;gap:8px;width:100%}
.mod-num{width:24px;height:24px;border:1px solid rgba(148,164,187,.13);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;background:rgba(148,164,187,.045);color:#6f8096}
.mod-item.cur .mod-num{border-color:rgba(231,178,76,.34);background:rgba(231,178,76,.14);color:#f4cd72}
.mod-item.done .mod-num{border-color:rgba(45,212,191,.28);background:rgba(45,212,191,.1);color:#7ce8d8}
.mod-info{flex:1;min-width:0}
.mod-name{display:flex;align-items:center;gap:8px;font-weight:650;color:#bcc8d7}
.mod-item:hover .mod-name,.mod-item.cur .mod-name{color:#f3f6fa}
.module-icon{position:relative;width:18px;height:18px;display:grid;place-items:center;flex:none;color:#8090a5}
.module-icon svg{width:18px;height:18px;display:block;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.module-icon .icon-accent{color:#e7b24c;stroke:currentColor}
.mod-item:hover .module-icon,.mod-item.cur .module-icon,.tool-row button:hover .module-icon,.top-action:hover .module-icon,.lsb-ft button:hover .module-icon{color:#f3f6fa;filter:drop-shadow(0 0 7px rgba(231,178,76,.38))}
.mod-item:hover .module-icon svg>*,.tool-row button:hover .module-icon svg>*,.top-action:hover .module-icon svg>*,.lsb-ft button:hover .module-icon svg>*{animation:hq-icon-draw .72s cubic-bezier(.22,1,.36,1)}
.mod-item:hover .module-icon:before,.tool-row button:hover .module-icon:before{content:"";position:absolute;right:-2px;top:-2px;width:3px;height:3px;border-radius:50%;background:#f4cd72;box-shadow:0 0 7px rgba(244,205,114,.8);animation:hq-seed .68s ease-out}
.mod-badge{font-size:8px;padding:2px 5px;border:1px solid rgba(231,178,76,.14);border-radius:999px;background:rgba(231,178,76,.07);color:#cfae67;white-space:nowrap}
.mod-item.done .mod-badge{background:var(--gb);color:var(--gr)}
.mod-expand{font-size:8px;color:#5f6e82;transition:transform .2s;flex-shrink:0}
.mod-item.expanded .mod-expand{transform:rotate(90deg)}

/* Sub-skills */
.mod-sub{display:none;align-items:center;gap:7px;padding:7px 8px 7px 33px;cursor:pointer;font-size:10px;color:#718197;transition:all .15s;border-radius:8px;margin:1px 2px;width:100%}
.mod-item.expanded .mod-sub{display:block}
.mod-sub:hover{color:#eaf1fa;background:rgba(148,164,187,.055)}
.mod-sub .module-icon{display:inline-grid;width:15px;height:15px;margin-right:6px;vertical-align:middle}
.mod-sub .module-icon svg{width:15px;height:15px}
.mod-sub.artifact{color:#d9c28a;background:rgba(231,178,76,.035)}
.mod-sub.artifact:hover{color:#fff2c7;background:rgba(231,178,76,.1)}
.mod-sub-badge{float:right;margin-top:1px;padding:1px 5px;border:1px solid rgba(231,178,76,.18);border-radius:999px;color:#c7a85e;font-size:7px}

/* Tools */
.tools-wrap{border-top:1px solid rgba(148,164,187,.08);background:rgba(5,9,16,.22)}
.tools-wrap .tool-row{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px 10px}
.tools-wrap .tool-row button{display:flex;align-items:center;gap:6px;flex:0 0 calc(50% - 3px);min-width:0;min-height:31px;padding:6px 7px;border:1px solid rgba(148,164,187,.1);border-radius:8px;background:rgba(148,164,187,.025);color:#718197;cursor:pointer;font-size:9.5px;text-align:left;transition:color .16s,background .16s,border-color .16s,box-shadow .16s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools-wrap .tool-row button:hover{background:rgba(231,178,76,.08);border-color:rgba(231,178,76,.2);color:#f1eadb;box-shadow:0 10px 24px -20px rgba(231,178,76,.8)}
.tool-row .module-icon{width:15px;height:15px}
.tool-row .module-icon svg{width:15px;height:15px}
.tools-wrap.collapsed .tool-row{display:none}
.artifact-empty{padding:6px 12px 9px;color:var(--dim);font-size:10px}
.lsb-ft{padding:10px 12px 12px;border-top:1px solid rgba(148,164,187,.09);display:flex;gap:7px;background:rgba(4,8,14,.42)}
.lsb-ft button{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-height:34px;padding:7px;border:1px solid rgba(148,164,187,.12);border-radius:9px;background:rgba(148,164,187,.035);color:#b7c3d2;cursor:pointer;font-size:10px;transition:.16s}
.lsb-ft button:first-child{border-color:rgba(231,178,76,.25);background:rgba(231,178,76,.1);color:#f1c768}
.lsb-ft button:hover{transform:translateY(-1px);border-color:rgba(231,178,76,.28);background:rgba(231,178,76,.1);color:#fff}
.project-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.project-panel-head h3{font-size:14px}.project-count{color:var(--acb);font-size:10px}.project-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid rgba(148,164,187,.1);border-radius:9px;margin-top:7px;background:rgba(148,164,187,.025);cursor:pointer}.project-row:hover{border-color:rgba(231,178,76,.25);background:rgba(231,178,76,.06)}.project-row-main{min-width:0}.project-row-title{font-size:12px;color:#e8eef7}.project-row-meta{margin-top:3px;color:var(--dim);font-size:9px}.project-delete{border:0;background:transparent;color:#ef7777;cursor:pointer;padding:5px}.project-empty,.project-loading,.project-error{padding:20px 6px;color:var(--dim);font-size:11px;text-align:center}.project-error{color:#ef9a9a}
.project-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0 3px}.project-tools small{color:var(--dim);font-size:9px}.project-tool,.project-export{border:1px solid rgba(148,164,187,.16);border-radius:7px;background:rgba(148,164,187,.05);color:#c9d4e2;cursor:pointer;padding:6px 8px;font-size:9px}.project-tool:hover,.project-export:hover{border-color:rgba(231,178,76,.3);color:#f1c768}.project-row-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}

/* ── CENTER CHAT ── */
.main{position:relative;flex:1;display:flex;flex-direction:column;height:100vh;min-width:0;background:linear-gradient(180deg,rgba(7,11,19,.24),rgba(7,11,19,.74))}
.top-bar{position:relative;z-index:2;min-height:55px;padding:10px 22px;border-bottom:1px solid rgba(148,164,187,.09);background:rgba(7,11,19,.66);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;font-size:11px}
.top-bar .cur-mod{display:flex;align-items:center;gap:6px}
.top-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px rgba(45,212,191,.75)}
.top-bar strong{color:#f1c768}
.top-action{display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(148,164,187,.11);border-radius:8px;background:rgba(148,164,187,.035);color:#7f8fa5;cursor:pointer;font-size:10px;transition:.16s}
.top-action[hidden]{display:none}.production-entry{border-color:rgba(45,212,191,.24);color:#9cebdd;background:rgba(45,212,191,.07)}
.top-action:hover{border-color:rgba(231,178,76,.24);background:rgba(231,178,76,.08);color:#f3f6fa}
.top-action .module-icon{width:14px;height:14px}.top-action .module-icon svg{width:14px;height:14px}
.mobile-menu{display:none}
.chat-area{position:relative;z-index:1;flex:1;overflow-y:auto;padding:26px 32px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(148,164,187,.16) transparent}
.welcome{position:relative;isolation:isolate;flex:1;width:min(620px,100%);min-height:390px;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:42px 38px;overflow:hidden;border:1px solid rgba(148,164,187,.13);border-radius:24px;background:radial-gradient(circle at 50% 18%,rgba(231,178,76,.13),transparent 30%),linear-gradient(145deg,rgba(17,24,36,.88),rgba(8,13,22,.92));box-shadow:0 35px 90px -54px rgba(0,0,0,.95),inset 0 1px rgba(255,255,255,.055);color:#7f8fa5;text-align:center}
.welcome:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.28;background-image:linear-gradient(rgba(148,164,187,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(148,164,187,.09) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(circle at center,#000,transparent 74%)}
.welcome:after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#2dd4bf,#e7b24c,transparent);opacity:.52}
.welcome .big-icon{position:relative;width:72px;height:72px;display:grid;place-items:center;margin-bottom:4px;border:1px solid rgba(231,178,76,.28);border-radius:22px;background:linear-gradient(145deg,rgba(231,178,76,.18),rgba(231,178,76,.055));box-shadow:0 20px 48px -28px rgba(231,178,76,.9),inset 0 1px rgba(255,255,255,.08);color:#f4cd72}
.welcome .big-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.welcome .big-icon .spark{transform-origin:center;animation:welcome-spark 2.8s ease-in-out infinite}
.welcome .big-icon:after{content:"";position:absolute;right:11px;top:11px;width:6px;height:6px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 12px rgba(45,212,191,.9)}
.welcome-kicker{color:#d1a94d;font-size:9px;font-weight:850;letter-spacing:.18em}
.welcome h2{font-size:26px;color:#f5f8fc;font-weight:800;letter-spacing:-.02em}
.welcome p{font-size:12px;max-width:430px;line-height:1.8;color:#8290a4}
.welcome-meta{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin:2px 0 5px}
.welcome-meta span{padding:5px 8px;border:1px solid rgba(148,164,187,.11);border-radius:999px;background:rgba(148,164,187,.035);color:#8b9ab0;font-size:9px}
.welcome-meta span:first-child{border-color:rgba(45,212,191,.2);background:rgba(45,212,191,.07);color:#79d8ca}
.start-btn{position:relative;min-width:132px;padding:11px 22px;border:1px solid rgba(244,205,114,.55);border-radius:11px;background:linear-gradient(135deg,#f4cd72,#e7b24c);box-shadow:0 16px 34px -20px rgba(231,178,76,.9),inset 0 1px rgba(255,255,255,.38);color:#211707;cursor:pointer;font-size:12px;font-weight:850;transition:transform .16s,box-shadow .16s,filter .16s}
.start-btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 20px 42px -20px rgba(231,178,76,.96)}
.msg{display:flex;gap:10px;max-width:750px;width:100%;margin:0 auto}
.msg.user{flex-direction:row-reverse}
.av{width:32px;height:32px;border:1px solid rgba(148,164,187,.12);border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:rgba(148,164,187,.045);color:#94a4bb}
.av .module-icon,.av .module-icon svg{width:17px;height:17px}
.msg.user .av{border-color:rgba(231,178,76,.22);background:rgba(231,178,76,.1);color:#f1c768}
.msg.assistant .av{border-color:rgba(45,212,191,.18);background:rgba(45,212,191,.07);color:#76d9ca}
.bubble{padding:13px 16px;border-radius:13px;max-width:85%;font-size:13px;line-height:1.72;word-break:break-word;box-shadow:0 16px 34px -30px rgba(0,0,0,.9)}
.msg.user .bubble{border:1px solid rgba(231,178,76,.13);background:linear-gradient(145deg,rgba(36,43,55,.94),rgba(24,35,54,.94))}
.msg.assistant .bubble{background:var(--ab);border:1px solid var(--bd)}
.harness-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(148,164,187,.12)}
.harness-action{padding:7px 12px;border:1px solid rgba(148,164,187,.2);border-radius:8px;background:rgba(148,164,187,.06);color:var(--tx);font:inherit;font-size:11px;cursor:pointer}
.harness-action.primary{border-color:rgba(231,178,76,.42);background:rgba(231,178,76,.13);color:#f4d993}
.harness-action:disabled{opacity:.45;cursor:not-allowed}
.choice-group{display:block;padding-top:12px}
.choice-list{overflow:hidden;border:1px solid rgba(148,164,187,.2);border-radius:6px}
.choice-action{width:100%;min-height:88px;padding:16px;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;border:0;border-bottom:1px solid rgba(148,164,187,.16);border-radius:0;background:rgba(148,164,187,.055);color:var(--tx);font:inherit;text-align:left;cursor:pointer;transition:border-color .08s,background .08s}
.choice-action:last-child{border-bottom:0}.choice-action:hover{background:rgba(148,164,187,.085)}.choice-action:focus-visible{outline:2px solid rgba(231,178,76,.7);outline-offset:-2px;position:relative;z-index:1}.choice-action.selected{outline:1px solid var(--gr);outline-offset:-1px;background:rgba(45,212,191,.07)}.choice-action:disabled{cursor:not-allowed;opacity:.72}
.choice-number{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(148,164,187,.38);border-radius:6px;font:700 16px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.choice-copy{min-width:0;display:block}.choice-title{font-size:16px;line-height:1.4;font-weight:650}.choice-badge{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid rgba(231,178,76,.38);border-radius:999px;color:var(--acb);font-size:14px;font-weight:650}.choice-details{display:block;margin-top:5px}.choice-summary,.choice-reason,.choice-caution{display:block;font-size:16px;line-height:1.5}.choice-summary{color:var(--tx);opacity:.8}.choice-reason strong{color:var(--gr)}.choice-caution strong{color:var(--wa)}.choice-pick{padding-top:5px;color:var(--acb);font-size:14px;white-space:nowrap}.choice-edit{min-height:44px;margin-top:10px}.choice-status{min-height:1px;margin-top:6px;color:var(--dim);font-size:14px}
.choice-receipt{margin-top:12px;border:1px solid rgba(148,164,187,.18);border-radius:6px;background:rgba(7,11,19,.32)}.choice-receipt summary{min-height:44px;padding:10px 12px;display:flex;align-items:center;color:var(--tx);font-size:14px;cursor:pointer}.choice-receipt-body{padding:0 12px 10px}.choice-receipt-item{padding:8px 0;border-top:1px solid rgba(148,164,187,.12);color:var(--dim);font-size:14px}.choice-receipt-item.selected{color:var(--tx)}.choice-receipt-title{font-weight:650}.choice-receipt .choice-line{line-height:1.5}.choice-receipt .choice-line strong{color:inherit}
.input-area{position:relative;z-index:2;padding:12px 24px 17px;border-top:1px solid rgba(148,164,187,.08);background:linear-gradient(180deg,rgba(7,11,19,.18),rgba(7,11,19,.92));backdrop-filter:blur(18px)}
.input-wrap{max-width:750px;margin:0 auto;display:flex;gap:7px;background:var(--ib);border:1px solid rgba(148,164,187,.13);border-radius:14px;padding:5px;align-items:flex-end;box-shadow:0 22px 48px -34px rgba(0,0,0,.92),inset 0 1px rgba(255,255,255,.035);transition:border-color .18s,background .18s,box-shadow .18s}
.input-wrap:focus-within{border-color:rgba(231,178,76,.42);background:rgba(11,17,27,.96);box-shadow:0 22px 48px -34px rgba(0,0,0,.92),0 0 24px -18px rgba(231,178,76,.75),inset 0 1px rgba(255,255,255,.05)}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-family:var(--f);font-size:12px;resize:none;padding:7px 8px;min-height:27px;max-height:120px}

document.querySelectorAll('[data-icon]').forEach(function(el){el.insertAdjacentHTML('afterbegin',moduleIcon(el.dataset.icon))});

// Module list
var M=[{id:1,name:"定位诊断",icon:"target"},{id:2,name:"人设塑造",icon:"user"},{id:3,name:"价值主张",icon:"sparkles"},{id:4,name:"故事资产",icon:"book"},{id:5,name:"选题策划",icon:"layers"},{id:6,name:"文案口播",icon:"edit"},{id:7,name:"形象设计",icon:"image"},{id:8,name:"脚本分镜",icon:"video"},{id:9,name:"私域矩阵",icon:"link"},{id:10,name:"朋友圈运营",icon:"message"},{id:11,name:"销售策略",icon:"trend"},{id:12,name:"公众号变现",icon:"calendar"}];
var AVAILABLE_MODULE_COUNT=6;

// Module → sub-skills map
var SKILL_MAP={};
SKILL_MAP[1]=[{id:'competitor',icon:'search',name:'竞品定位对比',api:'/api/m1-competitor',help:'分析赛道竞品的定位，找到你的差异化切入点'}];
SKILL_MAP[2]=[{id:'persona',icon:'user',name:'人设卡片',api:'/api/m2-persona',help:'生成你的人设标签、口头禅、镜头状态建议'}];
SKILL_MAP[3]=[{id:'value',icon:'sparkles',name:'价值金字塔',api:'/api/m3-value',help:'构建价值金字塔：主张→信任状→卖点→痛点'}];
SKILL_MAP[4]=[{id:'story',icon:'book',name:'故事资产库',api:'/api/m4-story',help:'收集你的经历故事，打造个人品牌资产库'}];
SKILL_MAP[5]=[{id:'hooks',icon:'layers',name:'Hook钩子生成',api:'/api/m5-hooks',help:'为一个选题生成10个钩子'}];
SKILL_MAP[6]=[];
SKILL_MAP[7]=[{id:'images',icon:'image',name:'形象预览',api:'/api/module7-images',help:'生成头像、封面和朋友圈配图参考'}];
SKILL_MAP[8]=[{id:'videos',icon:'video',name:'视频脚本',api:'/api/module8-video',help:'生成脚本和画面参考'}];
SKILL_MAP[9]=[{id:'funnel',icon:'link',name:'私域漏斗',api:'/api/m9-funnel',help:'设计私域转化漏斗'}];
SKILL_MAP[10]=[{id:'deliverable-10',icon:'message',name:'朋友圈排期',api:'/api/generate-deliverable',help:'生成7天朋友圈排期'}];
SKILL_MAP[11]=[{id:'sales',icon:'trend',name:'成交话术',api:'/api/m11-sales',help:'生成私域成交SOP话术'}];
SKILL_MAP[12]=[{id:'calendar',icon:'calendar',name:'公众号日历',api:'/api/m12-calendar',help:'生成公众号30天内容日历'}];

var cid=null,state={current_module:1,completed_modules:[],module_step:0,ip_profile:{},intake:{status:'complete'}},harnessActions=[],capabilityGates=[],reports={},deliverables={},productions={},activeProductionId=null,productionPolls={},streaming=false,materialUploading=false,pendingMaterialUpload=null,pendingChoiceFocus=0,convos=[],foundationEditing=false,foundationAnnotations=[],foundationReviewCid='',foundationPdfObjectUrl='',foundationPdfLoadId=0,activeContentTarget=null,activeContentPack=null,activeContentCategory=0;
var expandedMod=0;
var WELCOME_HTML=document.getElementById('welcome').outerHTML;

function toggleExpand(mid){
  if(expandedMod===mid){expandedMod=0}else{expandedMod=mid}
  renderMods()
}

function moduleArtifactRows(mid,done,foundation){
  var rows=[],report=reports[String(mid)]||reports[mid],deliverableKey=deliverables[String(mid)]||deliverables[mid]?String(mid):(mid===5&&deliverables.topic_radar?'topic_radar':''),deliverable=deliverableKey&&deliverables[deliverableKey];
  if(done.indexOf(mid)>=0||report)rows.push('<div class="mod-sub artifact" onclick="event.stopPropagation();viewReport('+mid+')">'+moduleIcon('document')+(report?'查看模块报告':'生成模块报告')+'<span class="mod-sub-badge">交付物</span></div>');
  if(deliverable)rows.push('<div class="mod-sub artifact" onclick="event.stopPropagation();viewDeliverable('+(deliverableKey==='topic_radar'?"'topic_radar'":mid)+')">'+moduleIcon(mid===6?'edit':'layers')+eHtml(deliverable.title||(M[mid-1].name+'交付物'))+'<span class="mod-sub-badge">交付物</span></div>');
  if(mid===4){
    if(foundation.status==='awaiting_confirmation'||foundation.status==='confirmed')rows.push('<div class="mod-sub artifact" onclick="event.stopPropagation();openFoundationReport()">'+moduleIcon('document')+'模块 1-4 IP 定位初稿 PDF<span class="mod-sub-badge">交付物</span></div>');
    if(foundation.status==='awaiting_confirmation'&&foundation.review_status==='dirty')rows.push('<div class="mod-sub artifact" onclick="event.stopPropagation();generateFoundationReport()">'+moduleIcon('sparkles')+'应用补充并重新生成 PDF</div>');
    else if(foundation.status==='awaiting_confirmation')rows.push('<div class="mod-sub artifact" onclick="event.stopPropagation();confirmFoundationReport()">'+moduleIcon('target')+'确认初稿，开始模块 5</div>');
    else if(done.indexOf(4)>=0&&foundation.status!=='confirmed')rows.push('<div class="mod-sub artifact" onclick="event.stopPropagation();generateFoundationReport()">'+moduleIcon('sparkles')+(foundation.status==='failed'?'重新生成':'检查/重试')+'模块 1-4 PDF</div>');
  }
  return rows.join('');
}

function loadSkill(sid){
  if(sid==='images'){loadPanel('images');return}
  if(sid==='videos'){loadPanel('videos');return}
  if(sid.indexOf('deliverable-')===0){viewDeliverable(Number(sid.split('-')[1]));return}
  if(sid==='video-factory'){
    openPanel('视频工厂')
    document.getElementById('rpnBody').innerHTML='<div class="rpn-card"><div class="rpn-card-header">🎥 视频工厂</div><p style="font-size:12px;color:var(--dim)">通义万相出图 + edge-tts配音 + FFmpeg合成</p><input id="vfTopic" placeholder="输入视频主题..." style="width:100%;padding:8px;background:var(--ib);border:1px solid var(--bd);color:var(--tx);border-radius:6px;margin:6px 0;font-size:12px"><button class="copy-btn" onclick="runVideoFactory()" style="margin-top:8px">生成视频</button><div id="vfResult"></div></div>'
  }else if(sid==='video-analyzer'){
    openPanel('对标分析')
    document.getElementById('rpnBody').innerHTML='<div class="rpn-card"><div class="rpn-card-header">📊 对标分析</div><p style="font-size:12px;color:var(--dim)">下载对标视频 → 语音转文字 → AI拆解结构</p><input id="vaUrl" placeholder="粘贴对标视频URL..." style="width:100%;padding:8px;background:var(--ib);border:1px solid var(--bd);color:var(--tx);border-radius:6px;margin:6px 0;font-size:12px"><button class="copy-btn" onclick="runVideoAnalyzer()" style="margin-top:8px">分析</button><div id="vaResult"></div></div>'
  }else{
    openPath('/skills')
  }
}

function openPath(path){window.location.href=path}

async function openCapabilityGates(){
  if(cid){try{var response=await fetch('/api/conversations/'+encodeURIComponent(cid));if(response.ok){var current=await response.json();capabilityGates=current.capability_gates||capabilityGates}}catch(ignore){}}
  openPanel('能力解锁');
  var html='<div class="rpn-card"><div class="rpn-card-header">当前 Project 能做什么</div><p style="color:var(--dim);font-size:11px">能力门禁会根据已确认状态解锁；生成、扣点和写入仍需再次确认。</p></div><div class="gate-list">';
  (capabilityGates||[]).forEach(function(gate){var unlocked=gate.status==='unlocked';html+='<div class="gate-card"><div class="gate-head"><span class="gate-name">'+eHtml(gate.name)+'</span><span class="gate-status '+(unlocked?'unlocked':'locked')+'">'+(unlocked?'已解锁':'未解锁')+'</span></div><div class="gate-next">'+eHtml(gate.next_step||'')+'</div><div class="gate-rule">'+eHtml(gate.confirmation||'')+' · '+eHtml(gate.writeback||'')+'</div></div>'});
  document.getElementById('rpnBody').innerHTML=html+'</div>'
}

async function runVideoFactory(){
  var topic=document.getElementById('vfTopic').value||'美业IP推广';
  document.getElementById('vfResult').innerHTML='<div class="spinner"></div><p style="font-size:11px;color:var(--dim)">生成中...（约60秒）</p>';
  try{
    var r=await fetch('/api/generate-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic,conversation_id:cid||''})});
    var d=await r.json();
    if(d.ok){document.getElementById('vfResult').innerHTML='<p style="color:var(--gr);margin:8px 0">✅ 视频生成成功！</p><video src="'+eHtml(isSafeMarkdownUrl(d.video_url,location.href)?d.video_url:'')+'" controls style="width:100%;max-width:360px;border-radius:8px;margin:8px 0"></video><pre style="font-size:10px;max-height:200px">'+eHtml(d.script||'')+'</pre>'}
    else{document.getElementById('vfResult').innerHTML='<p style="color:#ef4444">❌ '+eHtml(d.error||'生成失败')+'</p>'}
  }catch(e){document.getElementById('vfResult').innerHTML='<p style="color:#ef4444">❌ '+eHtml(e.message)+'</p>'}
}

async function runVideoAnalyzer(){
  var url=document.getElementById('vaUrl').value;
  if(!url){document.getElementById('vaResult').innerHTML='<p style="color:#ef4444">请输入视频URL</p>';return}
  document.getElementById('vaResult').innerHTML='<div class="spinner"></div><p style="font-size:11px;color:var(--dim)">下载+分析中...</p>';
  try{
    var r=await fetch('/api/analyze-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,conversation_id:cid||''})});
    var d=await r.json();

async function recoverTurn(projectId,requestId,bubble){

  for(var attempt=0;attempt<80;attempt++){
    await delay(1500);
    try{var r=await fetch('/api/conversations/'+encodeURIComponent(projectId)+'?receipt='+encodeURIComponent(requestId),{cache:'no-store'});if(r.status===202)continue;if(!r.ok)return false;var d=await r.json();if(d&&d.replayed)return true}catch(ignore){}
  }

}
async function sendTurn(turn,displayText,requestId){
  if(streaming||materialUploading||!cid)return;document.getElementById('sendBtn').disabled=true;document.getElementById('attachBtn').disabled=true;streaming=true;
  document.querySelectorAll('#chatArea .harness-actions button').forEach(function(button){button.disabled=true});
  if(turn.message&&isContentReviewMessage(turn.message))activeContentTarget=null;
  var turnCid=cid;
  var area=document.getElementById('chatArea'),welcome=area.querySelector('.welcome');if(welcome)welcome.remove();
  var um=document.createElement('div');um.className='msg user';um.innerHTML='<div class="av">'+moduleIcon('user')+'</div><div class="bubble">'+eHtml(displayText).replace(/\n/g,'<br>')+'</div>';area.appendChild(um);
  var am=document.createElement('div');am.className='msg assistant';am.innerHTML='<div class="av">'+moduleIcon('sparkles')+'</div><div class="bubble"><div class="typing" style="display:flex;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite .2s"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--dim);animation:bounce 1.4s infinite .4s"></span></div></div>';area.appendChild(am);keepVoiceCloneJobAtBottom();scroll();
  var full='',replayed=false,sawDone=false,recoverable=true,autoAction=null,restoreInputFocus=true,failureMessage='这条回复暂时没有完成。',retryRequestId=requestId||newTurnRequestId();var bubble=am.querySelector('.bubble');
  try{
    var body=Object.assign({conversation_id:turnCid,request_id:retryRequestId,expected_revision:state.revision},turn);if(activeContentTarget&&!turn.action)body.content_target=activeContentTarget;
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){recoverable=r.status>=500;if(!recoverable)try{var failed=await r.json();failureMessage=failed.error||failureMessage}catch(ignore){}throw new Error('发送失败')}
    var reader=r.body.getReader(),decoder=new TextDecoder(),buf='';
    while(true){var part=await reader.read();if(part.done)break;buf+=decoder.decode(part.value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';for(var i=0;i<lines.length;i++){var line=lines[i];if(!line.startsWith('data: '))continue;try{var data=JSON.parse(line.slice(6));if(data.error){recoverable=false;failureMessage=data.error;throw new Error('回复失败')}else if(data.content){full+=data.content;bubble.innerHTML=md(full)+'<span class="cursor" style="color:var(--ac)">▍</span>';scroll()}else if(data.done){sawDone=true;bubble.innerHTML=md(full);replayed=!!data.replayed;if(data.state&&(!replayed||data.state.revision>=state.revision)){state=data.state}harnessActions=Array.isArray(data.actions)?data.actions:[];var liveChoices=choiceActionItems(harnessActions);if(liveChoices.length)am.dataset.choiceTarget=String(liveChoices[0].target_id||'');if(data.auto_deliverables){Object.keys(data.auto_deliverables).forEach(function(mid){deliverables[mid]=data.auto_deliverables[mid]});if(data.auto_deliverables['6']){activeContentPack=data.auto_deliverables['6'];openPanel('📦 文案口播交付物');if(activeContentTarget)renderActiveContentScript();else renderContentPack(document.getElementById('rpnBody'))}}renderMods();renderChoiceReceiptsInDom();var doneActions=currentActions();attachHarnessActions(doneActions,bubble);autoAction=!replayed&&doneActions.find(function(item){return item.type==='prepare_production'})||null;if(autoAction)bubble.querySelectorAll('.harness-action').forEach(function(button){button.disabled=true});showArtifactNotice(data);if(data.new_completed&&data.new_completed.length>0)data.new_completed.forEach(function(mid){toast('✅ '+M[mid-1].name+'完成！')})}}catch(e){if(e.message==='回复失败')throw e}}}
    if(!sawDone)throw new Error('连接中断');if(replayed)await selectConvo(turnCid);else if(autoAction)await runStateAction(autoAction);pendingChoiceFocus=0
  }catch(e){var restoreChoice=pendingChoiceFocus;if(recoverable&&await recoverTurn(turnCid,retryRequestId,bubble)){await selectConvo(turnCid);toast('✅ 回复已自动恢复')}else if(restoreChoice){await selectConvo(turnCid);var restored=restoreChoice>0?document.querySelectorAll('.choice-action')[restoreChoice-1]:document.querySelector('.choice-edit'),restoredStatus=document.querySelector('.choice-status');if(restored)restored.focus();if(restoredStatus){restoredStatus.setAttribute('role','alert');restoredStatus.textContent=failureMessage}restoreInputFocus=false}else{bubble.innerHTML='<span style="color:var(--dim)">'+eHtml(failureMessage)+'</span><div class="harness-actions"><button type="button" class="harness-action primary">重新载入 Project</button></div>';bubble.querySelector('button').onclick=function(){selectConvo(turnCid).catch(function(){toast('Project 暂时加载失败')})}}pendingChoiceFocus=0}
  finally{streaming=false;document.getElementById('sendBtn').disabled=false;document.getElementById('attachBtn').disabled=false;if(restoreInputFocus)document.getElementById('userInput').focus()}

  var form=new FormData();form.append('backup',file,file.name);toast('正在恢复 Project 备份…');
  try{
    var r=await fetch('/api/conversations/import',{method:'POST',body:form}),d={};try{d=await r.json()}catch(ignore){}
    if(!r.ok||!d.ok)throw new Error(d.error||'Project 备份恢复失败');
    await loadConvos();await selectConvo(d.id);toggleProjects();toast('✅ Project 已从备份恢复')
  }catch(e){toast(e.message||'Project 备份恢复失败')}

}
