<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音评论区获客</title>
<style>
  :root{--bg:#0f1115;--card:#191c23;--line:#2a2e38;--txt:#e8eaed;--sub:#9aa0aa;--acc:#ff5c8a;--ok:#37c871}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC",sans-serif;padding:24px}
  .wrap{max-width:880px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);margin:0 0 20px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input,select{width:100%;padding:10px 12px;background:#0f1115;border:1px solid var(--line);border-radius:9px;color:var(--txt);font-size:15px}
  .row{display:flex;gap:12px}.row>div{flex:1}
  button{margin-top:16px;width:100%;padding:12px;background:var(--acc);color:#fff;border:0;border-radius:9px;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status{margin-top:14px;font-size:14px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--sub);font-weight:500}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .tag-ok{background:rgba(55,200,113,.15);color:var(--ok)}
  .stat{display:flex;gap:18px;margin:6px 0 0;font-size:13px;color:var(--sub)}
  .dl{display:inline-block;margin-top:12px;color:var(--acc);cursor:pointer;font-size:14px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  #kwcats{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
  .cat{padding:5px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--sub);cursor:pointer;background:#0f1115}
  .cat.active{background:var(--acc);color:#fff;border-color:var(--acc)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--txt);cursor:pointer;background:#13161c}
  .chip:hover{border-color:var(--acc);color:var(--acc)}
  #tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{padding:8px 16px;border:1px solid var(--line);border-radius:9px;cursor:pointer;color:var(--sub);font-size:14px;user-select:none}
  .tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
  textarea{width:100%;padding:10px 12px;background:#0f1115;border:1px solid var(--line);border-radius:9px;color:var(--txt);font-size:14px;resize:vertical;font-family:inherit;line-height:1.5}
  .ahint{color:var(--sub);font-size:12px;margin-top:6px}
  #worksGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
  .wcard{display:block;background:#13161c;border:1px solid var(--line);border-radius:9px;overflow:hidden;text-decoration:none;color:var(--txt)}
  .wcard img{width:100%;height:170px;object-fit:cover;display:block;background:#0a0c10}
  .wmeta{padding:6px 8px}
  .wt{font-size:12px;line-height:1.4;height:34px;overflow:hidden}
  .ws{font-size:11px;color:var(--sub);margin-top:4px}
  .pcard{display:flex;gap:14px;align-items:center;margin:6px 0 4px}
  .pcard img{width:56px;height:56px;border-radius:50%;object-fit:cover}
  #viewToggle{display:flex;gap:8px;margin:10px 0}
  .vt-btn{padding:6px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px;user-select:none;background:#13161c}
  .vt-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
  .vblock{border:1px solid var(--line);border-radius:11px;margin:12px 0;overflow:hidden;background:#13161c}
  .vhead{display:flex;gap:12px;padding:12px;text-decoration:none;color:var(--txt);align-items:flex-start}
  .vhead img{width:96px;height:128px;object-fit:cover;border-radius:7px;background:#0a0c10;flex:0 0 auto}
  .vhi{flex:1;min-width:0}
  .vhi .t{font-size:14px;line-height:1.45;max-height:62px;overflow:hidden}
  .vhi .m{font-size:12px;color:var(--sub);margin-top:6px}
  .vlead-badge{display:inline-block;background:rgba(255,92,138,.16);color:var(--acc);padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;margin-top:6px}
  .vbtns{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
  .vbtn{flex:1;width:auto;margin-top:0;text-align:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#0f1115;color:#5aa9ff;font-size:13px;cursor:pointer}
  .vbtn:hover{border-color:#5aa9ff}
  .vbtn:disabled{opacity:.5;cursor:default}
  .vlinks{font-size:12px;color:var(--sub);padding:0 12px 6px}
  .vlinks a{color:#5aa9ff;text-decoration:none}
  .prog{height:6px;background:#0a0c10;border-radius:6px;overflow:hidden;margin:0 12px 10px;display:none}
  .prog.on{display:block}
  .prog-bar{height:100%;width:35%;background:var(--acc);border-radius:6px;animation:indet 1.1s ease-in-out infinite}
  @keyframes indet{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
  .vleads{padding:0 12px 10px}
  .src-link{color:#5aa9ff;text-decoration:none;font-size:12px}
  .txtbox{margin:0 12px 12px;padding:10px 12px;background:#0f1115;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:240px;overflow:auto}
  .txtbox .h{color:var(--ok);font-size:12px;margin-bottom:6px}
  .dlink{color:#5aa9ff;text-decoration:none;font-size:13px;font-weight:600}
  .wbtns{display:flex;gap:6px;padding:6px 8px 0}
  .wbtn{flex:1;padding:5px 0;border:1px solid var(--line);border-radius:7px;background:#0f1115;color:#5aa9ff;font-size:12px;cursor:pointer;text-align:center}
  .wbtn:disabled{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 抖音评论区获客</h1>
  <p class="sub">输入行业关键词 → 自动搜视频、扒评论 → 过滤出精准潜在客户名单</p>

  <div class="card">
    <div id="tabs">
      <span class="tab active" data-mode="search">🔍 关键词搜索</span>
      <span class="tab" data-mode="account">👤 按账号爬取</span>
      <span class="tab" data-mode="videodl">🎬 视频下载</span>
      <span class="tab" data-mode="wxchannel">📺 视频号</span>
    </div>
    <div id="pane-search">
    <div class="row">
      <div><label>关键词</label><input id="kw" placeholder="如：美业获客"></div>
      <div style="flex:0 0 175px"><label>抓取视频数</label><select id="cnt"><option value="10">约 14 个（1页·最快）</option><option value="20" selected>约 22 个（2页·推荐）</option><option value="30">约 30 个（3页·最全）</option></select></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:6px">
      <input id="deepDig" type="checkbox" style="width:auto;margin:0">
      <span>🎯 爆款深挖（搜完自动对爆款视频补抓300条评论，更耗时但客户更全）</span>
    </label>
    <label>从关键词库选（点一下填入）</label>
    <div id="kwcats"></div>
    <div id="kwchips" class="chips"></div>
    </div>
    <div id="pane-account" style="display:none">
      <label>账号主页链接（一行一个，支持批量）</label>
      <textarea id="accts" rows="4" placeholder="粘贴抖音主页链接，一行一个，如：&#10;https://www.douyin.com/user/MS4wLjAB...&#10;（抖音 app 分享→复制链接；或直接填 sec_uid）"></textarea>
      <div class="ahint">每个账号会爬：账号画像 + 全部作品 + 评论 → 一个 xlsx 自动发到飞书群</div>
    </div>
    <div id="pane-videodl" style="display:none">
      <label>抖音视频链接</label>
      <textarea id="vdlLink" rows="2" placeholder="粘贴抖音视频链接，如 https://v.douyin.com/xxx 或 https://www.douyin.com/video/7xxx"></textarea>
      <div class="ahint">粘贴链接 → 自动下载无水印视频 + 提取口播文案</div>
    </div>
    <div id="pane-wxchannel" style="display:none">
      <label>视频号分享链接</label>
      <textarea id="sphLink" rows="2" placeholder="粘贴视频号分享链接，如 https://weixin.qq.com/sph/Apz4vHD0mW"></textarea>
      <div class="ahint">粘贴视频号链接 → 解析标题 + 封面 + 无水印下载 + 提取口播文案</div>
    </div>
    <label>口令</label><input id="pw" type="password" placeholder="团队共享口令">
    <button id="go">开始爬取</button>
    <div id="status"></div>
    <div id="vdlResult" style="margin-top:10px"></div>
  <div id="sphResult" style="margin-top:10px"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="stat" id="stat"></div>
    <span class="dl" id="dl" onclick="downloadCSV()">⬇ 下载 CSV</span>
    <div id="relatedBox" style="display:none;margin-top:12px">
      <label>🔗 相关关键词（这批视频里挖到的，点一下继续挖）</label>
      <div id="related" class="chips"></div>
    </div>
    <div id="viewToggle" style="display:none">
      <span class="vt-btn active" data-view="lead">👥 按客户看</span>
      <span class="vt-btn" data-view="video">🎬 按视频看</span>
    </div>
    <div id="worksGrid" style="display:none"></div>
    <div id="leadView" style="overflow-x:auto"><table id="tbl"></table></div>
    <div id="videoView" style="display:none"></div>
  </div>
</div>
<script>
let pollTimer=null, lastLeads=[], lastVideos=[], KW={}, currentMode='search', lastAccount=null;
async function loadKeywords(){
  try{const r=await fetch('/api/keywords');KW=await r.json()}catch(e){return}
  const cats=Object.keys(KW);if(!cats.length)return;
  const cbox=document.getElementById('kwcats');cbox.innerHTML='';
  cats.forEach((c,i)=>{
    const b=document.createElement('span');b.className='cat'+(i===0?' active':'');b.textContent=c;
    b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderChips(c)};
    cbox.appendChild(b);
  });
  renderChips(cats[0]);
}
function renderChips(cat){
  const box=document.getElementById('kwchips');box.innerHTML='';
  (KW[cat]||[]).forEach(w=>{
    const s=document.createElement('span');s.className='chip';s.textContent=w;
    s.onclick=()=>{document.getElementById('kw').value=w};
    box.appendChild(s);
  });
}
loadKeywords();
document.getElementById('go').addEventListener('click', runCrawl);
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentMode=t.dataset.mode;
    document.getElementById('pane-search').style.display=currentMode==='search'?'block':'none';
    document.getElementById('pane-account').style.display=currentMode==='account'?'block':'none';
    document.getElementById('pane-videodl').style.display=currentMode==='videodl'?'block':'none';
    document.getElementById('pane-wxchannel').style.display=currentMode==='wxchannel'?'block':'none';
    const btnLabels={videodl:'⬇ 下载视频 + 提取文案',wxchannel:'📺 解析视频号'};
    document.getElementById('go').textContent=btnLabels[currentMode]||'开始爬取';
    // 各模块结果互相独立：切 tab 只切换显示，不清除其它模块的内容（切回来还在）
    const _rc=document.getElementById('resultCard'),_vdl=document.getElementById('vdlResult'),_sph=document.getElementById('sphResult');
    const _hasCrawl=document.getElementById('stat').innerHTML.trim()!=='';
    _rc.style.display=((currentMode==='search'||currentMode==='account')&&_hasCrawl)?'block':'none';
    _vdl.style.display=currentMode==='videodl'?'block':'none';
    _sph.style.display=currentMode==='wxchannel'?'block':'none';
    setStatus('');
  };
});
async function runCrawl(){
  const pw=document.getElementById('pw').value;
  if(!pw){alert('请输入口令');return}
  const btn=document.getElementById('go');
  if(currentMode==='videodl'){return runVideoDL(pw,btn);}
  if(currentMode==='wxchannel'){return runWxChannel(pw,btn);}
  if(currentMode==='account'){
    const lines=document.getElementById('accts').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!lines.length){alert('请粘贴账号主页链接（一行一个）');return}
    btn.disabled=true;
    if(lines.length===1){
      setStatus('<span class="spin"></span>提交中…');
      const f=new FormData();f.append('password',pw);f.append('keyword',lines[0]);f.append('mode','account');
      let r;try{r=await fetch('/api/submit',{method:'POST',body:f})}catch(e){setStatus('网络错误');btn.disabled=false;return}
      if(!r.ok){let m=r.status;try{const t=await r.json();m=typeof t.detail==='string'?t.detail:JSON.stringify(t.detail)}catch(e){}setStatus('❌ '+m);btn.disabled=false;return}
      const {job_id}=await r.json();
      setStatus('<span class="spin"></span>已排队(账号#'+job_id+')，爬取中… 作品多的账号会久一点');
      poll(job_id);return;
    }
    setStatus('<span class="spin"></span>提交 '+lines.length+' 个账号…');
    let ok=0;
    for(const ln of lines){const f=new FormData();f.append('password',pw);f.append('keyword',ln);f.append('mode','account');try{const r=await fetch('/api/submit',{method:'POST',body:f});if(r.ok)ok++;}catch(e){}}
    btn.disabled=false;
    setStatus('✅ 已提交 '+ok+'/'+lines.length+' 个账号。每个爬完(画像+作品+评论)自动发 xlsx 到飞书群，约几分钟、排队进行。');
    return;
  }
  const kw=document.getElementById('kw').value.trim();
  let cnt=parseInt(document.getElementById('cnt').value,10);
  if(!cnt||cnt<1){cnt=10}if(cnt>100){cnt=100}
  if(!kw){alert('请先选/输入关键词');return}
  btn.disabled=true;
  setStatus('<span class="spin"></span>提交中…');
  const fd=new FormData();fd.append('password',pw);fd.append('keyword',kw);fd.append('count',cnt);
  fd.append('deep_dig', document.getElementById('deepDig').checked ? '1' : '0');
  let r;
  try{r=await fetch('/api/submit',{method:'POST',body:fd})}catch(e){setStatus('网络错误');btn.disabled=false;return}
  if(!r.ok){
    let msg=r.status;
    try{const t=await r.json();
      if(typeof t.detail==='string')msg=t.detail;
      else if(Array.isArray(t.detail))msg=t.detail.map(e=>e.msg||JSON.stringify(e)).join('；');
      else if(t.detail)msg=JSON.stringify(t.detail);
    }catch(e){}
    setStatus('❌ '+msg);btn.disabled=false;return}
  const {job_id}=await r.json();
  setStatus('<span class="spin"></span>已排队(任务#'+job_id+')，等待爬取… 通常 1-3 分钟');
  poll(job_id);
}
async function runVideoDL(pw,btn){
  const link=document.getElementById('vdlLink').value.trim();
  if(!link){alert('请粘贴抖音视频链接');return}
  btn.disabled=true;
  const res=document.getElementById('vdlResult');res.innerHTML='';
  setStatus('<span class="spin"></span>正在解析链接…');
  let info;
  try{
    const fd=new FormData();fd.append('password',pw);fd.append('link',link);
    const r=await fetch('/api/resolve',{method:'POST',body:fd});
    if(!r.ok){let m=r.status;try{const t=await r.json();m=typeof t.detail==='string'?t.detail:JSON.stringify(t.detail)}catch(e){}throw new Error(m)}
    info=await r.json();
  }catch(e){setStatus('❌ 解析失败：'+e.message);btn.disabled=false;return}
  setStatus('✅ 解析到「'+esc(info.title||info.aweme_id)+'」，正在下载视频 + 提取文案（约1-2分钟，可去干别的）…');
  const sub=async(type)=>{const fd=new FormData();fd.append('password',pw);fd.append('aweme_id',info.aweme_id);fd.append('url',info.url);fd.append('type',type);fd.append('title',info.title||'');const r=await fetch('/api/extract',{method:'POST',body:fd});return (await r.json()).job_id;};
  let dlJob,txJob;
  try{[dlJob,txJob]=await Promise.all([sub('download_video'),sub('transcribe')]);}catch(e){setStatus('❌ 提交失败');btn.disabled=false;return}
  res.innerHTML='<div class="prog on" id="vdl-prog"><div class="prog-bar"></div></div><div id="vdl-dl" style="margin:8px 0;font-size:13px;color:var(--sub)">⬇ 视频下载中…</div><div id="vdl-tx" class="txtbox" style="display:none"></div>';
  let done=0;const fin=()=>{if(++done>=2){btn.disabled=false;const p=document.getElementById('vdl-prog');if(p)p.classList.remove('on');setStatus('✅ 完成');}};
  pollVdl(dlJob,'download_video',fin);pollVdl(txJob,'transcribe',fin);
}
function pollVdl(id,type,fin){
  const tmr=setInterval(async()=>{
    let j;try{const r=await fetch('/api/job/'+id);if(!r.ok)return;j=await r.json();}catch(e){return}
    if(j.status==='done'){clearInterval(tmr);const rr=j.result||{};
      if(type==='download_video'){const mb=Math.round((rr.size||0)/1024/1024*10)/10;const el=document.getElementById('vdl-dl');if(el)el.innerHTML='⬇ <a class="dlink" href="/api/download/'+esc(rr.file)+'" target="_blank" download>下载无水印视频 ('+mb+'MB) ↓</a>';}
      else{const el=document.getElementById('vdl-tx');if(el){el.style.display='block';const tx=rr.text||'';el.innerHTML='<div class="h">📝 口播文案（'+(rr.char_count||tx.length)+'字）<span style="float:right;cursor:pointer;color:#5aa9ff" onclick="copyText(this)">复制</span></div>'+(tx?esc(tx):'(无语音/纯音乐)');}}
      fin();
    }else if(j.status==='error'){clearInterval(tmr);const el=document.getElementById(type==='download_video'?'vdl-dl':'vdl-tx');if(el){el.style.display='block';el.innerHTML='❌ '+(type==='download_video'?'下载':'文案')+'失败：'+(j.error||'');}fin();}
  },2500);
}
function poll(id){
  clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    const r=await fetch('/api/job/'+id);if(!r.ok)return;
    const j=await r.json();
    if(j.status==='pending'){setStatus('<span class="spin"></span>排队中(#'+id+')…')}
    else if(j.status==='running'){setStatus('<span class="spin"></span>正在爬取并过滤(#'+id+')…')}
    else if(j.status==='done'){clearInterval(pollTimer);document.getElementById('go').disabled=false;setStatus('✅ 完成');if(j.result&&j.result.type==='account'){renderAccount(j.result)}else{render(j.result)}}
    else if(j.status==='error'){clearInterval(pollTimer);document.getElementById('go').disabled=false;setStatus('❌ 出错：'+(j.error||'未知'))}
  },3000);
}
function setStatus(h){document.getElementById('status').innerHTML=h}
function render(res){
  lastLeads=res.leads||[];lastVideos=res.videos||[];lastAccount=null;
  document.getElementById('worksGrid').style.display='none';
  document.getElementById('resultCard').style.display='block';
  document.getElementById('stat').innerHTML=
    `🔥 精准客户 <b style="color:#fff">${res.leads_count}</b> &nbsp;|&nbsp; 🎬 视频 ${lastVideos.length} &nbsp;|&nbsp; 🗑️ 中介噪音 ${res.spam} &nbsp;|&nbsp; 💬 闲聊 ${res.chat} &nbsp;|&nbsp; 评论 ${res.total}`;
  const rel=res.related_keywords||[];
  const rbox=document.getElementById('relatedBox'),rdiv=document.getElementById('related');
  if(rel.length){rbox.style.display='block';rdiv.innerHTML='';rel.forEach(w=>{const s=document.createElement('span');s.className='chip';s.textContent=w;s.onclick=()=>{document.getElementById('kw').value=w;window.scrollTo({top:0,behavior:'smooth'});setStatus('已填入「'+w+'」，点「开始爬取」继续挖');};rdiv.appendChild(s);});}else{rbox.style.display='none';}
  loadKeywords();
  buildLeadTable();
  buildVideoView();
  document.getElementById('viewToggle').style.display='flex';
  setView('lead');
}
function buildLeadTable(){
  let h='<tr><th>#</th><th>昵称</th><th>抖音号</th><th>属地</th><th>需求</th><th>来源视频</th></tr>';
  lastLeads.forEach((c,i)=>{
    const url=c.profile||(c.sec_uid?'https://www.douyin.com/user/'+c.sec_uid:'');
    const nick=url?`<a href="${safeUrl(url)}" target="_blank" style="color:#5aa9ff;text-decoration:none">${esc(c.nickname)} ↗</a>`:esc(c.nickname);
    const did=url?`<a href="${safeUrl(url)}" target="_blank" style="color:#5aa9ff;text-decoration:none">${esc(c.douyin_id||'查看主页')}</a>`:esc(c.douyin_id||'');
    const vurl=c.aweme_id?'https://www.douyin.com/video/'+c.aweme_id:'';
    const src=vurl?`<a class="src-link" href="${safeUrl(vurl)}" target="_blank">${esc(c.source||'视频')} ↗</a>`:esc(c.source||'');
    h+=`<tr><td>${i+1}</td><td>${nick}</td><td>${did}</td><td>${esc(c.ip)}</td><td>${esc(c.content)}</td><td>${src}</td></tr>`;
  });
  document.getElementById('tbl').innerHTML=h;
}
function buildVideoView(){
  let h='';
  lastVideos.forEach(v=>{
    const vleads=lastLeads.filter(l=>l.aweme_id===v.aweme_id);
    const badge=v.leads_count>0?`<span class="vlead-badge">🔥 ${v.leads_count} 个客户</span>`:'<span style="color:var(--sub);font-size:12px">· 无客户</span>';
    let lh='';
    vleads.forEach(c=>{
      const url=c.profile||(c.sec_uid?'https://www.douyin.com/user/'+c.sec_uid:'');
      const nk=url?`<a href="${safeUrl(url)}" target="_blank" style="color:#5aa9ff;text-decoration:none">${esc(c.nickname)}</a>`:esc(c.nickname);
      lh+=`<div style="font-size:13px;padding:4px 0;border-top:1px solid var(--line)">${nk} <span style="color:var(--sub)">[${esc(c.ip)}]</span>：${esc(c.content)}</div>`;
    });
    h+=`<div class="vblock">
      <a class="vhead" href="${safeUrl(v.url)}" target="_blank">
        <img src="${safeUrl(v.cover)}" loading="lazy" referrerpolicy="no-referrer">
        <div class="vhi"><div class="t">${esc(v.title||'(无标题)')}</div>
          <div class="m">@${esc(v.nickname)} · ❤${v.likes||0} · 💬${v.comment_count||0} ${badge}</div></div>
      </a>
      <div class="vbtns">
        <button class="vbtn" onclick="extractText('${v.aweme_id}',this)">📝 提取文案</button>
        <button class="vbtn" onclick="extractVideo('${v.aweme_id}',this)">⬇ 提取视频</button>
      </div>
      <div class="prog" id="prog-${v.aweme_id}"><div class="prog-bar"></div></div>
      <div class="vlinks" id="vres-${v.aweme_id}"></div>
      ${vleads.length?`<div class="vleads">${lh}</div>`:''}
    </div>`;
  });
  document.getElementById('videoView').innerHTML=h;
}
function setView(v){
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.getElementById('leadView').style.display=v==='lead'?'block':'none';
  document.getElementById('videoView').style.display=v==='video'?'block':'none';
}
document.querySelectorAll('.vt-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
// ===== 提取文案(ASR) / 提取视频(下载)：异步任务 + 进度条 =====
function findVideo(aid){
  return (lastVideos||[]).find(v=>v.aweme_id===aid)
      || ((lastAccount&&lastAccount.works)||[]).find(w=>w.aweme_id===aid) || null;
}
function showProg(aid,on){const p=document.getElementById('prog-'+aid);if(p)p.classList.toggle('on',on)}
function showVRes(aid,html){const b=document.getElementById('vres-'+aid);if(b)b.innerHTML=html}
function extractText(aid,btn){doExtract(aid,'transcribe',btn)}
function extractVideo(aid,btn){doExtract(aid,'download_video',btn)}
async function doExtract(aid,type,btn){
  const pw=document.getElementById('pw').value;
  if(!pw){alert('请先在上方填口令再提取');return}
  const v=findVideo(aid);
  const url=v&&v.download_url;
  if(!url){showVRes(aid,'⚠️ 这条视频没拿到下载链接（可能已过期，重爬一次试试）');return}
  btn.disabled=true;showProg(aid,true);
  showVRes(aid,type==='transcribe'?'📝 已提交，处理中…（下载→识别，约1-2分钟，可去干别的）':'⬇ 已提交，下载中…（可去干别的）');
  const fd=new FormData();fd.append('password',pw);fd.append('aweme_id',aid);fd.append('url',url);fd.append('type',type);fd.append('title',((v&&v.title)||'').slice(0,60));
  let r;
  try{r=await fetch('/api/extract',{method:'POST',body:fd})}catch(e){showProg(aid,false);btn.disabled=false;showVRes(aid,'网络错误');return}
  if(!r.ok){let m=r.status;try{const t=await r.json();m=typeof t.detail==='string'?t.detail:JSON.stringify(t.detail)}catch(e){}showProg(aid,false);btn.disabled=false;showVRes(aid,'❌ '+m);return}
  const {job_id}=await r.json();
  pollExtract(job_id,aid,type,btn);
}
function pollExtract(id,aid,type,btn){
  const timer=setInterval(async()=>{
    let j;try{const r=await fetch('/api/job/'+id);if(!r.ok)return;j=await r.json()}catch(e){return}
    if(j.status==='running'){showVRes(aid,type==='transcribe'?'📝 处理中…（下载视频 → 语音识别）':'⬇ 下载中…')}
    else if(j.status==='done'){clearInterval(timer);showProg(aid,false);btn.disabled=false;renderExtract(aid,type,j.result)}
    else if(j.status==='error'){clearInterval(timer);showProg(aid,false);btn.disabled=false;showVRes(aid,'❌ '+(j.error||'失败'))}
  },2500);
}
function renderExtract(aid,type,res){
  if(!res){showVRes(aid,'完成但无结果');return}
  if((res.type||type)==='transcribe'){
    const t=res.text||'';
    const box=document.getElementById('vres-'+aid);
    if(box)box.innerHTML='<div class="txtbox"><div class="h">📝 口播文案（'+(res.char_count||t.length)+' 字）<span style="float:right;cursor:pointer;color:#5aa9ff" onclick="copyText(this)">复制</span></div>'+(t?esc(t):'(无语音内容 / 识别为空)')+'</div>';
  }else{
    const mb=Math.round((res.size||0)/1024/1024*10)/10;
    showVRes(aid,'⬇ <a class="dlink" href="/api/download/'+esc(res.file)+'" target="_blank" download>下载视频 ('+mb+'MB) ↓</a>');
  }
}
function copyText(el){try{const box=el.closest('.txtbox');const t=Array.from(box.childNodes).filter(n=>n.nodeType===3||(n.className!=='h')).map(n=>n.textContent).join('');navigator.clipboard.writeText(box.innerText.replace(/复制|已复制/,'').replace(/^📝.*\n?/,'').trim());el.textContent='已复制'}catch(e){}}
// ===== 视频号解析 =====
async function runWxChannel(pw,btn){
  const link=document.getElementById('sphLink').value.trim();
  if(!link){alert('请粘贴视频号分享链接');return}
  btn.disabled=true;
  const res=document.getElementById('sphResult');res.innerHTML='';
  setStatus('<span class="spin"></span>正在解析视频号链接…');
  let fd=new FormData();fd.append('password',pw);fd.append('url',link);
  let r;
  try{r=await fetch('/api/wxchannel',{method:'POST',body:fd})}
  catch(e){setStatus('❌ 网络错误');btn.disabled=false;return}
  if(!r.ok){
    let m=r.status;
    try{const t=await r.json();m=typeof t.detail==='string'?t.detail:JSON.stringify(t.detail)}catch(e){}
    setStatus('❌ '+m);btn.disabled=false;return;
  }
  const json=await r.json();
  btn.disabled=false;
  setStatus('✅ 解析完成');
  renderSph(json,link,pw);
}
function renderSph(json,shareUrl,pw){
  const d=json.data||json;
  const title=d.title||d.description||'(无标题)';
  const cover=d.cover_url||'';
  const videoUrl=d.video_url||'';
  const author=d.nickname||'';
  const likes=d.like_count||0;
  const duration=d.duration?Math.floor(d.duration/60)+'m'+d.duration%60+'s':'';
  const res=document.getElementById('sphResult');
  let h=`<div class="vblock">
    <div class="vhead" style="cursor:default">
      ${cover?`<img src="${esc(cover)}" referrerpolicy="no-referrer" style="width:96px;height:128px;object-fit:cover;border-radius:7px;background:#0a0c10;flex:0 0 auto">`:''}
      <div class="vhi">
        <div class="t">${esc(title)}</div>
        <div class="m">${author?`@${esc(author)} · `:''}❤${likes}${duration?' · ⏱'+duration:''}</div>
      </div>
    </div>`;
  if(shareUrl||videoUrl){
    h+=`<div class="vbtns">
      <button class="vbtn" id="sph-dl-btn" onclick="sphDownload('${esc(shareUrl)}',this)">⬇ 下载无水印视频</button>`;
    if(shareUrl) h+=`<button class="vbtn" onclick="sphTranscribe('${esc(shareUrl)}','${esc(title.slice(0,50))}',this)">📝 下载并提取文案</button>`;
    h+=`</div>`;
  } else {
    h+=`<div style="padding:8px 12px;font-size:13px;color:var(--sub)">⚠️ 未获取到下载链接（视频号可能需登录或链接已过期）</div>`;
  }
  h+=`<div id="sph-tx" style="padding:0 12px 10px"></div></div>`;
  res.innerHTML=h;
}
async function sphDownload(shareUrl,btn){
  const pw=document.getElementById('pw').value;
  if(!pw){alert('请先填口令');return}
  btn.disabled=true;btn.textContent='⬇ 下载中…';
  const tx=document.getElementById('sph-tx');tx.innerHTML='<span class="spin"></span>正在解析并下载视频（约1-2分钟）…';
  const fd=new FormData();fd.append('password',pw);fd.append('share_url',shareUrl);
  let r;try{r=await fetch('/api/wxchannel_download',{method:'POST',body:fd})}catch(e){tx.innerHTML='❌ 网络错误';btn.disabled=false;btn.textContent='⬇ 下载无水印视频';return}
  btn.disabled=false;
  if(!r.ok){let m=r.status;try{const t=await r.json();m=typeof t.detail==='string'?t.detail:JSON.stringify(t.detail)}catch(e){}tx.innerHTML='❌ '+m;btn.textContent='⬇ 下载无水印视频';return}
  const res=await r.json();
  const mb=Math.round((res.size||0)/1024/1024*10)/10;
  const fname=res.file.split('/').pop();
  btn.textContent='⬇ 重新下载';
  tx.innerHTML=`⬇ <a class="dlink" href="/api/download/${esc(res.file)}" download="${esc(fname)}">下载视频 (${mb}MB) ↓</a>`;
}
async function sphTranscribe(shareUrl,title,btn){
  const pw=document.getElementById('pw').value;
  if(!pw){alert('请先填口令');return}
  btn.disabled=true;
  const tx=document.getElementById('sph-tx');tx.innerHTML='<span class="spin"></span>正在下载/解密视频，随后自动识别文案…';
  const fd=new FormData();
  fd.append('password',pw);fd.append('share_url',shareUrl);fd.append('title',title);
  let r;try{r=await fetch('/api/wxchannel_transcribe',{method:'POST',body:fd})}catch(e){tx.innerHTML='❌ 网络错误';btn.disabled=false;return}
  if(!r.ok){let m=r.status;try{const t=await r.json();m=typeof t.detail==='string'?t.detail:JSON.stringify(t.detail)}catch(e){}tx.innerHTML='❌ '+m;btn.disabled=false;return}
  const {job_id}=await r.json();
  tx.innerHTML='📝 视频已就绪，识别中，约1-2分钟…';
  const tmr=setInterval(async()=>{
    let j;try{const rr=await fetch('/api/job/'+job_id);if(!rr.ok)return;j=await rr.json()}catch(e){return}
    if(j.status==='done'){clearInterval(tmr);btn.disabled=false;const res=j.result||{};const t=res.text||'';tx.innerHTML=`<div class="txtbox"><div class="h">📝 口播文案（${res.char_count||t.length}字）<span style="float:right;cursor:pointer;color:#5aa9ff" onclick="copyText(this)">复制</span></div>${t?esc(t):'(无语音/纯音乐)'}</div>`}
    else if(j.status==='error'){clearInterval(tmr);btn.disabled=false;tx.innerHTML='❌ 识别失败：'+(j.error||'')}
  },2500);
}
function esc(s){return(s==null?'':String(s)).replace(/[<>&"']/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(u){u=String(u==null?'':u);return /^(https?:\/\/|\/)/i.test(u)?esc(u):'#'}
function renderAccount(res){
  lastAccount=res;lastLeads=[];lastVideos=[];
  document.getElementById('resultCard').style.display='block';
  document.getElementById('relatedBox').style.display='none';
  document.getElementById('viewToggle').style.display='none';
  document.getElementById('leadView').style.display='none';
  document.getElementById('videoView').style.display='none';
  document.getElementById('tbl').innerHTML='';
  document.getElementById('stat').innerHTML=
    `👤 <b style="color:#fff">${esc(res.nickname)}</b> &nbsp; 粉丝 <b style="color:#fff">${res.fans}</b> | 获赞 ${res.likes} | 作品 ${res.works_count} | 评论 ${res.comments_count} &nbsp; <a href="${safeUrl(res.profile)}" target="_blank" style="color:#5aa9ff">主页↗</a>`;
  let h='';
  (res.works||[]).forEach(w=>{
    const aid=w.aweme_id;
    h+=`<div class="vblock">
      <a class="vhead" href="${safeUrl(w.url)}" target="_blank">
        <img src="${safeUrl(w.cover)}" loading="lazy" referrerpolicy="no-referrer">
        <div class="vhi"><div class="t">${esc(w.title||'(无标题)')}</div>
          <div class="m">❤${w.likes||0} · 💬${w.comments||0} · 🔄${w.shares||0}</div></div>
      </a>
      <div class="vbtns">
        <button class="vbtn" onclick="extractText('${aid}',this)">📝 提取文案</button>
        <button class="vbtn" onclick="extractVideo('${aid}',this)">⬇ 提取视频</button>
      </div>
      <div class="prog" id="prog-${aid}"><div class="prog-bar"></div></div>
      <div class="vlinks" id="vres-${aid}"></div>
    </div>`;
  });
  const g=document.getElementById('worksGrid');g.innerHTML=h;g.style.display='block';
}
function downloadCSV(){
  let rows,name;
  if(lastAccount){
    rows=[['标题','点赞','评论','收藏','分享','发布时间','视频链接']];
    (lastAccount.works||[]).forEach(w=>rows.push([w.title,w.likes,w.comments,w.collects,w.shares,w.create_time?new Date(w.create_time*1000).toLocaleString():'',w.url]));
    name='账号_'+(lastAccount.nickname||'account')+'.csv';
  }else{
    rows=[['昵称','抖音号','主页链接','属地','需求','来源视频']];
    lastLeads.forEach(c=>rows.push([c.nickname,c.douyin_id||'',c.profile||(c.sec_uid?'https://www.douyin.com/user/'+c.sec_uid:''),c.ip,c.content,c.source||'']));
    name='客户名单.csv';
  }
  let csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=name;a.click();
}
</script>
