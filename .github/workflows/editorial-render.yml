name: Editorial render

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/content_domains/editorial_*.py'
      - 'server/content_domains/video_compose*.py'
      - 'scripts/check_editorial_runtime.py'
      - 'scripts/check_editorial_process_cleanup.py'
      - 'scripts/editorial_process_fixture.mjs'
      - 'scripts/check_editorial_layout.py'
      - 'scripts/check_editorial_layout.mjs'
      - 'site/assets/one-click/templates/ip-editorial-serif-v1/**'
      - 'tools/hyperframes/ip-editorial-serif-v1/**'
      - 'tests/test_video_compose_editorial.py'
      - 'tests/test_editorial_layout.py'
      - '.github/workflows/editorial-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Linux editorial render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_SKIP_SKILLS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HYPERFRAMES_RUN_ID: editorial-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install isolated locked renderer
        working-directory: tools/hyperframes/ip-editorial-serif-v1
        run: npm ci --no-audit --no-fund
      - name: Resolve runner browser and FFmpeg
        shell: bash
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          command -v ffprobe
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          echo "VIDEO_COMPOSE_EDITORIAL_BROWSER=$browser" >> "$GITHUB_ENV"
          echo "VIDEO_COMPOSE_EDITORIAL_RUNTIME=$GITHUB_WORKSPACE/tools/hyperframes/ip-editorial-serif-v1/node_modules/hyperframes" >> "$GITHUB_ENV"
      - name: Offline contract and actual synthetic render
        run: |
          python -m unittest tests.test_video_compose_editorial tests.test_editorial_layout -v
          python scripts/check_editorial_runtime.py --output-dir "$RUNNER_TEMP/editorial-smoke"
          ffmpeg -v error -ss 1.4 -i "$RUNNER_TEMP/editorial-smoke/smoke.mp4" -frames:v 1 "$RUNNER_TEMP/editorial-smoke/frame.png"
      - name: Real non-root Linux timeout and orphan cleanup regression
        run: python scripts/check_editorial_process_cleanup.py --output-dir "$RUNNER_TEMP/editorial-process-cleanup"
      - name: Real fixed-font English layout boundary regression
        run: python scripts/check_editorial_layout.py --output-dir "$RUNNER_TEMP/editorial-layout"
      - name: Preserve exact-head synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-render-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/editorial-smoke/report.json
            ${{ runner.temp }}/editorial-smoke/smoke.mp4
            ${{ runner.temp }}/editorial-smoke/frame.png
            ${{ runner.temp }}/editorial-process-cleanup/report.json
            ${{ runner.temp }}/editorial-process-cleanup/*/launch.json
            ${{ runner.temp }}/editorial-process-cleanup/*/stderr.txt
            ${{ runner.temp }}/editorial-layout/report.json
            ${{ runner.temp }}/editorial-layout/measurements.json
            ${{ runner.temp }}/editorial-layout/fixtures.json
            ${{ runner.temp }}/editorial-layout/*-check.json
            ${{ runner.temp }}/editorial-layout/*.stderr
            ${{ runner.temp }}/editorial-layout/*.png
          if-no-files-found: warn
          retention-days: 7
