name: Main Agent v4 UX
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/hq_ip_agent/**'
      - 'site/workbench/hq-ip-agent/**'
      - 'scripts/hq_ip_agent_release.py'
      - 'tests/test_hq_ip_agent_release.py'
      - 'deploy/hq-ip-agent-ux.json'
      - '.github/workflows/hq-ip-agent-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r server/hq_ip_agent/requirements.txt
      - name: Release preflight and rollback tests
        run: python -m unittest discover -s tests -p test_hq_ip_agent_release.py -v
      - name: Mobile issue and adjacent regression
        working-directory: server/hq_ip_agent
        env:
          PYTHONPATH: '.'
          HQ_PROXY_TUNNEL: '0'
        run: |
          python -m unittest discover -s tests -p test_ux_recovery.py -v
          python tests/hq-p0c-test.py
      - name: Mocked mobile browser regression
        working-directory: server/hq_ip_agent
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/ux_mobile_regression.mjs
          node tests/quote_lifecycle_regression.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: main-agent-v4-mobile-${{ github.event.pull_request.head.sha || github.sha }}
          path: server/hq_ip_agent/.test-output/
          include-hidden-files: true
          if-no-files-found: error
