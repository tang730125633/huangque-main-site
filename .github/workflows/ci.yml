name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码与安全门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: 安装微信消息推送加密依赖
        run: python -m pip install "cryptography>=41,<50"

      - name: 检查敏感文件与静态资源
        run: python scripts/ci_validate.py

      - name: Verify workbench shell cache stamps
        run: python scripts/stamp_assets.py --check

      - name: 测试 CI 检查器
        run: python -m unittest discover -s tests -v

      - name: 检查 Python 语法
        shell: bash
        run: |
          mapfile -d '' files < <(find server scripts worker -type f -name '*.py' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files found under server/, scripts/, or worker/."
            exit 0
          fi
          python -m py_compile "${files[@]}"

      - name: 检查 JavaScript 语法
        run: find site -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: 测试工作台侧栏
        run: node tests/test_cloud_shell_sidebar.js

      - name: 安装设计系统依赖
        working-directory: design-system
        run: npm ci

      - name: 构建设计系统
        working-directory: design-system
        run: npm run build
