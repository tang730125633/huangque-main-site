name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码与安全门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: 安装媒体契约测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: 安装微信消息推送加密依赖
        run: python -m pip install "cryptography>=41,<50"

      - name: 安装 content 服务 Python 依赖
        run: python -m pip install -r deploy/requirements-content.txt

      - name: 检查敏感文件与静态资源
        run: python scripts/ci_validate.py

      - name: Verify workbench shell cache stamps
        run: python scripts/stamp_assets.py --check

      - name: 测试 CI 检查器
        run: python -m unittest discover -s tests -v

      - name: 测试并构建 HQ CLI
        working-directory: tools/hq-cli
        env:
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          cli_tmp="$(mktemp -d)"
          trap 'rm -rf "$cli_tmp"' EXIT
          python -m pip wheel --no-deps --wheel-dir "$cli_tmp/wheels-a" .
          python -m pip wheel --no-deps --wheel-dir "$cli_tmp/wheels-b" .
          cmp "$cli_tmp"/wheels-a/*.whl "$cli_tmp"/wheels-b/*.whl
          sh -n ../../site/downloads/hq/install.sh
          python -m venv "$cli_tmp/venv"
          "$cli_tmp/venv/bin/pip" install --no-index --no-deps ../../site/downloads/hq/v0.6.0/huangque_hq_cli-0.6.0-py3-none-any.whl
          "$cli_tmp/venv/bin/hq" version --json
          "$cli_tmp/venv/bin/hq" capabilities --json
          "$cli_tmp/venv/bin/python" -m hq_cli version --json

      - name: 检查 Python 语法
        shell: bash
        run: |
          mapfile -d '' files < <(find server scripts worker -type f -name '*.py' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files found under server/, scripts/, or worker/."
            exit 0
          fi
          python -m py_compile "${files[@]}"

      - name: 检查 JavaScript 语法
        run: find site -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: 测试工作台侧栏
        run: node tests/test_cloud_shell_sidebar.js

      - name: 测试编导页字段保留与上传上限
        run: node tests/test_script_director_fields.js

      - name: 测试画布 API 与短剧工作区
        run: |
          node tests/test_short_drama_center.js
          node tests/test_short_drama_workspace.js
          node tests/test_canvas_api.js
          node tests/test_canvas_short_drama.js
          node tests/test_canvas_short_drama_production.js
          node tests/test_canvas_short_drama_voice.js
          node tests/test_canvas_short_drama_workspace.js
          node tests/test_canvas_short_drama_completion.js
          python -m unittest tests.test_short_drama_completion_integrity -v
          node tests/test_canvas_digital_presenter.js

      - name: 安装设计系统依赖
        working-directory: design-system
        run: npm ci

      - name: 构建设计系统
        working-directory: design-system
        run: npm run build
