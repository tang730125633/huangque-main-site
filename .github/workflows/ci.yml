name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码与安全门禁
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查提交空白
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: 安装媒体契约测试依赖
        timeout-minutes: 5
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: 安装微信消息推送加密依赖
        run: python -m pip install "cryptography>=41,<50"

      - name: 安装 content 服务 Python 依赖
        run: python -m pip install -r deploy/requirements-content.txt

      - name: 检查敏感文件与静态资源
        run: python scripts/ci_validate.py

      - name: Verify workbench shell cache stamps
        run: python scripts/stamp_assets.py --check

      - name: 测试完整 Python 回归
        run: python -m unittest discover -s tests -v

      - name: 测试并构建 HQ CLI
        working-directory: tools/hq-cli
        env:
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          cli_tmp="$(mktemp -d)"
          trap 'rm -rf "$cli_tmp"' EXIT
          python -m pip wheel --no-deps --wheel-dir "$cli_tmp/wheels-a" .
          python -m pip wheel --no-deps --wheel-dir "$cli_tmp/wheels-b" .
          cmp "$cli_tmp"/wheels-a/*.whl "$cli_tmp"/wheels-b/*.whl
          sh -n ../../site/downloads/hq/install.sh
          python -m venv "$cli_tmp/venv"
          "$cli_tmp/venv/bin/pip" install --no-index --no-deps "$cli_tmp"/wheels-a/*.whl
          "$cli_tmp/venv/bin/hq" version --json
          "$cli_tmp/venv/bin/hq" capabilities --json
          "$cli_tmp/venv/bin/python" -m hq_cli version --json

      - name: 检查 Python 语法
        shell: bash
        run: |
          mapfile -d '' files < <(find server scripts worker -type f -name '*.py' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files found under server/, scripts/, or worker/."
            exit 0
          fi
          python -m py_compile "${files[@]}"

      - name: 检查 JavaScript 语法
        run: find site -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: 测试数字人工作台状态机
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_digital_human_*.js' -print | sort)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No digital-human JavaScript tests discovered."
            exit 1
          fi
          printf 'Running %d digital-human JavaScript test files:\n' "${#tests[@]}"
          printf '  %s\n' "${tests[@]}"
          node --test "${tests[@]}"

      - name: 测试工作台侧栏
        run: node tests/test_cloud_shell_sidebar.js

      - name: 测试编导页字段保留与上传上限
        run: node tests/test_script_director_fields.js

      - name: 测试画布 API 与短剧工作区
        run: |
          node tests/test_short_drama_center.js
          node tests/test_short_drama_workspace.js
          node tests/test_canvas_api.js
          node tests/test_canvas_short_drama.js
          node tests/test_canvas_short_drama_production.js
          node tests/test_canvas_short_drama_voice.js
          node tests/test_canvas_short_drama_workspace.js
          node tests/test_canvas_short_drama_completion.js
          python -m unittest tests.test_short_drama_completion_integrity -v
          node tests/test_canvas_digital_presenter.js

      - name: 安装设计系统依赖
        working-directory: design-system
        run: npm ci

      - name: 构建设计系统
        working-directory: design-system
        run: npm run build

  hq-cli-windows:
    name: HQ CLI · Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 测试 Windows 运行时
        working-directory: tools/hq-cli
        shell: powershell
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: PowerShell 5.1 安装
        shell: powershell
        run: |
          $unicode = ([string][char]0x9EC4) + ([string][char]0x96C0)
          $root = Join-Path $env:RUNNER_TEMP ($unicode + " CLI Test")
          $oldRoot = Join-Path $root "versions\0.10.4"
          $oldVenv = Join-Path $oldRoot "venv"
          python -m venv $oldVenv
          $oldPython = Join-Path $oldVenv "Scripts\python.exe"
          & $oldPython -m pip install --disable-pip-version-check --no-index --no-deps `
            .\site\downloads\hq\v0.10.4\huangque_hq_cli-0.10.4-py3-none-any.whl
          $binRoot = Join-Path $root "bin"
          New-Item -ItemType Directory -Path $binRoot | Out-Null
          $oldLauncher = ":: Huangque HQ CLI managed launcher`r`n@echo off`r`n" +
            '"%~dp0..\versions\0.10.4\venv\Scripts\hq.exe" %*' + "`r`n"
          [IO.File]::WriteAllText((Join-Path $binRoot "hq.cmd"), $oldLauncher, [Text.ASCIIEncoding]::new())
          $oldResult = & (Join-Path $binRoot "hq.cmd") version --json | ConvertFrom-Json
          if ($oldResult.cli_version -ne "0.10.4") { throw "old CLI fixture did not start" }
          .\site\downloads\hq\install.ps1 `
            -WheelPath .\site\downloads\hq\v0.12.0\huangque_hq_cli-0.12.0-py3-none-any.whl `
            -InstallRoot $root -NoPathUpdate
          $hq = Join-Path $root "bin\hq.cmd"
          $result = & $hq version --json | ConvertFrom-Json
          if ($result.cli_version -ne "0.12.0") { throw "unexpected CLI version" }
          $capabilities = & $hq capabilities --json | ConvertFrom-Json
          if (-not ($capabilities.capabilities | Where-Object id -eq "text-video-generate")) {
            throw "upgraded CLI is missing text-video-generate"
          }
          if (-not ($capabilities.capabilities | Where-Object id -eq "text-video-plan")) {
            throw "upgraded CLI is missing text-video-plan"
          }
          if (-not ($capabilities.capabilities | Where-Object id -eq "text-video-avatar-import")) {
            throw "upgraded CLI is missing text-video-avatar-import"
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "HQ_TEST_ROOT=$root`n", [Text.UTF8Encoding]::new($false))
      - name: cmd.exe 启动
        shell: cmd
        run: '"%HQ_TEST_ROOT%\bin\hq.cmd" capabilities --json'
      - name: PowerShell 7 启动并卸载
        shell: pwsh
        run: |
          $hq = Join-Path $env:HQ_TEST_ROOT "bin\hq.cmd"
          $result = & $hq capabilities --json | ConvertFrom-Json
          if ($result.schema -ne "hq.capabilities/v1") { throw "invalid capabilities output" }
          .\site\downloads\hq\uninstall.ps1 -InstallRoot $env:HQ_TEST_ROOT
          if (Test-Path $env:HQ_TEST_ROOT) { throw "uninstall left files behind" }
