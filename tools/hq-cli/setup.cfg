[metadata]
name = huangque-hq-cli
version = 0.6.0
description = Scoped agent CLI for the Huangque main site

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    hq = hq_cli.cli:main
