[metadata]
name = huangque-hq-cli
version = 0.10.5
description = Scoped agent CLI for the Huangque main site
author = Tang Zelong
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tang730125633/huangque-cli
license = MIT
license_files = LICENSE

[options]
python_requires = >=3.10
package_dir =
    = src
packages = find:
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    hq = hq_cli.cli:main
