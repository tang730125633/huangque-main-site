<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄雀 AI · 后端 API 文档（Swagger UI）</title>
<link rel="icon" href="/assets/cloud/logo-bird.png">
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  body{margin:0;background:#0b0e14}
  .swagger-ui .topbar{display:none}
  #hq-head{padding:16px 28px;border-bottom:1px solid #1f2733;background:#0b0e14;color:#eaf1fa;font-family:system-ui,sans-serif}
  #hq-head b{color:#e7b24c}
  #hq-head small{color:#94a4bb}
  .hqbtn{margin-top:12px;margin-right:10px;height:34px;padding:0 16px;border-radius:9px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:600;color:#94a4bb;background:rgba(148,164,187,.06);border:1px solid rgba(148,164,187,.18)}
  .hqbtn.on{color:#1c1402;background:linear-gradient(135deg,#f6d488,#e7b24c);border-color:transparent}
  #swagger-ui{background:#fff}
</style>
</head>
<body>
<div id="hq-head">
  <div style="font-size:17px;font-weight:600">🐦 黄雀 AI · 后端 API <b>Swagger UI</b></div>
  <small>网页登录可直接使用同域 Cookie；API 客户端点右上 Authorize 填 Bearer。执行后看 <b>Request duration</b>。</small><br>
  <small><b>测速安全：</b>优先点“安全测速接口”，只看 active + safe-read；生成、写入、删除、转点、充值和支付接口未获专项授权不要执行。｜ Apifox：openapi.json / openapi-tikhub.json</small>
  <div>
    <button class="hqbtn on" id="btnHQ" onclick="loadSpec('openapi.json',this)">黄雀后端 API（我们的接口）</button>
    <button class="hqbtn" id="btnSafe" onclick="loadSafe(this)">安全测速接口（只读）</button>
    <button class="hqbtn" id="btnTH" onclick="loadSpec('openapi-tikhub.json',this)">TikHub（我们在用的外部接口）</button>
  </div>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  var HTTP_METHODS = {get:1,post:1,put:1,patch:1,delete:1,head:1,options:1,trace:1};
  function activateButton(btn){
    document.querySelectorAll('.hqbtn').forEach(function(b){ b.classList.remove('on'); });
    if(btn) btn.classList.add('on');
  }
  function activeSafeSpec(spec){
    var count = 0;
    Object.keys(spec.paths || {}).forEach(function(path){
      var item = spec.paths[path];
      Object.keys(item).forEach(function(method){
        var operation = item[method];
        if(HTTP_METHODS[method] && (operation['x-hq-test-safety'] !== 'safe-read' || operation['x-hq-runtime-status'] !== 'active')) delete item[method];
      });
      var kept = Object.keys(item).filter(function(method){ return HTTP_METHODS[method]; }).length;
      if(!kept) delete spec.paths[path]; else count += kept;
    });
    spec.info.title += ' · 安全测速';
    spec.info.description = '此视图自动只保留 active + safe-read，共 ' + count + ' 个操作。\n\n' + spec.info.description;
    return spec;
  }
  function renderSwagger(source){
    window.ui = SwaggerUIBundle(Object.assign({
      dom_id: '#swagger-ui',
      deepLinking: true,
      persistAuthorization: true,
      tryItOutEnabled: true,
      displayRequestDuration: true,
      filter: true,
      docExpansion: 'list'
    }, source));
  }
  function loadSpec(u, btn){
    activateButton(btn);
    renderSwagger({url:u});
  }
  function loadSafe(btn){
    activateButton(btn);
    fetch('openapi.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('load failed'); return r.json(); })
      .then(function(spec){ renderSwagger({spec:activeSafeSpec(spec)}); })
      .catch(function(){ document.getElementById('swagger-ui').textContent = '安全测速视图加载失败，请刷新重试'; });
  }
  window.onload = function(){ loadSpec('openapi.json', document.getElementById('btnHQ')); };
</script>
</body>
</html>
